<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dxtutor IDE</title>
    <!--
      Boot splash styling lives INLINE here (not in the external CSS) on purpose:
      during a reload the Vite/CSS bundle has not necessarily parsed yet, so the
      splash must be able to paint a finished, branded screen with zero external
      dependencies. The JS hides #boot once the app has mounted.
    -->
    <style id="boot-style">
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #19191b;
        color: #d4d5d8;
        font-family: "Segoe UI", -apple-system, system-ui, Ubuntu, sans-serif;
        opacity: 1;
        transition: opacity 0.35s ease;
      }
      #boot.boot-hiding { opacity: 0; pointer-events: none; }
      #boot .boot-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: #ffffff;
      }
      #boot .boot-logo { color: #e06c3b; width: 30px; height: 30px; display: block; }
      #boot .boot-sub { font-size: 12.5px; color: #6b6d72; letter-spacing: 0.04em; }
      #boot .boot-spinner {
        width: 30px;
        height: 30px;
        border: 3px solid rgba(255, 255, 255, 0.14);
        border-top-color: #e06c3b;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-spinner { animation-duration: 2s; }
      }
    </style>
  </head>
  <body>
    <!-- Boot splash: covers everything until the app has mounted (no raw HTML). -->
    <div id="boot">
      <div class="boot-brand"><svg class="boot-logo" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1.8l1.4 4L13.4 7l-4 1.2L8 12.2 6.6 8.2 2.6 7l4-1.2z"/></svg> dxtutor IDE</div>
      <div class="boot-spinner"></div>
      <div class="boot-sub" data-i18n="boot.subtitle">Loading your workspace…</div>
    </div>

    <!--
      Casca da IDE (Fase 1 da reescrita). Estrutura portada de
      docs/prototype/index.html: titlebar (menu) / mid [activity · side · edit ·
      agent] / status. Os handlers inline do protótipo foram removidos: a casca é
      um módulo ES (src/app.ts → src/shell) e liga tudo por id/addEventListener.
    -->
    <div class="app">
      <!-- MENU BAR -->
      <div class="titlebar" data-tauri-drag-region>
        <div class="tb-brand" id="brand" data-tauri-drag-region></div>
        <div class="menubar" id="menubar"></div>
        <button class="cmd-center" id="cmd-center"><span data-ic="search"></span><span data-i18n="shell.cmdCenter">dxtutor — files and commands</span> <kbd>Ctrl+P</kbd></button>
        <div class="tb-right">
          <button class="tb-ic" id="tgl-side" data-i18n-title="shell.toggleSide" data-ic="layout-side"></button>
          <button class="tb-ic" id="tgl-panel" data-i18n-title="shell.togglePanel" data-ic="layout-panel"></button>
          <button class="tb-ic on" id="tgl-agent" data-i18n-title="shell.toggleAgent" data-ic="sparkle"></button>
          <button class="tb-ic" id="tb-account" data-ic="account" data-i18n-title="nav.account"></button>
          <span class="win-dot r"></span><span class="win-dot y"></span><span class="win-dot g"></span>
        </div>
      </div>

      <!-- MIDDLE -->
      <div class="mid">
        <div class="activity" id="activity"></div>

        <div class="side">
          <div class="pane show" id="pane-explorer"></div>
          <div class="pane" id="pane-search"></div>
          <div class="pane" id="pane-scm"></div>
          <div class="pane" id="pane-run"></div>
          <div class="pane" id="pane-test"></div>
          <div class="pane" id="pane-ext"></div>
          <div class="pane" id="pane-codev"></div>
          <div class="pane" id="pane-tutor"></div>
          <div class="pane" id="pane-remote"></div>
          <div class="pane" id="pane-containers"></div>
          <div class="pane" id="pane-account"></div>
        </div>

        <!-- EDITOR / tab area -->
        <div class="edit">
          <div class="tabs" id="tabs"></div>
          <div class="breadcrumbs" id="breadcrumbs"></div>
          <div class="ebody">
            <div class="ebody-scroll with-mm" id="ebody"></div>
            <div class="minimap" id="minimap"></div>
          </div>
          <div class="panel" id="panel">
            <div class="panel-tabs" id="panel-tabs">
              <button class="ptab" data-pt="problems">Problems <span class="pb" id="pb-prob">0</span></button>
              <button class="ptab" data-pt="output">Output · Co-Dev</button>
              <button class="ptab on" data-pt="terminal">Terminal</button>
              <button class="ptab" data-pt="services">Services</button>
              <span class="panel-tools">
                <button data-ic="trash" id="pt-clear" data-i18n-title="panel.clear"></button>
                <button data-ic="close" id="pt-close" data-i18n-title="panel.close"></button>
              </span>
            </div>
            <div class="panel-body">
              <div class="pcontent show" id="pc-terminal"><div id="term"></div></div>
              <div class="pcontent" id="pc-problems"></div>
              <div class="pcontent" id="pc-output"></div>
              <div class="pcontent" id="pc-services"></div>
            </div>
            <div class="tmux"><span class="win">[2] 0:bash*</span><span class="sp"></span><span class="host">"delonix" <span id="clock"></span></span></div>
          </div>
        </div>

        <!-- CO-DEV dock -->
        <div class="agent" id="agent">
          <div class="ag-hd"><div class="ag-mark" data-ic="sparkle"></div><div class="ag-name">Co-Dev</div>
            <button class="ag-model" id="ag-model" data-i18n-title="codev.pickModel"><span class="live"></span><span id="ag-model-l"></span></button>
            <button class="ag-ic" id="ag-popout" data-ic="popout" data-i18n-title="codev.popout"></button>
            <button class="ag-ic" id="ag-history" data-ic="history" data-i18n-title="codev.manager"></button>
            <button class="ag-ic" id="ag-new" data-ic="plus" data-i18n-title="codev.newChat"></button>
          </div>
          <div id="ag-body">
            <div class="modebar" id="modebar"></div>
            <div class="ag-msgs" id="ag-msgs"></div>
            <div class="run-ctl hidden" id="ag-runctl">
              <div class="rc-top"><span class="spin"></span><span class="rc-lbl" id="rc-lbl"></span><span class="rc-el" id="rc-el"></span></div>
              <div class="rc-cmds"><button class="rc" id="rc-pause"><kbd>p</kbd> pause</button><button class="rc" id="rc-stop"><kbd>x</kbd> stop</button><button class="rc" id="rc-details"><kbd>d</kbd> log</button></div>
            </div>
            <div class="ag-compose" id="ag-compose"><div class="composer">
              <textarea id="ag-input" rows="2" data-i18n-placeholder="codev.placeholder"></textarea>
              <div class="comp-bar"><button class="pill" id="pill-ctx" data-i18n-title="codev.ctx"></button><button class="pill" id="pill-test" data-i18n-title="codev.runTests">/test</button><button class="pill" id="pill-lint" data-i18n-title="codev.lint">/lint</button><button class="send" id="ag-send" data-ic="arrow-up" data-i18n-title="codev.send"></button></div>
            </div></div>
          </div>
        </div>

        <div class="rsz" id="rsz-side"></div>
        <div class="rsz" id="rsz-agent"></div>
      </div>

      <!-- STATUS BAR -->
      <div class="status">
        <button class="si remote" id="st-remote" data-ic="remote-arrows" data-i18n-title="status.commands"></button>
        <button class="si" id="st-branch" data-ic="branch-sm" data-i18n-title="status.switchBranch"><span id="st-branch-l">—</span></button>
        <button class="si" id="st-prob" data-i18n-title="status.problems"></button>
        <button class="si opt" id="st-tests" data-i18n-title="status.tests"></button>
        <span class="spacer"></span>
        <button class="si opt" id="st-pos" data-i18n-title="status.goToLine"></button>
        <span class="si opt" id="st-lang"></span>
        <button class="si opt" id="st-ctx" data-i18n-title="status.context"></button>
        <button class="si" id="st-model" data-ic="sparkle" data-i18n-title="status.model"><span id="st-model-l"></span></button>
        <button class="si mode" id="st-mode" data-i18n-title="status.mode"></button>
        <button class="si" id="st-bell" data-ic="bell" data-i18n-title="status.notifications"><span id="st-bell-n"></span></button>
      </div>
    </div>

    <div id="pal"><div class="pal-box"><input id="pal-in" autocomplete="off" spellcheck="false" /><div id="pal-list"></div></div></div>
    <div id="notes"></div>
    <div id="toast" style="position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg-menu);border:1px solid var(--border-strong);box-shadow:var(--sh-pop);border-radius:9px;padding:9px 16px;font-size:12.5px;opacity:0;transition:.2s;pointer-events:none;z-index:500"></div>

    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
