time = "O(n)"
space = "O(n)"
solution = '''
package student

import (
	"database/sql"
	"os"
	"path/filepath"
	"sync"

	_ "modernc.org/sqlite"
)

func PooledSum(upto, workers int) int {
	if workers < 1 {
		workers = 1
	}
	dir, err := os.MkdirTemp("", "pool")
	if err != nil {
		return 0
	}
	defer os.RemoveAll(dir)
	dsn := "file:" + filepath.Join(dir, "p.db") + "?_pragma=busy_timeout(10000)&_pragma=journal_mode(WAL)"
	db, err := sql.Open("sqlite", dsn)
	if err != nil {
		return 0
	}
	defer db.Close()
	db.SetMaxOpenConns(workers)
	if _, err := db.Exec(`CREATE TABLE nums (x INTEGER)`); err != nil {
		return 0
	}
	var wg sync.WaitGroup
	for w := 0; w < workers; w++ {
		wg.Add(1)
		go func(id int) {
			defer wg.Done()
			for v := id + 1; v <= upto; v += workers {
				db.Exec(`INSERT INTO nums (x) VALUES (?)`, v)
			}
		}(w)
	}
	wg.Wait()
	var sum int
	db.QueryRow(`SELECT COALESCE(SUM(x), 0) FROM nums`).Scan(&sum)
	return sum
}
'''
justification = """

Every value in `1..upto` is inserted exactly once across the workers, so the work and
the stored rows are both **O(n)** with `n = upto`. The partition is disjoint and
covers the whole range, and addition is commutative, so the final `SUM` is
`upto*(upto+1)/2` regardless of goroutine scheduling — deterministic by construction.

"""

