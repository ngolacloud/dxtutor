# ═════════════════════════════════════════════════════════════════════════════
# UNIT 11 — Goroutines & WaitGroup
# ═════════════════════════════════════════════════════════════════════════════
[[unit]]
id = "u11-goroutines-waitgroup"
title = "Goroutines & WaitGroup"
difficulty = 11
level = "advanced"
intro = """
The foundation of Go concurrency. A **goroutine** is a function that runs
concurrently, multiplexed by the Go runtime onto a small pool of OS threads — so
cheap you can launch thousands, where native threads would cost you megabytes
each. Launching one is just `go f()`. But a goroutine runs *independently*: if
`main` returns, the program ends and in-flight goroutines are dropped. A
`sync.WaitGroup` is the counter that lets `main` wait for a batch of goroutines to
finish. You will launch goroutines, coordinate them, and finish by summing a slice
across several of them — with a deterministic result.
"""

[[unit.step]]
kind = "concept"
id = "c11-goroutines"
title = "Goroutines vs threads, and WaitGroup"
points = 5
difficulty = 11
run_command = ""
intro = """
Goroutines are not OS threads: the runtime schedules many goroutines onto few
threads, so they are cheap to create and switch. Because they run independently of
`main`, you need an explicit way to wait for them — that is what a WaitGroup does.
"""
body = """
## Goroutines

```go
go doWork()        // runs doWork concurrently, returns immediately
go func() { ... }() // or an anonymous function, launched at once
```

A goroutine is a lightweight thread managed by the Go runtime, not the OS. Starting
one with `go` returns instantly; the work happens alongside the rest of your
program. The catch: when `main` returns, the whole program exits — any goroutine
still running is abandoned.

## WaitGroup: wait for a batch

```go
var wg sync.WaitGroup
for i := 0; i < 3; i++ {
    wg.Add(1)              // one more goroutine to wait for
    go func() {
        defer wg.Done()    // mark this one done on return
        work()
    }()
}
wg.Wait()                  // block until the counter reaches zero
```

Three calls do all the work: **`Add(n)`** raises the counter, **`Done()`** lowers
it by one (put it in a `defer` so it always runs), and **`Wait()`** blocks until
the counter hits zero. This is how `main` holds on until every goroutine finishes.

## Passing the loop value

When you launch a goroutine inside a loop, pass the loop value as an **argument**
so each goroutine gets its own copy:

```go
go func(n int) { use(n) }(i)
```

## A trick for lock-free results

If each goroutine writes to a **different slot** of a shared slice
(`results[i] = ...`), no two goroutines ever touch the same memory, so you need no
lock at all. You will use this to collect partial sums.
"""

