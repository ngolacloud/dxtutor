[unit.step.gabarito]
time = "O(1)"
space = "O(1)"
solution = '''
package student

import (
	"database/sql"

	_ "modernc.org/sqlite"
)

func Transfer(a0, b0, amount int) (int, int) {
	db, err := sql.Open("sqlite", ":memory:")
	if err != nil {
		return a0, b0
	}
	defer db.Close()
	db.Exec(`CREATE TABLE accounts (id INTEGER PRIMARY KEY, balance INTEGER)`)
	db.Exec(`INSERT INTO accounts (id, balance) VALUES (1, ?), (2, ?)`, a0, b0)
	tx, err := db.Begin()
	if err != nil {
		return a0, b0
	}
	tx.Exec(`UPDATE accounts SET balance = balance - ? WHERE id = 1`, amount)
	tx.Exec(`UPDATE accounts SET balance = balance + ? WHERE id = 2`, amount)
	var na, nb int
	tx.QueryRow(`SELECT balance FROM accounts WHERE id = 1`).Scan(&na)
	tx.QueryRow(`SELECT balance FROM accounts WHERE id = 2`).Scan(&nb)
	if na < 0 || nb < 0 {
		tx.Rollback()
		return a0, b0
	}
	tx.Commit()
	return na, nb
}
'''
justification = """

The work is a fixed number of statements regardless of the inputs, so both time and
space are **O(1)**. Atomicity comes from the transaction: on the overdraw path the
`Rollback` restores the opening balances, which is why the originals come back
unchanged.

"""

