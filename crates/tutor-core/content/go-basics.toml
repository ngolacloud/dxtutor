target = '''
package main

import "fmt"

func fib(n int) int {
    dp := make([]int, n+1)
    dp[0] = 0
    if n >= 1 {
        dp[1] = 1
    }
    for i := 2; i <= n; i++ {
        dp[i] = dp[i-1] + dp[i-2]
    }
    return dp[n]
}

