# ═════════════════════════════════════════════════════════════════════════════
# UNIT 3 — Control flow (if / switch)
# ═════════════════════════════════════════════════════════════════════════════
[[unit]]
id = "u3-control-flow"
title = "Control flow (if / switch)"
difficulty = 3
level = "basic"
intro = """
Programs make decisions. You will use `if`/`else` to branch on a boolean condition
and `switch` to pick cleanly among several cases. By the end you classify a number
in a graded challenge.
"""

[[unit.step]]
kind = "concept"
id = "c3-branching"
title = "Branching with if and switch"
points = 5
difficulty = 3
run_command = ""
intro = """
A branch lets the program take one path or another depending on a condition
evaluated at run time. Go's `if` needs no parentheses around the condition, and
its `switch` does not fall through by default — each case stands alone.
"""
body = """
## `if` / `else`

```go
if n%2 == 0 {
    fmt.Println("even")
} else {
    fmt.Println("odd")
}
```

The condition must be a `bool`. No parentheses are required; the braces are.

## `switch`

```go
switch day {
case 1:
    fmt.Println("Monday")
case 3:
    fmt.Println("Wednesday")
default:
    fmt.Println("Other")
}
```

Unlike C, Go does **not** fall through from one case to the next, so you rarely
need `break`. A `switch` with many cases reads far more clearly than a long chain
of `else if`.
"""

[[unit.step]]
kind = "drill"
id = "d1-if"
title = "Branch with if/else"
points = 10
difficulty = 3
placeholder_policy = "shown"
run_command = "go run ."
intro = """
`%` is the remainder operator. `n%2 == 0` is true exactly when `n` is even, so this
`if`/`else` prints one word or the other.
"""
