solution = '''
package student

import (
	"database/sql"
	"strings"

	_ "modernc.org/sqlite"
)

func TotalPrice(orderIDs []int) (int, int) {
	db, err := sql.Open("sqlite", ":memory:")
	if err != nil {
		return 0, 0
	}
	defer db.Close()
	db.Exec(`CREATE TABLE orders (id INTEGER PRIMARY KEY, price INTEGER)`)
	for i := 1; i <= 100; i++ {
		db.Exec(`INSERT INTO orders (id, price) VALUES (?, ?)`, i, i*10)
	}
	if len(orderIDs) == 0 {
		return 0, 0
	}
	placeholders := make([]string, len(orderIDs))
	args := make([]any, len(orderIDs))
	for i, id := range orderIDs {
		placeholders[i] = "?"
		args[i] = id
	}
	q := `SELECT COALESCE(SUM(price), 0) FROM orders WHERE id IN (` + strings.Join(placeholders, ",") + `)`
	queries := 0
	var sum int
	db.QueryRow(q, args...).Scan(&sum)
	queries++
	return sum, queries
}
'''
justification = """

Building the placeholder list is **O(n)** in the number of ids, and the single query
is one round trip whatever `n` is. The returned query count is literally `1`, which is
the point: the whole set is summed in one statement instead of one query per id.

"""

