solution = '''
package student

import "sync"

func ParallelCount(nums []int) int {
	const workers = 4
	jobs := make(chan int)
	results := make(chan int)
	var wg sync.WaitGroup
	wg.Add(workers)
	for w := 0; w < workers; w++ {
		go func() {
			defer wg.Done()
			for n := range jobs {
				if n%2 == 0 {
					results <- 1
				} else {
					results <- 0
				}
			}
		}()
	}
	go func() {
		for _, n := range nums {
			jobs <- n
		}
		close(jobs)
	}()
	go func() {
		wg.Wait()
		close(results)
	}()
	total := 0
	for r := range results {
		total += r
	}
	return total
}
'''
justification = """
Each of the `n` numbers is processed once by some worker and produces one result, so
the work is **O(n)**; the pool is a fixed number of workers with unbuffered channels,
so the extra space is **O(1)** (independent of `n`). The pool bounds concurrency, the
closer goroutine ends the results stream after every worker finishes, and because the
count is a sum of 0/1 flags, it is identical no matter which worker handled which
number — deterministic.
"""

[[unit]]
id = "u15-stacks-queues"
title = "Stacks & queues with slices"
difficulty = 15
level = "advanced"
intro = """
Two of the most useful data structures need no library at all — a Go slice is enough.
Push and pop from the right and a slice behaves as a **stack** (last in, first out);
take from the front instead and it is a **queue** (first in, first out). You will build
both, use a stack to reverse a slice, and finish by checking bracket balance — the
canonical stack problem.
"""

[[unit.step]]
kind = "concept"
id = "c15-stacks-queues"
title = "A slice is a stack and a queue"
points = 5
difficulty = 15
run_command = ""
intro = """
`append` grows a slice on the right; reslicing shrinks it. Pop the right end and you have
a LIFO stack; take the left end and you have a FIFO queue. No container package required.
"""
body = """
## Stack (LIFO)

Push with `append`, peek the last element, pop by reslicing away the last element:

```go
stack = append(stack, x)      // push
top := stack[len(stack)-1]    // peek the top
stack = stack[:len(stack)-1]  // pop
```

Last in, first out: the most recent push is the first pop.

## Queue (FIFO)

Push on the right, but take from the **front**:

```go
queue = append(queue, x)  // enqueue
front := queue[0]         // peek the front
queue = queue[1:]         // dequeue
```

First in, first out: the oldest element leaves first.

## When to reach for what

A stack models "undo", recursion, and matching brackets. A queue models work waiting in
line and breadth-first traversal. Reslicing is O(1), so both are cheap. (Reslicing a
queue's front repeatedly keeps the dropped heads in the backing array; for long-lived
queues use a ring buffer or `container/list`. For exercises, a slice is perfect.)
"""

