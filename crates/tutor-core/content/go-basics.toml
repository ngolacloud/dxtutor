```

Return `true` when every bracket in `s` is closed in the correct order, considering the
three pairs `()`, `[]` and `{}`. Any other character should be ignored.

Examples:

- `BalancedParens("")` -> `true`
- `BalancedParens("()[]{}")` -> `true`
- `BalancedParens("([{}])")` -> `true`
- `BalancedParens("(]")` -> `false`
- `BalancedParens(")(")` -> `false`

**Hint:** keep a stack of open brackets. Push every opener. On a closer, fail if the stack
is empty or its top is not the matching opener; otherwise pop. At the end, balanced means
the stack is empty.

Hidden tests decide correctness.
