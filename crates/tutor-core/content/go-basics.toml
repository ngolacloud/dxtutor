'''

[unit.step.gabarito]
time = "O(n)"
space = "O(n)"
solution = '''
package student

func SumConcurrent(nums []int) int {
	ch := make(chan int, len(nums))
	for _, n := range nums {
		go func(v int) {
			ch <- v
		}(n)
	}
	total := 0
	for range nums {
		total += <-ch
	}
	return total
}
'''
justification = """
Each of the `n` numbers is handled by one goroutine that sends on the channel, and
the collector receives `n` values, so the work is **O(n)**. The buffered channel
holds up to `n` pending values, so the extra space is **O(n)**. Because addition is
commutative, the total is the same no matter which goroutine is scheduled first,
which keeps the result deterministic.
"""

