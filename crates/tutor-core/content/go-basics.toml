# ═════════════════════════════════════════════════════════════════════════════
# UNIT 4 — Loops (for)
# ═════════════════════════════════════════════════════════════════════════════
[[unit]]
id = "u4-loops"
title = "Loops (for)"
difficulty = 4
level = "basic"
intro = """
Repetition is where computers shine. Go has exactly one loop keyword — `for` — that
plays every role: counting loop, while-style loop, and range loop over a collection.
By the end you sum the numbers up to `n` in a graded challenge.
"""

[[unit.step]]
kind = "concept"
id = "c4-for"
title = "The one loop: for"
points = 5
difficulty = 4
run_command = ""
intro = """
A loop repeats a block while a condition holds. Go unifies all looping into the
single keyword `for`, so there is less to remember and one shape to master.
"""
body = """
## Three shapes, one keyword

```go
for i := 1; i <= 5; i++ {   // classic counter: init; condition; post
    sum += i
}

for condition {             // while-style
    // ...
}

for i, v := range nums {    // range over a slice/map/string
    fmt.Println(i, v)
}
```

- The **classic** form has three parts: an initializer, a condition, and a
  post-statement (`i++`).
- Drop the init and post to get a **while** loop.
- **`range`** walks a collection, handing you the index and the value each turn.

Loop cost matters: a single `for` over `n` items is **O(n)**; a loop inside a loop
is **O(n²)**. You will meet that idea again when complexity is graded.
"""

[[unit.step]]
kind = "drill"
id = "d1-counter"
title = "Count with a for loop"
points = 10
difficulty = 4
placeholder_policy = "shown"
run_command = "go run ."
intro = """
The classic three-part `for` runs its body once per value of `i`, from 1 through 5,
accumulating the running total in `sum`.
"""
prompt = """
Add the numbers 1 through 5 with a classic `for` loop and print the total.
"""
target = '''
package main

import "fmt"

func main() {
    sum := 0
    for i := 1; i <= 5; i++ {
        sum += i
    }
    fmt.Println("Sum:", sum)
}
'''
line_comments = [
    "Runnable `package main`.",
    "",
    "Imports `fmt`.",
    "",
    "Opens `main`.",
    "Starts the running total at zero.",
    "Loops `i` from 1 while `i <= 5`, adding 1 each turn (`i++`).",
    "Adds the current `i` to `sum` (`+=` means `sum = sum + i`).",
    "Closes the loop body.",
    "Prints the final total, 15.",
    "Closes `main`.",
]
explanation = """
The loop body runs five times, once for each `i` in 1..5, and `sum` grows to 15.
One pass over `n` items is linear — **O(n)** work.
"""

