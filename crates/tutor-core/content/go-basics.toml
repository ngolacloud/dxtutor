			out = append(out, b[j])
			j++
		}
	}
	out = append(out, a[i:]...)
	out = append(out, b[j:]...)
	return out
}

func MergeSort(v []int) []int {
	if len(v) <= 1 {
		out := make([]int, len(v))
		copy(out, v)
		return out
	}
	mid := len(v) / 2
	left := MergeSort(v[:mid])
	right := MergeSort(v[mid:])
	return merge(left, right)
}
'''
justification = """
The slice is halved log n times and each level does O(n) merging, so the total is
**O(n log n)**; the merged outputs use **O(n)** extra space. The base case copies the 0- or
1-element slice, so a fresh slice is always returned and the input is never mutated. `merge`
uses `<=`, keeping equal elements in order — a stable sort — and duplicates are preserved.
"""

[[unit]]
id = "u20-recursion-dp"
title = "Recursion & dynamic programming"
difficulty = 20
level = "advanced"
intro = """
Recursion solves a problem by solving smaller versions of itself. When those subproblems
overlap, plain recursion redoes the same work exponentially — and **dynamic programming** fixes
it by solving each subproblem once and storing the answer. You will write classic recursions,
watch naive Fibonacci blow up, rebuild it bottom-up, and finish with the coin-change problem.
"""

[[unit.step]]
kind = "concept"
id = "c20-recursion-dp"
title = "From recursion to memoized DP"
points = 5
difficulty = 20
run_command = ""
intro = """
A recursive function needs a base case (when to stop) and a recursive case (how to shrink the
problem). When subproblems repeat, caching their results — dynamic programming — removes the
exponential blow-up.
"""
body = """
## Recursion

Base case plus a smaller call:

```go
func fact(n int) int {
    if n <= 1 {
        return 1       // base case
    }
    return n * fact(n-1)   // recursive case
}
```

## The overlap problem

Naive Fibonacci recomputes the same values over and over:

```go
func fib(n int) int {
    if n < 2 { return n }
    return fib(n-1) + fib(n-2)   // exponential: fib(n-2) computed twice, and so on
}
```

## Dynamic programming (bottom-up)

Solve each subproblem once, smallest first, and store it in a table:

```go
if n == 0 {
    return 0 // base case first: dp[1] below would be out of range for n == 0
}
dp := make([]int, n+1)
dp[1] = 1
for i := 2; i <= n; i++ {
    dp[i] = dp[i-1] + dp[i-2]   // each entry filled once
}
return dp[n]
```

The exponential recursion becomes a linear loop. The recipe generalises: define the
subproblem, find the recurrence (how an answer builds from smaller ones), pick the base cases,
and fill the table from the bottom up.
"""

