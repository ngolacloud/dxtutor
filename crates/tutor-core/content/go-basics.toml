## Your turn

Implement the function `SumConcurrent`:

```go
func SumConcurrent(nums []int) int { ... }
```

Return the sum of all the integers in `nums`, computed with the help of goroutines
and a channel (or a `sync.WaitGroup`). The result must be correct and deterministic
regardless of goroutine scheduling.

Examples:

- `SumConcurrent([]int{1, 2, 3, 4, 5})` → `15`
- `SumConcurrent(nil)` → `0`

