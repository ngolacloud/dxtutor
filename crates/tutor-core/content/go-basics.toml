[[unit]]
id = "udb4-n-plus-one"
title = "The N+1 query problem"
difficulty = 10
level = "intermediate"
intro = """

A loop that runs one query per id is the N+1 anti-pattern: for N ids you pay N round
trips (plus the one that produced the ids). Folding them into a single `IN (...)`
query is dramatically faster. You will count the queries both ways and then return a
total using exactly one query.

"""

[[unit.step]]
kind = "concept"
id = "cdb4-nplus1"
title = "One query, not N"
points = 5
difficulty = 10
run_command = ""
intro = """

Each database round trip has a cost. Doing one per item inside a loop multiplies that
cost by N. A single set-based query does the same work in one trip.

"""
body = """

## N+1 vs a single query

```go
// N+1: one query per id (slow)
for _, id := range ids {
    db.QueryRow(`SELECT price FROM orders WHERE id = ?`, id).Scan(&p)
    total += p
}

// One query for all ids (fast)
db.QueryRow(`SELECT SUM(price) FROM orders WHERE id IN (1, 2, 3)`).Scan(&total)
```

- The loop issues **N** separate queries — the classic N+1 pattern.
- The set-based version makes **one** round trip with an `IN (...)` list.
- Build the `IN` list from `?` placeholders (one per id) and pass the ids as
  arguments — never concatenate values into the SQL.
- Fewer round trips is usually the single biggest database win in a service.

"""

