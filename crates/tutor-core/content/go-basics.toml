[unit.step.gabarito]
time = "O(n)"
space = "O(1)"
solution = '''
package student

import "sync"

func SumParallel(nums []int) int {
	const workers = 4
	if len(nums) == 0 {
		return 0
	}
	partials := make([]int, workers)
	var wg sync.WaitGroup
	wg.Add(workers)
	for w := 0; w < workers; w++ {
		go func(id int) {
			defer wg.Done()
			sum := 0
			for i := id; i < len(nums); i += workers {
				sum += nums[i]
			}
			partials[id] = sum
		}(w)
	}
	wg.Wait()
	total := 0
	for _, p := range partials {
		total += p
	}
	return total
}
'''
justification = """
Every element is visited exactly once across the workers, so the work is **O(n)**;
the only extra memory is one partial-sum slot per worker, a fixed count, so the
extra space is **O(1)**. Each worker owns a disjoint stride of indices and its own
output slot, so there is no shared mutable state and no lock — and because addition
is commutative, the total is identical no matter which goroutine the runtime runs
first. That is what makes the result deterministic.
"""

