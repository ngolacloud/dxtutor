[[unit]]
id = "udb1-connect-query"
title = "Databases: connect & query"
difficulty = 10
level = "intermediate"
intro = """

Real services keep their state in a database. Go talks to SQL databases through the
standard `database/sql` package plus a driver. Here you use SQLite with the pure-Go
driver `modernc.org/sqlite` (no C compiler needed): open a database, create a table,
insert rows with `?` placeholders, and read them back with `QueryRow` and `Query`.

"""

[[unit.step]]
kind = "concept"
id = "cdb1-connect"
title = "database/sql and a driver"
points = 5
difficulty = 10
run_command = ""
intro = """

`database/sql` is a thin, driver-agnostic layer. You import a driver for its side
effect (a blank import) so it registers itself, then open a handle by the driver's
registered name.

"""
body = """

## Open, exec, query

```go
import (
    "database/sql"

    _ "modernc.org/sqlite"
)

db, _ := sql.Open("sqlite", ":memory:")
defer db.Close()

db.Exec(`CREATE TABLE users (id INTEGER, name TEXT)`)
db.Exec(`INSERT INTO users VALUES (?, ?)`, 1, "Ana")

var n int
db.QueryRow(`SELECT COUNT(*) FROM users`).Scan(&n)
```

- The **blank import** `_ "modernc.org/sqlite"` registers the driver named `sqlite`.
- **`sql.Open("sqlite", ":memory:")`** returns a `*sql.DB` handle — a pool, not a
  single connection.
- **`Exec`** runs statements that return no rows; **`?`** placeholders bind values
  safely (never build SQL by string concatenation).
- **`QueryRow(...).Scan(&n)`** reads exactly one row into Go variables.

For many rows, use `Query` and loop with `rows.Next()` / `rows.Scan(...)`, and always
`defer rows.Close()`.

"""

