[[unit]]
id = "u9-errors"
title = "Errors"
difficulty = 9
level = "intermediate"
intro = """
Go has no exceptions. Instead, a function that can fail returns an `error` as its
last result, and the caller checks it. You will use `errors.New`, `fmt.Errorf` with
`%w`, and the `err != nil` pattern. By the end you divide safely, returning an error
on divide-by-zero.
"""

[[unit.step]]
kind = "concept"
id = "c9-errors"
title = "Errors are values"
points = 5
difficulty = 9
run_command = ""
intro = """
In Go an error is just a value that implements the `error` interface (one method,
`Error() string`). Returning errors instead of throwing them makes every failure
path explicit and visible in the code.
"""
body = """
## Return and check

```go
import (
    "errors"
    "fmt"
)

func check(age int) error {
    if age < 0 {
        return errors.New("age cannot be negative")
    }
    return nil
}

err := check(-1)
if err != nil {
    fmt.Println("failed:", err)
}
```

- **`errors.New("...")`** builds a simple error value.
- A successful call returns **`nil`** for the error.
- The caller checks **`if err != nil`** — the single most common line in Go.

To add context while keeping the original error, wrap it:

```go
return fmt.Errorf("validate user: %w", ErrEmpty)
```

The `%w` verb wraps `ErrEmpty` so `errors.Is(err, ErrEmpty)` still recognises it
further up the stack.
"""

