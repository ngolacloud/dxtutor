title = "Functions & multiple returns"
difficulty = 5
level = "basic"
intro = """
Functions package a piece of work behind a name so you can call it anywhere. Go
functions can return **several values at once** — the idiom behind both `(result,
error)` and small helpers like min/max. By the end you return a quotient and a
remainder together.
"""

[[unit.step]]
kind = "concept"
id = "c5-functions"
title = "Declaring and returning"
points = 5
difficulty = 5
run_command = ""
intro = """
A function has a name, a list of typed parameters, a list of result types, and a
body. Go's ability to return more than one value is used everywhere in the
standard library.
"""
body = """
## One value, or several

```go
func square(x int) int {
    return x * x
}

func minMax(a, b int) (int, int) {
    if a < b {
        return a, b
    }
    return b, a
}
```

- Parameters come first (`a, b int` groups two `int`s).
- The result types come after the parameter list; wrap several in parentheses.
- `return a, b` hands back both values; the caller receives them with
  `lo, hi := minMax(8, 3)`.

Returning `(value, error)` is the Go convention for operations that can fail — you
will use it in the errors unit.
"""

