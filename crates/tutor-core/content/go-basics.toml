# UNIT 10 — Goroutines, channels & packages
# ═════════════════════════════════════════════════════════════════════════════
[[unit]]
id = "u10-concurrency"
title = "Goroutines, channels & packages"
difficulty = 10
level = "intermediate"
intro = """
The two things real Go backends lean on most: lightweight **concurrency**
(goroutines, channels, `sync.WaitGroup`) and the **module system** that pulls in
other people's code with `go get`. You will run concurrent work, coordinate it, use
two popular external packages, and finish by summing a slice concurrently.
"""

[[unit.step]]
kind = "concept"
id = "c10-concurrency"
title = "Goroutines, channels, and go get"
points = 5
difficulty = 10
run_command = ""
intro = """
A goroutine is a function running concurrently, scheduled by the Go runtime on top
of OS threads — cheap enough to launch thousands. Channels pass values safely
between goroutines. And when your program needs code it did not write, the module
system fetches it with `go get`.
"""
body = """
## Goroutines & channels

```go
done := make(chan string)   // a channel of strings
go func() {                 // launch a goroutine
    done <- "finished"      // send on the channel
}()
msg := <-done               // receive (blocks until a value arrives)
```

- **`go f()`** runs `f` concurrently and returns immediately.
- A **channel** (`make(chan T)`) is a typed pipe; `ch <- v` sends, `<-ch` receives.
- Receiving **blocks** until a value is ready, which is how goroutines synchronise.

## Waiting for many: sync.WaitGroup

```go
var wg sync.WaitGroup
for i := 0; i < 3; i++ {
    wg.Add(1)
    go func() { defer wg.Done(); work() }()
}
wg.Wait()   // blocks until all three call Done
```

## Pulling in packages with go get

Real services use libraries. You add one to your module and download it with:

```sh
go get github.com/google/uuid
```

Then `import "github.com/google/uuid"` and run with `go run .`. The toolchain
records the dependency in `go.mod` and its exact version in `go.sum`. The next two
drills do exactly this with two well-known packages — watch the tutor show you the
install command.
"""

