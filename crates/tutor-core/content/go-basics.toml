[[unit.step]]
kind = "drill"
id = "d2-waitgroup"
title = "Coordinate with sync.WaitGroup"
points = 10
difficulty = 10
placeholder_policy = "on_demand"
run_command = "go run ."
intro = """
A `sync.WaitGroup` counts outstanding goroutines. Each `Add(1)` before launching,
each `Done()` as it finishes, and `Wait()` blocks until the count returns to zero —
so `main` does not exit before the workers do.
"""
prompt = """
Launch three goroutines and wait for all of them with a `sync.WaitGroup`.
"""
target = '''
package main

import (
    "fmt"
    "sync"
)

func main() {
    var wg sync.WaitGroup
    for i := 1; i <= 3; i++ {
        wg.Add(1)
        go func(n int) {
            defer wg.Done()
            fmt.Println("worker", n)
        }(i)
    }
    wg.Wait()
    fmt.Println("all done")
}
'''
line_comments = [
    "Runnable `package main`.",
    "",
    "Begins a grouped import...",
    "...of `fmt`...",
    "...and `sync`, for the WaitGroup.",
    "Closes the import group.",
    "",
    "Opens `main`.",
    "Declares a WaitGroup to track running goroutines.",
    "Loops to launch three workers.",
    "Registers one more goroutine with the group.",
    "Launches a goroutine, passing the loop value as `n`.",
    "`defer` guarantees `Done` runs when the goroutine returns.",
    "The worker prints its number.",
    "Closes and calls the goroutine with the current `i`.",
    "Closes the loop body.",
    "Blocks until all three workers have called `Done`.",
    "Prints a final line after everyone finished.",
    "Closes `main`.",
]
explanation = """
`Add`/`Done`/`Wait` are the counter that lets `main` wait for concurrent work.
Passing `i` as an argument gives each goroutine its own copy. Worker lines may print
in any order — that is concurrency.
"""

