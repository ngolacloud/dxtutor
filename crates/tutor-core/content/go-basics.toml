# UNIT 8 — Slices & maps
# ═════════════════════════════════════════════════════════════════════════════
[[unit]]
id = "u8-slices-maps"
title = "Slices & maps"
difficulty = 8
level = "intermediate"
intro = """
Two collections power almost every Go program: the **slice** (a growable, ordered
list) and the **map** (a key→value lookup table). By the end you count how many
times each word appears — a tiny search index.
"""

[[unit.step]]
kind = "concept"
id = "c8-collections"
title = "Slices and maps"
points = 5
difficulty = 8
run_command = ""
intro = """
A slice is a view over a contiguous, growable array of elements of one type. A map
stores key→value pairs with average constant-time lookup via hashing. Between them
they cover ordered lists and keyed lookups.
"""
body = """
## Slice

```go
nums := []int{1, 2, 3}
nums = append(nums, 4)   // grows the slice
fmt.Println(len(nums))   // 4
```

`append` returns a (possibly new) slice, so you assign it back. `len` reports the
length.

## Map

```go
ages := map[string]int{"Ana": 30}
ages["Bo"] = 25             // insert
fmt.Println(ages["Ana"])    // 30

n, ok := ages["Zed"]        // ok is false when the key is absent
```

A map lookup is **O(1)** on average — that is why maps are the go-to tool for
counting, grouping, and de-duplicating. The comma-ok form (`n, ok := m[k]`) tells
you whether the key existed.
"""

