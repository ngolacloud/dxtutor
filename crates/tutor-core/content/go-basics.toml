[[unit]]
id = "u7-interfaces"
title = "Interfaces"
difficulty = 7
level = "intermediate"
intro = """
An **interface** names a set of methods. Any type that has those methods satisfies
the interface automatically — no `implements` keyword. This is how Go writes code
that works with many types at once. By the end you total the area of a mixed list
of shapes.
"""

[[unit.step]]
kind = "concept"
id = "c7-interfaces"
title = "Behaviour, not data"
points = 5
difficulty = 7
run_command = ""
intro = """
An interface describes what a value can **do**, not what it **is**. If a type has
the right methods, it fits the interface implicitly — this decoupling is the heart
of Go's approach to polymorphism.
"""
body = """
## Implicit satisfaction

```go
type Shape interface {
    Area() float64
}

type Square struct{ Side float64 }

func (s Square) Area() float64 { return s.Side * s.Side }
```

Because `Square` has an `Area() float64` method, it **is** a `Shape` — you never
write it down. Now a function can accept any `Shape`:

```go
func TotalArea(shapes []Shape) float64 {
    total := 0.0
    for _, s := range shapes {
        total += s.Area()
    }
    return total
}
```

The same loop handles squares, rectangles, circles — anything with an `Area`.
Interfaces let you program to behaviour, so new types slot in without touching the
code that uses them.
"""

