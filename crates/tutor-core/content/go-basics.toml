solution = '''
package student

func TwoSum(nums []int, target int) (int, int, bool) {
	seen := map[int]int{}
	for j, v := range nums {
		if i, ok := seen[target-v]; ok {
			return i, j, true
		}
		if _, ok := seen[v]; !ok {
			seen[v] = j
		}
	}
	return 0, 0, false
}
'''
justification = """
One pass over `nums` (**O(n)**) with a map holding at most one index per value (**O(n)**
space). For each `v` at index `j`, the complement `target - v` is looked up in O(1); if it was
seen earlier its stored index is smaller than `j`, so returning `(i, j)` gives the smaller
index first. Storing only the first occurrence of each value keeps `i` minimal. Finding the
complement before inserting `v` prevents using one element twice.
"""

