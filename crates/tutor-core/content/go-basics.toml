func UsesIndexForLookup() bool {
	db, err := sql.Open("sqlite", ":memory:")
	if err != nil {
		return false
	}
	defer db.Close()
	db.Exec(`CREATE TABLE users (id INTEGER PRIMARY KEY, email TEXT, name TEXT)`)
	db.Exec(`CREATE INDEX idx_users_email ON users(email)`)
	db.Exec(`INSERT INTO users (id, email, name) VALUES (1, 'a@x', 'Ana'), (2, 'b@x', 'Bo')`)
	rows, err := db.Query(`EXPLAIN QUERY PLAN SELECT name FROM users WHERE email = ?`, "a@x")
	if err != nil {
		return false
	}
	defer rows.Close()
	found := false
	for rows.Next() {
		var id, parent, notUsed int
		var detail string
		if err := rows.Scan(&id, &parent, &notUsed, &detail); err != nil {
			return false
		}
		if strings.Contains(detail, "USING INDEX") {
			found = true
		}
	}
	return found
}
