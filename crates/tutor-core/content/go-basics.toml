[[unit]]
id = "udb5-pagination"
title = "Pagination: OFFSET vs keyset"
difficulty = 10
level = "intermediate"
intro = """

Listing results a page at a time has two common shapes. `LIMIT/OFFSET` is simple but
gets slower as the offset grows, because the database still walks the skipped rows.
Keyset pagination (`WHERE id > ? ORDER BY id LIMIT ?`) remembers the last id and jumps
straight past it. You will build both and then a keyset pager.

"""

[[unit.step]]
kind = "concept"
id = "cdb5-paging"
title = "OFFSET vs keyset"
points = 5
difficulty = 10
run_command = ""
intro = """

Both approaches return a page of rows. The difference is what happens deep into the
list: OFFSET re-scans the skipped rows, keyset seeks directly using the last id.

"""
body = """

## Two ways to page

```go
// OFFSET: skip the first (page*size) rows
db.Query(`SELECT id FROM items ORDER BY id LIMIT ? OFFSET ?`, size, page*size)

// Keyset: continue after the last id you saw
db.Query(`SELECT id FROM items WHERE id > ? ORDER BY id LIMIT ?`, lastID, size)
```

- **`LIMIT ? OFFSET ?`** is easy, but a large `OFFSET` makes the database count past
  all the skipped rows every time.
- **Keyset** carries the last id forward; with an index on `id` it seeks straight to
  the next page, so cost stays flat as you go deeper.
- Keyset needs a stable sort key (here the primary key `id`) and `ORDER BY` on it.
- The trade-off: OFFSET can jump to any page number; keyset only moves forward from a
  known row.

"""

