[[unit]]
id = "u6-structs"
title = "Structs & methods"
difficulty = 6
level = "intermediate"
intro = """
Real programs model things — a user, a rectangle, a request. A **struct** groups
related fields into one named type, and a **method** attaches behaviour to that
type. By the end you give a `Rectangle` an `Area` method.
"""

[[unit.step]]
kind = "concept"
id = "c6-structs"
title = "Your own types"
points = 5
difficulty = 6
run_command = ""
intro = """
A struct is a composite type: several typed fields bundled under one name. A method
is a function with a **receiver** — the value it acts on — written just before the
name. Together they are how Go models data and the behaviour that belongs with it.
"""
body = """
## Struct + method

```go
type Rectangle struct {
    Width  float64
    Height float64
}

func (r Rectangle) Area() float64 {
    return r.Width * r.Height
}
```

- **`type Name struct { ... }`** declares a new type with named fields.
- Create a value with `Rectangle{Width: 3, Height: 4}` and read a field with
  `r.Width`.
- **`func (r Rectangle) Area() float64`** adds a method; `r` is the receiver, the
  specific rectangle the method runs on. Call it with `r.Area()`.

Capitalised names (`Width`, `Area`) are **exported** — visible from other packages;
lowercase names are private to the package. That single rule is Go's whole access
model.
"""

