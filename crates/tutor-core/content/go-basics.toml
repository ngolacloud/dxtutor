solution = '''
package student

import (
	"database/sql"

	_ "modernc.org/sqlite"
)

func PageAfter(lastID, size int) []int {
	out := []int{}
	if size <= 0 {
		return out
	}
	db, err := sql.Open("sqlite", ":memory:")
	if err != nil {
		return out
	}
	defer db.Close()
	db.Exec(`CREATE TABLE items (id INTEGER PRIMARY KEY)`)
	for i := 1; i <= 100; i++ {
		db.Exec(`INSERT INTO items (id) VALUES (?)`, i)
	}
	rows, err := db.Query(`SELECT id FROM items WHERE id > ? ORDER BY id LIMIT ?`, lastID, size)
	if err != nil {
		return out
	}
	defer rows.Close()
	for rows.Next() {
		var id int
		rows.Scan(&id)
		out = append(out, id)
	}
	return out
}
'''
justification = """

The query reads at most `size` rows and the result slice holds at most `size` ids, so
both time and space are **O(size)** — independent of how deep into the table the page
sits. That flat cost is the whole advantage of keyset over a large `OFFSET`.

"""

