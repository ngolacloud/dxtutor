[[unit]]
id = "u12-channels"
title = "Channels"
difficulty = 12
level = "advanced"
intro = """
Channels are how goroutines **communicate** — Go's motto is *"don't communicate by
sharing memory; share memory by communicating."* A channel is a typed pipe: one
goroutine sends values in, another receives them out, and the channel handles the
synchronisation. You will learn unbuffered channels (a send and a receive meet, a
rendezvous), buffered channels (a small queue), how `close` signals "no more
values", and how `range` drains a channel until it closes. The unit ends with a
producer/consumer pipeline that sums a stream of numbers.
"""

[[unit.step]]
kind = "concept"
id = "c12-channels"
title = "Sending, receiving, closing, ranging"
points = 5
difficulty = 12
run_command = ""
intro = """
A channel carries values of one type between goroutines and synchronises them while
doing it. Unbuffered channels pair a send with a receive; buffered channels hold a
few values; closing a channel tells receivers the stream has ended.
"""
body = """
## Make, send, receive

```go
ch := make(chan int)   // unbuffered channel of ints
ch <- 7                // send 7 (blocks until a receiver is ready)
v := <-ch              // receive (blocks until a value is ready)
```

On an **unbuffered** channel a send blocks until some goroutine receives, and a
receive blocks until some goroutine sends — the two meet at a single point, a
*rendezvous*. That rendezvous is itself the synchronisation.

## Buffered channels

```go
ch := make(chan int, 3)  // room for three values
ch <- 1; ch <- 2; ch <- 3 // these do not block: there is room
```

A **buffered** channel holds up to its capacity without a waiting receiver. Sends
block only when the buffer is full; receives block only when it is empty.

## Close and range

```go
close(ch)             // no more values will be sent
for v := range ch {   // yields buffered values, then stops at close
    use(v)
}

v, ok := <-ch         // ok == false once the channel is closed and drained
```

**`close`** marks a channel finished. A `range` over a channel reads values until it
is closed and drained, then ends the loop. The two-value receive `v, ok := <-ch`
reports whether a real value came (`ok` true) or the channel is closed (`ok` false).
Only the **sender** should close a channel, and never send on a closed one.

## Directional channels

A parameter typed `chan<- int` may only **send**; `<-chan int` may only **receive**.
It documents and enforces a goroutine's role.
"""

