[unit.step.gabarito]
time = "O(amount * len(coins))"
space = "O(amount)"
solution = '''
package student

func CoinChange(coins []int, amount int) int {
	if amount < 0 {
		return -1
	}
	const inf = 1 << 30
	dp := make([]int, amount+1)
	for i := 1; i <= amount; i++ {
		dp[i] = inf
		for _, c := range coins {
			if c > 0 && c <= i && dp[i-c]+1 < dp[i] {
				dp[i] = dp[i-c] + 1
			}
		}
	}
	if dp[amount] >= inf {
		return -1
	}
	return dp[amount]
}
'''
justification = """
`dp[x]` is the fewest coins for amount `x`. The outer loop runs `amount` times, the inner over
every coin, giving **O(amount * len(coins))** time and **O(amount)** space. Each `dp[x]` is
built from already-solved smaller amounts (`dp[x-c]`), so a bottom-up pass fills the table once.
`dp[0]` stays 0 (base case), and an entry still at infinity means that amount is unreachable, so
`dp[amount]` infinite returns -1. Trying every coin — not the largest greedily — is what makes
`[1 3 4]` for 6 yield 2 (3+3) rather than 3.
"""
