id = "d2-switch"
title = "Choose with switch"
points = 10
difficulty = 3
placeholder_policy = "shown"
run_command = "go run ."
intro = """
`switch` compares one value against several `case` labels and runs the first that
matches, with no fall-through. `default` handles everything else.
"""
