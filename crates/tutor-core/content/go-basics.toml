}
'''
line_comments = [
    "Runnable `package main`.",
    "",
    "Imports `fmt`.",
    "",
    "Opens `main`.",
    "`n` holds the value to classify.",
    "If the remainder of `n` divided by 2 is zero, `n` is even.",
    "Prints `even` on the true branch.",
    "`else` begins the false branch.",
    "Prints `odd` when `n` is not divisible by 2.",
    "Closes the `if`/`else`.",
    "Closes `main`.",
]
