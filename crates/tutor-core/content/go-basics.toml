[unit.step.gabarito]
time = "O(n)"
space = "O(n)"
solution = '''
package student

type Node struct {
	Val  int
	Next *Node
}

func ReverseList(items []int) []int {
	var head *Node
	for _, v := range items {
		head = &Node{Val: v, Next: head}
	}
	out := make([]int, 0, len(items))
	for n := head; n != nil; n = n.Next {
		out = append(out, n.Val)
	}
	return out
}
'''
justification = """
Each value is pushed once (**O(n)**) and the list holds one node per value (**O(n)** space).
Front insertion builds the list in reverse: the last value pushed becomes the head, so
walking head-to-nil yields the input reversed. Pre-sizing `out` with `make(..., 0, len)`
avoids re-allocations during the collecting walk.
"""

