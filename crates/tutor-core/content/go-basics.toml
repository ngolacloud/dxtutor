[[unit.step]]
kind = "concept"
id = "c19-sorting-searching"
title = "Divide, merge, and search"
points = 5
difficulty = 19
run_command = ""
intro = """
Binary search halves a sorted range each step — O(log n). Merge sort splits a slice in two,
sorts each half, and merges them back — O(n log n). Both are built from simple index work.
"""
body = """
## Binary search

On a sorted slice, compare the middle and discard half each iteration:

```go
lo, hi := 0, len(v)-1
for lo <= hi {
    mid := (lo + hi) / 2
    if v[mid] == target { return mid }
    if v[mid] < target { lo = mid + 1 } else { hi = mid - 1 }
}
return -1
```

## Merge

Combine two sorted slices by always taking the smaller front element:

```go
for i < len(a) && j < len(b) {
    if a[i] <= b[j] { out = append(out, a[i]); i++ } else { out = append(out, b[j]); j++ }
}
out = append(out, a[i:]...)   // drain the rest
out = append(out, b[j:]...)
```

## Merge sort

Split, recurse, merge:

```go
mid := len(v) / 2
left := MergeSort(v[:mid])
right := MergeSort(v[mid:])
return merge(left, right)
```

A slice of length 0 or 1 is already sorted — that is the base case. Using `<=` in the merge
keeps equal elements in their original relative order, so merge sort is **stable**.
"""

