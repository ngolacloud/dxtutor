[[unit]]
id = "u13-select-timeouts"
title = "Select & timeouts"
difficulty = 13
level = "advanced"
intro = """
A goroutine often has to wait on **several** channels at once, or give up after a
deadline. `select` is the tool: it blocks until one of its cases can proceed, then
runs that one. Pair it with `time.After` — a channel from the standard library that
fires after a duration — and you have timeouts. You will drain multiple channels,
add a timeout branch, and merge two closing channels into one deterministic total
using the nil-channel idiom.
"""

[[unit.step]]
kind = "concept"
id = "c13-select"
title = "select, multiple channels, time.After"
points = 5
difficulty = 13
run_command = ""
intro = """
`select` waits on many channel operations and proceeds with whichever is ready
first. With `time.After` you add a timeout case; with the two-value receive and a
nil channel you can drain several channels until each one closes.
"""
body = """
## select

```go
select {
case v := <-a:
    useA(v)
case v := <-b:
    useB(v)
}
```

`select` blocks until **one** of its cases can run, then runs exactly that case. If
several are ready, it picks one at random — so never rely on *which* case fires,
only on the invariant you maintain (for example, a running total).

## Timeouts with time.After

```go
select {
case v := <-work:
    use(v)
case <-time.After(2 * time.Second):
    fmt.Println("timed out")
}
```

`time.After(d)` returns a `<-chan Time` that receives a value after `d` elapses.
Put it in a `select` and whichever happens first — the work or the deadline — wins.

## Draining until closed: the nil-channel idiom

A receive on a **nil** channel blocks forever, so a nil case in a `select` is simply
never chosen. That gives a clean way to merge channels until each closes:

```go
for a != nil || b != nil {
    select {
    case v, ok := <-a:
        if !ok { a = nil; continue } // closed: disable this case
        use(v)
    case v, ok := <-b:
        if !ok { b = nil; continue }
        use(v)
    }
}
```

When a channel closes, set its variable to `nil` so its case stops being selected;
the loop ends once both are nil. The *order* of arrivals varies, but a total you
accumulate does not.
"""

