'''

[unit.step.gabarito]
time = "O(n)"
space = "O(n)"
solution = '''
package student

func BalancedParens(s string) bool {
	pairs := map[rune]rune{')': '(', ']': '[', '}': '{'}
	var stack []rune
	for _, c := range s {
		switch c {
		case '(', '[', '{':
			stack = append(stack, c)
		case ')', ']', '}':
			if len(stack) == 0 || stack[len(stack)-1] != pairs[c] {
				return false
			}
			stack = stack[:len(stack)-1]
		}
	}
	return len(stack) == 0
}
'''
justification = """
Each character is visited once, so the scan is **O(n)**; the stack holds at most one entry
per unmatched opener, so worst-case space is **O(n)**. A closer is legal only when the stack
top is its matching opener — otherwise the string is unbalanced. Leftover openers at the end
(non-empty stack) also mean unbalanced. Non-bracket characters hit no `switch` case and are
ignored.
"""

