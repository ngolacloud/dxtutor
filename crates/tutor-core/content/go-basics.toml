space = "O(n)"
solution = '''
package student

type Node struct {
	Val   int
	Left  *Node
	Right *Node
}

func insert(root *Node, v int) *Node {
	if root == nil {
		return &Node{Val: v}
	}
	if v < root.Val {
		root.Left = insert(root.Left, v)
	} else if v > root.Val {
		root.Right = insert(root.Right, v)
	}
	return root
}

func inorder(root *Node, out *[]int) {
	if root == nil {
		return
	}
	inorder(root.Left, out)
	*out = append(*out, root.Val)
	inorder(root.Right, out)
}

func SortedFromInserts(items []int) []int {
	var root *Node
	for _, v := range items {
		root = insert(root, v)
	}
	out := []int{}
	inorder(root, &out)
	return out
}
'''
