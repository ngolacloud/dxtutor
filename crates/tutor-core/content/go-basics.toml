solution = '''
package student

func MergeSum(a, b []int) int {
	ca := make(chan int)
	cb := make(chan int)
	go func() {
		for _, n := range a {
			ca <- n
		}
		close(ca)
	}()
	go func() {
		for _, n := range b {
			cb <- n
		}
		close(cb)
	}()
	total := 0
	for ca != nil || cb != nil {
		select {
		case v, ok := <-ca:
			if !ok {
				ca = nil
				continue
			}
			total += v
		case v, ok := <-cb:
			if !ok {
				cb = nil
				continue
			}
			total += v
		}
	}
	return total
}
'''
justification = """
Every element of both slices is received exactly once, so the work is **O(n)** in the
combined length; the two unbuffered channels hold at most one in-flight value each,
so the extra space is **O(1)**. The nil-channel idiom retires each case as its
channel closes, and the loop ends when both are nil. `select` may interleave the two
streams in any order, but summation is commutative, so the total is deterministic.
"""

# ═════════════════════════════════════════════════════════════════════════════
# UNIT 14 — Shared state: Mutex & worker pools
# ═════════════════════════════════════════════════════════════════════════════
[[unit]]
id = "u14-shared-state"
title = "Shared state: Mutex & worker pools"
difficulty = 14
level = "advanced"
intro = """
Sometimes goroutines really must share one piece of memory — a counter, a map, an
accumulator. Then you need **mutual exclusion**: a `sync.Mutex` whose `Lock`/`Unlock`
lets only one goroutine into the critical section at a time, so updates are not
lost. For simple counters, `sync/atomic` does the same lock-free. And the canonical
way to bound concurrency is a **worker pool**: a fixed set of goroutines pulling
jobs from one channel and pushing results to another. You will guard a shared
counter, build a pool, and finish with a deterministic parallel count.
"""

[[unit.step]]
kind = "concept"
id = "c14-shared-state"
title = "Mutex, atomic, and the worker-pool pattern"
points = 5
difficulty = 14
run_command = ""
intro = """
When goroutines share mutable memory, concurrent writes race and updates get lost. A
`sync.Mutex` serialises access to a critical section; `sync/atomic` does it lock-free
for single integers. A worker pool bounds how many goroutines run at once.
"""
body = """
## The problem: a data race

Two goroutines running `counter++` can read the same old value and both write back
`old+1`, losing one increment. The `-race` detector flags exactly this.

## sync.Mutex

```go
var mu sync.Mutex
mu.Lock()
counter++        // critical section: exactly one goroutine at a time
mu.Unlock()
```

`Lock` blocks until the mutex is free, then this goroutine owns it; `Unlock` releases
it. Only one goroutine holds the lock at once, so the increment is safe. Keep the
critical section small, and never forget to `Unlock` (a `defer mu.Unlock()` is common).

## sync/atomic

```go
var n int64
atomic.AddInt64(&n, 1)      // safe increment, no lock
total := atomic.LoadInt64(&n)
```

For a single counter, an atomic operation is simpler and faster than a mutex: the
hardware guarantees the read-modify-write happens as one indivisible step.

## Worker pool

Launch a fixed number of workers, each ranging over a shared **jobs** channel and
sending to a **results** channel:

```go
jobs := make(chan int)
results := make(chan int)
for w := 0; w < N; w++ {
    go func() {
        for j := range jobs { results <- process(j) }
    }()
}
```

Feed jobs, `close(jobs)` when done, and in a separate goroutine `wg.Wait()` then
`close(results)` so the collector's `range` can finish. A pool bounds concurrency to
`N` no matter how many jobs arrive — the standard shape for parallel work in Go.
"""

