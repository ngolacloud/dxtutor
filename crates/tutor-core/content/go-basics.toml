[[unit.step]]
kind = "concept"
id = "c16-linked-list"
title = "Nodes and pointers"
points = 5
difficulty = 16
run_command = ""
intro = """
A node holds a value and a pointer to the next node. A `nil` next marks the end. The list
itself is just a pointer to the first node — the head.
"""
body = """
## The node

```go
type Node struct {
    Val  int
    Next *Node
}
```

`Next` is a pointer; `nil` means "no next node". An empty list is a `nil` head.

## Push to the front

Make a new node whose `Next` is the current head, then move the head to it — O(1):

```go
head = &Node{Val: v, Next: head}
```

## Walk the list

Follow `Next` from the head until you reach `nil`:

```go
for n := head; n != nil; n = n.Next {
    use(n.Val)
}
```

Pushing to the front is cheap and reverses insertion order: the last value pushed is the
first one you meet when walking. Popping the front is just `head = head.Next`. That front
bias is exactly what makes a linked list a natural reversing tool.
"""

