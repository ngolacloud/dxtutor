[[unit.step]]
kind = "concept"
id = "c17-maps-sets"
title = "Counting, sets, and deterministic output"
points = 5
difficulty = 17
run_command = ""
intro = """
`map[K]V` indexes values by key. A missing key reads as the zero value, so `m[k]++` counts
without initialising. A set is a map whose value carries no data: `map[K]struct{}`.
"""
body = """
## Frequency counting

A missing key yields the zero value, so incrementing just works:

```go
freq := map[string]int{}
freq[word]++     // starts at 0 for a new word
```

## Sets with the empty struct

`struct{}{}` is a value that occupies zero bytes — perfect as a set's payload:

```go
set := map[int]struct{}{}
set[x] = struct{}{}          // add
_, ok := set[x]              // membership (comma-ok)
```

## The comma-ok idiom

Indexing a map returns an optional second boolean: `v, ok := m[k]`. `ok` is `true` only
when the key is present, which distinguishes "absent" from "present but zero".

## Determinism

**Map iteration order is randomised by design.** Never print a map directly if order
matters. Collect the keys, `sort` them, then iterate:

```go
keys := make([]string, 0, len(freq))
for k := range freq { keys = append(keys, k) }
sort.Strings(keys)
```

That one habit keeps map-derived output reproducible run after run.
"""

