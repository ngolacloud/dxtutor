}
'''
tests = '''
package student

import "testing"

func TestSumConcurrentBasic(t *testing.T) {
	if got := SumConcurrent([]int{1, 2, 3, 4, 5}); got != 15 {
		t.Fatalf("SumConcurrent(1..5) = %d, want 15", got)
	}
}

func TestSumConcurrentEmpty(t *testing.T) {
	if got := SumConcurrent(nil); got != 0 {
		t.Fatalf("SumConcurrent(nil) = %d, want 0", got)
	}
}

func TestSumConcurrentNegatives(t *testing.T) {
	if got := SumConcurrent([]int{-3, 3, -7, 7}); got != 0 {
		t.Fatalf("SumConcurrent = %d, want 0", got)
	}
