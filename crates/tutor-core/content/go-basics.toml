Each insert costs the tree's height — **O(log n)** on average over `n` items, so building is
**O(n log n)**; the traversal is O(n). Space is **O(n)** for the nodes. Insert ignores a value
equal to the current node, so duplicates never enter the tree, and in-order traversal of a BST
is sorted — giving distinct, ascending output. `out` starts as `[]int{}` so an empty input
returns a non-nil empty slice.
