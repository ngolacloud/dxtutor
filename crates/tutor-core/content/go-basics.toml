[[unit]]
id = "udb3-wal-pool"
title = "WAL mode & the connection pool"
difficulty = 10
level = "intermediate"
intro = """

`*sql.DB` is a pool of connections, not a single wire — safe to share across
goroutines. SQLite's Write-Ahead Logging (WAL) mode lets readers and a writer work
concurrently. Here you turn on WAL, cap the pool with `SetMaxOpenConns`, and have
several goroutines insert through the shared pool to a deterministic total.

"""

[[unit.step]]
kind = "concept"
id = "cdb3-pool"
title = "A pool you can share"
points = 5
difficulty = 10
run_command = ""
intro = """

`sql.Open` returns a pool. Goroutines can call it concurrently; the pool hands each
one a free connection. WAL mode improves read/write concurrency on SQLite.

"""
body = """

## Pool and WAL

```go
db, _ := sql.Open("sqlite", "file:app.db")
db.SetMaxOpenConns(4) // at most 4 live connections

db.Exec(`PRAGMA journal_mode=WAL`) // readers don't block the writer

var wg sync.WaitGroup
for w := 0; w < 4; w++ {
    wg.Add(1)
    go func() {
        defer wg.Done()
        db.Exec(`INSERT INTO nums VALUES (?)`, 1)
    }()
}
wg.Wait()
```

- **`*sql.DB` is safe for concurrent use** — share the one handle, never open a pool
  per goroutine.
- **`SetMaxOpenConns(n)`** bounds how many connections exist at once.
- **WAL** (`PRAGMA journal_mode=WAL`) needs a real file, not `:memory:`, and lets
  reads proceed while a write is in flight.
- A **busy timeout** makes a connection wait briefly for a lock instead of failing
  immediately — add it to the DSN so every pooled connection inherits it.

"""

