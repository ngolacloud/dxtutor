package student

import "testing"

func TestBalancedEmpty(t *testing.T) {
	if !BalancedParens("") {
		t.Fatal("empty string should be balanced")
	}
}

func TestBalancedSimple(t *testing.T) {
	if !BalancedParens("()[]{}") {
		t.Fatal("()[]{} should be balanced")
	}
}

func TestBalancedNested(t *testing.T) {
	if !BalancedParens("([{}])") {
		t.Fatal("([{}]) should be balanced")
	}
}

func TestBalancedMismatch(t *testing.T) {
	if BalancedParens("(]") {
		t.Fatal("(] should not be balanced")
	}
}

func TestBalancedUnclosed(t *testing.T) {
	if BalancedParens("(((") {
		t.Fatal("((( should not be balanced")
	}
}

func TestBalancedWrongOrder(t *testing.T) {
	if BalancedParens(")(") {
		t.Fatal(")( should not be balanced")
	}
}

func TestBalancedIgnoresOther(t *testing.T) {
	if !BalancedParens("a(b)c[d]e") {
		t.Fatal("non-bracket characters should be ignored")
	}
