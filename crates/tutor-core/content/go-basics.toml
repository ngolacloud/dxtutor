[[unit]]
id = "udb2-transactions"
title = "Transactions: all or nothing"
difficulty = 10
level = "intermediate"
intro = """

A transaction groups several statements so they either all take effect or none do.
You use `db.Begin()` to start one, run statements on the returned `*sql.Tx`, then
`Commit()` to keep the changes or `Rollback()` to discard them. You will build a
money transfer that rolls back rather than leave an account negative.

"""

[[unit.step]]
kind = "concept"
id = "cdb2-tx"
title = "Begin, Commit, Rollback"
points = 5
difficulty = 10
run_command = ""
intro = """

Without a transaction, each statement commits on its own — a crash halfway leaves
inconsistent data. A transaction makes a group of statements atomic.

"""
body = """

## The transaction shape

```go
tx, err := db.Begin()
if err != nil {
    return err
}
tx.Exec(`UPDATE accounts SET balance = balance - ? WHERE id = 1`, amount)
tx.Exec(`UPDATE accounts SET balance = balance + ? WHERE id = 2`, amount)

if bad {
    tx.Rollback() // undo everything in this tx
    return nil
}
tx.Commit() // make it permanent
```

- **`db.Begin()`** returns a `*sql.Tx`; run your statements on `tx`, not `db`.
- **`tx.Commit()`** makes every change in the transaction permanent at once.
- **`tx.Rollback()`** throws the whole group away — the database looks as if nothing
  happened.
- A transfer is the classic example: debit and credit must both succeed, or neither.

"""

