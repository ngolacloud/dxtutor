[[unit]]
id = "udb6-indexes"
title = "Indexes & EXPLAIN QUERY PLAN"
difficulty = 10
level = "intermediate"
intro = """

An index is a sorted structure that turns a full-table scan into a quick seek. Without
one, a `WHERE col = ?` lookup scans every row; with an index on that column, SQLite
seeks straight to the match. `EXPLAIN QUERY PLAN` shows which strategy the database
chose, so you can confirm an index is actually used.

"""

[[unit.step]]
kind = "concept"
id = "cdb6-index"
title = "Why indexes matter"
points = 5
difficulty = 10
run_command = ""
intro = """

A lookup without an index is a linear SCAN. An index on the filtered column lets the
database jump to the rows it needs. `EXPLAIN QUERY PLAN` reveals which one happens.

"""
body = """

## Create an index, read the plan

```go
db.Exec(`CREATE INDEX idx_users_email ON users(email)`)

rows, _ := db.Query(`EXPLAIN QUERY PLAN SELECT name FROM users WHERE email = ?`, "a@x")
for rows.Next() {
    var id, parent, notused int
    var detail string
    rows.Scan(&id, &parent, &notused, &detail)
    // detail: "SEARCH users USING INDEX idx_users_email (email=?)"
}
```

- **`CREATE INDEX`** builds a sorted lookup structure on one or more columns.
- Without an index, the plan says **`SCAN`** — every row is examined.
- With a matching index, the plan says **`SEARCH ... USING INDEX`** — a direct seek.
- **`EXPLAIN QUERY PLAN`** returns rows whose last column (`detail`) is the
  human-readable strategy; read it to verify your index is doing its job.

"""

