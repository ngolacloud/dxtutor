id = "go-basics"
language = "go"
title = "Go: From Zero to Backend"
level = "beginner"
summary = """
A guided, hands-on course in Go that takes you from your very first line of code
to the ideas that power real backend services. You read a short concept, build
muscle memory by typing small, complete programs with the tutor — every line
explained — and then apply what you learned in a graded challenge whose hidden
tests decide correctness. Twenty-six units of steadily rising difficulty: printing
with fmt, variables and types, control flow, loops, functions with multiple
returns, your own structs and methods, interfaces, slices and maps, error
handling, and the Go module system (go get); an intermediate database track built
on SQLite through database/sql and the pure-Go modernc.org/sqlite driver —
connecting and querying, transactions, the connection pool and WAL mode, the N+1
query problem, pagination, and indexes with EXPLAIN QUERY PLAN; then an advanced
concurrency track —
goroutines and WaitGroups, channels, select with timeouts, and shared state with
mutexes and worker pools; and a data structures & algorithms track: stacks and
queues, linked lists, maps and sets, binary search trees, sorting and searching,
and recursion with dynamic programming. Almost everything runs on the standard
library; two exercises teach you how to pull in and run an external package the
way every real Go project does. No prior Go needed.
"""

# NOTE on `line_comments`: for every drill, `line_comments[i]` explains line `i`
# of `target`, split by newline. Blank in-between lines carry "" so the alignment
# never drifts; the final empty line (from the trailing newline) needs no entry.
# Basic units set `placeholder_policy = "shown"` (the target appears at once); the
# intermediate units (6..10) use "on_demand" (hidden until the student asks). The
# `install_commands`/`run_command` fields teach the Go package manager: most steps
# only need the standard library (`run_command = "go run ."`, no installs), while
# two drills in Unit 10 pull an external module with `go get`.

# ═════════════════════════════════════════════════════════════════════════════
# UNIT 1 — Hello & fmt
# ═════════════════════════════════════════════════════════════════════════════
[[unit]]
id = "u1-hello"
title = "Hello & fmt"
difficulty = 1
level = "basic"
intro = """
Your very first steps in Go: what a program is, how to print to the screen with
the `fmt` package, and how the compiler turns your text into a running binary. By
the end you will write a tiny greeting function and let the hidden tests check it.
"""

[[unit.step]]
kind = "concept"
id = "c1-what-is-a-program"
title = "What a Go program is"
points = 5
difficulty = 1
run_command = ""
intro = """
Before you write anything, picture what a computer actually does: it loads a
compiled program into memory and executes machine instructions one after another.
A program needs one agreed place to begin — in Go that place is the function
`main`, inside the special `package main`. The Go toolchain compiles your source
into a native binary; when you run it, the operating system hands control to
`main`, and anything you print travels to **standard output**, which the terminal
shows on screen.
"""
body = """
## A program starts at `main`

Every runnable Go program lives in **`package main`** and begins at a function
called **`main`**. Think of `main` as the front door: when you run the program,
Go walks in through `main` and does, top to bottom, whatever it finds there.

```go
package main

import "fmt"

func main() {
    fmt.Println("Hello, Go!")
}
```

Four things to notice:

- **`package main`** marks this file as a buildable command (not a library).
- **`import "fmt"`** pulls in the standard-library `fmt` package, which formats
  and prints text.
- **`func main() { ... }`** declares the entry point; the `{ }` hold its body.
- **`fmt.Println(...)`** prints a line of text, then a newline, to standard output.

You compile and run a single-file program with **`go run .`**. In the next steps
you will type small, complete programs yourself; when your code matches the
target, the tutor runs it so you can see the output.
"""

[[unit.step]]
kind = "drill"
id = "d1-hello"
title = "Print your first line"
points = 10
difficulty = 1
placeholder_policy = "shown"
run_command = "go run ."
intro = """
This drill cements the one skeleton every Go program shares. `fmt.Println` writes
your text to standard output and adds a trailing newline. There is no loop and no
branching here — just the entry point `main` and a single write to the screen.
"""
prompt = """
Type the classic first program. It prints a single line and stops.

**Why:** this cements the shape every Go program shares — `package main`, an
`import`, and a `main` that writes one line. Reproduce it exactly.
"""
target = '''
package main

import "fmt"

func main() {
    fmt.Println("Hello, Go!")
}
'''
line_comments = [
    "Declares this file as part of `package main` — the special package that builds a runnable command.",
    "",
    "Imports the standard-library `fmt` package, which formats and prints text.",
    "",
    "Declares `main`, the function Go runs first; `{` opens its body.",
    "Prints the text followed by a newline to standard output.",
    "Closes the body of `main`; when execution reaches here the program ends.",
]
explanation = """
That is a complete Go program. Go entered `main`, ran the one `fmt.Println`,
printed `Hello, Go!`, and then `main` ended — so the program finished. Every
program you write grows from exactly this skeleton.
"""

[[unit.step]]
kind = "drill"
id = "d2-printf"
title = "Format with Printf"
points = 10
difficulty = 1
placeholder_policy = "shown"
run_command = "go run ."
intro = """
`fmt.Println` prints values as-is; `fmt.Printf` lets you build a formatted string
with **verbs**: `%s` for a string, `%d` for an integer. Unlike `Println`, `Printf`
does not add a newline for you, so you write `\\n` yourself where you want one.
"""
prompt = """
Use `fmt.Printf` with the `%s` and `%d` verbs to interpolate a name and a number
into one line. Note the explicit `\\n` at the end.
"""
target = '''
package main

import "fmt"

func main() {
    name := "Go"
    fmt.Printf("Hello, %s! You are %d years young.\n", name, 15)
}
'''
line_comments = [
    "Declares the runnable `package main`.",
    "",
    "Imports `fmt` for formatted printing.",
    "",
    "Opens `main`, the entry point.",
    "Declares `name` and infers its type (string) with the short form `:=`.",
    "`Printf` fills `%s` with `name` and `%d` with `15`; `\\n` ends the line.",
    "Closes `main`.",
]
explanation = """
`Printf` is the workhorse of formatted output: each verb (`%s`, `%d`, ...) is
replaced, left to right, by the matching argument. Because `Printf` prints exactly
what you give it, you control the newline with `\\n`.
"""

[[unit.step]]
kind = "challenge"
id = "ch1-greet"
title = "Implement Greet"
points = 30
difficulty = 2
entry = "Greet"
run_command = "go test ./..."
intro = """
Now you apply what you learned. In Go, strings join with the `+` operator, and a
function declares what it returns after its parameter list. Your function takes a
`string` and returns a new `string`. Hidden tests, not the screen, decide
correctness.
"""
instructions = """
## Your turn

Implement the function `Greet`:

```go
func Greet(name string) string { ... }
```

It takes a name and returns a string that reads `Hello, {name}!`.

Examples:

- `Greet("World")` → `"Hello, World!"`
- `Greet("Go")` → `"Hello, Go!"`

**Hint:** build the result by joining strings with `+`.

Hidden tests decide correctness. Implement it, then submit.
"""
starter = '''
package student

// Greet returns a friendly greeting for name.
func Greet(name string) string {
	// TODO: return "Hello, <name>!"
	return ""
}
'''
tests = '''
package student

import "testing"

func TestGreetWorld(t *testing.T) {
	if got := Greet("World"); got != "Hello, World!" {
		t.Fatalf("Greet(\"World\") = %q, want %q", got, "Hello, World!")
	}
}

func TestGreetGo(t *testing.T) {
	if got := Greet("Go"); got != "Hello, Go!" {
		t.Fatalf("Greet(\"Go\") = %q, want %q", got, "Hello, Go!")
	}
}
'''

[unit.step.gabarito]
time = "O(n)"
space = "O(n)"
solution = '''
package student

func Greet(name string) string {
	return "Hello, " + name + "!"
}
'''
justification = """
Joining strings copies the fixed text `Hello, ` and `!` plus the `n` characters of
`name` into a fresh string. Both the work and the memory grow in direct proportion
to the length of `name`, so the time is **O(n)** and the space is **O(n)**, where
`n` is the length of the name. There is no hidden loop — a single pass builds the
result once.
"""

# ═════════════════════════════════════════════════════════════════════════════
# UNIT 2 — Variables & types
# ═════════════════════════════════════════════════════════════════════════════
[[unit]]
id = "u2-variables"
title = "Variables & types"
difficulty = 2
level = "basic"
intro = """
Every value in Go has a **type** the compiler tracks for you: whole numbers
(`int`), real numbers (`float64`), text (`string`), truth values (`bool`). You
will meet the two ways to declare a variable (`var` and the short `:=`) and see
why Go makes you convert between numeric types on purpose.
"""

[[unit.step]]
kind = "concept"
id = "c2-variables"
title = "Values, types and declarations"
points = 5
difficulty = 2
run_command = ""
intro = """
A variable is a named box in memory holding a value of a fixed type. Go is
statically typed: the type is known at compile time, which lets the compiler catch
mistakes before the program ever runs.
"""
body = """
## Two ways to declare

```go
var age int = 15   // explicit type
city := "Luanda"   // short form: type inferred as string
```

- **`var name type = value`** states the type explicitly.
- **`name := value`** is the short form (only inside functions); Go **infers** the
  type from the value.

Go's basic types include `int`, `float64`, `bool`, and `string`. Unlike some
languages, Go will **not** silently mix numeric types: to multiply an `int` by a
`float64` you must convert, e.g. `float64(count) * price`. That explicitness
prevents a whole class of rounding bugs.
"""

[[unit.step]]
kind = "drill"
id = "d1-declare"
title = "Declare with var and :="
points = 10
difficulty = 2
placeholder_policy = "shown"
run_command = "go run ."
intro = """
Both declaration forms store a typed value. `var age int = 15` is explicit; the
short `city := "Luanda"` infers `string`. Printing several values with `Println`
separates them with spaces.
"""
prompt = """
Declare one variable with `var` and one with `:=`, then print them.
"""
target = '''
package main

import "fmt"

func main() {
    var age int = 15
    city := "Luanda"
    fmt.Println(age, city)
}
'''
line_comments = [
    "Runnable `package main`.",
    "",
    "Imports `fmt`.",
    "",
    "Opens `main`.",
    "Declares `age` as an `int` with the explicit `var` form.",
    "Declares `city` with the short `:=` form; its type is inferred as string.",
    "Prints both values, separated by a space.",
    "Closes `main`.",
]
explanation = """
`var` and `:=` both create a typed variable — `:=` just lets the compiler infer
the type. Inside functions the short form is the idiomatic choice.
"""

