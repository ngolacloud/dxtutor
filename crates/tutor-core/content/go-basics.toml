[[unit.step]]
kind = "concept"
id = "c18-bst"
title = "The ordering invariant"
points = 5
difficulty = 18
run_command = ""
intro = """
A BST node has a value and two children. The invariant: everything in the left subtree is
smaller than the node, everything in the right is larger. Keep it, and the tree stays sorted.
"""
body = """
## The node

```go
type Node struct {
    Val   int
    Left  *Node
    Right *Node
}
```

## Insert (recursive)

Descend left for smaller values, right for larger; create the node at the empty spot:

```go
func insert(root *Node, v int) *Node {
    if root == nil {
        return &Node{Val: v}
    }
    if v < root.Val {
        root.Left = insert(root.Left, v)
    } else if v > root.Val {
        root.Right = insert(root.Right, v)
    }
    return root
}
```

Equal values are ignored here, so the tree holds each value at most once.

## In-order traversal = sorted

Visit left, then the node, then right, and values come out ascending:

```go
func inorder(root *Node, out *[]int) {
    if root == nil {
        return
    }
    inorder(root.Left, out)
    *out = append(*out, root.Val)
    inorder(root.Right, out)
}
```

Search mirrors insert: go left or right by comparison, so lookup costs the tree's height —
O(log n) when balanced, O(n) in the worst case.
"""

