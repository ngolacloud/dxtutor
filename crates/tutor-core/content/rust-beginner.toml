[unit.step.gabarito]
time = "O(n)"
space = "O(n)"
solution = """
pub struct Fib {
    a: u64,
    b: u64,
}

impl Iterator for Fib {
    type Item = u64;
    fn next(&mut self) -> Option<u64> {
        let current = self.a;
        self.a = self.b;
        self.b = current + self.b;
        Some(current)
    }
}

pub fn fib_sequence(count: usize) -> Vec<u64> {
    let fib = Fib { a: 0, b: 1 };
    fib.take(count).collect()
}
"""
justification = """
Producing `count = n` values calls `next` `n` times (each O(1)), so time is
**O(n)**, and the collected vector holds `n` numbers, so space is **O(n)**. The
design is the lesson: `type Item = u64` declares what the iterator yields, a
hand-written `next` defines the sequence, and `take`/`collect` — generic over any
`Iterator` — come for free.
"""

[[unit]]
id = "u14-dispatch"
title = "Static vs dynamic dispatch"
difficulty = 14
level = "advanced"
intro = """
When code calls a trait method, Rust must decide *which* implementation to run.
With generics and `impl Trait`, it decides at compile time (static dispatch,
monomorphized, inlinable). With `dyn Trait` behind a reference or `Box`, it
decides at run time through a vtable (dynamic dispatch) — slower per call but able
to hold a mix of types in one collection. By the end you sum the areas of a
heterogeneous list of shapes behind `Box<dyn Shape>`.
"""

[[unit.step]]
kind = "concept"
id = "c14-dispatch"
title = "Compile-time or run-time?"
points = 5
difficulty = 14
intro = """
Polymorphism has to resolve to a concrete function somehow. Two strategies trade
off speed against flexibility. Monomorphization bakes a separate copy per type
(fast, bigger binary, one type per call site). Trait objects keep a pointer to a
table of function pointers (one copy, any type at run time, an indirection per
call). Knowing which you are using is the difference between fighting the
compiler and steering it.
"""
body = """
## Three ways to pass "something that implements a trait"

**`impl Trait` — static dispatch.** Sugar for a generic; the compiler
monomorphizes and can inline:

```rust
fn announce(x: impl std::fmt::Display) { println!("{x}"); }
fn counter() -> impl Iterator<Item = u32> { (1..=3).map(|n| n * 10) }
```

**`&dyn Trait` / `Box<dyn Trait>` — dynamic dispatch.** A **trait object**: a
pair of pointers (data + vtable). The method called is looked up at run time:

```rust
fn show(item: &dyn std::fmt::Display) { println!("{item}"); }
let shapes: Vec<Box<dyn Shape>> = vec![/* different types! */];
```

The crucial difference: a `Vec<Box<dyn Shape>>` can hold `Square`s *and*
`Circle`s together, because each element is just "a pointer to something that is a
`Shape`". A `Vec<T>` where `T: Shape` cannot — a generic resolves to exactly one
concrete type, so every element would have to be the very same shape.

Rule of thumb: reach for static dispatch by default (it is free and inlinable);
reach for `dyn` when you genuinely need a mixed collection or to erase the type.
"""

