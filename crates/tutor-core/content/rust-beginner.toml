[unit.step.gabarito]
time = "O(size)"
space = "O(size)"
solution = """
use rusqlite::Connection;

pub fn page_after(last_id: i64, size: i64) -> Vec<i64> {
    let conn = Connection::open_in_memory().unwrap();
    conn.execute("CREATE TABLE items (id INTEGER PRIMARY KEY)", [])
        .unwrap();
    {
        let mut stmt = conn.prepare("INSERT INTO items (id) VALUES (?1)").unwrap();
        for i in 1..=100i64 {
            stmt.execute([i]).unwrap();
        }
    }
    if size <= 0 {
        return Vec::new();
    }
    let mut stmt = conn
        .prepare("SELECT id FROM items WHERE id > ?1 ORDER BY id ASC LIMIT ?2")
        .unwrap();
    let rows = stmt
        .query_map([last_id, size], |r| r.get::<_, i64>(0))
        .unwrap();
    rows.map(|r| r.unwrap()).collect()
}
"""
justification = """
The seek uses the primary-key order to jump straight to the first id after `last_id`, then reads at most `size` rows — so the time and the returned vector are both **O(size)**, independent of how deep into the table the page sits. That is the advantage over `OFFSET`, which would have to walk and discard every row before the page; the `WHERE id > ?` cursor also keeps the page stable when other rows change.
"""

[[unit]]
id = "udb6-indexes"
title = "Database: indexes & query plans"
difficulty = 9
level = "intermediate"
intro = """
An index is what separates an instant lookup from a slow full-table scan. This unit shows how to create one and — crucially — how to confirm it is used, with `EXPLAIN QUERY PLAN`, which reports `SEARCH ... USING INDEX` versus `SCAN`. You finish by writing code that inspects the plan and proves the index is doing its job, under hidden tests.
"""

[[unit.step]]
kind = "concept"
id = "cdb6-index"
title = "Indexes and query plans"
points = 5
difficulty = 9
intro = """
Without an index, finding rows by a column means scanning the whole table — fine for ten rows, ruinous for ten million. An index is a sorted structure the database can search quickly, turning a full scan into a direct lookup. You do not have to guess whether it is used: `EXPLAIN QUERY PLAN` tells you exactly how SQLite will run a query.
"""
body = """
## Indexes

A lookup on an unindexed column forces a full-table **scan**. Create an index and the database can **search** straight to the matching rows:

```rust
conn.execute("CREATE INDEX idx_users_email ON users (email)", []).unwrap();
```

## EXPLAIN QUERY PLAN

To see whether an index is actually used, prefix a query with `EXPLAIN QUERY PLAN`. It returns rows describing the strategy; the useful part is the detail text in column 3:

```rust
let plan: String = conn
    .query_row(
        "EXPLAIN QUERY PLAN SELECT name FROM users WHERE email = ?1",
        ["a@b.c"],
        |r| r.get(3),
    )
    .unwrap();
```

With the index you will see a detail like `SEARCH users USING INDEX idx_users_email (email=?)`; without it, `SCAN users`. The word **SEARCH** with `USING INDEX` means a fast, targeted lookup; **SCAN** means reading every row. Reading the plan is how you confirm an index is doing its job rather than assuming it is.
"""

