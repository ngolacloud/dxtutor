[[unit.step]]
kind = "concept"
id = "c25-sorting-searching"
title = "Divide, merge, and halve"
points = 5
difficulty = 25
intro = """
Merge sort and binary search are both *divide and conquer*: split the problem in
half and recombine (or discard) half the work each step. That halving is where the
logarithm in their running time comes from.
"""
body = """
## Merge: combine two sorted slices

The engine of merge sort is merging two already-sorted slices into one. Walk both
with a cursor, always taking the smaller front; using `<=` (take from the left on a
tie) keeps the sort **stable**:

```rust
fn merge(a: &[i32], b: &[i32]) -> Vec<i32> {
    let mut out = Vec::new();
    let (mut i, mut j) = (0, 0);
    while i < a.len() && j < b.len() {
        if a[i] <= b[j] { out.push(a[i]); i += 1; }
        else { out.push(b[j]); j += 1; }
    }
    out.extend_from_slice(&a[i..]);
    out.extend_from_slice(&b[j..]);
    out
}
```

## Merge sort: split, sort halves, merge

Split the vector at the midpoint, merge-sort each half, then merge the results. A
slice of length 0 or 1 is already sorted — that is the base case:

```rust
fn merge_sort(v: Vec<i32>) -> Vec<i32> {
    if v.len() <= 1 { return v; }
    let mid = v.len() / 2;
    let left = merge_sort(v[..mid].to_vec());
    let right = merge_sort(v[mid..].to_vec());
    merge(&left, &right)
}
```

## Binary search: halve the window

On a **sorted** slice, keep a half-open window `[lo, hi)`. Compare the midpoint: on a
match return it; if the midpoint is too small discard the left half, else discard the
right. Each step halves the window, so it finishes in O(log n):

```rust
fn binary_search(v: &[i32], target: i32) -> Option<usize> {
    let (mut lo, mut hi) = (0, v.len());
    while lo < hi {
        let mid = lo + (hi - lo) / 2;
        if v[mid] == target { return Some(mid); }
        else if v[mid] < target { lo = mid + 1; }
        else { hi = mid; }
    }
    None
}
```

- Writing the midpoint as `lo + (hi - lo) / 2` avoids overflow that `(lo + hi) / 2`
  risks for large indices.
- Merge sort is stable and O(n log n); binary search needs sorted input and is
  O(log n).

Build the merge, build the binary search, and merge sort is just recursion over the
two.
"""

