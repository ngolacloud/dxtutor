body = """
## `struct`, `enum`, and `impl`

A **`struct`** groups named fields:

```rust
struct Point { x: i32, y: i32 }
let p = Point { x: 1, y: 2 };
println!("{}", p.x); // field access
```

An **`enum`** is a closed set of variants, each optionally carrying data:

```rust
enum Shape {
    Circle(f64),        // radius
    Rect(f64, f64),     // width, height
}
```

**`impl`** attaches methods. `&self` borrows the value the method is called on:

```rust
impl Point {
    fn sum(&self) -> i32 { self.x + self.y }
}
```

`match` on an enum must cover every variant — the compiler checks it, so you can
never forget a case.
"""

