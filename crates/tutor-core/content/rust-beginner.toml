time = "O(n log n) average, O(n^2) worst"
space = "O(n)"
solution = '''
struct Node {
    val: i32,
    left: Option<Box<Node>>,
    right: Option<Box<Node>>,
}

fn insert(root: &mut Option<Box<Node>>, v: i32) {
    match root {
        None => *root = Some(Box::new(Node { val: v, left: None, right: None })),
        Some(n) if v < n.val => insert(&mut n.left, v),
        Some(n) if v > n.val => insert(&mut n.right, v),
        Some(_) => {}
    }
}

fn walk(root: &Option<Box<Node>>, out: &mut Vec<i32>) {
    if let Some(n) = root {
        walk(&n.left, out);
        out.push(n.val);
        walk(&n.right, out);
    }
}

pub fn sorted_from_inserts(items: Vec<i32>) -> Vec<i32> {
    let mut root: Option<Box<Node>> = None;
    for x in items {
        insert(&mut root, x);
    }
    let mut out = Vec::new();
    walk(&root, &mut out);
    out
}
'''
