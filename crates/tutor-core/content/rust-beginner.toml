- `merge_sort(vec![])` → `vec![]`

**Hint:** if `v.len() <= 1` return `v`. Otherwise `let right = v.split_off(v.len() /
2);`, recurse on both parts, then merge them with two cursors, pushing the smaller
front each step and appending the leftovers.

Hidden tests decide correctness.
"""
starter = '''
