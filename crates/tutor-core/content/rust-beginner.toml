## Your turn

Find a pair of indices that sum to the target:

```rust
pub fn two_sum(nums: &[i32], target: i32) -> Option<(usize, usize)> { ... }
```

Return `Some((i, j))` with `i < j` and `nums[i] + nums[j] == target`, or `None` if no
such pair exists. Return the first such pair found while scanning left to right, with
the smaller index first.

Rules:

- Each index may be used once; the two indices must differ.
- Do it in a single pass with a `HashMap` from value to index — not a nested loop.
- An empty or single-element slice yields `None`.

Examples:

- `two_sum(&[2, 7, 11, 15], 9)` → `Some((0, 1))`
- `two_sum(&[3, 2, 4], 6)` → `Some((1, 2))`
- `two_sum(&[1, 2, 3], 100)` → `None`

**Hint:** keep a `HashMap<i32, usize>` of values you have seen. For each `(i, n)`,
compute `need = target - n`; if `need` is in the map at index `j`, return
`Some((j, i))`. Otherwise record `n -> i` (only if absent) and continue.

Hidden tests decide correctness.
"""
starter = '''
use std::collections::HashMap;

pub fn two_sum(nums: &[i32], target: i32) -> Option<(usize, usize)> {
    todo!("scan once, remembering value -> index, and look up target - n")
}
'''
tests = '''
use student::two_sum;

#[test]
fn basic() {
    assert_eq!(two_sum(&[2, 7, 11, 15], 9), Some((0, 1)));
}

#[test]
