#[test]
fn by_zero_is_none() {
    assert_eq!(safe_div(7, 0), None);
}

#[test]
fn negative_result() {
    assert_eq!(safe_div(-9, 3), Some(-3));
}

#[test]
fn zero_numerator() {
    assert_eq!(safe_div(0, 5), Some(0));
}
"""

[unit.step.gabarito]
time = "O(1)"
space = "O(1)"
solution = """
pub fn safe_div(a: i32, b: i32) -> Option<i32> {
    if b == 0 {
        None
    } else {
        Some(a / b)
    }
}
"""
justification = """
The function does one comparison and at most one division — the same work for any
input, with no loop and no allocation — so time and space are both constant:
**O(1)**. Returning `Option<i32>` turns a potential runtime panic (divide by zero)
into a value the caller must handle, which is the whole point of error handling in
Rust.
"""

