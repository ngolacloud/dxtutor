[[unit]]
id = "u16-send-sync"
title = "Send, Sync & object safety"
difficulty = 16
level = "advanced"
intro = """
The capstone of Rust's type system is fearless concurrency, enforced by two
marker traits. `Send` means a value can be *moved* to another thread; `Sync` means
it can be *shared* (`&T`) across threads. The compiler tracks them automatically
and refuses data races before the program runs. A companion rule — object safety
— decides which traits can become `dyn` trait objects. By the end you sum a vector
in parallel across real OS threads, using only the standard library.
"""

[[unit.step]]
kind = "concept"
id = "c16-send-sync-object-safety"
title = "Thread safety the compiler checks"
points = 5
difficulty = 16
intro = """
Data races — two threads touching the same memory, one writing, without
synchronisation — are undefined behaviour in most languages and found only by luck
or crashes. Rust promotes thread safety into the type system with two
auto-derived marker traits, so a racy program simply does not compile. Object
safety is a separate but related type-level rule about when a trait can be used
dynamically.
"""
body = """
## `Send`, `Sync`, and object safety

Two **marker traits** (no methods — just facts the compiler tracks):

- **`Send`**: the type can be moved to another thread. Almost everything is;
  `Rc<T>` is a notable exception (its counter is not thread-safe).
- **`Sync`**: `&T` can be shared between threads. `T` is `Sync` iff `&T` is
  `Send`.

They are derived automatically, so `thread::spawn` can simply require `Send`:

```rust
let data = vec![1, 2, 3];
let h = std::thread::spawn(move || data.iter().sum::<i32>());
let total = h.join().unwrap();
```

To *share* (not move) data, wrap it in **`Arc<T>`** — an atomically reference-
counted pointer that is `Send + Sync`:

```rust
use std::sync::Arc;
let shared = Arc::new(vec![10, 20, 30]);
let copy = Arc::clone(&shared); // another thread can read through this
```

**Object safety** decides whether a trait can become `dyn Trait`. A trait is
object-safe when its methods take `self`/`&self`/`&mut self`, are not generic, and
do not return `Self`. `Shape { fn area(&self) -> f64 }` is object-safe — hence the
earlier `Box<dyn Shape>` worked. A trait with a generic method or a `-> Self`
cannot be made into a trait object, because there would be no single vtable to
point at.
"""

