[[unit.step]]
kind = "challenge"
id = "ch11-max-of"
title = "Generic maximum"
points = 30
difficulty = 12
entry = "max_of"
intro = """
You write genuinely generic code. Implement `max_of` that returns the largest
element of a slice, or `None` when the slice is empty — for *any* type that can be
compared and copied. The same function must work for integers, floats and
characters, which is the whole point of a type parameter with bounds.
"""
instructions = """
## Your turn

Implement a generic maximum:

```rust
pub fn max_of<T: PartialOrd + Copy>(xs: &[T]) -> Option<T> { ... }
```

Return `None` for an empty slice, otherwise `Some(largest)`.

Examples:

- `max_of(&[3, 7, 2, 9, 4])` → `Some(9)`
- `max_of(&['a', 'z', 'm'])` → `Some('z')`
- `max_of::<i32>(&[])` → `None`

**Hint:** start from the first element with `xs.first()?`, then scan the rest
keeping the larger one.

Hidden tests decide correctness.
"""
starter = """
pub fn max_of<T: PartialOrd + Copy>(xs: &[T]) -> Option<T> {
    todo!("return None if empty, else Some(the largest element)")
}
"""
tests = """
use student::max_of;

#[test]
fn ints() {
    assert_eq!(max_of(&[3, 7, 2, 9, 4]), Some(9));
}

#[test]
fn single() {
    assert_eq!(max_of(&[42]), Some(42));
}

#[test]
fn empty() {
    assert_eq!(max_of::<i32>(&[]), None);
}

#[test]
fn chars() {
    assert_eq!(max_of(&['a', 'z', 'm']), Some('z'));
}

#[test]
fn floats() {
    assert_eq!(max_of(&[1.5, 0.5, 2.25]), Some(2.25));
}
"""

[unit.step.gabarito]
time = "O(n)"
space = "O(1)"
solution = """
pub fn max_of<T: PartialOrd + Copy>(xs: &[T]) -> Option<T> {
    let mut best = *xs.first()?;
    for &x in &xs[1..] {
        if x > best {
            best = x;
        }
    }
    Some(best)
}
"""
justification = """
A single pass compares each of the `n` elements once, so time is **O(n)**; only
one `best` value is kept, so extra space is **O(1)**. The bounds earn their keep:
`PartialOrd` enables `x > best`, `Copy` lets `best` hold a value rather than a
borrow, and `xs.first()?` returns `None` for the empty slice. One definition
serves `i32`, `f64` and `char` alike.
"""

[[unit]]
id = "u12-trait-bounds"
title = "Trait bounds: spelling out what a type can do"
difficulty = 12
level = "advanced"
intro = """
A bound is a requirement attached to a type parameter: `T: Display` means "any
`T`, as long as it can be displayed". You can write bounds inline (`<T: Display>`)
or, when they pile up, in a readable `where` clause. Bounds are checked at the
call site, so a generic that compiles is correct for every type that meets its
bounds. By the end you count matching elements of any comparable type.
"""

[[unit.step]]
kind = "concept"
id = "c12-where"
title = "Bounds and the where clause"
points = 5
difficulty = 12
intro = """
Generics are powerful precisely because they are constrained. A bound is a
promise the caller must keep and the body may rely on. Rust checks it where the
generic is *used*, so the error points at the real mistake — unlike templates
that explode deep inside a library. The `where` clause is just a tidier place to
write bounds when they grow.
"""
body = """
## Bounds: inline and `where`

A bound after a type parameter says what the type must provide:

```rust
fn show_all<T: std::fmt::Debug>(xs: &[T]) { /* can use {:?} on each */ }
```

Several bounds combine with `+`:

```rust
fn twice<T: std::fmt::Display + Clone>(x: T) -> String { /* ... */ }
```

When the list grows, a **`where` clause** keeps the signature readable:

```rust
fn join<T>(xs: &[T], sep: &str) -> String
where
    T: std::fmt::Display,
{
    /* ... */
}
```

Inline and `where` mean exactly the same thing. Either way, the compiler verifies
at the call site that your concrete type satisfies the bound — so a generic that
type-checks works for *every* type allowed to call it.
"""

