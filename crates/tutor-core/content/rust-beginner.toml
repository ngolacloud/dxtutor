id = "rust-beginner"
language = "rust"
title = "Rust: From Zero to Confident"
level = "beginner"
summary = """
A serious, guided course in Rust that takes you from your very first line of
code to the ideas that make Rust special. You read a short concept, build
muscle memory by typing small, complete programs along with the tutor — every
line explained — and then apply what you learned in a graded challenge whose
hidden tests decide correctness. Nine foundation units of steadily rising
difficulty — from printing a line to ownership, collections, your own types, and
error handling. Then an intermediate Database track using SQLite via the `rusqlite`
crate: connecting and querying, transactions and atomicity, WAL mode with connection
pools, the N+1 query problem, pagination, and indexes with query plans — followed by
an advanced track on Rust's type system: traits,
generics, trait bounds, associated types, static vs dynamic dispatch, lifetimes,
and Send/Sync with object safety. Then an advanced concurrency track — threads,
channels, shared state with Arc/Mutex, and data parallelism — and a data
structures & algorithms track: stacks and queues, linked lists, maps and sets,
binary search trees, sorting and searching, and recursion with dynamic
programming. Almost everything runs on the standard library alone — only the
Database track pulls in the `rusqlite` crate. No prior Rust needed.
"""

# NOTE on `line_comments`: for every drill, `line_comments[i]` explains line `i`
# of the `target`, split by newline. Blank in-between lines carry "" so the
# alignment never drifts; the final empty line (from the trailing newline) needs
# no entry. Early units set `placeholder_policy = "shown"` (the target appears at
# once); from Unit 6 on it is "on_demand" (hidden until the student asks).

# ═════════════════════════════════════════════════════════════════════════════
# UNIT 1 — Hello & printing
# ═════════════════════════════════════════════════════════════════════════════
[[unit]]
id = "u1-hello"
title = "Hello & printing"
difficulty = 1
level = "basic"
intro = """
Your very first steps in Rust: what a program is, how to print to the screen,
how to name a value, and how to call a function. By the end you will write a
tiny greeting function and let the tests check it.
"""

[[unit.step]]
kind = "concept"
id = "c1-what-is-a-program"
title = "What a Rust program is"
points = 5
difficulty = 1
intro = """
Before you write anything, picture what a computer actually does: it loads your
compiled program into memory and starts executing machine instructions one after
another. A program needs a single, agreed-upon place to begin — in Rust that
place is the function `main`. The operating system hands control to your program,
Rust runs `main` top to bottom, and anything you print travels to a stream called
**standard output** (stdout), which the terminal shows on screen. This first
concept makes that model concrete so the code that follows is never a mystery.
"""
body = """
## A program starts at `main`

Every Rust program begins running at a special function called **`main`**.
Think of it as the front door: when you run your program, Rust walks in through
`main` and does, top to bottom, whatever it finds there.

```rust
fn main() {
    println!("Hello, world!");
}
```

Three things to notice:

- **`fn main() { ... }`** declares the `main` function. `fn` means *function*;
  the `{ }` hold its body.
- **`println!`** prints a line of text to the screen. The `!` tells you it is a
  **macro**, not a regular function — for now, just know it prints.
- The text in **`"..."`** is a *string*: the exact characters to print.

In the next steps you will type small, complete programs yourself. When your
code matches the target, the tutor runs it so you can see the output — that is
how you build muscle memory.
"""

[[unit.step]]
kind = "drill"
id = "d1-hello-world"
title = "Print your first line"
points = 10
difficulty = 1
placeholder_policy = "shown"
intro = """
This drill cements the one skeleton every Rust program shares. Under the hood,
`println!` is a macro the compiler expands into code that formats your text and
writes the resulting bytes to standard output, with a trailing newline. There is
no loop and no branching here — just the entry point `main` and a single write to
the screen.
"""
prompt = """
Type the classic first program. It prints a single line and stops.

**Why:** this cements the shape every Rust program shares — a `main` function
and a `println!` that writes one line. Reproduce it exactly, character for
character.
"""
target = """
fn main() {
    println!("Hello, world!");
}
"""
line_comments = [
    "Declares `main`, the function Rust runs first; `{` opens its body.",
    "Prints the text `Hello, world!` followed by a newline to standard output.",
    "Closes the body of `main`; when execution reaches here the program ends.",
]
explanation = """
That is a complete Rust program. Rust entered `main`, ran the one `println!`,
printed `Hello, world!`, and then `main` ended — so the program finished. Every
program you write grows from exactly this skeleton.
"""

[[unit.step]]
kind = "drill"
id = "d2-two-lines"
title = "Print two lines in order"
points = 10
difficulty = 1
placeholder_policy = "shown"
intro = """
Programs run top to bottom. Two `println!` calls run in the order you write
them, each writing its own line and its own trailing newline. Seeing the output
appear in source order makes the "instructions run in sequence" model concrete.
"""
prompt = """
Print two separate lines. The order of the statements is the order of the
output.

**Why:** statements execute top to bottom. Each `println!` writes one line, so
the first call's text appears above the second's.
"""
target = """
fn main() {
    println!("Learning Rust");
    println!("One line at a time");
}
"""
line_comments = [
    "Declares `main` and opens its body.",
    "Runs first: prints `Learning Rust` on its own line.",
    "Runs next: prints `One line at a time` below the first line.",
    "Closes `main`; the program ends after both lines have printed.",
]
explanation = """
The two `println!` calls ran in source order, so `Learning Rust` printed first
and `One line at a time` second. That top-to-bottom flow is the backbone of every
program.
"""

[[unit.step]]
kind = "drill"
id = "d3-let-variable"
title = "Name a value and print it"
points = 10
difficulty = 2
placeholder_policy = "shown"
intro = """
Here you meet the idea of a **variable**: a name bound to a value living in
memory. `let name = "Rust";` reserves a slot and labels it `name`. Then string
**interpolation** — writing `{name}` inside the text — tells `println!` to look
up the variable and splice its value into the output at that exact spot.
"""
prompt = """
Give a value a name with `let`, then print it *inside* the text.

**Why:** `let name = "Rust";` creates a variable called `name`. Writing
`{name}` inside the string drops the variable's value right there — this is
**interpolation**. Type the program exactly.
"""
target = """
fn main() {
    let name = "Rust";
    println!("Hello, {name}!");
}
"""
line_comments = [
    "Declares `main` and opens its body.",
    "Binds the name `name` to the text `\"Rust\"`; `let` creates the variable.",
    "Prints `Hello, Rust!` — `{name}` is replaced by the variable's value.",
    "Closes `main`; the program ends.",
]
explanation = """
`let name = "Rust";` bound the name `name` to the text `Rust`, and
`println!("Hello, {name}!")` substituted that value into the `{name}` slot, so
the program printed `Hello, Rust!`. Variables let you say a value once and reuse
it by name.
"""

[[unit.step]]
kind = "challenge"
id = "ch1-greet"
title = "Implement greet"
points = 30
difficulty = 3
entry = "greet"
intro = """
Now you apply everything, and one new idea matters: the difference between
borrowing text and owning it. The parameter `name: &str` is a **string slice** —
a borrowed, read-only view into text the caller still owns. The return type
`String` is **owned** text your function builds fresh and hands back. The
`format!` macro does exactly that: it allocates a new `String` and copies the
fixed parts plus `name` into it. Hidden tests, not the screen, decide correctness.
"""
instructions = """
## Your turn

Implement the function `greet`:

```rust
pub fn greet(name: &str) -> String { ... }
```

It takes a name (a string slice `&str`) and returns a `String` that reads
`Hello, {name}!`.

Examples:

- `greet("World")` → `"Hello, World!"`
- `greet("Rust")` → `"Hello, Rust!"`

**Hint:** the `format!` macro builds a `String` the same way `println!` builds a
printed line — with `{name}` interpolation.

Hidden tests decide correctness. Implement it, then submit.
"""
starter = """
pub fn greet(name: &str) -> String {
    todo!("return a greeting like \\"Hello, World!\\"")
}
"""
tests = """
use student::greet;

#[test]
fn greets_world() {
    assert_eq!(greet("World"), "Hello, World!");
}

#[test]
fn greets_rust() {
    assert_eq!(greet("Rust"), "Hello, Rust!");
}

#[test]
fn greets_a_short_name() {
    assert_eq!(greet("Al"), "Hello, Al!");
}
"""

[unit.step.gabarito]
time = "O(n)"
space = "O(n)"
solution = """
pub fn greet(name: &str) -> String {
    format!("Hello, {name}!")
}
"""
justification = """
`format!` copies the fixed text `Hello, ` and `!` plus the `n` characters of
`name` into a fresh `String`. The work and the memory both grow in direct
proportion to the length of `name`, so the time is **O(n)** and the space is
**O(n)**, where `n` is the length of the name. There is no hidden loop — it is a
single pass that builds the result once.
"""

# ═════════════════════════════════════════════════════════════════════════════
# UNIT 2 — Variables & types
# ═════════════════════════════════════════════════════════════════════════════
[[unit]]
id = "u2-variables"
title = "Variables & types"
difficulty = 2
level = "basic"
intro = """
Every value in Rust has a **type** the compiler tracks for you: whole numbers,
real numbers, booleans, text. You will meet immutability (the default), the
`mut` keyword that opts into change, and simple arithmetic. By the end you will
convert a temperature with a graded challenge.
"""

[[unit.step]]
kind = "concept"
id = "c2-types"
title = "Values have types"
points = 5
difficulty = 2
intro = """
A type is a promise about what a value is and what you can do with it. The
compiler uses types to catch mistakes before your program ever runs — adding a
number to a piece of text is simply rejected. Most of the time Rust *infers* the
type from the value, so you rarely write it, but it is always there.
"""
body = """
## Numbers, booleans, and text

Common types you will use immediately:

- **`i32`** — a 32-bit signed integer, the default whole number (`let n = 42;`).
- **`f64`** — a 64-bit floating-point number, for reals (`let pi = 3.14;`).
- **`bool`** — either `true` or `false`.
- **`&str`** / **`String`** — borrowed text / owned text.

Bindings are **immutable by default**:

```rust
let x = 5;
// x = 6; // error: cannot assign twice to immutable `x`
let mut y = 5;
y = 6;     // fine: `mut` opts in to change
```

Immutability by default is a safety feature: a value you did not mark `mut`
cannot change under you. You reach for `mut` only when you truly need it.
"""

[[unit.step]]
kind = "drill"
id = "d4-numbers"
title = "Integer arithmetic"
points = 10
difficulty = 2
placeholder_policy = "shown"
intro = """
Integers support the usual arithmetic. Here you bind two whole numbers and print
their sum. `{}` is a positional slot: the arguments after the string fill the
slots left to right. The compiler infers both variables are `i32`.
"""
prompt = """
Bind two numbers, add them, and print the result using positional `{}` slots.

**Why:** arithmetic on integers is immediate. The `{}` slots are filled by the
arguments after the string, in order.
"""
target = """
fn main() {
    let a = 7;
    let b = 5;
    println!("{} + {} = {}", a, b, a + b);
}
"""
line_comments = [
    "Declares `main` and opens its body.",
    "Binds `a` to the integer `7` (inferred type `i32`).",
    "Binds `b` to the integer `5`.",
    "Prints `7 + 5 = 12`; the three `{}` slots take `a`, `b`, and `a + b` in order.",
    "Closes `main`.",
]
explanation = """
The three `{}` slots were filled, in order, by `a`, `b`, and the computed value
`a + b`, so the line read `7 + 5 = 12`. The addition happened right inside the
argument list.
"""

[[unit.step]]
kind = "drill"
id = "d5-mutable"
title = "Change a mutable variable"
points = 10
difficulty = 3
placeholder_policy = "shown"
intro = """
A binding marked `mut` may be reassigned or updated. `count += 1` is shorthand
for `count = count + 1`. Watching the value before and after makes mutation
concrete: the same slot in memory now holds a different number.
"""
prompt = """
Create a mutable counter, increment it, and print it before and after.

**Why:** only a `mut` binding may change. `count += 1` adds one in place. Without
`mut`, the second assignment would be a compile error.
"""
target = """
fn main() {
    let mut count = 0;
    println!("start: {count}");
    count += 1;
    println!("after: {count}");
}
"""
line_comments = [
    "Declares `main` and opens its body.",
    "Binds a **mutable** variable `count` to `0`; `mut` allows later change.",
    "Prints `start: 0`.",
    "Adds one to `count` in place; `+=` is `count = count + 1`.",
    "Prints `after: 1`, showing the value changed.",
    "Closes `main`.",
]
explanation = """
Because `count` was declared `mut`, `count += 1` was allowed and updated the
value from `0` to `1`. The two prints showed the before and after. Remove `mut`
and Rust would refuse to compile the reassignment — that is immutability
protecting you by default.
"""

[[unit.step]]
kind = "drill"
id = "d6-bool"
title = "A boolean from a comparison"
points = 10
difficulty = 3
placeholder_policy = "shown"
intro = """
Comparisons like `>` produce a `bool` — exactly `true` or `false`. Storing that
result in a variable shows that a boolean is an ordinary value you can name,
print, and later use to make decisions.
"""
prompt = """
Compare two numbers, store the resulting `bool`, and print it.

**Why:** `a > b` evaluates to a `bool`. Booleans are plain values you can bind
with `let` and print like any other.
"""
target = """
fn main() {
    let a = 10;
    let b = 3;
    let bigger = a > b;
    println!("{a} > {b} is {bigger}");
}
"""
line_comments = [
    "Declares `main` and opens its body.",
    "Binds `a` to `10`.",
    "Binds `b` to `3`.",
    "Evaluates `a > b` (which is `true`) and binds that `bool` to `bigger`.",
    "Prints `10 > 3 is true`.",
    "Closes `main`.",
]
explanation = """
`a > b` compared the two numbers and produced the boolean `true`, which you
stored in `bigger` and printed. Comparisons are how programs turn data into the
yes/no decisions you will branch on in the next unit.
"""

[[unit.step]]
kind = "challenge"
id = "ch2-c2f"
title = "Convert Celsius to Fahrenheit"
points = 30
difficulty = 4
entry = "celsius_to_fahrenheit"
intro = """
You apply typed arithmetic. The formula is `F = C * 9/5 + 32`. Working in `f64`
matters: if you divided integers, `9/5` would truncate to `1` and the answer
would be wrong. Using floating-point literals (`9.0`, `5.0`, `32.0`) keeps the
fraction exact.
"""
instructions = """
## Your turn

Implement `celsius_to_fahrenheit`:

```rust
pub fn celsius_to_fahrenheit(c: f64) -> f64 { ... }
```

Return the temperature in Fahrenheit using `F = C * 9/5 + 32`.

Examples:

- `celsius_to_fahrenheit(0.0)` → `32.0`
- `celsius_to_fahrenheit(100.0)` → `212.0`
- `celsius_to_fahrenheit(-40.0)` → `-40.0`

**Hint:** use floating-point literals (`9.0`, `5.0`, `32.0`) so the division
does not truncate.

Hidden tests decide correctness.
"""
starter = """
pub fn celsius_to_fahrenheit(c: f64) -> f64 {
    todo!("apply F = C * 9/5 + 32 in f64")
}
"""
tests = """
use student::celsius_to_fahrenheit;

#[test]
fn freezing_point() {
    assert_eq!(celsius_to_fahrenheit(0.0), 32.0);
}

#[test]
fn boiling_point() {
    assert_eq!(celsius_to_fahrenheit(100.0), 212.0);
}

#[test]
fn where_scales_meet() {
    assert_eq!(celsius_to_fahrenheit(-40.0), -40.0);
}
"""

[unit.step.gabarito]
time = "O(1)"
space = "O(1)"
solution = """
pub fn celsius_to_fahrenheit(c: f64) -> f64 {
    c * 9.0 / 5.0 + 32.0
}
"""
justification = """
The function does a fixed number of arithmetic operations — one multiply, one
divide, one add — regardless of the input value. There is no loop and no
allocation, so both time and space are constant: **O(1)**. Using `f64` literals
keeps `9.0 / 5.0` as `1.8` instead of truncating to `1`.
"""

# ═════════════════════════════════════════════════════════════════════════════
# UNIT 3 — Control flow: if/else & match
# ═════════════════════════════════════════════════════════════════════════════
[[unit]]
id = "u3-control-flow"
title = "Control flow: if/else & match"
difficulty = 3
level = "basic"
intro = """
Programs make decisions. `if`/`else` chooses between paths based on a boolean,
and because `if` is an **expression** in Rust it can even produce a value.
`match` compares a value against patterns and runs the first that fits. By the
end you will classify a number's sign under hidden tests.
"""

[[unit.step]]
kind = "concept"
id = "c3-branching"
title = "Choosing a path"
points = 5
difficulty = 3
intro = """
A branch is a fork in the road: the program evaluates a condition and takes one
way or the other. In Rust `if` is not just a statement — it is an expression that
evaluates to a value, so you can assign the chosen branch directly. `match` is
the exhaustive cousin: it forces you to handle every possibility, which is how
Rust stops you forgetting a case.
"""
body = """
## `if`/`else` and `match`

`if` runs a block when its condition is `true`:

```rust
if n > 0 {
    println!("positive");
} else {
    println!("not positive");
}
```

Because `if` is an expression, both arms can yield a value:

```rust
let label = if n % 2 == 0 { "even" } else { "odd" };
```

`match` compares a value against patterns, top to bottom, and runs the first
that fits. The `_` arm catches everything else and makes the match exhaustive:

```rust
match n {
    0 => println!("zero"),
    1 => println!("one"),
    _ => println!("many"),
}
```
"""

[[unit.step]]
kind = "drill"
id = "d7-if-else"
title = "Branch with if/else"
points = 10
difficulty = 3
placeholder_policy = "shown"
intro = """
This drill takes one path or the other depending on a condition. The `%`
operator gives the remainder of a division; `n % 2 == 0` is the classic test for
an even number. Exactly one of the two blocks runs.
"""
prompt = """
Print whether a number is even or odd using `if`/`else`.

**Why:** `n % 2` is the remainder after dividing by 2; it is `0` for even
numbers. The `if` runs one block, the `else` the other — never both.
"""
target = """
fn main() {
    let n = 7;
    if n % 2 == 0 {
        println!("{n} is even");
    } else {
        println!("{n} is odd");
    }
}
"""
line_comments = [
    "Declares `main` and opens its body.",
    "Binds `n` to `7`.",
    "Tests the condition `n % 2 == 0`; the remainder of 7 / 2 is 1, so this is false.",
    "The `if` block — would print `is even` — is skipped because the condition was false.",
    "Closes the `if` block and begins `else`.",
    "The `else` block runs instead, printing `7 is odd`.",
    "Closes the `else` block.",
    "Closes `main`.",
]
explanation = """
`7 % 2` is `1`, so the condition `== 0` was `false` and Rust took the `else`
path, printing `7 is odd`. Exactly one branch runs; change `n` to an even number
and the other block would run instead.
"""

[[unit.step]]
kind = "drill"
id = "d8-if-expression"
title = "if as an expression"
points = 10
difficulty = 4
placeholder_policy = "shown"
intro = """
In Rust `if` yields a value, so you can bind the chosen branch straight to a
variable. Each arm's final expression (no semicolon) is its value, and both arms
must have the same type. This removes the need for a throwaway mutable variable.
"""
prompt = """
Use `if`/`else` as an expression to choose a label, then print it.

**Why:** `if cond { a } else { b }` evaluates to `a` or `b`. Binding it with
`let` is cleaner than mutating a variable afterwards.
"""
target = """
fn main() {
    let n = 4;
    let label = if n % 2 == 0 { "even" } else { "odd" };
    println!("{n} is {label}");
}
"""
line_comments = [
    "Declares `main` and opens its body.",
    "Binds `n` to `4`.",
    "`if` is an expression: it evaluates to `\"even\"` (since 4 is even) and binds it to `label`.",
    "Prints `4 is even`.",
    "Closes `main`.",
]
explanation = """
The `if`/`else` expression evaluated to `"even"` and that value was bound to
`label` in one step. Using `if` as an expression keeps the code direct — no
temporary `mut` variable needed.
"""

[[unit.step]]
kind = "drill"
id = "d9-match"
title = "Match on a value"
points = 10
difficulty = 4
placeholder_policy = "shown"
intro = """
`match` lines a value up against patterns and runs the first arm that fits. The
final `_` arm is the catch-all, which also makes the match **exhaustive** — Rust
checks that every possible value is covered. Here it names small numbers and
calls everything else `many`.
"""
prompt = """
Use `match` to turn a number into a word.

**Why:** `match` picks the first matching arm. The `_` arm catches every other
value, so the match covers all cases — Rust requires that.
"""
target = """
fn main() {
    let n = 2;
    let word = match n {
        0 => "zero",
        1 => "one",
        2 => "two",
        _ => "many",
    };
    println!("{n} -> {word}");
}
"""
line_comments = [
    "Declares `main` and opens its body.",
    "Binds `n` to `2`.",
    "Starts a `match` on `n`; its result is bound to `word`.",
    "Arm: if `n` is `0`, the value is `\"zero\"`.",
    "Arm: if `n` is `1`, the value is `\"one\"`.",
    "Arm: `n` is `2`, so this arm matches and `word` becomes `\"two\"`.",
    "Catch-all `_` arm: any other value would be `\"many\"`.",
    "Closes the `match` expression (note the trailing semicolon on the `let`).",
    "Prints `2 -> two`.",
    "Closes `main`.",
]
explanation = """
`match n` tried the arms top to bottom and `2 => "two"` fit, so `word` became
`"two"`. The `_` arm guarantees every possible number is handled, which is why
the compiler accepts the match as complete.
"""

[[unit.step]]
kind = "challenge"
id = "ch3-sign"
title = "Classify a number's sign"
points = 30
difficulty = 5
entry = "sign"
intro = """
You apply branching. The function returns one of three fixed words, so the return
type is `&'static str` — a borrowed view into text baked into the program itself,
which is why no `String` allocation is needed. An `if`/`else if`/`else` chain, or
a `match` guard, picks the right one.
"""
instructions = """
## Your turn

Implement `sign`:

```rust
pub fn sign(n: i32) -> &'static str { ... }
```

Return:

- `"negative"` when `n < 0`
- `"zero"` when `n == 0`
- `"positive"` when `n > 0`

Examples:

- `sign(-5)` → `"negative"`
- `sign(0)` → `"zero"`
- `sign(7)` → `"positive"`

Hidden tests decide correctness.
"""
starter = """
pub fn sign(n: i32) -> &'static str {
    todo!("return \\"negative\\", \\"zero\\", or \\"positive\\"")
}
"""
tests = """
use student::sign;

#[test]
fn negatives() {
    assert_eq!(sign(-5), "negative");
    assert_eq!(sign(-1), "negative");
}

#[test]
fn zero() {
    assert_eq!(sign(0), "zero");
}

#[test]
fn positives() {
    assert_eq!(sign(7), "positive");
    assert_eq!(sign(1), "positive");
}
"""

[unit.step.gabarito]
time = "O(1)"
space = "O(1)"
solution = """
pub fn sign(n: i32) -> &'static str {
    if n < 0 {
        "negative"
    } else if n == 0 {
        "zero"
    } else {
        "positive"
    }
}
"""
justification = """
The function performs at most two comparisons and returns a reference to a string
literal already stored in the program's binary. There is no loop and no
allocation, so time and space are both constant: **O(1)**. `&'static str` means
the returned text lives for the whole program, so nothing is created or copied.
"""

# ═════════════════════════════════════════════════════════════════════════════
# UNIT 4 — Loops
# ═════════════════════════════════════════════════════════════════════════════
[[unit]]
id = "u4-loops"
title = "Loops"
difficulty = 4
level = "basic"
intro = """
Repetition is where computers earn their keep. `for` walks every item of a range
or collection, `while` repeats until a condition changes, and `loop` runs until
you `break`. By the end you will sum the numbers from 1 to n under hidden tests.
"""

[[unit.step]]
kind = "concept"
id = "c4-loops"
title = "Doing something many times"
points = 5
difficulty = 4
intro = """
A loop is a controlled way to repeat work without copying code. The computer
keeps a small piece of state — a counter, or the loop's position in a range — and
repeats the body, updating that state each pass, until a stopping condition is
met. Choosing the right loop is about who controls the stopping: the range (`for`),
a condition (`while`), or your own `break` (`loop`).
"""
body = """
## Three ways to repeat

A **`for`** loop walks each value an iterator yields. `0..n` is a range from `0`
up to but not including `n`:

```rust
for i in 0..3 {
    println!("{i}"); // 0, 1, 2
}
```

A **`while`** loop repeats as long as its condition holds:

```rust
let mut n = 3;
while n > 0 {
    println!("{n}");
    n -= 1;
}
```

A plain **`loop`** runs forever until you `break`, and `break value` can even
return a result. Reach for `for` whenever you are walking a known range — it is
the clearest and the hardest to get wrong (no off-by-one, no forgotten update).
"""

[[unit.step]]
kind = "drill"
id = "d10-for-range"
title = "Count with a for loop"
points = 10
difficulty = 4
placeholder_policy = "shown"
intro = """
A `for` over a range binds each value in turn to the loop variable and runs the
body once per value. `1..=3` is an **inclusive** range, so it yields 1, 2, and 3.
The loop variable is fresh each pass; you do not manage a counter by hand.
"""
prompt = """
Print the numbers 1, 2, 3 with a `for` loop over an inclusive range.

**Why:** `1..=3` yields 1, 2, 3 (the `=` includes the end). The body runs once
per value, with `i` bound to that value.
"""
target = """
fn main() {
    for i in 1..=3 {
        println!("count {i}");
    }
}
"""
line_comments = [
    "Declares `main` and opens its body.",
    "Loops over the inclusive range `1..=3`, binding `i` to 1, then 2, then 3.",
    "Body: prints `count 1`, `count 2`, `count 3` on successive passes.",
    "Closes the `for` loop body.",
    "Closes `main`.",
]
explanation = """
The `for` loop ran its body three times, with `i` taking the values 1, 2, 3 from
the inclusive range `1..=3`, so it printed three lines. The loop variable was
managed for you — no counter to increment, no condition to get wrong.
"""

[[unit.step]]
kind = "drill"
id = "d11-while"
title = "Count down with while"
points = 10
difficulty = 5
placeholder_policy = "shown"
intro = """
A `while` loop checks its condition **before** each pass and stops when it turns
false. You must change the state the condition depends on inside the body, or the
loop never ends. Here the countdown decrements `n` until it reaches zero.
"""
prompt = """
Count down from 3 to 1 with a `while` loop.

**Why:** `while n > 0` keeps looping as long as the condition holds. You must
change `n` inside the body (here with `n -= 1`) so it eventually stops.
"""
target = """
fn main() {
    let mut n = 3;
    while n > 0 {
        println!("{n}");
        n -= 1;
    }
    println!("liftoff");
}
"""
line_comments = [
    "Declares `main` and opens its body.",
    "Binds a mutable `n` to `3` — mutable because the loop will change it.",
    "Checks `n > 0` before each pass; loops while it holds.",
    "Body: prints the current value of `n`.",
    "Decrements `n` by one; without this the loop would run forever.",
    "Closes the `while` body; control jumps back to re-check the condition.",
    "Runs after the loop ends (when `n` reached 0): prints `liftoff`.",
    "Closes `main`.",
]
explanation = """
The loop printed 3, 2, 1 — one per pass — and stopped when `n` reached `0` and
the condition `n > 0` became false. Then `liftoff` printed. The `n -= 1` is what
makes the loop terminate; forget it and the condition would stay true forever.
"""

[[unit.step]]
kind = "drill"
id = "d12-accumulate"
title = "Accumulate a running total"
points = 10
difficulty = 5
placeholder_policy = "shown"
intro = """
The accumulator pattern is everywhere: keep a running value outside the loop and
update it each pass. Here `sum` starts at zero and grows by each `i`. This is
exactly the shape of the challenge that ends this unit.
"""
prompt = """
Add the numbers 1 through 5 into a running total and print it.

**Why:** the accumulator pattern — a `mut` total updated each pass — turns
repetition into a single computed result.
"""
target = """
fn main() {
    let mut sum = 0;
    for i in 1..=5 {
        sum += i;
    }
    println!("sum = {sum}");
}
"""
line_comments = [
    "Declares `main` and opens its body.",
    "Binds a mutable accumulator `sum` to `0`.",
    "Loops over `1..=5`, binding `i` to each value in turn.",
    "Adds the current `i` to `sum`; after the loop `sum` holds 1+2+3+4+5.",
    "Closes the `for` body.",
    "Prints `sum = 15`.",
    "Closes `main`.",
]
explanation = """
Each pass added `i` to `sum`, so after walking 1 through 5 the total was `15`.
Keeping an accumulator outside the loop and updating it inside is the core idea
behind the `sum_to` challenge coming next.
"""

[[unit.step]]
kind = "challenge"
id = "ch4-sum-to"
title = "Sum from 1 to n"
points = 30
difficulty = 6
entry = "sum_to"
intro = """
You apply the accumulator pattern. Return the sum `1 + 2 + ... + n`, and `0` when
`n` is `0`. Use `u32` (unsigned) because the inputs and the total are never
negative. A single `for` over an inclusive range, adding into a running total,
solves it in one linear pass.
"""
instructions = """
## Your turn

Implement `sum_to`:

```rust
pub fn sum_to(n: u32) -> u32 { ... }
```

Return the sum of all integers from `1` to `n` inclusive. `sum_to(0)` is `0`.

Examples:

- `sum_to(0)` → `0`
- `sum_to(5)` → `15`
- `sum_to(100)` → `5050`

**Hint:** start a total at `0` and add each value from a `for i in 1..=n` loop.

Hidden tests decide correctness.
"""
starter = """
pub fn sum_to(n: u32) -> u32 {
    todo!("accumulate 1 + 2 + ... + n")
}
"""
tests = """
use student::sum_to;

#[test]
fn zero_sums_to_zero() {
    assert_eq!(sum_to(0), 0);
}

#[test]
fn small() {
    assert_eq!(sum_to(5), 15);
}

#[test]
fn hundred() {
    assert_eq!(sum_to(100), 5050);
}
"""

[unit.step.gabarito]
time = "O(n)"
space = "O(1)"
solution = """
pub fn sum_to(n: u32) -> u32 {
    let mut total = 0;
    for i in 1..=n {
        total += i;
    }
    total
}
"""
justification = """
The loop runs exactly `n` times, doing constant work each pass, so the time grows
in direct proportion to `n`: **O(n)**. Only one accumulator variable is kept
regardless of `n`, so the space is **O(1)**. (A closed form `n*(n+1)/2` would be
O(1) time, but the loop version is what this unit teaches and is plenty fast.)
"""

