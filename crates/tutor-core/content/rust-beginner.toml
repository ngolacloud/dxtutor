Built-in types take you only so far; real programs describe their own domain. A
`struct` bundles several fields into one value you can pass around as a unit — a
point, a user, a config. An `enum` captures a closed choice: a value is exactly
one variant, and `match` forces you to handle each. Together they let the type
system encode the rules of your problem so invalid states become unrepresentable.
