intro = """
The capstone of the track. Implement `coin_change(coins, amount)`: return the fewest
coins (any denomination, reused freely) that sum to exactly `amount`, or `None` if it
cannot be made. A bottom-up DP table holds the fewest coins for every amount from `0`
