[unit.step.gabarito]
time = "O(n * sqrt(n))"
space = "O(n)"
solution = """
use std::sync::Arc;
use std::thread;

fn is_prime(n: u64) -> bool {
    if n < 2 {
        return false;
    }
    let mut d = 2;
    while d * d <= n {
        if n % d == 0 {
            return false;
        }
        d += 1;
    }
    true
}

pub fn count_primes_parallel(upto: u64, workers: usize) -> usize {
    if upto < 2 {
        return 0;
    }
    let workers = workers.max(1);
    let candidates: Arc<Vec<u64>> = Arc::new((2..=upto).collect());
    let len = candidates.len();
    let chunk = len.div_ceil(workers);
    let mut handles = Vec::new();
    for w in 0..workers {
        let start = w * chunk;
        if start >= len {
            break;
        }
        let end = (start + chunk).min(len);
        let nums = Arc::clone(&candidates);
        handles.push(thread::spawn(move || {
            nums[start..end].iter().filter(|&&n| is_prime(n)).count()
        }));
    }
    handles.into_iter().map(|h| h.join().unwrap()).sum()
}
"""
justification = """
Each of the `n = upto - 1` candidates is tested once with trial division up to its
square root, so the work is **O(n * sqrt(n))**; the shared `Arc<Vec<u64>>` holds the
`n` candidates, so space is **O(n)**. The count is deterministic because the chunks
are disjoint — every candidate is tested exactly once, on exactly one thread — so no
primality test is duplicated or lost, and summing the per-chunk counts yields the
same total as a single-threaded scan, for any number of workers.
"""

[[unit]]
id = "u21-stacks-queues"
title = "Stacks and Queues"
difficulty = 21
level = "advanced"
intro = """
Two of the most useful containers in programming are built straight from the
standard library. A **stack** is last-in, first-out: `Vec` already is one — `push`
puts an item on top, `pop` takes the top back off. A **queue** is first-in,
first-out: `VecDeque` adds at the back with `push_back` and removes from the front
with `pop_front`. This unit uses both, then checks balanced brackets with a stack.
"""

[[unit.step]]
kind = "concept"
id = "c21-stacks-queues"
title = "Last in first out, first in first out"
points = 5
difficulty = 21
intro = """
A stack and a queue differ only in *which end* you take from. Pick the stack when
you want to undo the most recent thing first; pick the queue when you want to serve
things in arrival order.
"""
body = """
## `Vec` is a stack

A `Vec` grows and shrinks at its end, which is exactly a **stack** — last in, first
out (LIFO). `push` adds to the top; `pop` removes the top and returns it as an
`Option` (`None` when empty):

```rust
let mut stack = Vec::new();
stack.push(1);
stack.push(2);
assert_eq!(stack.pop(), Some(2)); // the last pushed comes off first
```

## `VecDeque` is a queue

A **queue** serves in arrival order — first in, first out (FIFO). `VecDeque` is a
double-ended queue that can push and pop at *both* ends cheaply. Use `push_back` to
enqueue and `pop_front` to dequeue:

```rust
use std::collections::VecDeque;

let mut queue = VecDeque::new();
queue.push_back("a");
queue.push_back("b");
assert_eq!(queue.pop_front(), Some("a")); // the first enqueued leaves first
```

- Both `pop` and `pop_front` return `Option`, so an empty container yields `None`
  instead of panicking — handle that case with `while let Some(x) = ...` or a match.
- A stack reverses order (the last in leaves first); a queue preserves it.

Reach for a stack to process *most recent first* (undo, bracket matching,
depth-first search) and a queue for *fair, in-order* processing (task lists,
breadth-first search).
"""

