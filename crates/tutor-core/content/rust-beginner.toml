[unit.step.gabarito]
time = "O(n)"
space = "O(n)"
solution = """
use rusqlite::Connection;

pub fn count_adults(rows: &[(String, i64)]) -> i64 {
    let conn = Connection::open_in_memory().unwrap();
    conn.execute(
        "CREATE TABLE people (name TEXT NOT NULL, age INTEGER NOT NULL)",
        [],
    )
    .unwrap();
    for (name, age) in rows {
        conn.execute(
            "INSERT INTO people (name, age) VALUES (?1, ?2)",
            rusqlite::params![name, age],
        )
        .unwrap();
    }
    conn.query_row(
        "SELECT COUNT(*) FROM people WHERE age >= 18",
        [],
        |r| r.get(0),
    )
    .unwrap()
}
"""
justification = """
Inserting the `n` rows is linear work, and the `COUNT(*) ... WHERE age >= 18` scans them once — so time is **O(n)**; the rows live in the table, so space is **O(n)** too. Pushing the count into SQL (a `WHERE` plus `COUNT`) rather than looping in Rust lets the database filter and tally in a single pass, which is the whole point of querying instead of fetching everything and counting by hand.
"""

[[unit]]
id = "udb2-transactions"
title = "Database: transactions & atomicity"
difficulty = 9
level = "intermediate"
intro = """
A transaction is a group of changes that must all succeed together or all be undone — no middle ground. That is how a bank transfer never loses money to a crash halfway through. Here you commit, roll back, and lean on `rusqlite`'s automatic rollback-on-drop, then prove atomicity by moving money between two accounts under hidden tests.
"""

[[unit.step]]
kind = "concept"
id = "cdb2-tx"
title = "Transactions: all or nothing"
points = 5
difficulty = 9
intro = """
Some changes must happen together or not at all — moving money out of one account and into another, for instance. A transaction groups statements so they either all commit or all roll back, never halfway. This 'all-or-nothing' guarantee is called atomicity, and it is the reason databases can be trusted with money.
"""
body = """
## Atomicity with transactions

A transaction wraps several statements into one unit. Until you **commit**, the changes are pending; a **rollback** throws them all away. In `rusqlite` you start one with `Connection::transaction`, which borrows the connection mutably:

```rust
let tx = conn.transaction().unwrap();
tx.execute("UPDATE acct SET bal = bal - 100 WHERE id = 1", []).unwrap();
tx.execute("UPDATE acct SET bal = bal + 100 WHERE id = 2", []).unwrap();
tx.commit().unwrap(); // both updates become permanent together
```

If anything is wrong, you roll back instead, and the database is left exactly as it was:

```rust
tx.rollback().unwrap(); // neither update survives
```

There is a safety net: if a `Transaction` is dropped without `commit`, `rusqlite` **rolls it back automatically**. So an early return or a panic cannot leave a half-finished change behind — the default is to undo. That default is what makes transactions a guarantee rather than a hope.
"""

