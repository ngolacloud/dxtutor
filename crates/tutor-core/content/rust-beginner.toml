# ═════════════════════════════════════════════════════════════════════════════
# UNIT 6 — Ownership & borrowing
# ═════════════════════════════════════════════════════════════════════════════
[[unit]]
id = "u6-ownership"
title = "Ownership & borrowing"
difficulty = 6
level = "intermediate"
intro = """
Here is the idea at the heart of Rust: every value has a single **owner**, and
when the owner goes out of scope the value is freed — no garbage collector, no
manual free. Instead of giving ownership away, you can **borrow** a value with
`&`. By the end you will count characters in borrowed text under hidden tests.
"""

[[unit.step]]
kind = "concept"
id = "c6-ownership"
title = "Owning and borrowing values"
points = 5
difficulty = 6
intro = """
Memory safety usually costs you either a garbage collector (pauses, overhead) or
manual `free` calls (bugs, crashes). Rust takes a third path: the compiler tracks,
at compile time, who owns each value and frees it exactly once when the owner
leaves scope. Borrowing lets other code read or mutate a value temporarily
without taking that ownership — all checked before your program runs.
"""
body = """
## Move, borrow, and scope

A `String` has a single owner. Assigning it **moves** ownership; the old name can
no longer be used:

```rust
let a = String::from("hi");
let b = a;        // ownership moves to `b`
// println!("{a}"); // error: `a` was moved
```

**Borrowing** with `&` lends access without moving:

```rust
fn len(s: &String) -> usize { s.len() } // borrows, does not own
let a = String::from("hi");
let n = len(&a);  // lend a reference
println!("{a}");  // still usable — ownership never left
```

A `&` is a shared, read-only borrow; `&mut` is an exclusive borrow that may
mutate. The rule — many readers **or** one writer, never both — is what makes
data races impossible. When the owner's scope ends, the value is freed
automatically.
"""

[[unit.step]]
kind = "drill"
id = "d15-borrow"
title = "Borrow instead of move"
points = 10
difficulty = 6
placeholder_policy = "on_demand"
intro = """
Passing `&s` lends a reference to the function instead of handing over ownership,
so `s` is still usable afterwards. The function reads through the borrow with
`.len()` and returns a number. Nothing was copied or freed; the owner stayed put.
"""
prompt = """
Pass a borrow of a `String` to a function that reads its length, then keep using
the original.

**Why:** `&s` lends a read-only reference. Because ownership never moved, `s`
remains valid after the call — borrowing is how functions look without taking.
"""
target = """
fn char_len(s: &String) -> usize {
    s.len()
}

fn main() {
    let s = String::from("hello");
    let n = char_len(&s);
    println!("{s} has {n} bytes");
}
"""
line_comments = [
    "Declares `char_len`, borrowing a `String` by shared reference `&String`.",
    "Reads the length through the borrow and returns it; the caller keeps ownership.",
    "Closes `char_len`.",
    "",
    "Declares `main` and opens its body.",
    "Creates an owned `String` `s` holding `\"hello\"`.",
    "Lends a reference with `&s`; the returned length is bound to `n`.",
    "Prints `hello has 5 bytes` — `s` is still usable because it was only borrowed.",
    "Closes `main`; `s` goes out of scope here and its memory is freed automatically.",
]
explanation = """
`char_len(&s)` borrowed `s` rather than taking it, so after the call `s` was
still valid and printable. The `&` is the whole point: the function looked at the
data without owning it, and Rust freed `s` only when `main` ended.
"""

[[unit.step]]
kind = "drill"
id = "d16-mut-borrow"
title = "Mutate through a borrow"
points = 10
difficulty = 7
placeholder_policy = "on_demand"
intro = """
A `&mut` borrow lends **exclusive** write access. The function can change the
value in place, and the change is visible to the owner afterwards. While a `&mut`
borrow is active, no other borrow of the same value may exist — that exclusivity
is what prevents data races.
"""
prompt = """
Pass a mutable borrow so a function can append to a `String` in place.

**Why:** `&mut s` lends exclusive write access. `push_str` appends through the
borrow, and the owner sees the change once the borrow ends.
"""
target = """
fn add_bang(s: &mut String) {
    s.push_str("!");
}

fn main() {
    let mut s = String::from("hi");
    add_bang(&mut s);
    println!("{s}");
}
"""
line_comments = [
    "Declares `add_bang`, taking an exclusive mutable borrow `&mut String`.",
    "Appends `\"!\"` to the borrowed string in place; no value is returned.",
    "Closes `add_bang`.",
    "",
    "Declares `main` and opens its body.",
    "Creates a mutable `String` `s` holding `\"hi\"` — mutable so it can be borrowed `&mut`.",
    "Lends an exclusive borrow with `&mut s`; the function mutates it.",
    "Prints `hi!` — the append is visible to the owner now the borrow has ended.",
    "Closes `main`; `s` is freed here.",
]
explanation = """
`add_bang(&mut s)` borrowed `s` exclusively and appended through that borrow, so
afterwards `s` read `hi!`. Only one `&mut` borrow may exist at a time — that
exclusivity is exactly what makes in-place mutation safe in Rust.
"""

[[unit.step]]
kind = "drill"
id = "d17-str-slice"
title = "Borrow text as &str"
points = 10
difficulty = 7
placeholder_policy = "on_demand"
intro = """
A `&str` is a borrowed, read-only view of UTF-8 text. Both a string literal and
an owned `String` can be viewed as `&str`, so functions that only read text take
`&str` to accept either. Here `first_word` returns a slice that borrows *into*
the original — no new text is allocated.
"""
prompt = """
Write a function taking `&str` that returns the first word, and call it with a
literal.

**Why:** `&str` is a borrowed view of text. Taking `&str` (not `String`) lets the
function accept literals and `String`s alike, without owning anything.
"""
target = """
fn first_word(text: &str) -> &str {
    text.split(' ').next().unwrap_or("")
}

fn main() {
    let word = first_word("hello there");
    println!("first word: {word}");
}
"""
line_comments = [
    "Declares `first_word`, borrowing text as `&str` and returning a borrowed `&str`.",
    "Splits on spaces, takes the first piece, and falls back to `\"\"` if there is none.",
    "Closes `first_word`.",
    "",
    "Declares `main` and opens its body.",
    "Calls `first_word` with a string literal (itself a `&str`); binds the slice to `word`.",
    "Prints `first word: hello`.",
    "Closes `main`.",
]
explanation = """
`first_word` viewed the text through a `&str` borrow and returned a slice that
points *into* the same text — no copy, no allocation. Taking `&str` is why it
accepted the literal directly; a `String` would have worked just as well.
"""

[[unit.step]]
kind = "challenge"
id = "ch6-count-chars"
title = "Count characters"
points = 30
difficulty = 8
entry = "count_chars"
intro = """
You apply borrowing. Take a `&str` — a borrowed view, so you never own or consume
the caller's text — and return how many **characters** it contains. Counting
`chars()` (not bytes) matters for text like `héllo`, where one accented letter is
a single character but more than one byte. The count is a `usize`.
"""
instructions = """
## Your turn

Implement `count_chars`:

```rust
pub fn count_chars(s: &str) -> usize { ... }
```

Return the number of Unicode characters in `s`.

Examples:

- `count_chars("")` → `0`
- `count_chars("abc")` → `3`
- `count_chars("héllo")` → `5`

**Hint:** `s.chars()` yields the characters; `.count()` counts them. Counting
bytes with `.len()` would be wrong for accented letters.

Hidden tests decide correctness.
"""
starter = """
pub fn count_chars(s: &str) -> usize {
    todo!("count the characters in the borrowed string")
}
"""
tests = """
use student::count_chars;

#[test]
fn empty() {
    assert_eq!(count_chars(""), 0);
}

#[test]
fn ascii() {
    assert_eq!(count_chars("abc"), 3);
}

#[test]
fn accented_is_one_char() {
    assert_eq!(count_chars("héllo"), 5);
}

#[test]
fn spaces_count() {
    assert_eq!(count_chars("a b"), 3);
}
"""

[unit.step.gabarito]
time = "O(n)"
space = "O(1)"
solution = """
pub fn count_chars(s: &str) -> usize {
    s.chars().count()
}
"""
justification = """
`chars()` walks the string once, decoding each UTF-8 character, and `count()`
tallies them — a single linear pass over the `n` bytes of input, so the time is
**O(n)**. No collection is built; only a running count is kept, so the space is
**O(1)**. Because `s` is borrowed as `&str`, the caller's text is never owned or
copied.
"""

# ═════════════════════════════════════════════════════════════════════════════
# UNIT 7 — Collections: Vec & HashMap
# ═════════════════════════════════════════════════════════════════════════════
[[unit]]
id = "u7-collections"
title = "Collections: Vec & HashMap"
difficulty = 7
level = "intermediate"
intro = """
Real programs juggle many values at once. A `Vec<T>` is a growable list; a
`HashMap<K, V>` maps keys to values. You will build them, iterate them, and use
iterator methods like `filter` and `collect`. By the end you will extract the
even numbers from a slice under hidden tests.
"""

[[unit.step]]
kind = "concept"
id = "c7-collections"
title = "Lists and maps"
points = 5
difficulty = 7
intro = """
A collection stores many values behind one name and lets you add, read, and walk
them. A `Vec<T>` keeps its elements in order in a single block of memory, which
makes indexing and iteration fast. A `HashMap<K, V>` trades order for near-instant
lookup by key. Iterators tie them together: a uniform way to visit every element
and transform it without writing index loops by hand.
"""
body = """
## `Vec`, `HashMap`, and iterators

A **`Vec<T>`** is a growable list:

```rust
let mut xs = vec![1, 2, 3];
xs.push(4);           // now [1, 2, 3, 4]
println!("{}", xs[0]); // index access: 1
```

