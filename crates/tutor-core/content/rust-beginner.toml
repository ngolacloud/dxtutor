[unit.step.gabarito]
time = "O(k)"
space = "O(k)"
solution = """
use rusqlite::Connection;

fn seed(conn: &Connection) {
    conn.execute(
        "CREATE TABLE orders (id INTEGER PRIMARY KEY, price INTEGER NOT NULL)",
        [],
    )
    .unwrap();
    let mut stmt = conn
        .prepare("INSERT INTO orders (id, price) VALUES (?1, ?2)")
        .unwrap();
    for i in 1..=100i64 {
        stmt.execute([i, i * 10]).unwrap();
    }
}

pub fn total_price(order_ids: &[i64]) -> (i64, usize) {
    let conn = Connection::open_in_memory().unwrap();
    seed(&conn);
    if order_ids.is_empty() {
        return (0, 0);
    }
    let placeholders = order_ids
        .iter()
        .map(|_| "?")
        .collect::<Vec<_>>()
        .join(",");
    let sql = format!(
        "SELECT COALESCE(SUM(price), 0) FROM orders WHERE id IN ({})",
        placeholders
    );
    let params = rusqlite::params_from_iter(order_ids.iter());
    let sum: i64 = conn.query_row(&sql, params, |r| r.get(0)).unwrap();
    (sum, 1)
}
"""
justification = """
Building the `IN` clause and binding the ids is linear in `k`, the number of ids, and the database answers in a single query — so time and space are **O(k)** in the input, with exactly one round-trip. Returning the query count alongside the sum is the proof: whether you ask for one order or fifty, the count stays 1, because `IN (...)` does in one statement what the naive loop would do in N.
"""

[[unit]]
id = "udb5-pagination"
title = "Database: pagination done right"
difficulty = 9
level = "intermediate"
intro = """
Showing results a page at a time sounds trivial, but the obvious `LIMIT`/`OFFSET` approach slows down on deep pages and can skip or duplicate rows when data shifts. This unit contrasts it with keyset (seek) pagination — `WHERE id > ? ORDER BY id LIMIT ?` — which stays fast and stable. You finish by implementing keyset paging over a seeded table, under hidden tests.
"""

[[unit.step]]
kind = "concept"
id = "cdb5-paging"
title = "Pagination: offset vs keyset"
points = 5
difficulty = 9
intro = """
You rarely want every row at once — you want a page of them. The familiar way is `LIMIT`/`OFFSET`, but it gets slower the deeper you go and can skip or repeat rows when data changes underneath you. Keyset (or 'seek') pagination remembers the last id you saw and asks for rows *after* it, which stays fast and stable.
"""
body = """
## LIMIT / OFFSET

The textbook page: skip `OFFSET` rows, take `LIMIT`:

```rust
// page 3 of size 10: skip 20, take 10
let sql = "SELECT id FROM t ORDER BY id LIMIT 10 OFFSET 20";
```

It works, but the database must still walk and discard all `OFFSET` rows, so page 10000 is slow. Worse, if rows are inserted or deleted between pages, the offset shifts and you can skip or repeat items.

## Keyset / seek pagination

Instead of counting from the start, remember the last id and seek past it:

```rust
let sql = "SELECT id FROM t WHERE id > ?1 ORDER BY id LIMIT ?2";
// pass (last_id_seen, page_size)
```

The `WHERE id > ?1` jumps straight to where you left off using the primary-key order, so every page costs the same no matter how deep. Because the cursor is a real id rather than a position, inserts and deletes elsewhere cannot make you skip or repeat a row. The one rule: order by a stable, unique column (an id is ideal).
"""

