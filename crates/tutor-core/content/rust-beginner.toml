[[unit]]
id = "u17-threads"
title = "Threads"
difficulty = 17
level = "advanced"
intro = """
A single program can do several things at once by running them on separate
threads of execution. This unit is the start of an advanced concurrency track:
you learn what a thread is, how to start one with `std::thread::spawn`, how to
wait for it with `join`, and how to hand owned data to a thread with `move`.
Everything is standard library, and every result is deterministic.
"""

[[unit.step]]
kind = "concept"
id = "c17-threads"
title = "What a thread is"
points = 5
difficulty = 17
intro = """
Until now your programs ran one instruction after another on a single line of
execution. A thread lets a program run more than one such line at the same time.
That power comes with a hazard — shared memory — which the rest of this track
teaches you to tame.
"""
body = """
## Threads: doing several things at once

A **thread** is an independent sequence of instructions that the operating system
can run at the same time as other threads. Every program starts with one thread,
the one that runs `main`. You can start more.

Threads of the same program **share the same memory**. That is what makes them
fast to create and able to cooperate — but it is also the source of danger: if two
threads touch the same data at the same time and at least one writes, you have a
**data race**, a bug that is undefined behaviour in most languages.

Rust's job is to make that danger visible at compile time. For now, the mechanics:

```rust
use std::thread;

let handle = thread::spawn(|| {
    // work that runs on a new thread
});
handle.join().unwrap(); // wait for it to finish
```

- **`thread::spawn`** starts a new thread running the given closure and returns a
  **`JoinHandle`**.
- **`join`** blocks the current thread until that thread finishes, and returns
  whatever the closure produced (inside a `Result`, so you `unwrap`).
- A thread outlives the local variables of the function that spawned it, so a
  closure that captures data must usually take ownership with **`move`**. Moving
  owned data into a thread is allowed because the type is `Send`.

Start a thread, give it work, `join` it to collect the answer: that is the whole
shape of the simplest concurrency.
"""

