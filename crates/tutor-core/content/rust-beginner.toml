[unit.step.gabarito]
time = "O(amount * coins)"
space = "O(amount)"
solution = '''
pub fn coin_change(coins: &[u32], amount: u32) -> Option<u32> {
    let amount = amount as usize;
    let mut dp = vec![u32::MAX; amount + 1];
    dp[0] = 0;
    for a in 1..=amount {
        for &c in coins {
            let c = c as usize;
            if c <= a && dp[a - c] != u32::MAX {
                dp[a] = dp[a].min(dp[a - c] + 1);
            }
        }
    }
    if dp[amount] == u32::MAX {
        None
    } else {
        Some(dp[amount])
    }
}
'''
justification = """
The table has `amount + 1` entries and each is relaxed against every coin, so the time
is **O(amount * coins)** and the space is **O(amount)**. `dp[a]` is the provably fewest
coins for amount `a`: it is built only from `dp[a - c]`, a strictly smaller amount that
is already final, so optimal substructure holds. An entry that never improves past the
`u32::MAX` marker is unreachable, which is reported as `None`; `dp[0] = 0` seeds the
base case.
"""
