intro = """
A linked list is the first data structure you build from pointers rather than a
contiguous block. In Rust the shape is `Option<Box<Node>>`: each node owns the next
through a `Box`, and `None` marks the end. This unit builds a singly linked list —
push to the front, pop from the front, measure its length — then reverses a sequence
