[unit.step.gabarito]
time = "O(n)"
space = "O(n)"
solution = '''
use std::collections::HashMap;

pub fn two_sum(nums: &[i32], target: i32) -> Option<(usize, usize)> {
    let mut seen: HashMap<i32, usize> = HashMap::new();
    for (i, &n) in nums.iter().enumerate() {
        let need = target - n;
        if let Some(&j) = seen.get(&need) {
            return Some((j, i));
        }
        seen.entry(n).or_insert(i);
    }
    None
}
'''
justification = """
The slice is scanned once, and each step does an average O(1) map lookup and insert,
so the total time is **O(n)**. The map stores at most one entry per element, giving
**O(n)** space. For the current index `i`, the complement `target - nums[i]` is looked
up among the earlier values; if present at index `j`, then `j < i`, so `(j, i)` is
returned smaller-index-first and is the first such pair in scan order.
"""

[[unit]]
id = "u24-binary-search-tree"
title = "Binary Search Trees"
difficulty = 24
level = "advanced"
intro = """
A binary search tree keeps values ordered by *where* they sit: everything smaller
than a node goes left, everything larger goes right. That invariant makes `insert`
and `contains` follow a single path down the tree, and an in-order traversal reads
the values back in sorted order. This unit builds a BST of `i32` with
`Option<Box<Node>>`, then returns a sorted, de-duplicated sequence from raw inserts.
"""

[[unit.step]]
kind = "concept"
id = "c24-binary-search-tree"
title = "Smaller left, larger right"
points = 5
difficulty = 24
intro = """
The binary-search-tree invariant is one rule applied at every node: left subtree
holds smaller values, right subtree holds larger ones. Keep that rule and search,
insertion, and sorted output all fall out naturally.
"""
body = """
## The node and the invariant

Each node owns two optional children, both `Option<Box<Node>>`. The invariant: for
every node, all values in its left subtree are **smaller**, and all in its right
subtree are **larger**:

```rust
struct Node {
    val: i32,
    left: Option<Box<Node>>,
    right: Option<Box<Node>>,
}
```

## Insert and search follow one path

To insert or search, compare at the current node and step left or right — never
both. That is why both are O(height): one comparison per level.

```rust
fn insert(root: &mut Option<Box<Node>>, v: i32) {
    match root {
        None => *root = Some(Box::new(Node { val: v, left: None, right: None })),
        Some(n) if v < n.val => insert(&mut n.left, v),
        Some(n) if v > n.val => insert(&mut n.right, v),
        Some(_) => {} // equal: already present, ignore
    }
}
```

## In-order traversal reads sorted

Visit the left subtree, then the node, then the right subtree. Because left is
always smaller and right always larger, this yields the values in **ascending
order**:

```rust
fn walk(root: &Option<Box<Node>>, out: &mut Vec<i32>) {
    if let Some(n) = root {
        walk(&n.left, out);
        out.push(n.val);
        walk(&n.right, out);
    }
}
```

- Matching on `&mut Option<Box<Node>>` lets `insert` plant a new node exactly where
  the search falls off the tree (the `None` arm).
- Ignoring the equal case keeps the tree a *set* — duplicates are dropped.

Insert each value, walk in order, and you have sorted unique output — the challenge
in a nutshell.
"""

