    "Iterates the slice by reference.",
    "Prints each element with `{:?}`, legal because of the bound.",
    "Closes the loop.",
    "Closes `show_all`.",
    "",
    "`main` opens.",
    "Calls `show_all` on a slice of `i32`; prints `1`, `2`, `3` on three lines.",
    "Closes `main`.",
]
explanation = """
`show_all` printed every element because the bound `T: Debug` promised each one
could be formatted with `{:?}`. Remove the bound and the `println!` would not
compile — the body may only use capabilities it has declared.
"""

[[unit.step]]
kind = "drill"
id = "d33-where-clause"
title = "The where clause"
points = 10
difficulty = 13
placeholder_policy = "on_demand"
intro = """
When a signature gets busy, move the bounds into a `where` clause below it. It
reads the same to the compiler but far better to a human. Here `join` turns any
slice of `Display` values into one separated string.
"""
prompt = """
Rewrite a bound as a `where` clause on a `join` function.

**Why:** `where` keeps the function header clean when bounds multiply, with no
change in meaning.
"""
target = """
fn join<T>(xs: &[T], sep: &str) -> String
where
    T: std::fmt::Display,
{
    let parts: Vec<String> = xs.iter().map(|x| x.to_string()).collect();
    parts.join(sep)
}

fn main() {
    println!("{}", join(&[1, 2, 3], "-"));
    println!("{}", join(&["a", "b"], ", "));
}
"""
line_comments = [
    "Declares `join<T>` — the header stays clean.",
    "The `where` keyword introduces the bounds...",
    "...`T: Display`, so each element can become a string.",
    "Opens the body.",
    "Maps each element to its `String` form and collects them.",
    "Joins the parts with the separator.",
    "Closes `join`.",
    "",
    "`main` opens.",
    "Joins ints with `-`; prints `1-2-3`.",
    "Joins strings with `, `; prints `a, b`.",
    "Closes `main`.",
]
explanation = """
The `where` clause moved the `T: Display` bound out of the header, leaving
`join<T>` easy to read — and the compiler treats it identically to an inline
bound. `join` then worked for ints and strings alike, producing `1-2-3` and
`a, b`.
"""

[[unit.step]]
kind = "drill"
id = "d34-multiple-bounds"
title = "Several bounds with +"
points = 10
difficulty = 13
placeholder_policy = "on_demand"
intro = """
A type parameter can be asked for more than one capability at once, joined with
`+`. `twice` needs `Clone` to duplicate the value and `Display` to print both
copies. Each bound unlocks exactly one thing the body does.
"""
