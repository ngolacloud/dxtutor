[[unit.step]]
kind = "challenge"
id = "ch16-parallel-sum"
title = "Parallel sum across threads"
points = 40
difficulty = 17
entry = "parallel_sum"
intro = """
The capstone. Implement `parallel_sum`, which splits a vector into chunks, sums
each chunk on its own OS thread, and combines the partial sums — standard library
only (`std::thread`, `std::sync::Arc`). It must return the same answer as a plain
sequential sum for any number of workers, which is `Send`/`Sync` doing their job:
the data is shared safely and no thread races another.
"""
instructions = """
## Your turn

Sum a vector using several threads:

```rust
pub fn parallel_sum(data: Vec<i64>, workers: usize) -> i64 { ... }
```

Split `data` into roughly equal chunks, sum each chunk on its own thread, and add
the partial sums. The result must equal `data.iter().sum()` for any `workers`.

Rules:

- `workers` of `0` behaves like `1`.
- An empty vector sums to `0`.
- Use only `std::thread` and `std::sync::Arc` — no external crates.

Examples:

- `parallel_sum((1..=100).collect(), 4)` → `5050`
- `parallel_sum(vec![1, 2, 3, 4], 1)` → `10`

**Hint:** wrap the data in an `Arc`, give each thread a start/end range and its own
`Arc::clone`, then sum the values each thread returns from `join`.

Hidden tests decide correctness.
"""
starter = """
use std::sync::Arc;
use std::thread;

pub fn parallel_sum(data: Vec<i64>, workers: usize) -> i64 {
    todo!("split into chunks, sum each on a thread, combine the partial sums")
}
"""
tests = """
use student::parallel_sum;

#[test]
fn matches_sequential() {
    let data: Vec<i64> = (1..=100).collect();
    assert_eq!(parallel_sum(data, 4), 5050);
}

#[test]
fn single_worker() {
    assert_eq!(parallel_sum(vec![1, 2, 3, 4], 1), 10);
}

#[test]
fn more_workers_than_items() {
    assert_eq!(parallel_sum(vec![5, 5, 5], 10), 15);
}

#[test]
fn empty_is_zero() {
    assert_eq!(parallel_sum(Vec::new(), 4), 0);
}

#[test]
fn zero_workers_defaults_to_one() {
    assert_eq!(parallel_sum(vec![7, 8], 0), 15);
}
"""

[unit.step.gabarito]
time = "O(n)"
space = "O(n)"
solution = """
use std::sync::Arc;
use std::thread;

pub fn parallel_sum(data: Vec<i64>, workers: usize) -> i64 {
    if data.is_empty() {
        return 0;
    }
    let workers = workers.max(1);
    let shared = Arc::new(data);
    let len = shared.len();
    let chunk = len.div_ceil(workers);
    let mut handles = Vec::new();
    for w in 0..workers {
        let start = w * chunk;
        if start >= len {
            break;
        }
        let end = (start + chunk).min(len);
        let part = Arc::clone(&shared);
        handles.push(thread::spawn(move || {
            let mut acc: i64 = 0;
            for &x in &part[start..end] {
                acc += x;
            }
            acc
        }));
    }
    handles.into_iter().map(|h| h.join().unwrap()).sum()
}
"""
justification = """
Every element is added exactly once across all threads, so the total work is
**O(n)**; the `Arc` holds the single shared vector and the handles are `O(workers)`
≤ `O(n)`, so space is **O(n)**. Correctness regardless of `workers` is the lesson:
`Arc<Vec<i64>>` is `Send + Sync`, so each thread safely reads its own disjoint
range, and because no two threads touch the same element there is no data race —
the compiler would reject the code otherwise.
"""

