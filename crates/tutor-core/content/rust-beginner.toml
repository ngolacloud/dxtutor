## Your turn

Sort a vector with merge sort:

```rust
pub fn merge_sort(mut v: Vec<i32>) -> Vec<i32> { ... }
```

Return a sorted (ascending, stable) copy of `v`. Split at the midpoint, sort each
half recursively, and merge the halves.

Rules:

- Do **not** use `slice::sort` or `sort_unstable` — write the merge yourself.
- A slice of length 0 or 1 is already sorted (the base case).
- The sort must be stable: keep equal elements in their original relative order
  (take from the left half on a tie with `<=`).

