intro = """
Dynamic programming is just recursion with its repeated subproblems solved only
once. Whether you cache results top-down or fill a table bottom-up, the win is the
same: exponential work collapses to polynomial.
"""
body = """
## Naive recursion recomputes

Fibonacci is the textbook case. The direct recursion is clear but calls itself with
the same arguments over and over — `fib(50)` makes billions of calls:

```rust
fn fib(n: u32) -> u64 {
    if n < 2 { n as u64 } else { fib(n - 1) + fib(n - 2) }
}
```

## Memoise: solve each subproblem once

**Memoisation** caches each answer the first time it is computed and returns the
cached value afterwards. A `Vec<Option<u64>>` indexed by `n` turns the exponential
recursion into linear work:

```rust
fn fib(n: usize, memo: &mut Vec<Option<u64>>) -> u64 {
    if let Some(v) = memo[n] { return v; }
    let v = if n < 2 { n as u64 } else { fib(n - 1, memo) + fib(n - 2, memo) };
    memo[n] = Some(v);
    v
}
```

## Bottom-up: fill a table

The same idea without recursion: start from the base cases and build each answer
from smaller ones you have already stored. `dp[i]` holds the solution for size `i`:

```rust
let mut dp = vec![0u64; n + 1];
dp[1] = 1;
for i in 2..=n {
    dp[i] = dp[i - 1] + dp[i - 2];
}
```

- Memoisation is top-down (recurse, then cache); tabulation is bottom-up (loop,
  filling the table). Both compute every distinct subproblem exactly once.
- Choose DP when the problem has **overlapping subproblems** (the same smaller cases
  recur) and **optimal substructure** (the best answer builds from best sub-answers).

Coin change has both: the fewest coins for an amount builds on the fewest coins for
smaller amounts — a perfect bottom-up table.
"""

