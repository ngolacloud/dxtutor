[[unit]]
id = "u20-parallelism"
title = "Parallelism"
difficulty = 20
level = "advanced"
intro = """
The payoff of the whole track: split a large job across threads, let them work on
disjoint pieces, and combine the pieces into one answer. This unit uses
`thread::scope` to borrow local data without `Arc`, divides a vector into chunks,
and finishes by counting primes in parallel — always with a deterministic result.
"""

[[unit.step]]
kind = "concept"
id = "c20-parallelism"
title = "Divide the work, combine the answers"
points = 5
difficulty = 20
intro = """
Concurrency is about *dealing with* many things at once; parallelism is about
*doing* many things at once to go faster. The recipe is always the same: split the
input into independent parts, process the parts on different threads, and reduce
their results into one.
"""
body = """
## Data parallelism: split, compute, combine

To make a big computation faster with threads, give each thread a **disjoint**
slice of the data. Because the slices do not overlap, the threads never touch the
same memory — no locks, no races — and the partial results combine into the whole:

1. **Split** the data into `k` roughly equal chunks.
2. **Compute** a partial result for each chunk on its own thread.
3. **Combine** (reduce) the partials into the final answer.

Because a thread must not outlive the data it borrows, sharing owned data usually
needs `Arc`. But the standard library offers a lighter tool for the common case
where the data outlives the threads: **`thread::scope`**.

```rust
use std::thread;

let data = vec![1, 2, 3, 4];
let total: i32 = thread::scope(|s| {
    let h = s.spawn(|| data.iter().sum::<i32>());
    h.join().unwrap()
});
```

- Inside `thread::scope`, scoped threads created with **`s.spawn`** may **borrow**
  local variables directly — no `move`, no `Arc` — because the scope guarantees
  every scoped thread finishes before `scope` returns.
- Gathering the partials in a fixed order (for example, by chunk index) makes the
  combined result **deterministic**: the final answer never depends on which thread
  happened to finish first.

Split into disjoint chunks, compute in parallel, reduce in order: that is the
engine of data parallelism.
"""

