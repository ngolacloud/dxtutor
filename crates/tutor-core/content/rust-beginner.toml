[unit.step.gabarito]
time = "O(n)"
space = "O(n)"
solution = """
use r2d2_sqlite::SqliteConnectionManager;
use std::sync::atomic::{AtomicU64, Ordering};
use std::thread;

static SEQ: AtomicU64 = AtomicU64::new(0);

pub fn pooled_sum(upto: i64, workers: usize) -> i64 {
    let workers = workers.max(1);
    let seq = SEQ.fetch_add(1, Ordering::SeqCst);
    let path = std::env::temp_dir().join(format!(
        "dxtutor_pooled_{}_{}.db",
        std::process::id(),
        seq
    ));
    let _ = std::fs::remove_file(&path);

    let manager = SqliteConnectionManager::file(&path)
        .with_init(|c| c.execute_batch("PRAGMA journal_mode=WAL; PRAGMA busy_timeout=5000;"));
    let pool = r2d2::Pool::builder()
        .max_size((workers as u32).max(2))
        .build(manager)
        .unwrap();

    {
        let conn = pool.get().unwrap();
        conn.execute("CREATE TABLE nums (x INTEGER NOT NULL)", [])
            .unwrap();
    }

    let mut handles = Vec::new();
    for w in 0..workers {
        let pool = pool.clone();
        handles.push(thread::spawn(move || {
            let conn = pool.get().unwrap();
            let mut n = (w as i64) + 1;
            while n <= upto {
                conn.execute("INSERT INTO nums (x) VALUES (?1)", [n]).unwrap();
                n += workers as i64;
            }
        }));
    }
    for h in handles {
        h.join().unwrap();
    }

    let conn = pool.get().unwrap();
    let sum: i64 = conn
        .query_row("SELECT COALESCE(SUM(x), 0) FROM nums", [], |r| r.get(0))
        .unwrap();
    drop(conn);
    drop(pool);
    let _ = std::fs::remove_file(&path);
    sum
}
"""
justification = """
Every number from 1 to `upto` is inserted exactly once across the threads, so the total work and the stored rows are both linear — time and space **O(n)**. The determinism comes from the design, not luck: the slices are disjoint (each number written once), WAL plus a busy timeout make concurrent writers wait rather than fail, and the sum is read only after every thread is joined — so the answer is always `upto*(upto+1)/2` regardless of interleaving.
"""

[[unit]]
id = "udb4-n-plus-one"
title = "Database: the N+1 problem"
difficulty = 9
level = "intermediate"
intro = """
One of the most common database performance bugs is quietly running a query inside a loop — one query to get a list, then N more, one per item. This unit makes the cost visible by counting queries, then fixes it with a single `IN (...)` or `JOIN`. You finish by computing a total with exactly one query and proving the count, under hidden tests.
"""

[[unit.step]]
kind = "concept"
id = "cdb4-nplus1"
title = "The N+1 query problem"
points = 5
difficulty = 9
intro = """
A classic performance bug: you fetch a list, then loop and run one more query per item. One query plus N queries — the 'N+1' problem. Each round-trip to the database has a cost, and N of them in a loop is slow. The fix is to ask for everything you need in a single query, with `IN (...)` or a `JOIN`.
"""
body = """
## One query in a loop is N queries

Here is the trap. You have some ids and fetch each row separately:

```rust
let mut total = 0;
for id in &ids {
    let price: i64 = conn
        .query_row("SELECT price FROM p WHERE id = ?1", [id], |r| r.get(0))
        .unwrap();
    total += price; // one database round-trip per id
}
```

With 1000 ids that is 1000 queries. The database spends most of its time on round-trip overhead, not on the actual work.

## Ask once

Fetch the whole set in a single query with `IN (...)` — or a `JOIN` when the data spans tables:

```rust
let total: i64 = conn
    .query_row("SELECT SUM(price) FROM p WHERE id IN (1, 2, 3)", [], |r| r.get(0))
    .unwrap();
```

Same answer, one round-trip. The rule of thumb: if you find yourself running queries inside a loop, step back and ask whether one `IN` or `JOIN` could do the whole job at once. Almost always, it can.
"""

