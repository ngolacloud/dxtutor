"""
line_comments = [
    "Declares `clamp_small`, taking and returning an `i32`.",
    "`n.max(0)` lifts anything below 0 up to 0, then `.min(9)` caps it at 9; the result is returned.",
    "Closes `clamp_small`.",
    "",
    "Declares `main` and opens its body.",
    "Calls `clamp_small(15)`; 15 is capped to 9, which prints.",
    "Calls `clamp_small(-4)`; -4 is lifted to 0, which prints.",
    "Closes `main`.",
]
explanation = """
`clamp_small` chained the `max` and `min` methods to keep its input within 0..=9,
so `15` became `9` and `-4` became `0`. You composed two existing operations into
one named function and reused it twice.
"""

[[unit.step]]
