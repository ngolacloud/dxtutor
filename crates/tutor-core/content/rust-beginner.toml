"""

[[unit.step]]
kind = "concept"
id = "c22-linked-list"
title = "Nodes that own the next node"
points = 5
difficulty = 22
intro = """
A linked list stores each value in its own node, and each node *owns* the rest of
the list. Because ownership must have a known size, the link goes through a `Box` —
a pointer to heap data — and ends with `None`.
"""
body = """
## The shape: `Option<Box<Node>>`

A node holds a value and a link to the next node. The link is
`Option<Box<Node>>`: `Some(box)` points at another node, `None` ends the list. The
`Box` is essential — without it the type would contain itself and have infinite
size:

```rust
struct Node {
    val: i32,
    next: Option<Box<Node>>,
}
```

## Push to the front

The cheapest insertion is at the head: make a new node whose `next` is the old
head, then make it the new head. `Option::take` swaps the old head out (leaving
`None` in its place) so it can be moved into the new node:

```rust
let mut head: Option<Box<Node>> = None;
head = Some(Box::new(Node { val: 1, next: head.take() }));
head = Some(Box::new(Node { val: 2, next: head.take() })); // 2 -> 1 -> end
```

- `Box<Node>` owns one node on the heap; dropping the head drops the whole chain.
- `head.take()` is the idiom for moving an owned value *out* of an `Option` while
  leaving it valid (`None`) — exactly what you need when re-linking.
- To walk the list, follow `&node.next` with a `while let Some(node) = cur` loop.

Push-front then walk is the backbone of every operation in this unit — including
reversing a sequence, which push-front does almost for free.
"""

