"""
instructions = """
## Your turn

Make an amount with the fewest coins:

```rust
pub fn coin_change(coins: &[u32], amount: u32) -> Option<u32> { ... }
```

Return `Some(k)` where `k` is the minimum number of coins from `coins` (each usable
any number of times) that sum to exactly `amount`, or `None` if no combination works.

Rules:

- `amount` of `0` needs `0` coins → `Some(0)`.
- If the amount cannot be formed (including when `coins` is empty and `amount > 0`),
  return `None`.
- Use a bottom-up DP table, not brute-force enumeration.

Examples:

- `coin_change(&[1, 2, 5], 11)` → `Some(3)` (5 + 5 + 1)
- `coin_change(&[2], 3)` → `None`
- `coin_change(&[1, 2, 5], 0)` → `Some(0)`

**Hint:** make `dp` of length `amount + 1`, every entry an \"unreachable\" marker
(`u32::MAX`) except `dp[0] = 0`. For each amount `a` from `1` to `amount`, for each
coin `c <= a` with `dp[a - c]` reachable, set `dp[a] = min(dp[a], dp[a - c] + 1)`. The
answer is `dp[amount]`, or `None` if it stayed unreachable.

Hidden tests decide correctness.
"""
