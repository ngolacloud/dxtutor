[[unit]]
id = "u10-traits"
title = "Traits & impl: behaviour as a contract"
difficulty = 10
level = "advanced"
intro = """
A trait is a named set of methods a type promises to provide — an interface, in
the vocabulary of other languages. You declare the contract once with `trait`,
then `impl` it for each concrete type. Code can then speak to "anything that
behaves like this" instead of to one specific type. By the end you implement a
trait and let a function greet any type that satisfies it.
"""

[[unit.step]]
kind = "concept"
id = "c10-traits"
title = "Shared behaviour, named once"
points = 5
difficulty = 10
intro = """
Programs repeat behaviour across unrelated types: many things can be "printed",
"compared", or "drawn". A trait captures that behaviour as a contract: a set of
method signatures a type agrees to supply. This is how Rust achieves
polymorphism without inheritance — types stay independent, and the shared
vocabulary lives in the trait.
"""
body = """
## Traits: an interface you implement

A **trait** declares methods a type must provide:

```rust
trait Speak {
    fn say(&self) -> String;
}
```

A type **implements** the trait with an `impl ... for ...` block:

```rust
struct Dog;
impl Speak for Dog {
    fn say(&self) -> String { String::from("Woof") }
}
```

Now `Dog` *is a* `Speak`, and any code that only needs `Speak` can use it.

Traits may also carry **default methods** — a body the implementer can reuse or
override:

```rust
trait Greeter {
    fn name(&self) -> String;
    fn greet(&self) -> String { format!("Hello, {}!", self.name()) }
}
```

An implementer only has to supply `name`; it gets `greet` for free. Traits are
the backbone of Rust's type system — generics, iterators, operators and more are
all expressed as traits.
"""

[[unit.step]]
