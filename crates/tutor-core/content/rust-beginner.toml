[[unit]]
id = "u18-channels"
title = "Channels"
difficulty = 18
level = "advanced"
intro = """
Sharing memory between threads is dangerous; passing *messages* is safe. A channel
is a one-way pipe: threads send values down it and another thread receives them.
This unit covers `std::sync::mpsc` — create a channel, `send`, `recv`, iterate the
receiver until it closes, and clone the sender for several producers.
"""

[[unit.step]]
kind = "concept"
id = "c18-channels"
title = "Communicate by passing messages"
points = 5
difficulty = 18
intro = """
There are two ways for threads to cooperate: share memory and guard it, or send
each other messages and share nothing. Message passing sidesteps a whole class of
bugs, and Rust's standard library gives you a channel to do it.
"""
body = """
## Channels: `std::sync::mpsc`

A popular slogan captures the idea: *do not communicate by sharing memory; share
memory by communicating.* A **channel** is a queue with two ends:

```rust
use std::sync::mpsc;

let (tx, rx) = mpsc::channel();
tx.send(42).unwrap();        // producer end
let got = rx.recv().unwrap(); // consumer end, blocks until a value arrives
```

- **`mpsc::channel()`** returns a pair: a **transmitter** `tx` and a **receiver**
  `rx`. The name `mpsc` means *multi-producer, single-consumer*.
- **`tx.send(value)`** pushes a value into the channel. It returns a `Result`
  because sending fails if the receiver is gone.
- **`rx.recv()`** blocks until a value is available and returns it.
- You can loop over the receiver directly — `for value in rx { ... }` — and the
  loop ends automatically when **every** sender has been dropped and the channel
  is empty.
- `tx` is `Clone`: clone it so several producer threads can send into the same
  channel. The receiver only stops iterating once *all* clones are gone.

Because a value is *moved* into the channel on `send` and *moved* out on `recv`,
only one thread ever owns it at a time. There is no shared mutable state, so there
is nothing to race.
"""

