[[unit]]
id = "udb1-connect-query"
title = "Database: connect & query"
difficulty = 9
level = "intermediate"
intro = """
Databases are how real programs remember things. In this track you drive SQLite directly from Rust with the `rusqlite` crate — no server to run, just a library. You start here by opening a database, creating a table, inserting rows with bound parameters, and reading results back as Rust values. By the end you let SQL count adults for you under hidden tests.
"""

[[unit.step]]
kind = "concept"
id = "cdb1-connect"
title = "Opening a database and running SQL"
points = 5
difficulty = 9
intro = """
A database is just structured storage you talk to in SQL. The `rusqlite` crate gives you a `Connection` — a handle to one SQLite database — and lets you run statements and read rows back as ordinary Rust values. You bind inputs as parameters instead of pasting them into the SQL text, which is both safer and faster.
"""
body = """
## Connecting and querying

A `Connection` is your handle to one SQLite database. The easiest one to open is an in-memory database — perfect for tests, because it vanishes when the program ends:

```rust
use rusqlite::Connection;

let conn = Connection::open_in_memory().unwrap();
```

You create tables and insert rows with `execute`. Never paste values into the SQL string — **bind** them as parameters (`?1`, `?2`, ...) so the database parses the query once and the values can never be mistaken for SQL:

```rust
conn.execute("CREATE TABLE person (name TEXT, age INTEGER)", []).unwrap();
conn.execute("INSERT INTO person VALUES (?1, ?2)", ("Ana", 30)).unwrap();
```

To read one value back, `query_row` runs a query and hands the single row to a closure; to read many, `prepare` a statement and `query_map` over the rows:

```rust
let n: i64 = conn
    .query_row("SELECT COUNT(*) FROM person", [], |r| r.get(0))
    .unwrap();

let mut stmt = conn.prepare("SELECT age FROM person").unwrap();
let ages: Vec<i64> = stmt
    .query_map([], |r| r.get(0)).unwrap()
    .map(|r| r.unwrap())
    .collect();
```

`r.get(0)` reads column 0 of the current row, converting it to the Rust type you asked for. That is the whole loop: open, execute, query, read.
"""

