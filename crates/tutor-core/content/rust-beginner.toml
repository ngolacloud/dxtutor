        todo!("PI * r * r")
    }
}

pub fn total_area(shapes: &[Box<dyn Shape>]) -> f64 {
    todo!("sum each shape's area")
}
"""
tests = """
use student::{total_area, Shape, Rect, Circle};

#[test]
fn sums_rects() {
    let shapes: Vec<Box<dyn Shape>> = vec![
        Box::new(Rect { w: 2.0, h: 3.0 }),
        Box::new(Rect { w: 1.0, h: 1.0 }),
    ];
    assert_eq!(total_area(&shapes), 7.0);
}

#[test]
fn empty_is_zero() {
    let shapes: Vec<Box<dyn Shape>> = Vec::new();
    assert_eq!(total_area(&shapes), 0.0);
}

#[test]
fn circle_area() {
    let shapes: Vec<Box<dyn Shape>> = vec![Box::new(Circle { r: 2.0 })];
    let got = total_area(&shapes);
    assert!((got - 12.566).abs() < 0.01, "got {got}");
}

#[test]
fn mixed() {
    let shapes: Vec<Box<dyn Shape>> = vec![
        Box::new(Rect { w: 2.0, h: 2.0 }),
        Box::new(Circle { r: 1.0 }),
    ];
    let got = total_area(&shapes);
    assert!((got - (4.0 + std::f64::consts::PI)).abs() < 1e-9, "got {got}");
}
"""

[unit.step.gabarito]
time = "O(n)"
space = "O(1)"
solution = """
pub trait Shape {
    fn area(&self) -> f64;
}

pub struct Rect {
    pub w: f64,
    pub h: f64,
}

pub struct Circle {
    pub r: f64,
}

impl Shape for Rect {
    fn area(&self) -> f64 {
        self.w * self.h
    }
}

impl Shape for Circle {
    fn area(&self) -> f64 {
        std::f64::consts::PI * self.r * self.r
    }
}

pub fn total_area(shapes: &[Box<dyn Shape>]) -> f64 {
    shapes.iter().map(|s| s.area()).sum()
}
"""
justification = """
`total_area` visits each of the `n` shapes once, summing as it goes, so time is
**O(n)** and extra space is **O(1)**. Each `s.area()` is a dynamic call resolved
through the shape's vtable — which is exactly what lets one slice hold `Rect`s and
`Circle`s together. A generic would have forced a single element type; `Box<dyn
Shape>` erases it.
"""

[[unit]]
id = "u15-lifetimes"
title = "Lifetimes: how long a reference is valid"
difficulty = 15
level = "advanced"
intro = """
A reference borrows data owned by someone else, and it must never outlive that
data. Lifetimes are the compiler's names for "how long" — usually inferred, but
sometimes you write them (`'a`) to relate the lifetimes of inputs and outputs.
They are purely a compile-time check: no runtime cost, just a guarantee that no
reference ever dangles. By the end you return a borrow of the longest word in a
sentence, with the lifetime tying output to input.
"""

[[unit.step]]
kind = "concept"
id = "c15-lifetimes"
title = "Borrows that never dangle"
points = 5
difficulty = 15
intro = """
A dangling pointer — a reference to freed memory — is a classic source of crashes
and exploits in systems languages. Rust abolishes it at compile time with
lifetimes: every reference carries an invisible tag saying how long the data it
points to lives, and the borrow checker refuses any use that could outlast it.
Most of the time this is inferred; naming lifetimes is how you teach the compiler
about relationships it cannot guess.
"""
body = """
## `'a`: naming how long a borrow lives

Most references need no annotation — the compiler infers lifetimes (**elision**):

```rust
fn first_line(s: &str) -> &str { s.lines().next().unwrap_or("") }
```

When a function takes several references and returns one, you sometimes must say
how they relate. A named lifetime `'a` does that:

```rust
fn longest<'a>(a: &'a str, b: &'a str) -> &'a str {
    if a.len() >= b.len() { a } else { b }
}
```

This reads: "for some lifetime `'a`, both inputs live at least `'a`, and the
result lives no longer than that." The caller cannot keep the result after either
input is gone.

A struct that *holds* a reference must name the lifetime too:

```rust
struct Excerpt<'a> { text: &'a str }
```

Lifetimes are checked entirely at compile time — they vanish from the running
program. They are not about *how long* things live, but about the compiler
proving a reference can never point at data that is already gone.
"""

