    "Returns the first element by value (allowed because `T: Copy`).",
    "Closes `first`.",
    "",
    "`main` opens.",
    "An array of `i32` — here `T` will be `i32`.",
    "An array of `&str` — here `T` will be `&str`.",
    "Calls `first` on the ints; prints `10`.",
    "Calls the SAME `first` on the strings; prints `a`.",
    "Closes `main`.",
]
explanation = """
One definition of `first` served both a slice of `i32` and a slice of `&str`. The
compiler monomorphized it into two specialised copies, so the call sites pay no
runtime cost. That is the deal generics offer: write once, specialise everywhere.
"""

