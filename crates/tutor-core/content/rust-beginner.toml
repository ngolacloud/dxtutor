[unit.step.gabarito]
time = "O(n log n)"
space = "O(n)"
solution = '''
pub fn merge_sort(mut v: Vec<i32>) -> Vec<i32> {
    let n = v.len();
    if n <= 1 {
        return v;
    }
    let mid = n / 2;
    let right = merge_sort(v.split_off(mid));
    let left = merge_sort(v);
    let mut out = Vec::with_capacity(n);
    let (mut i, mut j) = (0, 0);
    while i < left.len() && j < right.len() {
        if left[i] <= right[j] {
            out.push(left[i]);
            i += 1;
        } else {
            out.push(right[j]);
            j += 1;
        }
    }
    out.extend_from_slice(&left[i..]);
    out.extend_from_slice(&right[j..]);
    out
}
'''
justification = """
The recursion halves the input at each level, giving **O(log n)** levels, and each
level merges a total of `n` elements in linear time, so the sort is **O(n log n)**. The
merge allocates a buffer proportional to the slice it combines, so auxiliary space is
**O(n)**. Taking from the left half on ties (`<=`) preserves the original order of
equal elements, so the sort is stable; the base case (length 0 or 1) is already sorted.
"""

