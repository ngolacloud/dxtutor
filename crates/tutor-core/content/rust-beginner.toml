[[unit]]
id = "u13-associated-types"
title = "Associated types: a type the trait names"
difficulty = 13
level = "advanced"
intro = """
Some traits need to name a related type, not just methods. `Iterator` declares
`type Item` — the kind of value it yields — and every implementer pins it down.
Associated types keep signatures clean: you write `fn next(&mut self) ->
Option<Self::Item>` once instead of threading an extra generic everywhere. By the
end you implement `Iterator` for your own type and generate a Fibonacci sequence.
"""

[[unit.step]]
kind = "concept"
id = "c13-assoc-types"
title = "Types that belong to a trait"
points = 5
difficulty = 13
intro = """
A generic parameter lets the *caller* choose a type; an associated type lets the
*implementer* fix one. When each implementing type has exactly one natural choice
— an iterator yields one kind of item — an associated type expresses that better
than a generic, and keeps every downstream signature free of extra parameters.
"""
body = """
## `type Item` inside a trait

A trait can declare an **associated type** — a placeholder the implementer fills
in:

```rust
trait Container {
    type Item;
    fn get(&self, i: usize) -> Self::Item;
}
```

Each `impl` chooses the concrete type:

```rust
impl Container for Bytes {
    type Item = u8;
    fn get(&self, i: usize) -> u8 { self.data[i] }
}
```

The canonical example is the standard library's `Iterator`:

```rust
trait Iterator {
    type Item;
    fn next(&mut self) -> Option<Self::Item>;
}
```

Because `Item` is associated (not a generic parameter), a type is an iterator of
*one* item type, and you refer to it as `Self::Item` without dragging an extra
`<I>` through every function. Implement `next` and you get `map`, `filter`,
`take`, `sum`, `collect` and the rest for free.
"""

