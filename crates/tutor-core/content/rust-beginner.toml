[unit.step.gabarito]
time = "O(n)"
space = "O(n)"
solution = """
use std::thread;

pub fn sum_in_two_threads(data: Vec<i64>) -> i64 {
    let mut data = data;
    let mid = data.len() / 2;
    let right = data.split_off(mid);
    let left = data;
    let h_left = thread::spawn(move || left.iter().sum::<i64>());
    let h_right = thread::spawn(move || right.iter().sum::<i64>());
    h_left.join().unwrap() + h_right.join().unwrap()
}
"""
justification = """
Every element is summed exactly once across the two threads, so the work is
**O(n)**; the two owned halves together hold `n` elements, so space is **O(n)**.
`split_off` behaves for every length — an empty input leaves both halves empty and
the sum is `0`. Correctness is independent of scheduling because the halves are
disjoint: no element is counted twice and no two threads touch the same memory, so
there is no data race.
"""

