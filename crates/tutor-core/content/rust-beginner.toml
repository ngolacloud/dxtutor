# UNIT 5 — Functions
# ═════════════════════════════════════════════════════════════════════════════
[[unit]]
id = "u5-functions"
title = "Functions"
difficulty = 5
level = "basic"
intro = """
Functions are how you name a piece of work and reuse it. You will pass arguments,
return values, and compose small functions into bigger ones. By the end you will
compute the maximum of three numbers under hidden tests.
"""

[[unit.step]]
kind = "concept"
id = "c5-functions"
title = "Named, reusable work"
points = 5
difficulty = 5
intro = """
When `main` calls a function, the computer sets up a small region of memory — a
**stack frame** — for that call: it copies the arguments into the parameters,
runs the body, and the return value flows back to the caller. A function has
typed inputs and a typed output, and in Rust the final expression without a
semicolon is what it hands back.
"""
body = """
## Parameters, return values, composition

```rust
fn double(n: i32) -> i32 {
    n * 2          // tail expression, no semicolon → the return value
}

fn quadruple(n: i32) -> i32 {
    double(double(n)) // functions compose: the output of one feeds the next
}
```

- `(n: i32)` declares a parameter `n` of type `i32`.
- `-> i32` declares the return type.
- The last expression with **no semicolon** is returned; `return` is only needed
  to leave early.

Small, well-named functions are the building blocks of every program — you write
a calculation once and call it wherever you need it.
"""

[[unit.step]]
kind = "drill"
id = "d13-define-call"
title = "Define a function and call it"
points = 10
difficulty = 5
placeholder_policy = "shown"
intro = """
Here you declare your own function and call it from `main`. The argument `21` is
copied into the parameter `n`, the body computes `n * 2`, and that value flows
back to be stored in `result`. The tail expression `n * 2` has no semicolon, so
it is the return value.
"""
prompt = """
Define `double` and call it from `main`.

**Why:** a function names a calculation. `double(21)` copies `21` into `n`,
returns `n * 2`, and you store the answer. The last expression (no semicolon) is
what the function returns.
"""
target = """
fn double(n: i32) -> i32 {
    n * 2
}

fn main() {
    let result = double(21);
    println!("double of 21 is {result}");
}
"""
line_comments = [
    "Declares `double`, taking an `i32` called `n` and returning an `i32`.",
    "The tail expression `n * 2` (no semicolon) is the value returned.",
    "Closes `double`.",
    "",
    "Declares `main` and opens its body.",
    "Calls `double(21)`; `21` is copied into `n`, and the returned `42` is bound to `result`.",
    "Prints `double of 21 is 42`.",
    "Closes `main`.",
]
explanation = """
`main` called `double(21)`, which computed `21 * 2` and returned `42`; you stored
it in `result` and printed it. The blank line between the two functions is just
for readability — Rust ignores it.
"""

[[unit.step]]
kind = "drill"
id = "d14-compose"
title = "Compose two functions"
points = 10
difficulty = 6
placeholder_policy = "shown"
intro = """
Functions compose: the output of one can be the input of another. `min` and `max`
are methods already on `i32`, called with a dot. Here you build `clamp_small` on
top of them, then call it from `main`. This is how larger behaviour is assembled
from small, tested pieces.
"""
prompt = """
Write `clamp_small` that keeps a number within 0..=9, built on the `max` and
`min` methods, then call it.

**Why:** `n.max(0)` is never below 0; `.min(9)` is never above 9. Chaining them
clamps the value — and wrapping that in a named function makes it reusable.
"""
target = """
