[unit.step.gabarito]
time = "O(n_threads * per_thread)"
space = "O(n_threads)"
solution = """
use std::sync::{Arc, Mutex};
use std::thread;

pub fn parallel_counter(n_threads: usize, per_thread: usize) -> i64 {
    let counter = Arc::new(Mutex::new(0i64));
    let mut handles = Vec::new();
    for _ in 0..n_threads {
        let c = Arc::clone(&counter);
        handles.push(thread::spawn(move || {
            for _ in 0..per_thread {
                let mut n = c.lock().unwrap();
                *n += 1;
            }
        }));
    }
    for h in handles {
        h.join().unwrap();
    }
    let total = *counter.lock().unwrap();
    total
}
"""
justification = """
There are exactly `n_threads * per_thread` increments, each done once under the
lock, so the work is **O(n_threads * per_thread)**; the only extra storage is one
join handle per thread, so space is **O(n_threads)**. Correctness is independent of
scheduling: every increment happens inside the mutex's critical section, so no two
overlap and none is lost — the total is always the product, including `0` when
either factor is `0`.
"""

