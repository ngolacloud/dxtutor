[unit.step.gabarito]
time = "O(n)"
space = "O(n)"
solution = """
pub trait Greet {
    fn hello(&self) -> String;
}

pub struct Person {
    pub name: String,
}

impl Greet for Person {
    fn hello(&self) -> String {
        format!("Hello, {}!", self.name)
    }
}

pub fn greeting(name: &str) -> String {
    let person = Person { name: name.to_string() };
    person.hello()
}
"""
justification = """
Building the greeting copies the name once and formats a new string, so both time
and space are linear in the name's length, **O(n)**. The point is the shape, not
the cost: behaviour lives in the `Greet` trait, `Person` implements it, and
`greeting` speaks only through the trait method `hello`.
"""

[[unit]]
id = "u11-generics"
title = "Generics: write it once, for every type"
difficulty = 11
level = "advanced"
intro = """
A generic is code parameterised by a type you fill in later: `Vec<T>` works for
any `T`, and so can your own functions and structs. The compiler stamps out a
specialised copy for each concrete type you use (monomorphization), so generics
cost nothing at runtime. By the end you write one `max_of` that finds the largest
element of a slice of *any* comparable, copyable type.
"""

[[unit.step]]
kind = "concept"
id = "c11-generics"
title = "Type parameters"
points = 5
difficulty = 11
intro = """
Copy-pasting the same function for `i32`, then `f64`, then `String` is how bugs
and boredom breed. Generics let you write the logic once with a *type parameter*
— a stand-in like `T` — and the compiler generates a concrete version for each
type actually used. The abstraction is free: monomorphization means no runtime
tax.
"""
body = """
## Type parameters with `<T>`

A **generic function** names one or more type parameters in angle brackets:

```rust
fn first<T: Copy>(xs: &[T]) -> T {
    xs[0]
}
```

`T` is a placeholder; call `first(&[1, 2, 3])` and `T` becomes `i32`.

A **generic struct** parameterises its fields:

```rust
struct Pair<T> {
    a: T,
    b: T,
}
```

The bound `T: Copy` after the parameter is a **constraint** — it says "whatever
`T` is, it must be copyable", which is what lets the body use the value. (Unit 12
digs into bounds.)

At compile time Rust performs **monomorphization**: for each concrete type you
use, it generates a specialised copy of the code. Generics are therefore as fast
as hand-written type-specific code — zero-cost abstraction.
"""

[[unit.step]]
kind = "drill"
