# UNIT 19 — Shared state
# ═════════════════════════════════════════════════════════════════════════════
[[unit]]
id = "u19-shared-state"
title = "Shared state"
difficulty = 19
level = "advanced"
intro = """
Sometimes threads really must share one piece of mutable state. The safe tool is
`Arc<Mutex<T>>`: an `Arc` shares ownership across threads and a `Mutex` guarantees
only one thread touches the value at a time. This unit builds a counter incremented
by many threads and a vector filled in parallel — always with a correct total.
"""

[[unit.step]]
kind = "concept"
id = "c19-shared-state"
title = "One value, many threads, no races"
points = 5
difficulty = 19
intro = """
When several threads must read and write the *same* value, you need two things at
once: shared ownership so every thread may hold the value, and mutual exclusion so
only one writes at a time. `Arc` and `Mutex` provide exactly those two guarantees.
"""
body = """
## `Arc<Mutex<T>>`: shared, synchronised state

Two separate problems, two tools, combined:

- **`Arc<T>`** — *atomically reference-counted* — lets many threads **share
  ownership** of one value. Clone it (cheaply) and each thread holds a handle; the
  value is freed when the last handle is dropped. `Arc` alone only grants shared
  *read* access.
- **`Mutex<T>`** — *mutual exclusion* — guards a value so only one thread can
  access it at a time. Calling **`lock()`** blocks until the lock is free and
  returns a **guard**; while you hold the guard you have exclusive access, and the
  lock releases automatically when the guard is dropped.

Put them together — `Arc<Mutex<T>>` — to share one mutable value safely:

```rust
use std::sync::{Arc, Mutex};

let counter = Arc::new(Mutex::new(0));
let c = Arc::clone(&counter);        // a handle for another thread
let mut n = c.lock().unwrap();       // exclusive access
*n += 1;                             // safe mutation
```

- `lock()` returns a `Result` (it fails only if another thread panicked while
  holding the lock), so you `unwrap`.
- Keep the critical section — the time you hold the guard — as short as possible;
  the lock serialises threads, so long holds throw away parallelism.

With the mutex in place, the final count is exact no matter how the threads
interleave: every increment happens under the lock, so none is ever lost.
"""

