[unit.step.gabarito]
time = "O(n)"
space = "O(n)"
solution = '''
struct Node {
    val: i32,
    next: Option<Box<Node>>,
}

pub fn reverse_list(items: Vec<i32>) -> Vec<i32> {
    let mut head: Option<Box<Node>> = None;
    for x in items {
        head = Some(Box::new(Node {
            val: x,
            next: head.take(),
        }));
    }
    let mut out = Vec::new();
    let mut cur = head;
    while let Some(node) = cur {
        out.push(node.val);
        cur = node.next;
    }
    out
}
'''
justification = """
Building the list does one `push_front` per item (constant work each), and walking it
visits each node once, so the total time is **O(n)**. The list owns one heap node per
element plus the output vector, giving **O(n)** space. Each push links the new value
ahead of the previous head, so the head-to-tail order is the reverse of the insertion
order — walking from the head collects the input reversed.
"""

[[unit]]
id = "u23-maps-sets"
title = "Maps and Sets"
difficulty = 23
level = "advanced"
intro = """
Hashing gives you two indispensable tools in near-constant time. A `HashMap<K, V>`
associates keys with values — perfect for counting how often each thing appears. A
`HashSet<T>` stores only keys — perfect for dedup and fast membership tests. This
unit counts frequencies, de-duplicates, tests membership, and finishes with two-sum
using a map to find a pair in a single pass.
"""

[[unit.step]]
kind = "concept"
id = "c23-maps-sets"
title = "Key to value, and keys alone"
points = 5
difficulty = 23
intro = """
A map remembers a value for each key; a set remembers only that a key is present.
Both answer *\"have I seen this?\"* in roughly constant time, which turns many
quadratic scans into single passes.
"""
body = """
## `HashMap`: count with the entry API

A `HashMap<K, V>` looks up, inserts, and updates by key in average O(1). The
`entry` API is the clean way to update-or-insert: `entry(k).or_insert(0)` hands you
a mutable reference to the value for `k`, creating it with a default first if
needed:

```rust
use std::collections::HashMap;

let mut counts: HashMap<&str, i32> = HashMap::new();
for w in ["a", "b", "a"] {
    *counts.entry(w).or_insert(0) += 1; // count occurrences
}
assert_eq!(counts["a"], 2);
```

## `HashSet`: membership and dedup

A `HashSet<T>` is a map with no values — it stores unique keys. `insert` returns
`false` if the item was already present, and `contains` tests membership in O(1).
Collecting an iterator into a `HashSet` drops duplicates:

```rust
use std::collections::HashSet;

let set: HashSet<i32> = [3, 1, 2, 3].iter().copied().collect();
assert_eq!(set.len(), 3); // the duplicate 3 is gone
```

- Iteration order of a `HashMap`/`HashSet` is **unspecified** — never print one
  directly if you need stable output. Collect into a `Vec` and `sort` first.
- A hash map lets you trade memory for speed: remember what you have seen so you
  never have to rescan for it.

Counting, de-duplicating, and *\"have I seen the complement?\"* lookups are the three
patterns that carry this unit into the two-sum challenge.
"""

