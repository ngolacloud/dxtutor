# UNIT 9 — Error handling: Option & Result
# ═════════════════════════════════════════════════════════════════════════════
[[unit]]
id = "u9-error-handling"
title = "Error handling: Option & Result"
difficulty = 9
level = "intermediate"
intro = """
Rust has no `null` and no exceptions. Instead, "might be missing" is an `Option`
and "might fail" is a `Result`, both ordinary enums the compiler makes you handle.
By the end you will write safe division that returns `None` instead of crashing,
under hidden tests.
"""

[[unit.step]]
kind = "concept"
id = "c9-option-result"
title = "Absence and failure as values"
points = 5
difficulty = 9
intro = """
Most languages signal "no value" with `null` and "it broke" with exceptions —
both easy to ignore until they crash you at runtime. Rust makes both explicit in
the type system. An `Option<T>` is `Some(value)` or `None`; a `Result<T, E>` is
`Ok(value)` or `Err(error)`. Because they are enums, you cannot use the inner
value without first handling the empty or failing case — the compiler insists.
"""
body = """
## `Option` and `Result`

**`Option<T>`** models a value that may be absent:

```rust
fn first(xs: &[i32]) -> Option<i32> {
    if xs.is_empty() { None } else { Some(xs[0]) }
}
```

**`Result<T, E>`** models an operation that may fail:

```rust
fn parse(s: &str) -> Result<i32, std::num::ParseIntError> {
    s.parse::<i32>() // Ok(n) or Err(..)
}
```

You unwrap them by **handling both cases**, usually with `match`:

```rust
match first(&xs) {
    Some(n) => println!("first is {n}"),
    None => println!("empty"),
}
```

There is no `null` to forget and no exception to swallow — absence and failure are
values you must deal with, which is why Rust programs crash so rarely.

## Shortcut: the `?` operator

Writing a full `match` just to pass a `None`/`Err` upward gets noisy. When your
function itself returns `Option`/`Result`, the **`?`** operator does it for you:
it unwraps the `Some`/`Ok` value, or **returns early** with the `None`/`Err`.

```rust
fn first_doubled(xs: &[i32]) -> Option<i32> {
    let first = xs.first()?; // None here → return None from the whole function
    Some(first * 2)
}
```

`?` only works inside a function whose return type fits (an `Option` in an
`Option`-returning function, a `Result` in a `Result`-returning one). It is pure
sugar for the `match` above — the same behaviour, far less code.
"""

[[unit.step]]
