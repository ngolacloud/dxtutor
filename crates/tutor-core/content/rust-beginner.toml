#[test]
fn empty_is_balanced() {
    assert!(balanced_parens(""));
}

#[test]
fn simple_pairs() {
    assert!(balanced_parens("()[]{}"));
}

#[test]
fn nested_ok() {
    assert!(balanced_parens("([{}])"));
}

#[test]
fn ignores_other_chars() {
    assert!(balanced_parens("a(b[c]d)e"));
}

#[test]
fn wrong_nesting() {
    assert!(!balanced_parens("([)]"));
}

#[test]
fn unclosed() {
    assert!(!balanced_parens("((("));
}

#[test]
fn extra_close() {
    assert!(!balanced_parens("())"));
}
'''

[unit.step.gabarito]
time = "O(n)"
space = "O(n)"
solution = '''
pub fn balanced_parens(s: &str) -> bool {
    let mut stack: Vec<char> = Vec::new();
    for c in s.chars() {
        match c {
            '(' | '[' | '{' => stack.push(c),
            ')' => {
                if stack.pop() != Some('(') {
                    return false;
                }
            }
            ']' => {
                if stack.pop() != Some('[') {
                    return false;
                }
            }
            '}' => {
                if stack.pop() != Some('{') {
                    return false;
                }
            }
            _ => {}
        }
    }
    stack.is_empty()
}
'''
justification = """
Each character is examined once and triggers at most one `push` or `pop`, so the time
is **O(n)** in the length of `s`. The stack holds at most one entry per unmatched
opener, so worst-case space is **O(n)** (a string of all openers). Correctness follows
from the invariant that the stack always holds exactly the still-open brackets in
nesting order: a closer must match the top, and a fully balanced string ends with an
empty stack.
"""

[[unit]]
