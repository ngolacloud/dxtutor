use rusqlite::Connection;

pub fn uses_index_for_lookup() -> bool {
    let conn = Connection::open_in_memory().unwrap();
    conn.execute(
        "CREATE TABLE users (id INTEGER PRIMARY KEY, email TEXT NOT NULL, name TEXT NOT NULL)",
        [],
    )
    .unwrap();
    conn.execute("CREATE INDEX idx_users_email ON users (email)", [])
        .unwrap();
    {
        let mut stmt = conn
            .prepare("INSERT INTO users (id, email, name) VALUES (?1, ?2, ?3)")
            .unwrap();
        for i in 1..=100i64 {
            stmt.execute(rusqlite::params![i, format!("user{}@x.io", i), format!("User {}", i)])
                .unwrap();
        }
    }
    let mut stmt = conn
        .prepare("EXPLAIN QUERY PLAN SELECT name FROM users WHERE email = ?1")
        .unwrap();
    let plan: String = stmt
        .query_map(["user42@x.io"], |r| r.get::<_, String>(3))
        .unwrap()
        .map(|r| r.unwrap())
        .collect::<Vec<_>>()
        .join(" ");
    plan.contains("USING INDEX")
}
"""
justification = """
The function builds a tiny fixed table, adds one index, and inspects a single query plan — a constant amount of work, so time and space are **O(1)**. The value is methodological: rather than trusting that an index helps, it reads SQLite's own `EXPLAIN QUERY PLAN` and confirms the lookup resolves via `USING INDEX` (a targeted search) instead of a full-table `SCAN`, which is how you verify a performance assumption instead of guessing.
"""

