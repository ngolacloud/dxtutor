prompt = """
Share a pool across four threads, each inserting one number into a shared database, then read the total.

**Why:** this is the shape of real concurrent database work — a pool per worker, serialized writes, and a result that does not depend on thread order.
"""
install_commands = ["cargo add rusqlite --features bundled", "cargo add r2d2", "cargo add r2d2_sqlite"]
run_command = "cargo run"
dependencies = ["rusqlite = { version = \"0.31\", features = [\"bundled\"] }", "r2d2 = \"0.8\"", "r2d2_sqlite = \"0.24\""]
target = """
use r2d2_sqlite::SqliteConnectionManager;
use std::thread;

fn main() {
    let path = std::env::temp_dir().join("dxtutor_pool_demo.db");
    let _ = std::fs::remove_file(&path);
    let manager = SqliteConnectionManager::file(&path)
        .with_init(|c| c.execute_batch("PRAGMA busy_timeout=5000;"));
    let pool = r2d2::Pool::builder().max_size(4).build(manager).unwrap();
    pool.get().unwrap().execute("CREATE TABLE n (v INTEGER)", []).unwrap();
    let mut hs = Vec::new();
    for v in [1, 2, 3, 4] {
        let pool = pool.clone();
        hs.push(thread::spawn(move || {
            let c = pool.get().unwrap();
            c.execute("INSERT INTO n (v) VALUES (?1)", [v]).unwrap();
        }));
    }
    for h in hs {
        h.join().unwrap();
    }
    let c = pool.get().unwrap();
    let sum: i64 = c.query_row("SELECT SUM(v) FROM n", [], |r| r.get(0)).unwrap();
    println!("sum = {sum}");
}
"""
