[[unit.step]]
kind = "challenge"
id = "chdb2-transfer"
title = "Atomic transfer"
points = 40
difficulty = 11
entry = "transfer"
dependencies = ["rusqlite = { version = \"0.31\", features = [\"bundled\"] }"]
intro = """
You prove atomicity with money. Two accounts start with balances `a0` and `b0`. In a single transaction, move `amount` from A to B. If that would push *either* balance below zero, roll the whole transaction back and return the original balances unchanged. Otherwise commit and return the new balances.
"""
instructions = """
## Your turn

Implement `transfer`:

```rust
pub fn transfer(a0: i64, b0: i64, amount: i64) -> (i64, i64) { ... }
```

Seed two accounts, open one transaction, debit A and credit B, then check: if either balance is now negative, `rollback` and return `(a0, b0)`; otherwise `commit` and return the new `(a, b)`.

Examples:

- `transfer(100, 0, 30)` → `(70, 30)` (commits)
- `transfer(50, 0, 80)` → `(50, 0)` (A would go negative → rolls back)
- `transfer(100, 0, -10)` → `(100, 0)` (B would go negative → rolls back)
- `transfer(100, 0, 100)` → `(0, 100)` (exact, still valid)

**Hint:** open the database as `mut`, do both `UPDATE`s inside `conn.transaction()`, read the two balances, then `rollback` or `commit` based on the sign.

Hidden tests decide correctness.
"""
starter = """
use rusqlite::Connection;

pub fn transfer(a0: i64, b0: i64, amount: i64) -> (i64, i64) {
    todo!("move amount A->B in one transaction; rollback to the originals if either would go negative")
}
"""
tests = """
use student::transfer;

#[test]
fn normal_transfer_commits() {
    assert_eq!(transfer(100, 0, 30), (70, 30));
}

#[test]
fn overdraw_rolls_back() {
    assert_eq!(transfer(50, 0, 80), (50, 0));
}

#[test]
fn exact_drain_ok() {
    assert_eq!(transfer(100, 0, 100), (0, 100));
}

#[test]
fn negative_amount_would_underflow_b_rolls_back() {
    assert_eq!(transfer(100, 0, -10), (100, 0));
}

#[test]
fn zero_amount_no_change() {
    assert_eq!(transfer(100, 50, 0), (100, 50));
}
"""

[unit.step.gabarito]
time = "O(1)"
space = "O(1)"
solution = """
use rusqlite::Connection;

pub fn transfer(a0: i64, b0: i64, amount: i64) -> (i64, i64) {
    let mut conn = Connection::open_in_memory().unwrap();
    conn.execute(
        "CREATE TABLE accounts (id INTEGER PRIMARY KEY, balance INTEGER NOT NULL)",
        [],
    )
    .unwrap();
    conn.execute("INSERT INTO accounts (id, balance) VALUES (1, ?1)", [a0])
        .unwrap();
    conn.execute("INSERT INTO accounts (id, balance) VALUES (2, ?1)", [b0])
        .unwrap();

    let tx = conn.transaction().unwrap();
    tx.execute("UPDATE accounts SET balance = balance - ?1 WHERE id = 1", [amount])
        .unwrap();
    tx.execute("UPDATE accounts SET balance = balance + ?1 WHERE id = 2", [amount])
        .unwrap();
    let a: i64 = tx
        .query_row("SELECT balance FROM accounts WHERE id = 1", [], |r| r.get(0))
        .unwrap();
    let b: i64 = tx
        .query_row("SELECT balance FROM accounts WHERE id = 2", [], |r| r.get(0))
        .unwrap();
    if a < 0 || b < 0 {
        tx.rollback().unwrap();
    } else {
        tx.commit().unwrap();
    }

    let fa: i64 = conn
        .query_row("SELECT balance FROM accounts WHERE id = 1", [], |r| r.get(0))
        .unwrap();
    let fb: i64 = conn
        .query_row("SELECT balance FROM accounts WHERE id = 2", [], |r| r.get(0))
        .unwrap();
    (fa, fb)
}
"""
justification = """
The work is a fixed handful of statements regardless of the numbers — two updates, two reads, and one commit-or-rollback — so time and space are both **O(1)**. The transaction is what makes the result trustworthy: debit and credit either both land or both vanish, so the two accounts can never be seen in a half-moved state, and a would-be-negative balance leaves the books exactly as they started.
"""

[[unit]]
id = "udb3-wal-pool"
title = "Database: WAL & connection pools"
difficulty = 9
level = "intermediate"
intro = """
Real services hit one database from many threads at once. This unit shows the two tools that make that safe and fast: WAL mode, which lets readers run while a writer writes, and a connection pool (`r2d2` + `r2d2_sqlite`) that lends each thread its own connection. You finish by making several threads cooperate on a shared database and produce the same total every time, under hidden tests.
"""

[[unit.step]]
kind = "concept"
id = "cdb3-pool"
title = "Concurrency: WAL and connection pools"
points = 5
difficulty = 9
intro = """
When several threads touch one database, two things help. WAL mode (write-ahead logging) lets readers keep reading while a writer writes, instead of everyone blocking. A connection pool hands each thread its own connection from a managed set, so you neither open a new one every time nor share one unsafely. Writes still serialize — SQLite allows one writer at a time — but the result stays correct and, when the work is commutative, deterministic.
"""
body = """
## WAL mode

By default SQLite blocks readers during a write. **WAL** (write-ahead logging) lets readers continue against the last committed state while one writer appends — far better under concurrency. You turn it on with a pragma (it needs a real file, not an in-memory database):

```rust
let mode: String = conn
    .query_row("PRAGMA journal_mode=WAL", [], |r| r.get(0))
    .unwrap();
assert_eq!(mode, "wal");
```

## Connection pools

Opening a connection per task is wasteful; sharing one across threads is unsafe. A **pool** keeps a set of ready connections and lends one out on demand. The `r2d2` crate plus `r2d2_sqlite` give you exactly that:

```rust
use r2d2_sqlite::SqliteConnectionManager;

let manager = SqliteConnectionManager::file("app.db")
    .with_init(|c| c.execute_batch("PRAGMA journal_mode=WAL; PRAGMA busy_timeout=5000;"));
let pool = r2d2::Pool::builder().max_size(8).build(manager).unwrap();

let conn = pool.get().unwrap(); // checked out; returns to the pool when dropped
```

`with_init` runs on every new connection — a good place to set WAL and a **busy_timeout** so a thread that meets a locked database waits a moment and retries instead of failing. Writes still happen one at a time, so if each thread adds to a shared total the final sum is the same no matter who went first — concurrent, yet deterministic.
"""

