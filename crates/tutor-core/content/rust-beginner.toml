element to be `Debug` so it can print it with `{:?}`. Try to use `T` without the
bound and the compiler stops you — that is bounds doing their job.
"""
prompt = """
Write `show_all<T: Debug>` that prints each element of a slice.

**Why:** the body can only use a capability it has asked for. `T: Debug` unlocks
