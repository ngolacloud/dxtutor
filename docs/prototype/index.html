<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>dxtutor IDE — protótipo navegável</title></head><body>
<style>
  :root{
    --bg-base:#0f0f11; --bg-editor:#161618; --bg-elevated:#1b1b1e; --bg-side:#19191b;
    --bg-activity:#141416; --bg-title:#141416; --bg-status:#141416; --bg-panel:#161618;
    --bg-tab-inactive:#19191b; --bg-input:#202023; --bg-hover:#242428;
    --bg-sel:#2a2a30; --bg-sel-inactive:#26262a; --bg-menu:#1d1d20;
    --border:#2a2a2e; --border-strong:#37373c; --seam:#202023; --guide:#2f2f34;
    --fg:#e8e8ea; --fg-dim:#8a8a90; --fg-muted:#6e6e75; --fg-bright:#fff;
    --accent:#e06c3b; --accent-hover:#f08a4b; --accent-grad:linear-gradient(135deg,#e06c3b,#f08a4b);
    --accent-soft:rgba(224,108,59,.12); --blue:#4a9eff;
    --green:#5cc9a7; --git-u:#73c991; --git-m:#d7a860; --git-d:#f1707a;
    --red:#f1707a; --yellow:#e0b64a; --cyan:#5fcad6; --purple:#c678dd;
    --folder:#8a8f9c;
    --font-ui:"Inter",-apple-system,"Segoe UI",system-ui,Roboto,sans-serif;
    --font-mono:"Cascadia Code","JetBrains Mono","Fira Code","SF Mono",Menlo,Consolas,monospace;
    --sh-card:0 1px 2px rgba(0,0,0,.45),0 8px 28px rgba(0,0,0,.35);
    --sh-acc:0 4px 14px rgba(224,108,59,.3);
    --sh-pop:0 10px 34px rgba(0,0,0,.55);
    --side-w:250px; --agent-w:380px; --panel-h:230px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:var(--font-ui);font-size:13px;color:var(--fg);background:var(--bg-base);-webkit-font-smoothing:antialiased;user-select:none}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-thumb{background:rgba(130,130,140,.3);border:3px solid transparent;background-clip:padding-box;border-radius:6px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(150,150,160,.45);background-clip:padding-box}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  svg.ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
  svg.ico.fill{fill:currentColor;stroke:none}

  .app{height:100vh;display:grid;grid-template-rows:34px 1fr 24px}

  /* ── Menu bar ── */
  .titlebar{display:flex;align-items:center;background:var(--bg-title);border-bottom:1px solid var(--seam);padding:0 8px;position:relative;z-index:60}
  .tb-brand{width:30px;display:grid;place-items:center;color:var(--accent-hover)}
  .menubar{display:flex}
  .menu-top{padding:4px 9px;border-radius:6px;color:var(--fg-dim);font-size:12.5px}
  .menu-top:hover,.menu-top.open{background:var(--bg-hover);color:var(--fg)}
  .tb-title{position:absolute;left:0;right:0;text-align:center;color:var(--fg-muted);font-size:12px;pointer-events:none}
  .tb-right{margin-left:auto;display:flex;align-items:center;gap:3px;z-index:2}
  .tb-ic{width:30px;height:24px;display:grid;place-items:center;color:var(--fg-muted);border-radius:6px}
  .tb-ic:hover{background:var(--bg-hover);color:var(--fg)}
  .tb-ic.on{color:var(--accent-hover)}
  .update-btn{display:flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent-hover);border:1px solid rgba(224,108,59,.35);border-radius:7px;padding:3px 10px;font-size:11.5px;font-weight:500}
  .update-btn:hover{background:rgba(224,108,59,.2)}
  .win-dot{width:11px;height:11px;border-radius:50%;margin-left:3px}
  .win-dot.r{background:#f1707a}.win-dot.y{background:#e0b64a}.win-dot.g{background:#5fcf8e}

  .menu-pop{position:fixed;min-width:240px;background:var(--bg-menu);border:1px solid var(--border-strong);border-radius:9px;box-shadow:var(--sh-pop);padding:5px;z-index:200;display:none}
  .menu-pop.show{display:block}
  .mi{display:flex;align-items:center;gap:10px;padding:5px 9px;border-radius:6px;font-size:12.5px;color:var(--fg);white-space:nowrap}
  .mi:hover{background:var(--accent);color:#fff}
  .mi .key{margin-left:auto;color:var(--fg-muted);font-size:11px;font-family:var(--font-mono)}
  .mi:hover .key{color:rgba(255,255,255,.75)}
  .mi .chev{margin-left:auto;color:var(--fg-muted);font-size:10px}.mi:hover .chev{color:#fff}
  .mi.has-key .chev{margin-left:8px}
  .mi-sep{height:1px;background:var(--border);margin:5px 7px}
  .mi-check{width:13px;text-align:center;color:var(--accent-hover);font-size:11px}

  /* ── Middle grid ── */
  .mid{display:grid;grid-template-columns:48px var(--side-w) 1fr var(--agent-w);min-height:0;position:relative}

  /* Activity bar */
  .activity{background:var(--bg-activity);border-right:1px solid var(--seam);display:flex;flex-direction:column;align-items:center;padding:4px 0;overflow:hidden}
  .act{position:relative;width:48px;height:42px;display:grid;place-items:center;color:var(--fg-muted)}
  .act svg.ico{width:22px;height:22px;stroke-width:1.05}
  .act:hover{color:var(--fg)}
  .act.on{color:var(--fg-bright)}
  .act.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2.5px;border-radius:0 3px 3px 0;background:var(--accent-grad)}
  .act .badge{position:absolute;right:5px;top:5px;min-width:16px;height:15px;padding:0 3px;border-radius:8px;background:var(--blue);color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;font-family:var(--font-mono)}
  .act .badge.acc{background:var(--accent-grad)}
  .act.spacer{margin-top:auto}

  /* Sidebar */
  .side{background:var(--bg-side);border-right:1px solid var(--seam);display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .pane{display:none;flex-direction:column;min-height:0;flex:1}.pane.show{display:flex}
  .side-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 7px 16px;flex:none}
  .side-hd .t{font-size:11px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--fg-dim)}
  .side-hd .acts{display:flex;gap:1px}
  .side-hd .acts button,.sec-hd .acts button{width:22px;height:22px;display:grid;place-items:center;color:var(--fg-muted);border-radius:5px}
  .side-hd .acts button:hover,.sec-hd .acts button:hover{background:var(--bg-hover);color:var(--fg)}
  .side-hd .acts svg.ico{width:15px;height:15px}

  /* collapsible sections */
  .sections{flex:1;overflow:auto;display:flex;flex-direction:column}
  .section{display:flex;flex-direction:column;min-height:0}
  .section.flexible{flex:1}
  .sec-hd{display:flex;align-items:center;gap:4px;height:24px;padding:0 10px 0 6px;flex:none;cursor:pointer}
  .sec-hd:hover{color:var(--fg)}
  .sec-hd .chev{width:16px;height:16px;display:grid;place-items:center;color:var(--fg-dim);transition:transform .12s}
  .sec-hd.open .chev{transform:rotate(90deg)}
  .sec-hd .lbl{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--fg-dim)}
  .sec-hd .acts{margin-left:auto;display:none;gap:1px}
  .sec-hd:hover .acts{display:flex}
  .sec-body{display:none;overflow:auto;padding-bottom:6px}.sec-body.show{display:block}
  .section.flexible .sec-body.show{flex:1}
  .sec-empty{color:var(--fg-muted);font-size:12.5px;padding:8px 16px;line-height:1.5}

  /* tree */
  .tree{padding:2px 0 6px}
  .row{display:flex;align-items:center;gap:6px;height:22px;padding-right:10px;color:var(--fg);font-size:13px;white-space:nowrap;position:relative}
  .row:hover{background:var(--bg-hover)}
  .row.sel{background:var(--bg-sel)}
  .row.sel::before{content:"";position:absolute;inset:0;box-shadow:inset 1px 0 0 var(--accent)}
  .row .chev{width:16px;height:16px;flex:none;display:grid;place-items:center;color:var(--fg-dim);transition:transform .12s}
  .row.open>.chev{transform:rotate(90deg)}
  .row .chev.leaf{opacity:0}
  .row .ic{flex:none;display:grid;place-items:center}
  .row .ic.folder{color:var(--folder)} .row .ic.rs{color:#dea584} .row .ic.file{color:var(--fg-dim)}
  .row .ic.css{color:var(--blue)} .row .ic.json{color:var(--yellow)} .row .ic.toml{color:var(--git-m)} .row .ic.md{color:var(--blue)}
  .row .nm{overflow:hidden;text-overflow:ellipsis;flex:1}
  .row.git-m>.nm{color:var(--git-m)} .row.git-u>.nm{color:var(--git-u)} .row.git-d>.nm{color:var(--git-d)}
  .row .deco{margin-left:auto;font-family:var(--font-mono);font-weight:700;font-size:11px;padding-left:6px}
  .row.git-m .deco{color:var(--git-m)} .row.git-u .deco{color:var(--git-u)} .row.git-d .deco{color:var(--git-d)}
  .row .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;flex:none}
  .row.git-m .dot{background:var(--git-m)} .row.git-u .dot{background:var(--git-u)}
  .children{position:relative}
  .children>.children::before,.tree .children .children-wrap{}
  .guide{position:absolute;top:0;bottom:0;width:1px;background:var(--guide)}

  /* search / scm panes */
  .field{margin:8px 10px;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;padding:6px 9px;color:var(--fg-muted);font-size:12.5px;display:flex;align-items:center;gap:7px}
  .field.focus{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
  .btn-blue{display:block;width:calc(100% - 20px);margin:8px 10px;background:var(--blue);color:#fff;border-radius:6px;padding:7px;font-size:12.5px;font-weight:500;text-align:center}
  .btn-blue:hover{filter:brightness(1.08)}
  .scm-grp{display:flex;align-items:center;gap:7px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--fg-dim);padding:8px 12px 4px;font-weight:600}
  .scm-grp .cnt{margin-left:auto;background:var(--bg-sel-inactive);border-radius:9px;padding:0 7px;font-family:var(--font-mono);font-size:10px}
  .scm-row{display:flex;align-items:center;gap:8px;height:23px;padding:0 12px;font-size:12.5px;color:var(--fg)}
  .scm-row:hover{background:var(--bg-hover)}
  .scm-row .pth{color:var(--fg-muted);font-size:11px;overflow:hidden;text-overflow:ellipsis}
  .scm-row.del .nm{text-decoration:line-through;color:var(--fg-muted)}
  .scm-row .g{margin-left:auto;font-family:var(--font-mono);font-weight:700;flex:none}
  .scm-row .g.M{color:var(--git-m)} .scm-row .g.U{color:var(--git-u)} .scm-row .g.D{color:var(--git-d)}

  /* Editor */
  .edit{display:grid;grid-template-rows:36px 24px 1fr var(--panel-h);min-width:0;background:var(--bg-editor)}
  .tabs{display:flex;background:var(--bg-tab-inactive);border-bottom:1px solid var(--seam);overflow-x:auto}
  .tabs::-webkit-scrollbar{height:0}
  .tab{display:flex;align-items:center;gap:7px;padding:0 11px;height:36px;font-size:12.5px;color:var(--fg-muted);border-right:1px solid var(--seam);flex:none;max-width:220px}
  .tab:hover{color:var(--fg)} .tab.active{background:var(--bg-editor);color:var(--fg);position:relative}
  .tab.active::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--accent-grad)}
  .tab .ic.rs{color:#dea584}.tab .ic.css{color:var(--blue)}.tab .ic.chat{color:var(--accent-hover)}
  .tab .x{width:17px;height:17px;display:grid;place-items:center;border-radius:5px;color:var(--fg-muted);margin-left:1px}
  .tab .x:hover{background:var(--bg-hover);color:var(--fg)}
  .tab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .breadcrumbs{display:flex;align-items:center;gap:5px;padding:0 14px;font-size:11.5px;color:var(--fg-muted);border-bottom:1px solid var(--seam);background:var(--bg-editor)}
  .breadcrumbs .sep{opacity:.5}
  .breadcrumbs .crumb:hover{color:var(--fg)}
  .ebody{overflow:hidden;position:relative}
  .doc{display:none;min-height:100%}.doc.show{display:block}
  .code{font-family:var(--font-mono);font-size:13px;line-height:1.7;padding:14px 0}
  .cl{display:flex}
  .cl .ln{width:46px;flex:none;text-align:right;padding-right:16px;color:var(--fg-muted);opacity:.5;user-select:none}
  .cl .tx{white-space:pre}
  .kw{color:var(--purple)}.fn{color:var(--blue)}.str{color:var(--git-u)}.ty{color:var(--cyan)}
  .cm{color:var(--fg-muted);font-style:italic}.mac{color:var(--accent-hover)}.num{color:var(--accent-hover)}
  .err{background:rgba(241,112,122,.08);box-shadow:inset 2px 0 0 var(--red)}
  .ct-dot{width:9px;height:9px;border:1.3px solid var(--red);border-radius:2px;flex:none}
  /* minimap */
  .minimap{position:absolute;top:0;right:0;bottom:0;width:66px;background:rgba(0,0,0,.14);border-left:1px solid var(--seam);padding:8px 7px;display:flex;flex-direction:column;gap:2px;pointer-events:none}
  .mm-line{height:2px;border-radius:1px;background:var(--fg-muted);opacity:.45}
  .mm-line.err{background:var(--red);opacity:.8}
  .mm-view{position:absolute;left:0;right:0;top:8px;height:64px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06)}
  .ebody-scroll{position:absolute;inset:0;overflow:auto}
  .ebody-scroll.with-mm{right:66px}
  .minimap.hidden{display:none}

  /* bottom panel */
  .panel{border-top:1px solid var(--border);background:var(--bg-panel);display:flex;flex-direction:column;min-height:0}
  .panel-tabs{display:flex;align-items:center;padding:0 8px;border-bottom:1px solid var(--seam);height:34px;flex:none}
  .ptab{padding:0 11px;height:34px;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fg-dim);text-transform:uppercase;letter-spacing:.4px;position:relative}
  .ptab:hover{color:var(--fg)} .ptab.on{color:var(--fg)}
  .ptab.on::after{content:"";position:absolute;left:11px;right:11px;bottom:0;height:2px;background:var(--accent-grad)}
  .ptab .pb{background:var(--bg-sel-inactive);color:var(--fg-dim);border-radius:9px;font-size:10px;padding:0 6px;font-family:var(--font-mono);text-transform:none}
  .ptab.on .pb{background:var(--accent-soft);color:var(--accent-hover)}
  .panel-tools{margin-left:auto;display:flex;gap:1px}
  .panel-tools button{width:26px;height:26px;display:grid;place-items:center;color:var(--fg-muted);border-radius:5px}
  .panel-tools button:hover{background:var(--bg-hover);color:var(--fg)}
  .panel-tools svg.ico{width:15px;height:15px}
  .panel-body{flex:1;min-height:0;overflow:hidden;position:relative}
  .pcontent{display:none;position:absolute;inset:0;overflow:auto}.pcontent.show{display:block}
  #term{font-family:var(--font-mono);font-size:12.5px;line-height:1.5;padding:8px 12px;color:#d6d6d9;cursor:text;user-select:text}
  #term .line{white-space:pre-wrap;word-break:break-word}
  #term .pr{color:var(--git-u)} #term .pr .at{color:var(--fg-muted)} #term .pr .pth{color:var(--blue)} #term .pr .br{color:var(--accent-hover)}
  #term .cmd{color:var(--fg-bright)}
  #term .dim{color:var(--fg-muted)}#term .ok{color:var(--green)}#term .warn{color:var(--yellow)}#term .er{color:var(--red)}#term .ac{color:var(--accent-hover)}#term .dir{color:var(--blue);font-weight:600}
  #term .inputline{display:flex}
  #term #cmd{flex:1;background:none;border:none;outline:none;color:var(--fg-bright);font:inherit;caret-color:var(--accent-hover)}
  .prob{display:flex;align-items:flex-start;gap:9px;padding:6px 14px;font-size:12.5px;border-bottom:1px solid var(--seam)}
  .prob .pi{flex:none;margin-top:1px}.prob .pi.e{color:var(--red)}.prob .pi.w{color:var(--yellow)}
  .prob .ploc{color:var(--fg-muted);font-family:var(--font-mono);font-size:11px}

  /* Agent dock */
  .agent{background:var(--bg-elevated);border-left:1px solid var(--seam);display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .ag-hd{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--border)}
  .ag-mark{width:21px;height:21px;display:grid;place-items:center;background:var(--accent-grad);border-radius:7px;color:#fff;box-shadow:var(--sh-acc)}
  .ag-mark svg.ico{width:13px;height:13px}
  .ag-name{font-weight:600}
  .ag-model{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--fg-dim);background:var(--bg-input);border:1px solid var(--border);border-radius:13px;padding:3px 9px}
  .ag-model .live{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 7px var(--green)}
  .ag-ic{color:var(--fg-muted);padding:0 2px}.ag-ic:hover{color:var(--fg)}
  .ag-msgs{flex:1;overflow:auto;padding:14px 13px;display:flex;flex-direction:column;gap:16px}
  .m{display:flex;flex-direction:column}.m.user{align-items:flex-end}
  .bub{border-radius:13px;box-shadow:var(--sh-card);max-width:92%}
  .m.user .bub{background:var(--accent-soft);border:1px solid rgba(224,108,59,.28);max-width:84%}
  .m.ai .bub{background:var(--bg-editor);border:1px solid var(--border)}
  .bh{display:flex;align-items:center;gap:7px;padding:8px 13px 0}
  .br2{font-family:var(--font-mono);font-size:10px;letter-spacing:.9px;text-transform:uppercase;font-weight:600}
  .m.ai .br2{color:var(--accent-hover)}.m.user .br2{color:var(--fg-dim)}
  .bt{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--fg-muted)}
  .bd{padding:6px 13px 11px;line-height:1.6;font-size:13px}
  .bd code{font-family:var(--font-mono);font-size:12px;background:var(--bg-base);border:1px solid var(--border);border-radius:5px;padding:1px 5px;color:var(--accent-hover)}
  .plan{margin:2px 13px 11px;border:1px solid var(--border);border-radius:10px;background:var(--bg-editor);padding:11px 12px}
  .plan-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
  .plan-t{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--fg-dim);font-weight:600}
  .plan-c{font-family:var(--font-mono);font-size:11px;color:var(--accent-hover)}
  .bar{height:5px;border-radius:3px;background:var(--bg-input);overflow:hidden;margin-bottom:9px}
  .bar>span{display:block;height:100%;width:57%;background:var(--accent-grad)}
  .stp{display:grid;grid-template-columns:15px 1fr auto;gap:9px;font-family:var(--font-mono);font-size:11.5px;padding:1.5px 0;font-variant-numeric:tabular-nums}
  .stp .d{color:var(--fg-muted);font-size:10.5px}
  .stp.done .g{color:var(--green)}.stp.done .l{color:var(--fg-dim)}
  .stp.run .g{color:var(--accent-hover)}.stp.run .l{color:var(--fg-bright);font-weight:600}
  .stp.todo{color:var(--fg-muted)}
  .budget{margin:0 13px;display:flex;align-items:center;gap:8px;background:var(--bg-input);border:1px solid var(--border);border-radius:9px;padding:7px 11px;font-size:11.5px;color:var(--fg-dim)}
  .budget .dotb{width:7px;height:7px;border-radius:50%;background:var(--accent-hover);flex:none}
  .budget .vu{margin-left:auto;color:var(--accent-hover);white-space:nowrap}.budget .vu:hover{text-decoration:underline}
  .budget .clo{color:var(--fg-muted)}
  .ag-compose{padding:11px 13px 13px}
  .composer{background:var(--bg-input);border:1px solid var(--border);border-radius:13px;padding:9px 11px;transition:.12s}
  .composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .composer input{width:100%;background:none;border:none;outline:none;color:var(--fg);font:inherit;font-size:13px}
  .composer input::placeholder{color:var(--fg-muted)}
  .comp-bar{display:flex;align-items:center;gap:8px;margin-top:8px}
  .pill{background:var(--bg-elevated);color:var(--fg-dim);border:1px solid var(--border);border-radius:14px;padding:3px 10px;font-size:11px;font-family:var(--font-mono);display:flex;gap:5px;align-items:center}
  .send{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--accent-grad);display:grid;place-items:center;color:#fff;box-shadow:var(--sh-acc)}
  .send:hover{filter:brightness(1.1)}
  /* Assistant centrado (aba) */
  .agent-center{max-width:780px;margin:0 auto;display:flex;flex-direction:column;height:100%}
  .ac-head{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--border);flex:none}
  .ac-dock{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--fg-dim);border:1px solid var(--border);border-radius:7px;padding:4px 10px;font-size:12px}
  .ac-dock:hover{color:var(--fg);border-color:var(--accent)}.ac-dock svg.ico{width:14px;height:14px}
  .ac-body{flex:1;min-height:0;display:flex}
  #agent-slot{flex:1;min-height:0;display:flex;flex-direction:column}
  /* barra de controlo do agente em execução */
  .spin{display:inline-block;width:9px;height:9px;border:1.6px solid var(--border-strong);border-top-color:var(--accent-hover);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
  .run-ctl{margin:0 13px 10px;border:1px solid var(--border);border-radius:10px;background:var(--bg-editor);padding:9px 11px}
  .run-ctl.hidden{display:none}
  .rc-top{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11.5px;color:var(--fg-dim);margin-bottom:8px}
  .rc-top .rc-lbl{color:var(--fg)}.rc-top .rc-el{margin-left:auto;color:var(--accent-hover)}
  .rc-cmds{display:flex;flex-wrap:wrap;gap:6px}
  .rc{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--fg-dim);background:var(--bg-input);border:1px solid var(--border);border-radius:6px;padding:3px 8px}
  .rc:hover{color:var(--fg);border-color:var(--accent)}
  .rc kbd{font-family:var(--font-mono);background:var(--bg-base);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--accent-hover);font-size:10.5px}

  /* Status bar */
  .status{display:flex;align-items:center;background:var(--bg-status);border-top:1px solid var(--seam);font-size:11.5px;color:var(--fg-dim);position:relative;font-family:var(--font-mono)}
  .status::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(224,108,59,.45),transparent)}
  .si{display:flex;align-items:center;gap:5px;padding:0 9px;height:100%}
  .si svg.ico{width:13px;height:13px}
  .si:hover{background:var(--bg-hover);color:var(--fg)}
  .si.brand{background:var(--accent-grad);color:#fff;font-weight:600}
  .si.remote{background:var(--blue);color:#fff;padding:0 8px}.si.remote:hover{filter:brightness(1.1);background:var(--blue)}
  .si.ag-set svg.ico{color:var(--accent-hover)}
  .si.ok{color:var(--git-u)} .spacer{flex:1}
  /* tmux strip */
  .tmux{display:flex;align-items:center;height:20px;flex:none;background:#2fae63;color:#0a2a16;font-family:var(--font-mono);font-size:11.5px;font-weight:600;padding:0 10px}
  .tmux .win{background:rgba(0,0,0,.18);padding:0 7px;border-radius:2px}
  .tmux .sp{flex:1}
  .tmux .host{opacity:.85}

  .rsz{position:absolute;top:0;bottom:0;width:5px;cursor:col-resize;z-index:30}
  .rsz:hover,.rsz.drag{background:var(--accent-soft)}
  #rsz-side{left:calc(48px + var(--side-w) - 2px)}
  #rsz-agent{right:calc(var(--agent-w) - 2px)}
  .hidden{display:none!important}
  /* ═════════ v2 ═════════ */
  kbd{font-family:var(--font-mono);background:var(--bg-base);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--fg-dim);font-size:10.5px}
  input,textarea,select{font:inherit;color:var(--fg)}
  .cmd-center{position:absolute;left:50%;transform:translateX(-50%);width:min(400px,30vw);height:24px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--bg-input);border:1px solid var(--border);border-radius:7px;color:var(--fg-muted);font-size:12px;white-space:nowrap;overflow:hidden}
  .cmd-center:hover{border-color:var(--border-strong);color:var(--fg)}
  .cmd-center svg.ico{width:13px;height:13px}
  @media(max-width:1180px){.cmd-center{display:none}}
  #term{color:var(--fg)}
  .act .badge{pointer-events:none}
  .x-rs{color:#dea584}.x-ts{color:var(--blue)}.x-css{color:var(--purple)}.x-json,.x-toml{color:var(--yellow)}.x-md{color:var(--cyan)}.x-sql{color:var(--green)}.x-html{color:var(--accent-hover)}
  .tab .ic{display:grid;place-items:center;flex:none}.tab .ic.acc{color:var(--accent-hover)}
  .row{cursor:pointer}.tab,.scm-row,.prob,.sec-hd{cursor:pointer}

  /* inputs de painel */
  .inp{display:block;width:calc(100% - 20px);margin:6px 10px;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;padding:6px 9px;font-size:12.5px;outline:none;user-select:text}
  .inp:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .inp::placeholder{color:var(--fg-muted)}
  .btn{display:block;width:calc(100% - 20px);margin:6px 10px;background:var(--accent-grad);color:#fff;border-radius:6px;padding:7px;font-size:12.5px;font-weight:600;text-align:center}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:var(--bg-input);border:1px solid var(--border);color:var(--fg);font-weight:500}
  .btn.ghost:hover{border-color:var(--accent)}
  .scm-row{position:relative}
  .scm-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none;max-width:60%}
  .scm-row .ra{display:none;margin-left:auto;gap:2px}
  .scm-row:hover .ra{display:flex}.scm-row:hover .ra+.g{margin-left:4px}
  .scm-row .ra button{width:20px;height:20px;border-radius:4px;color:var(--fg-dim);display:grid;place-items:center;font-size:13px}
  .scm-row .ra button:hover{background:var(--bg-sel);color:var(--fg)}
  .s-hit{display:flex;gap:8px;padding:1px 10px 1px 30px;font-family:var(--font-mono);font-size:11.5px;color:var(--fg-dim);white-space:nowrap;overflow:hidden;cursor:pointer;height:20px;align-items:center}
  .s-hit:hover{background:var(--bg-hover);color:var(--fg)}
  .s-hit .n{color:var(--fg-muted);flex:none;width:22px;text-align:right}
  .s-hit mark{background:var(--accent-soft);color:var(--accent-hover);border-radius:2px}
  .kv{display:flex;align-items:center;gap:8px;padding:4px 12px;font-size:12.5px}
  .kv .v{margin-left:auto;color:var(--fg-muted);font-family:var(--font-mono);font-size:11px}
  .pdot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
  .pdot.off{background:var(--fg-muted)!important;opacity:.5}
  .tag{font-family:var(--font-mono);font-size:10px;border:1px solid var(--border-strong);border-radius:9px;padding:0 7px;color:var(--fg-dim);white-space:nowrap}
  .tag.live{color:var(--green);border-color:var(--green)}.tag.acc{color:var(--accent-hover);border-color:var(--accent)}
  .tag.bad{color:var(--red);border-color:var(--red)}.tag.warn{color:var(--yellow);border-color:var(--yellow)}
  .sw{width:28px;height:16px;border-radius:9px;background:var(--bg-sel);position:relative;flex:none;border:1px solid var(--border-strong)}
  .sw::after{content:"";position:absolute;top:1px;left:1px;width:12px;height:12px;border-radius:50%;background:var(--fg-muted);transition:.12s}
  .sw.on{background:var(--accent)}.sw.on::after{left:13px;background:#fff}

  /* editor editável */
  .ed{display:flex;font-family:var(--font-mono);font-size:13px;line-height:22px;padding-top:12px;min-height:100%;tab-size:4}
  .ed-gut{width:52px;flex:none;text-align:right;padding-right:16px;color:var(--fg-muted);user-select:none}
  .ed-gut div{height:22px;opacity:.55}.ed-gut .g-e{color:var(--red);opacity:1}.ed-gut .g-w{color:var(--yellow);opacity:1}
  .ed-wrap{position:relative;flex:1;min-width:max-content}
  .ed-hl{white-space:pre;padding-bottom:140px;padding-right:40px}
  .ed-hl .l{height:22px}
  .ed-hl .l.d-e{background:rgba(241,112,122,.09);box-shadow:inset 2px 0 0 var(--red)}
  .ed-hl .l.d-w{background:rgba(224,182,74,.07);box-shadow:inset 2px 0 0 var(--yellow)}
  .ed-hl .cm{font-style:normal}
  .ed-ta{position:absolute;inset:0;width:100%;height:100%;background:transparent;color:transparent;caret-color:var(--fg-bright);border:0;outline:0;resize:none;overflow:hidden;font:inherit;line-height:22px;white-space:pre;padding:0;tab-size:4;user-select:text}
  .ed-ta::selection{background:rgba(74,158,255,.3)}
  .empty{height:100%;display:grid;place-items:center;color:var(--fg-muted);text-align:center;line-height:2.1;font-size:12.5px}

  /* diff */
  .diff{font-family:var(--font-mono);font-size:12.5px;line-height:21px;padding:10px 0 80px;min-width:max-content}
  .diff-h{font-family:var(--font-ui);padding:4px 16px 12px;color:var(--fg-dim);font-size:12.5px;display:flex;gap:10px;align-items:center}
  .dl{display:flex;white-space:pre}
  .dl .n{width:40px;flex:none;text-align:right;padding-right:10px;color:var(--fg-muted);opacity:.6;user-select:none}
  .dl .s{width:18px;flex:none;text-align:center;color:var(--fg-muted)}
  .dl.add{background:rgba(92,201,167,.12)}.dl.add .s{color:var(--green)}
  .dl.del{background:rgba(241,112,122,.12)}.dl.del .s{color:var(--red)}

  /* páginas centrais */
  .page{max-width:900px;margin:0 auto;padding:26px 28px 90px;user-select:text}
  .page h1{font-size:22px;font-weight:600;margin-bottom:4px}
  .page .sub{color:var(--fg-dim);font-size:13px;line-height:1.6;margin-bottom:6px}
  .page h2{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--fg-dim);font-weight:700;margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .pcard{background:var(--bg-elevated);border:1px solid var(--border);border-radius:11px;padding:12px 13px;display:flex;flex-direction:column;gap:8px;text-align:left}
  .pcard.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  button.pcard:hover{border-color:var(--border-strong)}
  .pcard .ph{display:flex;align-items:center;gap:8px;font-weight:600}
  .pcard .ph .sw,.pcard .ph .tag:last-child{margin-left:auto}
  .pcard label{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--fg-muted);display:block;margin-bottom:3px}
  .pcard input,.page select{width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:12px;font-family:var(--font-mono);outline:none}
  .pcard input:focus,.page select:focus{border-color:var(--accent)}
  .pcard .pd{color:var(--fg-dim);font-size:12px;line-height:1.5}
  .lnk{color:var(--accent-hover);font-size:12px}.lnk:hover{text-decoration:underline}
  .tbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--fg-muted);font-weight:600;padding:6px 10px;border-bottom:1px solid var(--border)}
  .tbl td{padding:7px 10px;border-bottom:1px solid var(--seam);vertical-align:top;line-height:1.5}
  .tbl td.c{color:var(--fg-dim)}.tbl td.on{color:var(--fg);background:var(--accent-soft)}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--bg-elevated)}
  .rowline{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--seam);font-size:12.5px}
  .rowline:last-child{border-bottom:0}.rowline .sp{flex:1}
  .mini{background:var(--bg-input);border:1px solid var(--border);border-radius:6px;padding:3px 10px;font-size:11.5px;color:var(--fg-dim);white-space:nowrap}
  .mini:hover{border-color:var(--accent);color:var(--fg)}
  .wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:9px}
  .wbtn{display:flex;align-items:center;gap:12px;text-align:left;background:var(--bg-elevated);border:1px solid var(--border);border-radius:11px;padding:12px 14px}
  .wbtn:hover{border-color:var(--accent)}
  .wbtn .wi{color:var(--accent-hover)}.wbtn b{display:block;font-size:13px;font-weight:500}.wbtn small{color:var(--fg-muted);font-size:11.5px}

  /* paleta */
  #pal{position:fixed;inset:0;z-index:400;display:none;background:rgba(0,0,0,.25)}
  #pal.show{display:block}
  .pal-box{position:absolute;top:44px;left:50%;transform:translateX(-50%);width:min(620px,92vw);background:var(--bg-menu);border:1px solid var(--border-strong);border-radius:11px;box-shadow:var(--sh-pop);padding:7px}
  #pal-in{width:100%;background:var(--bg-input);border:1px solid var(--accent);border-radius:7px;padding:7px 10px;font-size:13px;outline:none;user-select:text}
  #pal-list{max-height:340px;overflow:auto;margin-top:6px}
  .pi{display:flex;align-items:center;gap:10px;padding:5px 9px;border-radius:6px;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .pi.on{background:var(--accent-soft)}.pi:hover{background:var(--bg-hover)}
  .pi .d{color:var(--fg-muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
  .pi .key{margin-left:auto;color:var(--fg-muted);font-family:var(--font-mono);font-size:11px}
  .pal-empty{padding:10px;color:var(--fg-muted);font-size:12.5px}
  #notes{position:fixed;right:8px;bottom:30px;width:330px;max-height:320px;overflow:auto;background:var(--bg-menu);border:1px solid var(--border-strong);border-radius:10px;box-shadow:var(--sh-pop);z-index:300;display:none;padding:6px}
  #notes.show{display:block}
  .nt{padding:7px 9px;border-radius:6px;font-size:12px;line-height:1.5;display:flex;gap:8px}
  .nt .tm{color:var(--fg-muted);font-family:var(--font-mono);font-size:10.5px;flex:none}

  /* Co-Dev */
  .ag-name{white-space:nowrap}.ag-hd .ag-model{min-width:0;white-space:nowrap;overflow:hidden}#ag-model-l{overflow:hidden;text-overflow:ellipsis}
  #ag-body{flex:1;min-height:0;display:flex;flex-direction:column}
  button.ag-model{cursor:pointer}button.ag-model:hover{border-color:var(--accent);color:var(--fg)}
  .modebar{padding:9px 13px 8px;border-bottom:1px solid var(--border);flex:none}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg-input);border:1px solid var(--border);border-radius:9px;padding:2px;gap:2px}
  .seg button{padding:4px 0;border-radius:7px;font-size:12px;color:var(--fg-dim)}
  .seg button:hover{color:var(--fg)}
  .seg button.on{background:var(--accent-grad);color:#fff;font-weight:600;box-shadow:var(--sh-acc)}
  .mode-d{font-size:11.5px;color:var(--fg-muted);margin-top:6px;line-height:1.45}
  .ag-msgs{user-select:text;gap:12px}
  .m.ai .bub{max-width:100%;width:100%}
  .bd p{margin:0 0 7px}.bd p:last-child{margin:0}
  .bd pre{font-family:var(--font-mono);font-size:11.5px;background:var(--bg-base);border:1px solid var(--border);border-radius:7px;padding:8px 10px;overflow:auto;margin:6px 0;line-height:1.5;white-space:pre}
  .bd ul{margin:4px 0 4px 18px}.bd li{margin:2px 0}
  .tools:empty{display:none}.tools{padding:8px 13px 0;display:flex;flex-direction:column;gap:5px}
  .intro{margin:auto 0;padding:6px 4px;display:flex;flex-direction:column;gap:8px}
  .intro .i-t{font-size:17px;font-weight:600}.intro .i-s{color:var(--fg-dim);line-height:1.55;font-size:12.5px;margin-bottom:4px}
  .chip{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--bg-editor);border:1px solid var(--border);border-radius:10px;padding:9px 11px;font-size:12.5px}
  .chip:hover{border-color:var(--accent)}.chip small{color:var(--fg-muted);font-size:11px}
  .chips{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .i-n{font-size:11px;color:var(--fg-muted);line-height:1.5}
  .phase{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--fg-dim);font-weight:600;margin-top:4px}
  .phase i{font-style:normal;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-hover);flex:none}
  .phase::after{content:"";flex:1;height:1px;background:var(--border)}
  .tool{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11.5px;color:var(--fg-dim);background:var(--bg-input);border:1px solid var(--border);border-radius:7px;padding:5px 9px;flex-wrap:wrap}
  .tool .tn{color:var(--accent-hover);flex:none}
  .tool .ta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
  .tool .tr{margin-left:auto;flex:none;display:flex;gap:8px;align-items:center}
  .tool .pls{color:var(--green)}.tool .mns{color:var(--red)}
  .tool .okc{color:var(--green)}.tool .bad{color:var(--red)}
  .gate{display:flex;gap:6px;flex-wrap:wrap;width:100%;margin-top:6px}
  .gb{background:var(--bg-elevated);border:1px solid var(--border-strong);border-radius:7px;padding:4px 11px;font-size:12px;color:var(--fg);font-family:var(--font-ui)}
  .gb:hover{border-color:var(--accent)}
  .gb.pri{background:var(--accent-grad);border-color:transparent;color:#fff;font-weight:600}
  .gdone{font-size:11px;color:var(--fg-muted);font-family:var(--font-mono)}
  .card-b{padding:4px 13px 12px;font-size:12.5px;line-height:1.55}
  .req{padding:5px 0;border-bottom:1px solid var(--seam)}.req:last-child{border:0}
  .req .ac{color:var(--fg-dim);font-size:12px;padding-left:14px;position:relative}
  .req .ac::before{content:"◦";position:absolute;left:3px;color:var(--accent-hover)}
  .qopt{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--border);border-radius:8px;padding:6px 9px;margin-top:5px;background:var(--bg-input);font-size:12.5px;line-height:1.45}
  button.qopt:hover{border-color:var(--accent)}
  .qopt .ql{flex:1}.qopt small{display:block;color:var(--fg-muted);font-size:11px}
  .qopt.pick{border-color:var(--accent);background:var(--accent-soft)}
  .qopt.dim{opacity:.5}
  .qfoot{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center;font-size:11px;color:var(--fg-muted)}
  .cand{border:1px solid var(--border);border-radius:9px;padding:8px 10px;margin-top:6px;background:var(--bg-input)}
  .cand.best{border-color:var(--accent);background:var(--accent-soft)}
  .cand .ch{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--fg-dim);font-family:var(--font-mono)}
  .cand .tot{margin-left:auto;font-size:13px;font-weight:700;color:var(--fg)}
  .cand.best .tot{color:var(--accent-hover)}
  .cand .ct{font-weight:600;margin-top:3px}.cand .cs{color:var(--fg-dim);font-size:12px;margin-top:2px}
  .crit{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:7px}
  .crit span{font-family:var(--font-mono);font-size:9.5px;color:var(--fg-muted);text-transform:uppercase}
  .crit i{display:block;height:4px;border-radius:2px;background:var(--bg-sel);margin-top:2px;overflow:hidden}
  .crit i b{display:block;height:100%;background:var(--accent-grad)}
  .evalbox{display:flex;gap:14px;align-items:flex-start}
  .score{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;flex:none;padding-top:2px}
  .score small{font-size:11px;color:var(--fg-muted);font-weight:500}
  .score.ok{color:var(--green)}.score.bad{color:var(--red)}
  .chk{display:flex;gap:7px;font-size:12px;line-height:1.5}
  .chk .w{margin-left:auto;color:var(--fg-muted);font-family:var(--font-mono);font-size:10.5px;flex:none;padding-left:6px}
  .chk.ok .g{color:var(--green)}.chk.no .g{color:var(--red)}.chk.no{color:var(--fg)}
  .fixl{padding:5px 0;border-bottom:1px solid var(--seam);font-size:12px}.fixl:last-child{border:0}
  .fixl b{color:var(--red);font-weight:600}.fixl span{color:var(--fg-dim);display:block}
  .composer textarea{width:100%;background:none;border:none;outline:none;resize:none;font-size:13px;line-height:1.5;display:block;user-select:text}

function buildActivity(){
  const bar=$('#activity');
  ACTS.forEach((a,i)=>{const el=document.createElement('button');el.className='act'+(i===0?' on':'')+(a.spacer?' spacer':'');
    el.title=a.title;el.innerHTML=svg(a.ic)+(a.badge?`<span class="badge${a.accBadge?' acc':''}">${a.badge}</span>`:'');
    el.onclick=e=>{e.stopPropagation();if(a.overflow)openOverflow(el);else if(a.pane)setPane(a.pane,el);else toast(a.title);};bar.appendChild(el);});
}
function openOverflow(btn){closeMenus();const r=btn.getBoundingClientRect();const pop=document.createElement('div');pop.className='menu-pop show';document.body.appendChild(pop);
  const title=document.createElement('div');title.className='mi';title.style.cssText='color:var(--fg-muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;pointer-events:none';title.textContent='Additional Views';pop.appendChild(title);
  OVERFLOW.forEach(it=>{if(it.sep){const s=document.createElement('div');s.className='mi-sep';pop.appendChild(s);return;}
    const mi=document.createElement('div');mi.className='mi';mi.innerHTML=`<span>${it.l}</span>`+(it.pane?'':'<span class="key">plugin</span>');
    mi.onclick=e=>{e.stopPropagation();closeMenus();if(it.pane)setPane(it.pane);else toast(it.l+' — requer o plugin instalado');};pop.appendChild(mi);});
  let x=r.right+4,y=r.top;const h=pop.offsetHeight;if(y+h>innerHeight)y=innerHeight-h-6;pop.style.left=x+'px';pop.style.top=y+'px';}
function setPane(p,el){
  $$('.act').forEach(a=>a.classList.remove('on'));
  if(el)el.classList.add('on');else{const idx=ACTS.findIndex(a=>a.pane===p);if(idx>=0)$$('.act')[idx].classList.add('on');}
  $$('.pane').forEach(x=>x.classList.remove('show'));const pe=$('#pane-'+p);if(pe)pe.classList.add('show');
}

    ls(){const d=a[0]?dirAt(CWD.slice(4).concat(a[0].split('/').filter(Boolean))):curDir();if(!d||!d.children){echo('<span class="er">ls: '+(a[0]||'.')+': não encontrado</span>');return;}echo(Object.keys(d.children).map(n=>d.children[n].dir?`<span class="dir">${n}/</span>`:`<span class="${d.children[n].t==='rust'?'ac':''}">${n}</span>`).join('   ')||'<span class="dim">(vazio)</span>');},
    pwd(){echo('/home/'+USER+'/'+CWD.slice(1).join('/'));},
    cd(){const x=a[0]||'~';if(x==='~'||x==='/'){CWD=['~','workspaces','NgolaCloud','projects'];return;}if(x==='..'){if(CWD.length>4)CWD.pop();return;}let t=CWD.slice();for(const p of x.split('/').filter(Boolean)){if(p==='..'){if(t.length>4)t.pop();continue;}const nd=dirAt(t.slice(4).concat(p));if(!nd||!nd.dir){echo('<span class="er">cd: '+x+': não é um directório</span>');return;}t.push(p);}CWD=t;},
    cat(){const f=a[0];if(!f){echo('<span class="er">cat: falta o ficheiro</span>');return;}const b=f.split('/').pop();if(DOCS[b])DOCS[b].forEach(l=>echo('<span class="'+(l[0]==='err'?'':l[0])+'">'+l[1]+'</span>'));else echo('<span class="dim">// '+b+' — conteúdo não disponível no protótipo</span>');},
    tree(){echo('<span class="dir">'+CWD[CWD.length-1]+'/</span>');const d=curDir();if(d&&d.children){const ks=Object.keys(d.children);ks.forEach((k,i)=>echo('<span class="dim">'+(i===ks.length-1?'└─ ':'├─ ')+'</span>'+(d.children[k].dir?'<span class="dir">'+k+'/</span>':k)));}},
    echo(){echo(a.join(' ').replace(/</g,'&lt;'));},whoami(){echo(USER);},date(){echo(new Date().toString());},
    history(){HIST.forEach((h,i)=>echo('<span class="dim">'+String(i+1).padStart(4)+'</span>  '+h.replace(/</g,'&lt;')));},
    clear(){termClear();return 'skip';},
    neofetch(){echo(`<span class="ac">    ✦✦✦✦✦    </span>  <span class="ok">${USER}@${HOST}</span>\n<span class="ac">  ✦✦ </span><span class="dim">delonix</span><span class="ac"> ✦✦  </span>  <span class="ac">OS</span>    Delonix Linux 7.0\n<span class="ac">  ✦✦✦✦✦✦✦✦✦  </span>  <span class="ac">Shell</span> dsh 2.1 (emulado)\n<span class="ac">    ✦✦✦✦✦    </span>  <span class="ac">IDE</span>   dxtutor IDE · grafite\n                 <span class="ac">CPU</span>   16 cores · <span class="ok">extrema velocidade</span>`);},
    git(){const s=a[0];if(s==='status')echo(`No ramo <span style="color:var(--accent-hover)">main</span>\n<span class="dim">Changes not staged:</span>\n  <span class="warn">modified:</span>   desktop/src/styles.css\n  <span class="warn">modified:</span>   desktop/src/assistant.ts\n<span class="dim">Untracked:</span>\n  <span class="er">desktop/src/theme.css</span>`);else if(s==='branch')echo(`<span class="ok">* main</span>\n  develop\n  feat/learning-paths`);else if(s==='log')echo(`<span class="ac">c638e07</span> feat(arch): persist the Studio design\n<span class="ac">a5b0d39</span> feat(arch): double-click a node to delete it\n<span class="ac">64943bc</span> feat(arch): interactive canvas`);else echo('<span class="dim">git: status|branch|log</span>');},
    cargo(){const s=a[0];if(s==='build'){echo('<span class="dim">   Compiling dxtutor v0.1.0</span>');setTimeout(()=>{echo('<span class="ok">    Finished</span> dev in 0.81s');newInput();},140);return 'async';}if(s==='test'){echo('<span class="dim">   Running tests…</span>');setTimeout(()=>{echo('<span class="ok">test result: ok. 261 passed; 0 failed</span>');newInput();},160);return 'async';}echo('<span class="dim">cargo: build|test</span>');},
  };
  let r;if(XC[cmd])r=XC[cmd](a,v);else if(C[cmd])r=C[cmd]();else echo('<span class="er">'+cmd+': comando não encontrado</span> <span class="dim">(help)</span>');if(r!=='skip'&&r!=='async')newInput();}

function mkRz(el,v,base,min,max,inv){el.onmousedown=e=>{e.preventDefault();el.classList.add('drag');const sx=e.clientX,start=parseInt(getComputedStyle(document.body).getPropertyValue(v))||base;const mv=ev=>{let d=ev.clientX-sx;if(inv)d=-d;document.body.style.setProperty(v,Math.min(max,Math.max(min,start+d))+'px');};const up=()=>{el.classList.remove('drag');removeEventListener('mousemove',mv);removeEventListener('mouseup',up);};addEventListener('mousemove',mv);addEventListener('mouseup',up);};}

<script>
const SEED={"base": {"Cargo.toml": "[workspace]\nmembers = [\"crates/lexer\", \"crates/store\"]\nresolver = \"2\"\n\n[workspace.dependencies]\nrusqlite = { version = \"0.32\", features = [\"bundled\"] }\n", "README.md": "# dxtutor\n\nIDE com um Co-Dev integrado. Local-first, multi-modelo.\n\n- `desktop/` — interface (TypeScript + Tauri)\n- `crates/lexer` — tokenizador de exemplo\n- `crates/store` — persistência SQLite\n- `db/migrations` — esquema da base de dados\n- `.dxtutor/` — conhecimento do projecto que o Co-Dev lê antes de agir\n", "desktop/index.html": "<!doctype html>\n<html lang=\"pt\">\n  <head>\n    <meta charset=\"utf-8\" />\n    <title>dxtutor IDE<\/title>\n    <link rel=\"stylesheet\" href=\"/src/styles.css\" />\n  <\/head>\n  <body>\n    <div id=\"app\"><\/div>\n    <script type=\"module\" src=\"/src/main.ts\"><\/script>\n  <\/body>\n<\/html>\n", "desktop/package.json": "{\n  \"name\": \"dxtutor-desktop\",\n  \"version\": \"0.2.0\",\n  \"scripts\": {\n    \"dev\": \"vite\",\n    \"build\": \"tsc && vite build\",\n    \"lint\": \"dx lint\"\n  },\n  \"dependencies\": {\n    \"@tauri-apps/api\": \"^2.0.0\"\n  }\n}\n", "desktop/src/styles.css": "/* dxtutor — tema Grafite + laranja */\n:root {\n  --bg-base: #0f0f11;\n  --bg-editor: #161618;\n  --accent: #e06c3b;\n  --accent-hover: #f08a4b;\n  --radius: 9px;\n}\n\n.agent {\n  background: var(--bg-editor);\n  border-radius: var(--radius);\n}\n\n.send {\n  background: var(--accent);\n}\n", "desktop/src/assistant.ts": "// Painel Co-Dev — render das mensagens.\nimport { state } from \"./workspace\";\n\nexport function renderMessages(): void {\n  const host = document.querySelector(\"#ag-msgs\");\n  if (!host) return;\n  host.innerHTML = state.messages.map(bubble).join(\"\");\n}\n\nfunction bubble(m: Message): string {\n  return `<div class=\"m ${m.role}\"><div class=\"bd\">${m.html}<\/div><\/div>`;\n}\n\n// v2: suporte a cartões de plano\nexport function renderPlan(steps: Step[]): string {\n  return steps.map((s) => `<div class=\"stp ${s.state}\">${s.label}<\/div>`).join(\"\");\n}\n", "desktop/src/workspace.ts": "// Estado do workspace aberto.\nexport const state = {\n  root: \"\",\n  messages: [] as Message[],\n};\n\nexport async function openWorkspace(name: string): Promise<void> {\n  state.root = name;\n}\n", "desktop/src/i18n.ts": "// Textos da interface (pt-AO).\nconst STRINGS: Record<string, string> = {\n  \"app.title\": \"dxtutor IDE\",\n  \"agent.name\": \"Co-Dev\",\n  \"mode.manual\": \"Manual\",\n  \"mode.auto\": \"Automático\",\n};\n\nexport function t(key: string): string {\n  return STRINGS[key] ?? key;\n}\n", "desktop/src/theme.css": "/* Tokens alternativos — Slate índigo */\n:root[data-theme=\"slate\"] {\n  --bg-base: #0e1016;\n  --bg-editor: #141722;\n  --accent: #6d7cff;\n  --accent-hover: #8f9bff;\n}\n", "desktop/src/main.ts": "// Arranque da aplicação desktop.\nimport { renderMessages } from \"./assistant\";\nimport { openWorkspace } from \"./workspace\";\nimport { t } from \"./i18n\";\n\nexport async function main(): Promise<void> {\n  document.title = t(\"app.title\");\n  await openWorkspace(\"projects\");\n  renderMessages();\n}\n\nmain();\n", "crates/lexer/src/lib.rs": "// Tokeniza uma expressão aritmética.\npub fn tokenize(src: &str) -> Vec<Token> {\n    let mut tokens = Vec::new();\n    let mut chars = src.chars().peekable();\n    for c in chars {\n        if c.is_ascii_digit() {\n            tokens.push(Token::Num(c));\n        }\n    }\n    if chars.peek().is_none() {\n        tokens.push(Token::Eof);\n    }\n    tokens\n}\n\n#[derive(Debug, PartialEq)]\npub enum Token {\n    Num(char),\n    Eof,\n}\n", "crates/store/src/lib.rs": "// Camada de persistência (ADR-002): só este crate fala com o SQLite.\npub mod workspaces;\n\npub type Result<T> = std::result::Result<T, StoreError>;\n\n#[derive(Debug)]\npub enum StoreError {\n    Sqlite(rusqlite::Error),\n    NotFound,\n}\n", "crates/store/src/workspaces.rs": "use crate::Result;\nuse rusqlite::{params, Connection};\n\npub struct Workspace {\n    pub id: String,\n    pub name: String,\n    pub created_at: i64,\n}\n\npub fn insert(conn: &Connection, w: &Workspace) -> Result<()> {\n    conn.execute(\n        \"INSERT INTO workspaces (id, name, created_at) VALUES (?1, ?2, ?3)\",\n        params![w.id, w.name, w.created_at],\n    )?;\n    Ok(())\n}\n", ".dxtutor/regras.md": "# Regras do Co-Dev neste projecto\n\n1. Ler os ADRs e o Design System antes de propor uma solução.\n2. Não quebrar a API pública de um crate sem perguntar ao humano.\n3. Toda a alteração de esquema entra como migração nova em `db/migrations`.\n4. Nenhuma cor fixa na UI: usar sempre tokens (`var(--…)`).\n5. Código novo só é entregue com testes a passar e auto-avaliação ≥ limiar.\n6. `git push` e acções destrutivas exigem sempre aprovação humana.\n7. Se a confiança numa decisão for baixa, escolher a opção reversível e assinalar o pressuposto.\n", ".dxtutor/padroes.md": "# Padrões de projecto adoptados\n\n1. **Camadas** — ver ADR-002.\n2. **Repository** — acesso a dados atrás de um `trait`; a implementação SQLite é um detalhe.\n3. **Command** — cada acção da UI é um comando Tauri com entrada e saída tipadas.\n4. **Strategy** — provedores de LLM implementam o mesmo `trait ModelProvider`.\n5. **Observer** — a UI subscreve eventos do agente (plano, ferramenta, avaliação).\n", ".dxtutor/design-system.md": "# Design System\n\n## Tokens\n- Cor: `--bg-base`, `--bg-editor`, `--accent`, `--accent-hover` (ver `desktop/src/styles.css`)\n- Raio: `--radius`\n- Nunca usar valores hexadecimais fora da definição dos tokens.\n\n## Componentes\n- Listas e históricos vivem em **secções do painel lateral**, não em modais.\n- Acção primária: um único botão com `--accent` por vista.\n- Estados: vazio, a carregar, erro — sempre os três.\n", ".dxtutor/requisitos.md": "# Requisitos (backlog vivo)\n\n## RF-01 · Editor e navegação\nComo programador quero abrir, editar e procurar ficheiros sem sair do teclado.\n\n## RF-02 · Co-Dev multi-modelo\nComo programador quero escolher entre Claude, Gemini, Codex e Ollama local por papel.\n\n## RF-03 · Histórico de conversas\nComo programador quero retomar conversas anteriores do Co-Dev por workspace.\n- CA1: as conversas ficam guardadas depois de fechar a aplicação.\n- CA2: a lista mostra primeiro as mais recentes.\n- CA3: apagar um workspace apaga as suas conversas.\n\n## RNF-01 · Local-first\nOs dados do utilizador ficam na máquina; nada sai sem consentimento.\n", ".dxtutor/base-de-dados.md": "# Base de dados\n\n- Motor: SQLite (ficheiro por instalação), acesso via `rusqlite`.\n- Chaves: `TEXT` (ULID). Datas: `INTEGER` (epoch ms).\n- Integridade: chaves estrangeiras com `ON DELETE CASCADE` quando o filho não vive sem o pai.\n- Desempenho: toda a listagem ordenada precisa de um índice que cubra o filtro e a ordenação.\n- Migrações: ficheiros numerados, só para a frente, nunca editar uma migração aplicada.\n", ".dxtutor/arquitectura/ADR-001-local-first.md": "# ADR-001 · Local-first\n\n**Estado:** aceite\n\n**Decisão:** os dados do utilizador (workspaces, conversas, definições) são guardados\nlocalmente em SQLite. Serviços remotos são opcionais e nunca a fonte de verdade.\n\n**Consequências:** funciona offline; sincronização é uma funcionalidade futura, não um requisito.\n", ".dxtutor/arquitectura/ADR-002-camadas.md": "# ADR-002 · Camadas\n\n**Estado:** aceite\n\n**Decisão:** UI (`desktop/`) → comandos Tauri → crates de domínio → `crates/store`.\nSó o crate `store` contém SQL. A UI nunca acede à base de dados directamente.\n\n**Consequências:** a persistência pode mudar sem tocar na interface; testes do `store` não precisam de UI.\n", "db/migrations/0001_init.sql": "-- 0001 · esquema inicial\nCREATE TABLE workspaces (\n  id         TEXT PRIMARY KEY,\n  name       TEXT NOT NULL,\n  created_at INTEGER NOT NULL\n);\n"}, "gen": {"conversations.rs": "// Repository (padroes.md §2): quem consome depende do trait, não do SQLite.\nuse crate::Result;\nuse rusqlite::{params, Connection};\n\npub struct Conversation {\n    pub id: String,\n    pub workspace_id: String,\n    pub title: String,\n    pub created_at: i64,\n}\n\npub trait ConversationRepo {\n    fn save(&self, c: &Conversation) -> Result<()>;\n    fn list_recent(&self, workspace_id: &str, limit: u32) -> Result<Vec<Conversation>>;\n}\n\npub struct SqliteConversationRepo {\n    pub conn: Connection,\n}\n\nimpl ConversationRepo for SqliteConversationRepo {\n    fn save(&self, c: &Conversation) -> Result<()> {\n        self.conn.execute(\n            \"INSERT INTO conversations (id, workspace_id, title, created_at) VALUES (?1, ?2, ?3, ?4)\",\n            params![c.id, c.workspace_id, c.title, c.created_at],\n        )?;\n        Ok(())\n    }\n\n    fn list_recent(&self, workspace_id: &str, limit: u32) -> Result<Vec<Conversation>> {\n        let mut stmt = self.conn.prepare(\n            \"SELECT id, workspace_id, title, created_at FROM conversations WHERE workspace_id = ?1 LIMIT ?2\",\n        )?;\n        let rows = stmt.query_map(params![workspace_id, limit], Conversation::from_row)?;\n        rows.collect()\n    }\n}\n", "history.ts": "// Secção «Histórico» do painel Co-Dev.\n// Só fala com o comando Tauri — nunca com a base de dados (ADR-002).\nimport { invoke } from \"@tauri-apps/api/core\";\n\nexport async function renderHistory(host: HTMLElement, workspaceId: string): Promise<void> {\n  const items = await invoke<Conversation[]>(\"conversations_list_recent\", { workspaceId, limit: 20 });\n  if (!items.length) {\n    host.textContent = \"Ainda não há conversas neste workspace.\";\n    return;\n  }\n  host.innerHTML = items\n    .map((c) => `<button class=\"hist-row\" data-id=\"${c.id}\">${c.title}<\/button>`)\n    .join(\"\");\n  host.style.borderLeft = \"2px solid #ff6600\";\n}\n", "0002_conversations.sql": "-- 0002 · histórico de conversas do Co-Dev (ADR-003)\nCREATE TABLE conversations (\n  id           TEXT PRIMARY KEY,\n  workspace_id TEXT NOT NULL REFERENCES workspaces(id) ON DELETE CASCADE,\n  title        TEXT NOT NULL,\n  created_at   INTEGER NOT NULL\n);\n\nCREATE TABLE messages (\n  id              TEXT PRIMARY KEY,\n  conversation_id TEXT NOT NULL REFERENCES conversations(id) ON DELETE CASCADE,\n  role            TEXT NOT NULL,\n  content         TEXT NOT NULL,\n  created_at      INTEGER NOT NULL\n);\n", "ADR-003-historico.md": "# ADR-003 · Histórico de conversas\n\n**Estado:** aceite (proposto pelo Co-Dev, aprovado pelo humano na entrega)\n\n**Contexto:** RF-03 pede conversas persistentes por workspace.\n\n**Decisão:** tabelas `conversations` e `messages` em SQLite (ADR-001), acedidas\natravés do `trait ConversationRepo` no crate `store` (ADR-002, padrão Repository).\nA UI lista-as numa secção do painel lateral (Design System).\n\n**Alternativas rejeitadas:** SQL directo na UI (viola ADR-002); Postgres gerido\n(viola ADR-001); ficheiro JSON (sem integridade referencial nem ordenação indexada).\n\n**Pressuposto a rever:** retenção de 90 dias, configurável.\n", "conversations_test.rs": "use store::conversations::*;\n\n#[test]\nfn save_and_load_roundtrip() {\n    let repo = test_repo();\n    repo.save(&conv(\"c1\", \"ws1\", \"Primeira\", 10)).unwrap();\n    assert_eq!(repo.list_recent(\"ws1\", 10).unwrap().len(), 1);\n}\n\n#[test]\nfn list_recent_orders_by_newest() {\n    let repo = test_repo();\n    repo.save(&conv(\"c1\", \"ws1\", \"Antiga\", 10)).unwrap();\n    repo.save(&conv(\"c2\", \"ws1\", \"Recente\", 20)).unwrap();\n    assert_eq!(repo.list_recent(\"ws1\", 10).unwrap()[0].id, \"c2\");\n}\n\n#[test]\nfn cascade_delete_messages() {\n    let repo = test_repo();\n    repo.save(&conv(\"c1\", \"ws1\", \"A apagar\", 10)).unwrap();\n    delete_workspace(&repo.conn, \"ws1\").unwrap();\n    assert!(repo.list_recent(\"ws1\", 10).unwrap().is_empty());\n}\n"}};
const COURSES={"rust":{"id":"rust-beginner","title":"Rust: From Zero to Confident","summary":"A serious, guided course in Rust that takes you from your very first line of code to the ideas that make Rust special. You read a short concept, build muscle memory by typing small, complete programs along with the tutor — every line explained — and then apply what you learned in a graded challenge whose hidden tests decide correctness. Nine foundation units of steadily rising difficulty — from printing a line to ownership, collections, your own types, and error handling. Then an intermediate Database track using SQLite via the `rusqlite` crate: connecting and querying, transactions and atomicity, WAL mode with connection pools, the N+1 query problem, pagination, and indexes with query plans — followed by an advanced track on Rust's type system: traits, generics, trait bounds, associated types, static vs dynamic dispatch, lifetimes, and Send/Sync with object safety. Then an advanced concurrency track — threads, channels, shared state with Arc/Mutex, and data parallelism — and a data structures & algorithms track: stacks and queues, linked lists, maps and sets, binary search trees, sorting and searching, and recursion with dynamic programming. Almost everything runs on the standard library alone — only the Database track pulls in the `rusqlite` crate. No prior Rust needed.","units":[{"id":"u1-hello","title":"Hello & printing","difficulty":1,"level":"basic","intro":"Your very first steps in Rust: what a program is, how to print to the screen,\nhow to name a value, and how to call a function. By the end you will write a\ntiny greeting function and let the tests check it.\n","steps":[{"kind":"concept","id":"c1-what-is-a-program","title":"What a Rust program is","points":5,"difficulty":1,"intro":"Before you write anything, picture what a computer actually does: it loads your\ncompiled program into memory and starts executing machine instructions one after\nanother. A program needs a single, agreed-upon place to begin — in Rust that\nplace is the function `main`. The operating system hands control to your program,\nRust runs `main` top to bottom, and anything you print travels to a stream called\n**standard output** (stdout), which the terminal shows on screen. This first\nconcept makes that model concrete so the code that follows is never a mystery.\n","body":"## A program starts at `main`\n\nEvery Rust program begins running at a special function called **`main`**.\nThink of it as the front door: when you run your program, Rust walks in through\n`main` and does, top to bottom, whatever it finds there.\n\n```rust\nfn main() {\n    println!(\"Hello, world!\");\n}\n```\n\nThree things to notice:\n\n- **`fn main() { ... }`** declares the `main` function. `fn` means *function*;\n  the `{ }` hold its body.\n- **`println!`** prints a line of text to the screen. The `!` tells you it is a\n  **macro**, not a regular function — for now, just know it prints.\n- The text in **`\"...\"`** is a *string*: the exact characters to print.\n\nIn the next steps you will type small, complete programs yourself. When your\ncode matches the target, the tutor runs it so you can see the output — that is\nhow you build muscle memory.\n"},{"kind":"drill","id":"d1-hello-world","title":"Print your first line","points":10,"difficulty":1,"intro":"This drill cements the one skeleton every Rust program shares. Under the hood,\n`println!` is a macro the compiler expands into code that formats your text and\nwrites the resulting bytes to standard output, with a trailing newline. There is\nno loop and no branching here — just the entry point `main` and a single write to\nthe screen.\n","prompt":"Type the classic first program. It prints a single line and stops.\n\n**Why:** this cements the shape every Rust program shares — a `main` function\nand a `println!` that writes one line. Reproduce it exactly, character for\ncharacter.\n","target":"fn main() {\n    println!(\"Hello, world!\");\n}\n","line_comments":["Declares `main`, the function Rust runs first; `{` opens its body.","Prints the text `Hello, world!` followed by a newline to standard output.","Closes the body of `main`; when execution reaches here the program ends."],"explanation":"That is a complete Rust program. Rust entered `main`, ran the one `println!`,\nprinted `Hello, world!`, and then `main` ended — so the program finished. Every\nprogram you write grows from exactly this skeleton.\n","placeholder_policy":"shown"},{"kind":"drill","id":"d2-two-lines","title":"Print two lines in order","points":10,"difficulty":1,"intro":"Programs run top to bottom. Two `println!` calls run in the order you write\nthem, each writing its own line and its own trailing newline. Seeing the output\nappear in source order makes the \"instructions run in sequence\" model concrete.\n","prompt":"Print two separate lines. The order of the statements is the order of the\noutput.\n\n**Why:** statements execute top to bottom. Each `println!` writes one line, so\nthe first call's text appears above the second's.\n","target":"fn main() {\n    println!(\"Learning Rust\");\n    println!(\"One line at a time\");\n}\n","line_comments":["Declares `main` and opens its body.","Runs first: prints `Learning Rust` on its own line.","Runs next: prints `One line at a time` below the first line.","Closes `main`; the program ends after both lines have printed."],"explanation":"The two `println!` calls ran in source order, so `Learning Rust` printed first\nand `One line at a time` second. That top-to-bottom flow is the backbone of every\nprogram.\n","placeholder_policy":"shown"},{"kind":"drill","id":"d3-let-variable","title":"Name a value and print it","points":10,"difficulty":2,"intro":"Here you meet the idea of a **variable**: a name bound to a value living in\nmemory. `let name = \"Rust\";` reserves a slot and labels it `name`. Then string\n**interpolation** — writing `{name}` inside the text — tells `println!` to look\nup the variable and splice its value into the output at that exact spot.\n","prompt":"Give a value a name with `let`, then print it *inside* the text.\n\n**Why:** `let name = \"Rust\";` creates a variable called `name`. Writing\n`{name}` inside the string drops the variable's value right there — this is\n**interpolation**. Type the program exactly.\n","target":"fn main() {\n    let name = \"Rust\";\n    println!(\"Hello, {name}!\");\n}\n","line_comments":["Declares `main` and opens its body.","Binds the name `name` to the text `\"Rust\"`; `let` creates the variable.","Prints `Hello, Rust!` — `{name}` is replaced by the variable's value.","Closes `main`; the program ends."],"explanation":"`let name = \"Rust\";` bound the name `name` to the text `Rust`, and\n`println!(\"Hello, {name}!\")` substituted that value into the `{name}` slot, so\nthe program printed `Hello, Rust!`. Variables let you say a value once and reuse\nit by name.\n","placeholder_policy":"shown"},{"kind":"challenge","id":"ch1-greet","title":"Implement greet","points":30,"difficulty":3,"intro":"Now you apply everything, and one new idea matters: the difference between\nborrowing text and owning it. The parameter `name: &str` is a **string slice** —\na borrowed, read-only view into text the caller still owns. The return type\n`String` is **owned** text your function builds fresh and hands back. The\n`format!` macro does exactly that: it allocates a new `String` and copies the\nfixed parts plus `name` into it. Hidden tests, not the screen, decide correctness.\n","instructions":"## Your turn\n\nImplement the function `greet`:\n\n```rust\npub fn greet(name: &str) -> String { ... }\n```\n\nIt takes a name (a string slice `&str`) and returns a `String` that reads\n`Hello, {name}!`.\n\nExamples:\n\n- `greet(\"World\")` → `\"Hello, World!\"`\n- `greet(\"Rust\")` → `\"Hello, Rust!\"`\n\n**Hint:** the `format!` macro builds a `String` the same way `println!` builds a\nprinted line — with `{name}` interpolation.\n\nHidden tests decide correctness. Implement it, then submit.\n","starter":"pub fn greet(name: &str) -> String {\n    todo!(\"return a greeting like \\\"Hello, World!\\\"\")\n}\n","tests":"use student::greet;\n\n#[test]\nfn greets_world() {\n    assert_eq!(greet(\"World\"), \"Hello, World!\");\n}\n\n#[test]\nfn greets_rust() {\n    assert_eq!(greet(\"Rust\"), \"Hello, Rust!\");\n}\n\n#[test]\nfn greets_a_short_name() {\n    assert_eq!(greet(\"Al\"), \"Hello, Al!\");\n}\n","entry":"greet","gabarito":{"time":"O(n)","space":"O(n)","solution":"pub fn greet(name: &str) -> String {\n    format!(\"Hello, {name}!\")\n}\n","justification":"`format!` copies the fixed text `Hello, ` and `!` plus the `n` characters of\n`name` into a fresh `String`. The work and the memory both grow in direct\nproportion to the length of `name`, so the time is **O(n)** and the space is\n**O(n)**, where `n` is the length of the name. There is no hidden loop — it is a\nsingle pass that builds the result once.\n"}}]},{"id":"u2-variables","title":"Variables & types","difficulty":2,"level":"basic","intro":"Every value in Rust has a **type** the compiler tracks for you: whole numbers,\nreal numbers, booleans, text. You will meet immutability (the default), the\n`mut` keyword that opts into change, and simple arithmetic. By the end you will\nconvert a temperature with a graded challenge.\n","steps":[{"kind":"concept","id":"c2-types","title":"Values have types","points":5,"difficulty":2,"intro":"A type is a promise about what a value is and what you can do with it. The\ncompiler uses types to catch mistakes before your program ever runs — adding a\nnumber to a piece of text is simply rejected. Most of the time Rust *infers* the\ntype from the value, so you rarely write it, but it is always there.\n","body":"## Numbers, booleans, and text\n\nCommon types you will use immediately:\n\n- **`i32`** — a 32-bit signed integer, the default whole number (`let n = 42;`).\n- **`f64`** — a 64-bit floating-point number, for reals (`let pi = 3.14;`).\n- **`bool`** — either `true` or `false`.\n- **`&str`** / **`String`** — borrowed text / owned text.\n\nBindings are **immutable by default**:\n\n```rust\nlet x = 5;\n// x = 6; // error: cannot assign twice to immutable `x`\nlet mut y = 5;\ny = 6;     // fine: `mut` opts in to change\n```\n\nImmutability by default is a safety feature: a value you did not mark `mut`\ncannot change under you. You reach for `mut` only when you truly need it.\n"},{"kind":"drill","id":"d4-numbers","title":"Integer arithmetic","points":10,"difficulty":2,"intro":"Integers support the usual arithmetic. Here you bind two whole numbers and print\ntheir sum. `{}` is a positional slot: the arguments after the string fill the\nslots left to right. The compiler infers both variables are `i32`.\n","prompt":"Bind two numbers, add them, and print the result using positional `{}` slots.\n\n**Why:** arithmetic on integers is immediate. The `{}` slots are filled by the\narguments after the string, in order.\n","target":"fn main() {\n    let a = 7;\n    let b = 5;\n    println!(\"{} + {} = {}\", a, b, a + b);\n}\n","line_comments":["Declares `main` and opens its body.","Binds `a` to the integer `7` (inferred type `i32`).","Binds `b` to the integer `5`.","Prints `7 + 5 = 12`; the three `{}` slots take `a`, `b`, and `a + b` in order.","Closes `main`."],"explanation":"The three `{}` slots were filled, in order, by `a`, `b`, and the computed value\n`a + b`, so the line read `7 + 5 = 12`. The addition happened right inside the\nargument list.\n","placeholder_policy":"shown"},{"kind":"drill","id":"d5-mutable","title":"Change a mutable variable","points":10,"difficulty":3,"intro":"A binding marked `mut` may be reassigned or updated. `count += 1` is shorthand\nfor `count = count + 1`. Watching the value before and after makes mutation\nconcrete: the same slot in memory now holds a different number.\n","prompt":"Create a mutable counter, increment it, and print it before and after.\n\n**Why:** only a `mut` binding may change. `count += 1` adds one in place. Without\n`mut`, the second assignment would be a compile error.\n","target":"fn main() {\n    let mut count = 0;\n    println!(\"start: {count}\");\n    count += 1;\n    println!(\"after: {count}\");\n}\n","line_comments":["Declares `main` and opens its body.","Binds a **mutable** variable `count` to `0`; `mut` allows later change.","Prints `start: 0`.","Adds one to `count` in place; `+=` is `count = count + 1`.","Prints `after: 1`, showing the value changed.","Closes `main`."],"explanation":"Because `count` was declared `mut`, `count += 1` was allowed and updated the\nvalue from `0` to `1`. The two prints showed the before and after. Remove `mut`\nand Rust would refuse to compile the reassignment — that is immutability\nprotecting you by default.\n","placeholder_policy":"shown"},{"kind":"drill","id":"d6-bool","title":"A boolean from a comparison","points":10,"difficulty":3,"intro":"Comparisons like `>` produce a `bool` — exactly `true` or `false`. Storing that\nresult in a variable shows that a boolean is an ordinary value you can name,\nprint, and later use to make decisions.\n","prompt":"Compare two numbers, store the resulting `bool`, and print it.\n\n**Why:** `a > b` evaluates to a `bool`. Booleans are plain values you can bind\nwith `let` and print like any other.\n","target":"fn main() {\n    let a = 10;\n    let b = 3;\n    let bigger = a > b;\n    println!(\"{a} > {b} is {bigger}\");\n}\n","line_comments":["Declares `main` and opens its body.","Binds `a` to `10`.","Binds `b` to `3`.","Evaluates `a > b` (which is `true`) and binds that `bool` to `bigger`.","Prints `10 > 3 is true`.","Closes `main`."],"explanation":"`a > b` compared the two numbers and produced the boolean `true`, which you\nstored in `bigger` and printed. Comparisons are how programs turn data into the\nyes/no decisions you will branch on in the next unit.\n","placeholder_policy":"shown"},{"kind":"challenge","id":"ch2-c2f","title":"Convert Celsius to Fahrenheit","points":30,"difficulty":4,"intro":"You apply typed arithmetic. The formula is `F = C * 9/5 + 32`. Working in `f64`\nmatters: if you divided integers, `9/5` would truncate to `1` and the answer\nwould be wrong. Using floating-point literals (`9.0`, `5.0`, `32.0`) keeps the\nfraction exact.\n","instructions":"## Your turn\n\nImplement `celsius_to_fahrenheit`:\n\n```rust\npub fn celsius_to_fahrenheit(c: f64) -> f64 { ... }\n```\n\nReturn the temperature in Fahrenheit using `F = C * 9/5 + 32`.\n\nExamples:\n\n- `celsius_to_fahrenheit(0.0)` → `32.0`\n- `celsius_to_fahrenheit(100.0)` → `212.0`\n- `celsius_to_fahrenheit(-40.0)` → `-40.0`\n\n**Hint:** use floating-point literals (`9.0`, `5.0`, `32.0`) so the division\ndoes not truncate.\n\nHidden tests decide correctness.\n","starter":"pub fn celsius_to_fahrenheit(c: f64) -> f64 {\n    todo!(\"apply F = C * 9/5 + 32 in f64\")\n}\n","tests":"use student::celsius_to_fahrenheit;\n\n#[test]\nfn freezing_point() {\n    assert_eq!(celsius_to_fahrenheit(0.0), 32.0);\n}\n\n#[test]\nfn boiling_point() {\n    assert_eq!(celsius_to_fahrenheit(100.0), 212.0);\n}\n\n#[test]\nfn where_scales_meet() {\n    assert_eq!(celsius_to_fahrenheit(-40.0), -40.0);\n}\n","entry":"celsius_to_fahrenheit","gabarito":{"time":"O(1)","space":"O(1)","solution":"pub fn celsius_to_fahrenheit(c: f64) -> f64 {\n    c * 9.0 / 5.0 + 32.0\n}\n","justification":"The function does a fixed number of arithmetic operations — one multiply, one\ndivide, one add — regardless of the input value. There is no loop and no\nallocation, so both time and space are constant: **O(1)**. Using `f64` literals\nkeeps `9.0 / 5.0` as `1.8` instead of truncating to `1`.\n"}}]},{"id":"u3-control-flow","title":"Control flow: if/else & match","difficulty":3,"level":"basic","intro":"Programs make decisions. `if`/`else` chooses between paths based on a boolean,\nand because `if` is an **expression** in Rust it can even produce a value.\n`match` compares a value against patterns and runs the first that fits. By the\nend you will classify a number's sign under hidden tests.\n","steps":[{"kind":"concept","id":"c3-branching","title":"Choosing a path","points":5,"difficulty":3,"intro":"A branch is a fork in the road: the program evaluates a condition and takes one\nway or the other. In Rust `if` is not just a statement — it is an expression that\nevaluates to a value, so you can assign the chosen branch directly. `match` is\nthe exhaustive cousin: it forces you to handle every possibility, which is how\nRust stops you forgetting a case.\n","body":"## `if`/`else` and `match`\n\n`if` runs a block when its condition is `true`:\n\n```rust\nif n > 0 {\n    println!(\"positive\");\n} else {\n    println!(\"not positive\");\n}\n```\n\nBecause `if` is an expression, both arms can yield a value:\n\n```rust\nlet label = if n % 2 == 0 { \"even\" } else { \"odd\" };\n```\n\n`match` compares a value against patterns, top to bottom, and runs the first\nthat fits. The `_` arm catches everything else and makes the match exhaustive:\n\n```rust\nmatch n {\n    0 => println!(\"zero\"),\n    1 => println!(\"one\"),\n    _ => println!(\"many\"),\n}\n```\n"},{"kind":"drill","id":"d7-if-else","title":"Branch with if/else","points":10,"difficulty":3,"intro":"This drill takes one path or the other depending on a condition. The `%`\noperator gives the remainder of a division; `n % 2 == 0` is the classic test for\nan even number. Exactly one of the two blocks runs.\n","prompt":"Print whether a number is even or odd using `if`/`else`.\n\n**Why:** `n % 2` is the remainder after dividing by 2; it is `0` for even\nnumbers. The `if` runs one block, the `else` the other — never both.\n","target":"fn main() {\n    let n = 7;\n    if n % 2 == 0 {\n        println!(\"{n} is even\");\n    } else {\n        println!(\"{n} is odd\");\n    }\n}\n","line_comments":["Declares `main` and opens its body.","Binds `n` to `7`.","Tests the condition `n % 2 == 0`; the remainder of 7 / 2 is 1, so this is false.","The `if` block — would print `is even` — is skipped because the condition was false.","Closes the `if` block and begins `else`.","The `else` block runs instead, printing `7 is odd`.","Closes the `else` block.","Closes `main`."],"explanation":"`7 % 2` is `1`, so the condition `== 0` was `false` and Rust took the `else`\npath, printing `7 is odd`. Exactly one branch runs; change `n` to an even number\nand the other block would run instead.\n","placeholder_policy":"shown"},{"kind":"drill","id":"d8-if-expression","title":"if as an expression","points":10,"difficulty":4,"intro":"In Rust `if` yields a value, so you can bind the chosen branch straight to a\nvariable. Each arm's final expression (no semicolon) is its value, and both arms\nmust have the same type. This removes the need for a throwaway mutable variable.\n","prompt":"Use `if`/`else` as an expression to choose a label, then print it.\n\n**Why:** `if cond { a } else { b }` evaluates to `a` or `b`. Binding it with\n`let` is cleaner than mutating a variable afterwards.\n","target":"fn main() {\n    let n = 4;\n    let label = if n % 2 == 0 { \"even\" } else { \"odd\" };\n    println!(\"{n} is {label}\");\n}\n","line_comments":["Declares `main` and opens its body.","Binds `n` to `4`.","`if` is an expression: it evaluates to `\"even\"` (since 4 is even) and binds it to `label`.","Prints `4 is even`.","Closes `main`."],"explanation":"The `if`/`else` expression evaluated to `\"even\"` and that value was bound to\n`label` in one step. Using `if` as an expression keeps the code direct — no\ntemporary `mut` variable needed.\n","placeholder_policy":"shown"},{"kind":"drill","id":"d9-match","title":"Match on a value","points":10,"difficulty":4,"intro":"`match` lines a value up against patterns and runs the first arm that fits. The\nfinal `_` arm is the catch-all, which also makes the match **exhaustive** — Rust\nchecks that every possible value is covered. Here it names small numbers and\ncalls everything else `many`.\n","prompt":"Use `match` to turn a number into a word.\n\n**Why:** `match` picks the first matching arm. The `_` arm catches every other\nvalue, so the match covers all cases — Rust requires that.\n","target":"fn main() {\n    let n = 2;\n    let word = match n {\n        0 => \"zero\",\n        1 => \"one\",\n        2 => \"two\",\n        _ => \"many\",\n    };\n    println!(\"{n} -> {word}\");\n}\n","line_comments":["Declares `main` and opens its body.","Binds `n` to `2`.","Starts a `match` on `n`; its result is bound to `word`.","Arm: if `n` is `0`, the value is `\"zero\"`.","Arm: if `n` is `1`, the value is `\"one\"`.","Arm: `n` is `2`, so this arm matches and `word` becomes `\"two\"`.","Catch-all `_` arm: any other value would be `\"many\"`.","Closes the `match` expression (note the trailing semicolon on the `let`).","Prints `2 -> two`.","Closes `main`."],"explanation":"`match n` tried the arms top to bottom and `2 => \"two\"` fit, so `word` became\n`\"two\"`. The `_` arm guarantees every possible number is handled, which is why\nthe compiler accepts the match as complete.\n","placeholder_policy":"shown"},{"kind":"challenge","id":"ch3-sign","title":"Classify a number's sign","points":30,"difficulty":5,"intro":"You apply branching. The function returns one of three fixed words, so the return\ntype is `&'static str` — a borrowed view into text baked into the program itself,\nwhich is why no `String` allocation is needed. An `if`/`else if`/`else` chain, or\na `match` guard, picks the right one.\n","instructions":"## Your turn\n\nImplement `sign`:\n\n```rust\npub fn sign(n: i32) -> &'static str { ... }\n```\n\nReturn:\n\n- `\"negative\"` when `n < 0`\n- `\"zero\"` when `n == 0`\n- `\"positive\"` when `n > 0`\n\nExamples:\n\n- `sign(-5)` → `\"negative\"`\n- `sign(0)` → `\"zero\"`\n- `sign(7)` → `\"positive\"`\n\nHidden tests decide correctness.\n","starter":"pub fn sign(n: i32) -> &'static str {\n    to
