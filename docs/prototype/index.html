PLAIN QUERY\nPLAN` says so — its detail text contains `SCAN`.\n\n","prompt":"\nCreate a table with no index, `EXPLAIN QUERY PLAN` a `WHERE v = ?` lookup, and print\nwhether the plan contains `SCAN`.\n\n","target":"package main\n\nimport (\n\t\"database/sql\"\n\t\"fmt\"\n\t\"strings\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\nfunc main() {\n\tdb, _ := sql.Open(\"sqlite\", \":memory:\")\n\tdefer db.Close()\n\tdb.Exec(`CREATE TABLE t (id INTEGER, v TEXT)`)\n\tdb.Exec(`INSERT INTO t VALUES (1, 'a'), (2, 'b')`)\n\trows, _ := db.Query(`EXPLAIN QUERY PLAN SELECT v FROM t WHERE v = ?`, \"a\")\n\tdefer rows.Close()\n\tplan := \"\"\n\tfor rows.Next() {\n\t\tvar a, b, c int\n\t\tvar d string\n\t\trows.Scan(&a, &b, &c, &d)\n\t\tplan += d\n\t}\n\tfmt.Println(strings.Contains(plan, \"SCAN\"))\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `database/sql`...","...`fmt`...","...and `strings`, to inspect the plan text.","","...plus the pure-Go `modernc.org/sqlite` driver, blank-imported.","Closes the import group.","","Opens `main`.","Opens an in-memory SQLite database.","Closes the database when `main` returns.","Creates a table with NO index on `v`.","Inserts two rows.","Asks SQLite to EXPLAIN how it would run a lookup on `v`.","Closes the row set when done.","Accumulates the plan description.","Walks each plan row.","The first three EXPLAIN columns (id, parent, notused).","The human-readable detail column.","Scans the plan row.","Appends the detail text.","Closes the loop.","Prints `true`: with no index, SQLite must SCAN the whole table.","Closes `main`."],"explanation":"\nNo index on `v` leaves SQLite no choice but a full scan, so the plan detail contains\n`SCAN` and the program prints `true`.\n\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"ddb6-index","title":"An index means USING INDEX","points":10,"difficulty":10,"intro":"\nAdd an index on the filtered column and the plan changes to a seek. Selecting a\nnon-indexed column keeps it a plain `USING INDEX` (not a covering index).\n\n","prompt":"\nCreate an index on `v`, `EXPLAIN QUERY PLAN` a `WHERE v = ?` lookup, and print whether\nthe plan contains `USING INDEX`.\n\n","target":"package main\n\nimport (\n\t\"database/sql\"\n\t\"fmt\"\n\t\"strings\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\nfunc main() {\n\tdb, _ := sql.Open(\"sqlite\", \":memory:\")\n\tdefer db.Close()\n\tdb.Exec(`CREATE TABLE t (id INTEGER, v TEXT, w TEXT)`)\n\tdb.Exec(`CREATE INDEX idx_t_v ON t(v)`)\n\tdb.Exec(`INSERT INTO t VALUES (1, 'a', 'x'), (2, 'b', 'y')`)\n\trows, _ := db.Query(`EXPLAIN QUERY PLAN SELECT w FROM t WHERE v = ?`, \"a\")\n\tdefer rows.Close()\n\tplan := \"\"\n\tfor rows.Next() {\n\t\tvar a, b, c int\n\t\tvar d string\n\t\trows.Scan(&a, &b, &c, &d)\n\t\tplan += d\n\t}\n\tfmt.Println(strings.Contains(plan, \"USING INDEX\"))\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `database/sql`...","...`fmt`...","...and `strings`, to inspect the plan text.","","...plus the pure-Go `modernc.org/sqlite` driver, blank-imported.","Closes the import group.","","Opens `main`.","Opens an in-memory SQLite database.","Closes the database when `main` returns.","Creates a table with an extra column `w` (kept off the index).","Creates an index on column `v`.","Inserts two rows.","EXPLAINs a lookup on the indexed column `v`.","Closes the row set when done.","Accumulates the plan description.","Walks each plan row.","The first three EXPLAIN columns.","The human-readable detail column.","Scans the plan row.","Appends the detail text.","Closes the loop.","Prints `true`: the plan now says USING INDEX.","Closes `main`."],"explanation":"\nThe index on `v` lets SQLite seek instead of scan, so the plan detail contains\n`USING INDEX` and the program prints `true`.\n\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"ddb6-lookup","title":"Use the index to fetch a row","points":10,"difficulty":10,"intro":"\nBeyond the plan, the index just makes the real lookup fast. Create the index, then\nfetch a row by the indexed column and print its id.\n\n","prompt":"\nCreate an index on `email`, look up the user whose email is `b@x`, and print the\nmatching id (`2`).\n\n","target":"package main\n\nimport (\n\t\"database/sql\"\n\t\"fmt\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\nfunc main() {\n\tdb, _ := sql.Open(\"sqlite\", \":memory:\")\n\tdefer db.Close()\n\tdb.Exec(`CREATE TABLE users (id INTEGER, email TEXT)`)\n\tdb.Exec(`CREATE INDEX idx_email ON users(email)`)\n\tdb.Exec(`INSERT INTO users VALUES (1, 'a@x'), (2, 'b@x')`)\n\tvar id int\n\tdb.QueryRow(`SELECT id FROM users WHERE email = ?`, \"b@x\").Scan(&id)\n\tfmt.Println(id)\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `database/sql`, Go's standard database interface...","...and `fmt` for printing.","","...plus the pure-Go `modernc.org/sqlite` driver, blank-imported so it registers itself under the name `sqlite`.","Closes the import group.","","Opens `main`.","Opens an in-memory SQLite database.","Closes the database when `main` returns.","Creates a `users` table with an id and an email.","Creates an index on `email` so lookups are fast.","Inserts two users.","Will hold the id we look up.","Finds the user whose email is `b@x` using the indexed column.","Prints 2 — the matching id.","Closes `main`."],"explanation":"\nThe query reads like any other; the index just changes how the database finds the\nrow. The user with email `b@x` has id 2.\n\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"cdb6-usesindex","title":"Implement UsesIndexForLookup","points":40,"difficulty":11,"intro":"\nConfirm an index is actually used. Build a table and an index, ask SQLite to EXPLAIN a\n`WHERE col = ?` lookup, and report whether the chosen plan uses the index.\n\n","instructions":"\n## Your turn\n\nImplement the function `UsesIndexForLookup`:\n\n```go\nfunc UsesIndexForLookup() bool { ... }\n```\n\nCreate a table, `CREATE INDEX` on one column, and run\n`EXPLAIN QUERY PLAN SELECT ... WHERE <that column> = ?`. Read the plan rows (the last\ncolumn is the detail text) and return `true` if any detail contains the substring\n`\"USING INDEX\"`, else `false`.\n\nTip: select a column that is NOT in the index so the plan reads `USING INDEX` rather\nthan `USING COVERING INDEX`.\n\nExamples:\n\n- With a matching index -> `true`\n\nHidden tests decide correctness.\n\n","starter":"package student\n\nimport (\n\t\"database/sql\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\n// UsesIndexForLookup creates a table plus an index on one column, runs\n// EXPLAIN QUERY PLAN for a `WHERE col = ?` lookup, and reports whether the\n// plan text contains \"USING INDEX\".\nfunc UsesIndexForLookup() bool {\n\t// TODO: CREATE TABLE + CREATE INDEX, then read EXPLAIN QUERY PLAN rows and\n\t// check the detail column for \"USING INDEX\".\n\t_ = sql.Open\n\treturn false\n}\n","tests":"package student\n\nimport \"testing\"\n\nfunc TestUsesIndexTrue(t *testing.T) {\n\tif !UsesIndexForLookup() {\n\t\tt.Fatalf(\"UsesIndexForLookup() = false, want true (indexed column lookup)\")\n\t}\n}\n\nfunc TestUsesIndexDeterministic(t *testing.T) {\n\tfor i := 0; i < 3; i++ {\n\t\tif !UsesIndexForLookup() {\n\t\t\tt.Fatalf(\"call %d returned false, want stable true\", i)\n\t\t}\n\t}\n}\n\nfunc TestUsesIndexNotPanicking(t *testing.T) {\n\t_ = UsesIndexForLookup()\n}\n\nfunc TestUsesIndexConsistentPair(t *testing.T) {\n\ta := UsesIndexForLookup()\n\tb := UsesIndexForLookup()\n\tif a != b {\n\t\tt.Fatalf(\"inconsistent results: %v vs %v\", a, b)\n\t}\n\tif !a {\n\t\tt.Fatalf(\"expected true on indexed lookup\")\n\t}\n}\n","entry":"UsesIndexForLookup","gabarito":{"time":"O(1)","space":"O(1)","solution":"package student\n\nimport (\n\t\"database/sql\"\n\t\"strings\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\nfunc UsesIndexForLookup() bool {\n\tdb, err := sql.Open(\"sqlite\", \":memory:\")\n\tif err != nil {\n\t\treturn false\n\t}\n\tdefer db.Close()\n\tdb.Exec(`CREATE TABLE users (id INTEGER PRIMARY KEY, email TEXT, name TEXT)`)\n\tdb.Exec(`CREATE INDEX idx_users_email ON users(email)`)\n\tdb.Exec(`INSERT INTO users (id, email, name) VALUES (1, 'a@x', 'Ana'), (2, 'b@x', 'Bo')`)\n\trows, err := db.Query(`EXPLAIN QUERY PLAN SELECT name FROM users WHERE email = ?`, \"a@x\")\n\tif err != nil {\n\t\treturn false\n\t}\n\tdefer rows.Close()\n\tfound := false\n\tfor rows.Next() {\n\t\tvar id, parent, notUsed int\n\t\tvar detail string\n\t\tif err := rows.Scan(&id, &parent, &notUsed, &detail); err != nil {\n\t\t\treturn false\n\t\t}\n\t\tif strings.Contains(detail, \"USING INDEX\") {\n\t\t\tfound = true\n\t\t}\n\t}\n\treturn found\n}\n","justification":"\nThe table has a fixed tiny size and the work is a constant number of statements, so\ntime and space are **O(1)**. `EXPLAIN QUERY PLAN` exposes the optimiser's choice; a\nmatching index on the filtered column yields a `SEARCH ... USING INDEX` plan, which is\nwhy the detail contains `USING INDEX`.\n\n"}}]},{"id":"u11-goroutines-waitgroup","title":"Goroutines & WaitGroup","difficulty":11,"level":"advanced","intro":"The foundation of Go concurrency. A **goroutine** is a function that runs\nconcurrently, multiplexed by the Go runtime onto a small pool of OS threads — so\ncheap you can launch thousands, where native threads would cost you megabytes\neach. Launching one is just `go f()`. But a goroutine runs *independently*: if\n`main` returns, the program ends and in-flight goroutines are dropped. A\n`sync.WaitGroup` is the counter that lets `main` wait for a batch of goroutines to\nfinish. You will launch goroutines, coordinate them, and finish by summing a slice\nacross several of them — with a deterministic result.\n","steps":[{"kind":"concept","id":"c11-goroutines","title":"Goroutines vs threads, and WaitGroup","points":5,"difficulty":11,"intro":"Goroutines are not OS threads: the runtime schedules many goroutines onto few\nthreads, so they are cheap to create and switch. Because they run independently of\n`main`, you need an explicit way to wait for them — that is what a WaitGroup does.\n","body":"## Goroutines\n\n```go\ngo doWork()        // runs doWork concurrently, returns immediately\ngo func() { ... }() // or an anonymous function, launched at once\n```\n\nA goroutine is a lightweight thread managed by the Go runtime, not the OS. Starting\none with `go` returns instantly; the work happens alongside the rest of your\nprogram. The catch: when `main` returns, the whole program exits — any goroutine\nstill running is abandoned.\n\n## WaitGroup: wait for a batch\n\n```go\nvar wg sync.WaitGroup\nfor i := 0; i < 3; i++ {\n    wg.Add(1)              // one more goroutine to wait for\n    go func() {\n        defer wg.Done()    // mark this one done on return\n        work()\n    }()\n}\nwg.Wait()                  // block until the counter reaches zero\n```\n\nThree calls do all the work: **`Add(n)`** raises the counter, **`Done()`** lowers\nit by one (put it in a `defer` so it always runs), and **`Wait()`** blocks until\nthe counter hits zero. This is how `main` holds on until every goroutine finishes.\n\n## Passing the loop value\n\nWhen you launch a goroutine inside a loop, pass the loop value as an **argument**\nso each goroutine gets its own copy:\n\n```go\ngo func(n int) { use(n) }(i)\n```\n\n## A trick for lock-free results\n\nIf each goroutine writes to a **different slot** of a shared slice\n(`results[i] = ...`), no two goroutines ever touch the same memory, so you need no\nlock at all. You will use this to collect partial sums.\n"},{"kind":"drill","id":"d1-goroutines-wg","title":"Launch goroutines, wait with a WaitGroup","points":10,"difficulty":11,"intro":"Each iteration registers one goroutine with `Add(1)` and launches it; `defer\nwg.Done()` marks it finished on return; `wg.Wait()` holds `main` until all three\nare done, so the final line is guaranteed to print last.\n","prompt":"Launch three goroutines and use a `sync.WaitGroup` so `main` waits for all of them.\n","target":"package main\n\nimport (\n    \"fmt\"\n    \"sync\"\n)\n\nfunc main() {\n    var wg sync.WaitGroup\n    for i := 1; i <= 3; i++ {\n        wg.Add(1)\n        go func(n int) {\n            defer wg.Done()\n            fmt.Println(\"goroutine\", n, \"ran\")\n        }(i)\n    }\n    wg.Wait()\n    fmt.Println(\"all goroutines finished\")\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `fmt` for printing...","...and `sync` for the WaitGroup.","Closes the import group.","","Opens `main`.","Declares a WaitGroup: a counter of outstanding goroutines.","Loops to launch three goroutines.","Registers one more goroutine before starting it.","Starts a goroutine running an anonymous function; `n` is its own copy of `i`.","`defer` guarantees `Done` runs on return, decrementing the counter.","The goroutine's work: print its number.","Closes and calls the anonymous function with the current `i`.","Closes the loop body.","Blocks until the counter hits zero — all three goroutines finished.","Prints a final line, guaranteed after every goroutine.","Closes `main`."],"explanation":"`Add`/`Done`/`Wait` are the whole protocol. The three worker lines may print in any\norder — that is concurrency — but the final line always prints last, because\n`Wait` blocks until the count returns to zero.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d2-wg-index","title":"Collect results without a lock","points":10,"difficulty":11,"intro":"Each goroutine writes to its own slot of the `results` slice, so no two goroutines\never touch the same memory — disjoint writes need no mutex. `main` reads the slice\nonly after `Wait` returns.\n","prompt":"Square four numbers concurrently, each goroutine writing into its own slice slot.\n","target":"package main\n\nimport (\n    \"fmt\"\n    \"sync\"\n)\n\nfunc main() {\n    nums := []int{10, 20, 30, 40}\n    results := make([]int, len(nums))\n    var wg sync.WaitGroup\n    for i, n := range nums {\n        wg.Add(1)\n        go func(idx, val int) {\n            defer wg.Done()\n            results[idx] = val * val\n        }(i, n)\n    }\n    wg.Wait()\n    fmt.Println(results)\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `fmt`...","...and `sync`.","Closes the import group.","","Opens `main`.","The input: a slice of four numbers.","A results slice of the same length — each goroutine owns one slot.","A WaitGroup to wait for every goroutine.","Loops over the slice with index and value.","Registers one more goroutine.","Launches a goroutine; `idx` and `val` are its own copies.","`Done` runs on return.","Writes only to slot `idx` — no two goroutines share a slot, so no lock is needed.","Closes and calls the goroutine with this index and value.","Closes the loop body.","Waits for all goroutines to finish.","Prints the fully-populated results slice.","Closes `main`."],"explanation":"Writing to disjoint indices is the simplest safe way to gather concurrent results:\nno shared mutable cell, so no data race. The output `[100 400 900 1600]` is always\nin order, because slot `i` is always written by the goroutine that owns index `i`.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d3-wg-partials","title":"Sum a slice with a fixed worker count","points":10,"difficulty":11,"intro":"A preview of the challenge. Three workers split the slice by striding — worker\n`id` handles indices id, id+3, id+6, ... — each keeping a private running sum, then\n`main` combines the partials after `Wait`.\n","prompt":"Add up a slice using three workers, each summing every third element.\n","target":"package main\n\nimport (\n    \"fmt\"\n    \"sync\"\n)\n\nfunc main() {\n    nums := []int{1, 2, 3, 4, 5, 6}\n    const workers = 3\n    partials := make([]int, workers)\n    var wg sync.WaitGroup\n    wg.Add(workers)\n    for w := 0; w < workers; w++ {\n        go func(id int) {\n            defer wg.Done()\n            sum := 0\n            for i := id; i < len(nums); i += workers {\n                sum += nums[i]\n            }\n            partials[id] = sum\n        }(w)\n    }\n    wg.Wait()\n    total := 0\n    for _, p := range partials {\n        total += p\n    }\n    fmt.Println(\"total =\", total)\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `fmt`...","...and `sync`.","Closes the import group.","","Opens `main`.","The numbers to add up.","A fixed number of workers to divide the work among.","One result slot per worker — again, disjoint slots mean no lock.","A WaitGroup for the workers.","`Add` the whole count once, instead of one at a time.","Launches one goroutine per worker.","Each worker gets its own id.","`Done` on return.","A private running sum for this worker.","Strided loop: worker `id` handles indices id, id+workers, id+2*workers, ...","Adds each number it owns.","Closes the inner loop.","Stores this worker's partial sum in its own slot.","Closes and calls the worker goroutine.","Closes the launch loop.","Waits for every worker to finish.","Now combine the partials on the main goroutine.","Loops over the partial sums.","Adds each partial into the total.","Closes the combine loop.","Prints the final total.","Closes `main`."],"explanation":"Striding splits the work evenly without any shared counter: each worker reads its\nown indices and writes its own slot. Summing the partials afterwards is sequential\nand tiny. The total `21` is deterministic because addition does not care which\nworker finished first.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch11-sumparallel","title":"Implement SumParallel","points":40,"difficulty":11,"intro":"Put it together: sum a slice of integers using several goroutines, coordinated by a\nWaitGroup, with a result that is correct and deterministic no matter how the\nruntime schedules the work.\n","instructions":"## Your turn\n\nImplement the function `SumParallel`:\n\n```go\nfunc SumParallel(nums []int) int { ... }\n```\n\nReturn the sum of all integers in `nums`, computed with the help of several\ngoroutines coordinated by a `sync.WaitGroup`. The result must be correct and\ndeterministic regardless of goroutine scheduling.\n\nExamples:\n\n- `SumParallel([]int{1, 2, 3, 4, 5})` → `15`\n- `SumParallel(nil)` → `0`\n\n**Hint:** give each worker a disjoint share of the slice (for example by striding),\nlet it compute a private partial sum into its own slot, `Wait` for all of them, then\nadd the partials. Addition is commutative, so order never matters.\n\nHidden tests decide correctness. Implement it, then submit.\n","starter":"package student\n\n// SumParallel sums nums using several goroutines coordinated by a WaitGroup.\nfunc SumParallel(nums []int) int {\n\t// TODO: split the work across workers, sum each share, then combine\n\treturn 0\n}\n","tests":"package student\n\nimport \"testing\"\n\nfunc TestSumParallelBasic(t *testing.T) {\n\tif got := SumParallel([]int{1, 2, 3, 4, 5}); got != 15 {\n\t\tt.Fatalf(\"SumParallel(1..5) = %d, want 15\", got)\n\t}\n}\n\nfunc TestSumParallelEmpty(t *testing.T) {\n\tif got := SumParallel(nil); got != 0 {\n\t\tt.Fatalf(\"SumParallel(nil) = %d, want 0\", got)\n\t}\n}\n\nfunc TestSumParallelNegatives(t *testing.T) {\n\tif got := SumParallel([]int{-3, 3, -7, 7, 100}); got != 100 {\n\t\tt.Fatalf(\"SumParallel = %d, want 100\", got)\n\t}\n}\n\nfunc TestSumParallelLarge(t *testing.T) {\n\tnums := make([]int, 1000)\n\twant := 0\n\tfor i := range nums {\n\t\tnums[i] = i\n\t\twant += i\n\t}\n\tif got := SumParallel(nums); got != want {\n\t\tt.Fatalf(\"SumParallel(0..999) = %d, want %d\", got, want)\n\t}\n}\n","entry":"SumParallel","gabarito":{"time":"O(n)","space":"O(1)","solution":"package student\n\nimport \"sync\"\n\nfunc SumParallel(nums []int) int {\n\tconst workers = 4\n\tif len(nums) == 0 {\n\t\treturn 0\n\t}\n\tpartials := make([]int, workers)\n\tvar wg sync.WaitGroup\n\twg.Add(workers)\n\tfor w := 0; w < workers; w++ {\n\t\tgo func(id int) {\n\t\t\tdefer wg.Done()\n\t\t\tsum := 0\n\t\t\tfor i := id; i < len(nums); i += workers {\n\t\t\t\tsum += nums[i]\n\t\t\t}\n\t\t\tpartials[id] = sum\n\t\t}(w)\n\t}\n\twg.Wait()\n\ttotal := 0\n\tfor _, p := range partials {\n\t\ttotal += p\n\t}\n\treturn total\n}\n","justification":"Every element is visited exactly once across the workers, so the work is **O(n)**;\nthe only extra memory is one partial-sum slot per worker, a fixed count, so the\nextra space is **O(1)**. Each worker owns a disjoint stride of indices and its own\noutput slot, so there is no shared mutable state and no lock — and because addition\nis commutative, the total is identical no matter which goroutine the runtime runs\nfirst. That is what makes the result deterministic.\n"}}]},{"id":"u12-channels","title":"Channels","difficulty":12,"level":"advanced","intro":"Channels are how goroutines **communicate** — Go's motto is *\"don't communicate by\nsharing memory; share memory by communicating.\"* A channel is a typed pipe: one\ngoroutine sends values in, another receives them out, and the channel handles the\nsynchronisation. You will learn unbuffered channels (a send and a receive meet, a\nrendezvous), buffered channels (a small queue), how `close` signals \"no more\nvalues\", and how `range` drains a channel until it closes. The unit ends with a\nproducer/consumer pipeline that sums a stream of numbers.\n","steps":[{"kind":"concept","id":"c12-channels","title":"Sending, receiving, closing, ranging","points":5,"difficulty":12,"intro":"A channel carries values of one type between goroutines and synchronises them while\ndoing it. Unbuffered channels pair a send with a receive; buffered channels hold a\nfew values; closing a channel tells receivers the stream has ended.\n","body":"## Make, send, receive\n\n```go\nch := make(chan int)   // unbuffered channel of ints\nch <- 7                // send 7 (blocks until a receiver is ready)\nv := <-ch              // receive (blocks until a value is ready)\n```\n\nOn an **unbuffered** channel a send blocks until some goroutine receives, and a\nreceive blocks until some goroutine sends — the two meet at a single point, a\n*rendezvous*. That rendezvous is itself the synchronisation.\n\n## Buffered channels\n\n```go\nch := make(chan int, 3)  // room for three values\nch <- 1; ch <- 2; ch <- 3 // these do not block: there is room\n```\n\nA **buffered** channel holds up to its capacity without a waiting receiver. Sends\nblock only when the buffer is full; receives block only when it is empty.\n\n## Close and range\n\n```go\nclose(ch)             // no more values will be sent\nfor v := range ch {   // yields buffered values, then stops at close\n    use(v)\n}\n\nv, ok := <-ch         // ok == false once the channel is closed and drained\n```\n\n**`close`** marks a channel finished. A `range` over a channel reads values until it\nis closed and drained, then ends the loop. The two-value receive `v, ok := <-ch`\nreports whether a real value came (`ok` true) or the channel is closed (`ok` false).\nOnly the **sender** should close a channel, and never send on a closed one.\n\n## Directional channels\n\nA parameter typed `chan<- int` may only **send**; `<-chan int` may only **receive**.\nIt documents and enforces a goroutine's role.\n"},{"kind":"drill","id":"d1-unbuffered","title":"An unbuffered channel is a rendezvous","points":10,"difficulty":12,"intro":"The goroutine's send blocks until `main` receives; `main`'s receive blocks until the\ngoroutine sends. They meet at one point — that handshake both moves the value and\nsynchronises the two goroutines.\n","prompt":"Send a value from a goroutine and receive it in `main` over an unbuffered channel.\n","target":"package main\n\nimport \"fmt\"\n\nfunc main() {\n    ch := make(chan int)\n    go func() {\n        ch <- 42\n    }()\n    v := <-ch\n    fmt.Println(\"received\", v)\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","Opens `main`.","Makes an unbuffered channel of ints — a send waits for a matching receive.","Launches a goroutine, so the send has someone to pair with.","Sends 42; it blocks here until `main` receives.","Closes and calls the anonymous goroutine.","Receives from the channel — the moment the send completes, a rendezvous.","Prints the received value.","Closes `main`."],"explanation":"If you sent on an unbuffered channel from the only goroutine, the program would\ndeadlock — nobody to receive. Launching a goroutine gives the send a partner; the\ntwo block until they meet, which is exactly how channels synchronise work.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d2-buffered-range","title":"Buffer, close, and range","points":10,"difficulty":12,"intro":"A buffered channel takes three values without a receiver; `close` marks the end;\n`range` then yields them in first-in-first-out order and stops cleanly at the close.\n","prompt":"Fill a buffered channel, close it, and drain it with `range` — in FIFO order.\n","target":"package main\n\nimport \"fmt\"\n\nfunc main() {\n    ch := make(chan int, 3)\n    ch <- 1\n    ch <- 2\n    ch <- 3\n    close(ch)\n    for v := range ch {\n        fmt.Println(\"got\", v)\n    }\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","Opens `main`.","A buffered channel holding up to 3 ints — sends do not block while there is room.","Sends 1 into the buffer (no receiver needed yet).","Sends 2.","Sends 3 — the buffer is now full.","`close` says no more values will be sent.","`range` over a channel yields buffered values in FIFO order, then stops at close.","Prints each value: 1, 2, 3 — always in that order.","Closes the loop (it ends when the channel is drained and closed).","Closes `main`."],"explanation":"Buffering lets a sender run ahead of a receiver by up to the capacity. Closing is\nwhat lets `range` terminate — without it, the loop would block forever waiting for a\nfourth value. The output order is deterministic: a channel is a FIFO queue.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d3-directional","title":"Directional channels in a pipeline","points":10,"difficulty":12,"intro":"The `produce` function is typed `chan<- int`, so it may only send — the compiler\nenforces its role. It closes the channel when done, letting the consumer's `range`\nend on its own.\n","prompt":"Write a producer that only sends, and sum its output in `main` with `range`.\n","target":"package main\n\nimport \"fmt\"\n\nfunc produce(out chan<- int, n int) {\n    for i := 1; i <= n; i++ {\n        out <- i\n    }\n    close(out)\n}\n\nfunc main() {\n    ch := make(chan int)\n    go produce(ch, 4)\n    sum := 0\n    for v := range ch {\n        sum += v\n    }\n    fmt.Println(\"sum =\", sum)\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","A producer function; `chan<- int` means it may only SEND on this channel.","Loops from 1 to n.","Sends each number out.","Closes the loop.","Closes the channel so the consumer's range can stop.","Closes `produce`.","","Opens `main`.","Makes the channel the producer and consumer share.","Runs the producer concurrently.","A running sum on the main goroutine (the consumer).","Ranges over the channel until the producer closes it.","Adds each received value.","Closes the loop.","Prints the total: 1+2+3+4 = 10.","Closes `main`."],"explanation":"This is the shape of every Go pipeline: a producer sends and closes, a consumer\nranges and sums. Directional types make the roles explicit and let the compiler\ncatch mistakes (a producer that accidentally receives will not compile). The total\n`10` is deterministic — the consumer sees every value exactly once.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch12-sumpipeline","title":"Implement SumPipeline","points":40,"difficulty":12,"intro":"Build a producer/consumer pipeline: one goroutine produces the numbers on a channel\nand closes it; the main goroutine consumes with `range` and returns the sum. The\nresult is deterministic because the consumer sees every value exactly once.\n","instructions":"## Your turn\n\nImplement the function `SumPipeline`:\n\n```go\nfunc SumPipeline(nums []int) int { ... }\n```\n\nStart a goroutine that **sends** every element of `nums` on a channel and then\n**closes** it. In the calling goroutine, **`range`** over the channel and return the\nsum of everything you receive.\n\nExamples:\n\n- `SumPipeline([]int{1, 2, 3, 4, 5})` → `15`\n- `SumPipeline(nil)` → `0` (an empty producer closes immediately)\n\n**Hint:** the producer goroutine must `close` the channel when it is done, or the\nconsumer's `range` will block forever.\n\nHidden tests decide correctness. Implement it, then submit.\n","starter":"package student\n\n// SumPipeline sums nums through a producer/consumer channel pipeline.\nfunc SumPipeline(nums []int) int {\n\t// TODO: a goroutine sends nums and closes; range here and sum\n\treturn 0\n}\n","tests":"package student\n\nimport \"testing\"\n\nfunc TestSumPipelineBasic(t *testing.T) {\n\tif got := SumPipeline([]int{1, 2, 3, 4, 5}); got != 15 {\n\t\tt.Fatalf(\"SumPipeline(1..5) = %d, want 15\", got)\n\t}\n}\n\nfunc TestSumPipelineEmpty(t *testing.T) {\n\tif got := SumPipeline(nil); got != 0 {\n\t\tt.Fatalf(\"SumPipeline(nil) = %d, want 0\", got)\n\t}\n}\n\nfunc TestSumPipelineNegatives(t *testing.T) {\n\tif got := SumPipeline([]int{-10, 10, -5, 5}); got != 0 {\n\t\tt.Fatalf(\"SumPipeline = %d, want 0\", got)\n\t}\n}\n","entry":"SumPipeline","gabarito":{"time":"O(n)","space":"O(1)","solution":"package student\n\nfunc SumPipeline(nums []int) int {\n\tch := make(chan int)\n\tgo func() {\n\t\tfor _, n := range nums {\n\t\t\tch <- n\n\t\t}\n\t\tclose(ch)\n\t}()\n\ttotal := 0\n\tfor v := range ch {\n\t\ttotal += v\n\t}\n\treturn total\n}\n","justification":"The producer sends `n` values and the consumer receives `n` values, so the work is\n**O(n)**; the unbuffered channel holds at most one in-flight value, so the extra\nspace is **O(1)**. Closing the channel is what lets the consumer's `range` finish.\nThere is exactly one sender and one receiver, so no value is seen twice — the sum is\ndeterministic.\n"}}]},{"id":"u13-select-timeouts","title":"Select & timeouts","difficulty":13,"level":"advanced","intro":"A goroutine often has to wait on **several** channels at once, or give up after a\ndeadline. `select` is the tool: it blocks until one of its cases can proceed, then\nruns that one. Pair it with `time.After` — a channel from the standard library that\nfires after a duration — and you have timeouts. You will drain multiple channels,\nadd a timeout branch, and merge two closing channels into one deterministic total\nusing the nil-channel idiom.\n","steps":[{"kind":"concept","id":"c13-select","title":"select, multiple channels, time.After","points":5,"difficulty":13,"intro":"`select` waits on many channel operations and proceeds with whichever is ready\nfirst. With `time.After` you add a timeout case; with the two-value receive and a\nnil channel you can drain several channels until each one closes.\n","body":"## select\n\n```go\nselect {\ncase v := <-a:\n    useA(v)\ncase v := <-b:\n    useB(v)\n}\n```\n\n`select` blocks until **one** of its cases can run, then runs exactly that case. If\nseveral are ready, it picks one at random — so never rely on *which* case fires,\nonly on the invariant you maintain (for example, a running total).\n\n## Timeouts with time.After\n\n```go\nselect {\ncase v := <-work:\n    use(v)\ncase <-time.After(2 * time.Second):\n    fmt.Println(\"timed out\")\n}\n```\n\n`time.After(d)` returns a `<-chan Time` that receives a value after `d` elapses.\nPut it in a `select` and whichever happens first — the work or the deadline — wins.\n\n## Draining until closed: the nil-channel idiom\n\nA receive on a **nil** channel blocks forever, so a nil case in a `select` is simply\nnever chosen. That gives a clean way to merge channels until each closes:\n\n```go\nfor a != nil || b != nil {\n    select {\n    case v, ok := <-a:\n        if !ok { a = nil; continue } // closed: disable this case\n        use(v)\n    case v, ok := <-b:\n        if !ok { b = nil; continue }\n        use(v)\n    }\n}\n```\n\nWhen a channel closes, set its variable to `nil` so its case stops being selected;\nthe loop ends once both are nil. The *order* of arrivals varies, but a total you\naccumulate does not.\n"},{"kind":"drill","id":"d1-select-drain","title":"select picks whichever is ready","points":10,"difficulty":13,"intro":"Both channels are pre-loaded, so each `select` takes whichever one it happens to\npick first. You receive exactly two values and add them: the order select chooses\nvaries, but the total is fixed.\n","prompt":"Pre-load two channels and drain both with `select`, summing what you receive.\n","target":"package main\n\nimport \"fmt\"\n\nfunc main() {\n    a := make(chan int, 1)\n    b := make(chan int, 1)\n    a <- 10\n    b <- 20\n    sum := 0\n    for i := 0; i < 2; i++ {\n        select {\n        case v := <-a:\n            sum += v\n        case v := <-b:\n            sum += v\n        }\n    }\n    fmt.Println(\"sum =\", sum)\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","Opens `main`.","Buffered channel a, pre-loaded below.","Buffered channel b.","Puts 10 in a.","Puts 20 in b.","A running total.","We will receive exactly two values.","`select` waits until one of its cases is ready.","If a has a value, receive it...","...and add it.","If instead b is ready, receive it...","...and add it.","Closes the select.","Closes the loop.","Prints 30 — the order select chooses varies, but the total does not.","Closes `main`."],"explanation":"`select` is the multi-way wait: it proceeds with whatever is ready. Here both cases\nare ready, so Go may take either first — your code must not depend on the order,\nonly on the invariant (the running sum). The result `30` is deterministic.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d2-timeout","title":"Add a timeout with time.After","points":10,"difficulty":13,"intro":"The channel is pre-loaded, so its receive is ready immediately and always wins the\n`select`; the `time.After` branch is the deadline that would fire only if the value\nhad not arrived in time.\n","prompt":"Race a channel receive against a one-second timeout — the ready value wins.\n","target":"package main\n\nimport (\n    \"fmt\"\n    \"time\"\n)\n\nfunc main() {\n    ch := make(chan string, 1)\n    ch <- \"ready\"\n    select {\n    case msg := <-ch:\n        fmt.Println(\"got:\", msg)\n    case <-time.After(time.Second):\n        fmt.Println(\"timed out\")\n    }\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `fmt`...","...and `time`, for the timeout.","Closes the import group.","","Opens `main`.","A buffered channel with room for one value.","Pre-load it, so the receive below is already ready.","`select` races the two cases.","The channel case: ready now, because we pre-loaded it.","Prints the message — this branch always wins here.","`time.After` returns a channel that fires after one second.","The timeout branch — not taken, since the value is already waiting.","Closes the select.","Closes `main`."],"explanation":"`time.After` turns a deadline into just another channel, so a timeout is one more\n`select` case. Because the value is already in the buffer, its case is ready at once\nand always wins — a timeout only fires when the real work is too slow. No race, no\nflakiness.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d3-select-merge","title":"Merge two channels until both close","points":10,"difficulty":13,"intro":"A preview of the challenge. Two goroutines feed two channels and close them. The\n`select` loop drains both; when a channel closes, setting its variable to `nil`\ndisables that case, and the loop ends once both are nil.\n","prompt":"Merge two closing channels into one deterministic sum with the nil-channel idiom.\n","target":"package main\n\nimport \"fmt\"\n\nfunc main() {\n    a := make(chan int)\n    b := make(chan int)\n    go func() {\n        a <- 1\n        a <- 2\n        close(a)\n    }()\n    go func() {\n        b <- 10\n        b <- 20\n        close(b)\n    }()\n    sum := 0\n    for a != nil || b != nil {\n        select {\n        case v, ok := <-a:\n            if !ok {\n                a = nil\n                continue\n            }\n            sum += v\n        case v, ok := <-b:\n            if !ok {\n                b = nil\n                continue\n            }\n            sum += v\n        }\n    }\n    fmt.Println(\"merged sum =\", sum)\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","Opens `main`.","Unbuffered channel a.","Unbuffered channel b.","A goroutine feeding a...","...sends 1...","...sends 2...","...then closes a to signal it is done.","Closes and starts the goroutine.","A second goroutine feeding b...","...sends 10...","...sends 20...","...then closes b.","Closes and starts it.","The running total.","Keep looping while either channel is still open.","`select` takes whichever channel has a value next.","Receive from a, with the two-value form to detect close.","If `ok` is false the channel is closed and drained...","...set a to nil so this case is never ready again (a nil channel blocks forever)...","...and skip to the next iteration.","Closes the if.","Otherwise add the value.","Same for b: receive and detect close.","If b is closed...","...disable this case by nil-ing b...","...and continue.","Closes the if.","Otherwise add b's value.","Closes the select.","Closes the loop — both channels are now nil.","Prints the merged total: 1+2+10+20 = 33.","Closes `main`."],"explanation":"Setting a closed channel's variable to `nil` is the idiomatic way to retire a\n`select` case, because a receive on nil blocks forever and so is never chosen. The\nloop ends exactly when both channels have closed. Interleaving order varies; the\ntotal `33` does not.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch13-mergesum","title":"Implement MergeSum","points":40,"difficulty":13,"intro":"Merge two streams with `select`: feed each slice on its own channel, then drain both\nuntil each closes, summing everything. The total is deterministic even though the\ninterleaving of the two streams is not.\n","instructions":"## Your turn\n\nImplement the function `MergeSum`:\n\n```go\nfunc MergeSum(a, b []int) int { ... }\n```\n\nStart one goroutine that sends every element of `a` on a channel and closes it, and\nanother that does the same for `b`. In the calling goroutine, use a **`select`** loop\nto receive from whichever channel is ready, and return the sum of all values from\nboth.\n\nExamples:\n\n- `MergeSum([]int{1, 2, 3}, []int{10, 20})` → `36`\n- `MergeSum(nil, nil)` → `0`\n- `MergeSum([]int{5, 5, 5}, nil)` → `15`\n\n**Hint:** use the two-value receive `v, ok := <-ch` to detect a closed channel, and\nset that channel's variable to `nil` so its `select` case is never chosen again. Loop\nwhile either channel is still non-nil.\n\nHidden tests decide correctness. Implement it, then submit.\n","starter":"package student\n\n// MergeSum merges two channels with select and returns the total.\nfunc MergeSum(a, b []int) int {\n\t// TODO: feed a and b on two channels, drain both with select, sum\n\treturn 0\n}\n","tests":"package student\n\nimport \"testing\"\n\nfunc TestMergeSumBasic(t *testing.T) {\n\tif got := MergeSum([]int{1, 2, 3}, []int{10, 20}); got != 36 {\n\t\tt.Fatalf(\"MergeSum = %d, want 36\", got)\n\t}\n}\n\nfunc TestMergeSumEmpty(t *testing.T) {\n\tif got := MergeSum(nil, nil); got != 0 {\n\t\tt.Fatalf(\"MergeSum(nil,nil) = %d, want 0\", got)\n\t}\n}\n\nfunc TestMergeSumOneSide(t *testing.T) {\n\tif got := MergeSum([]int{5, 5, 5}, nil); got != 15 {\n\t\tt.Fatalf(\"MergeSum one-side = %d, want 15\", got)\n\t}\n}\n","entry":"MergeSum","gabarito":{"time":"O(n)","space":"O(1)","solution":"package student\n\nfunc MergeSum(a, b []int) int {\n\tca := make(chan int)\n\tcb := make(chan int)\n\tgo func() {\n\t\tfor _, n := range a {\n\t\t\tca <- n\n\t\t}\n\t\tclose(ca)\n\t}()\n\tgo func() {\n\t\tfor _, n := range b {\n\t\t\tcb <- n\n\t\t}\n\t\tclose(cb)\n\t}()\n\ttotal := 0\n\tfor ca != nil || cb != nil {\n\t\tselect {\n\t\tcase v, ok := <-ca:\n\t\t\tif !ok {\n\t\t\t\tca = nil\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\ttotal += v\n\t\tcase v, ok := <-cb:\n\t\t\tif !ok {\n\t\t\t\tcb = nil\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\ttotal += v\n\t\t}\n\t}\n\treturn total\n}\n","justification":"Every element of both slices is received exactly once, so the work is **O(n)** in the\ncombined length; the two unbuffered channels hold at most one in-flight value each,\nso the extra space is **O(1)**. The nil-channel idiom retires each case as its\nchannel closes, and the loop ends when both are nil. `select` may interleave the two\nstreams in any order, but summation is commutative, so the total is deterministic.\n"}}]},{"id":"u14-shared-state","title":"Shared state: Mutex & worker pools","difficulty":14,"level":"advanced","intro":"Sometimes goroutines really must share one piece of memory — a counter, a map, an\naccumulator. Then you need **mutual exclusion**: a `sync.Mutex` whose `Lock`/`Unlock`\nlets only one goroutine into the critical section at a time, so updates are not\nlost. For simple counters, `sync/atomic` does the same lock-free. And the canonical\nway to bound concurrency is a **worker pool**: a fixed set of goroutines pulling\njobs from one channel and pushing results to another. You will guard a shared\ncounter, build a pool, and finish with a deterministic parallel count.\n","steps":[{"kind":"concept","id":"c14-shared-state","title":"Mutex, atomic, and the worker-pool pattern","points":5,"difficulty":14,"intro":"When goroutines share mutable memory, concurrent writes race and updates get lost. A\n`sync.Mutex` serialises access to a critical section; `sync/atomic` does it lock-free\nfor single integers. A worker pool bounds how many goroutines run at once.\n","body":"## The problem: a data race\n\nTwo goroutines running `counter++` can read the same old value and both write back\n`old+1`, losing one increment. The `-race` detector flags exactly this.\n\n## sync.Mutex\n\n```go\nvar mu sync.Mutex\nmu.Lock()\ncounter++        // critical section: exactly one goroutine at a time\nmu.Unlock()\n```\n\n`Lock` blocks until the mutex is free, then this goroutine owns it; `Unlock` releases\nit. Only one goroutine holds the lock at once, so the increment is safe. Keep the\ncritical section small, and never forget to `Unlock` (a `defer mu.Unlock()` is common).\n\n## sync/atomic\n\n```go\nvar n int64\natomic.AddInt64(&n, 1)      // safe increment, no lock\ntotal := atomic.LoadInt64(&n)\n```\n\nFor a single counter, an atomic operation is simpler and faster than a mutex: the\nhardware guarantees the read-modify-write happens as one indivisible step.\n\n## Worker pool\n\nLaunch a fixed number of workers, each ranging over a shared **jobs** channel and\nsending to a **results** channel:\n\n```go\njobs := make(chan int)\nresults := make(chan int)\nfor w := 0; w < N; w++ {\n    go func() {\n        for j := range jobs { results <- process(j) }\n    }()\n}\n```\n\nFeed jobs, `close(jobs)` when done, and in a separate goroutine `wg.Wait()` then\n`close(results)` so the collector's `range` can finish. A pool bounds concurrency to\n`N` no matter how many jobs arrive — the standard shape for parallel work in Go.\n"},{"kind":"drill","id":"d1-mutex","title":"Guard a shared counter with a Mutex","points":10,"difficulty":14,"intro":"A hundred goroutines increment one shared counter. The mutex makes each increment a\ncritical section entered by one goroutine at a time, so no update is lost — the\nresult is exactly 100.\n","prompt":"Increment a shared counter from 100 goroutines, protected by a `sync.Mutex`.\n","target":"package main\n\nimport (\n    \"fmt\"\n    \"sync\"\n)\n\nfunc main() {\n    var mu sync.Mutex\n    counter := 0\n    var wg sync.WaitGroup\n    for i := 0; i < 100; i++ {\n        wg.Add(1)\n        go func() {\n            defer wg.Done()\n            mu.Lock()\n            counter++\n            mu.Unlock()\n        }()\n    }\n    wg.Wait()\n    fmt.Println(\"counter =\", counter)\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `fmt`...","...and `sync`, for Mutex and WaitGroup.","Closes the import group.","","Opens `main`.","A mutex: only one goroutine may hold its lock at a time.","The shared counter every goroutine will increment.","A WaitGroup to wait for all 100 goroutines.","Launches one hundred goroutines.","Registers each one.","Starts a goroutine.","`Done` on return.","Takes the lock — any other goroutine must wait here.","The critical section: increment the shared counter safely.","Releases the lock so the next goroutine can proceed.","Closes and calls the goroutine.","Closes the loop.","Waits for all of them.","Prints 100 — the lock makes the result deterministic (no lost updates).","Closes `main`."],"explanation":"Without the lock, concurrent `counter++` would race and you would usually see fewer\nthan 100. The mutex serialises the critical section, so every increment lands. Run\nit under `go run -race .` and the detector stays silent — the lock removed the race.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d2-worker-pool","title":"Build a worker pool","points":10,"difficulty":14,"intro":"Three workers pull jobs from one channel and push squares to another. A separate\ngoroutine waits for the workers and closes the results channel, so the collector's\n`range` ends cleanly. The total is the same no matter which worker handled which job.\n","prompt":"Square five numbers with a three-worker pool and sum the results.\n","target":"package main\n\nimport (\n    \"fmt\"\n    \"sync\"\n)\n\nfunc main() {\n    jobs := make(chan int, 5)\n    results := make(chan int, 5)\n    var wg sync.WaitGroup\n    for w := 0; w < 3; w++ {\n        wg.Add(1)\n        go func() {\n            defer wg.Done()\n            for j := range jobs {\n                results <- j * j\n            }\n        }()\n    }\n    for i := 1; i <= 5; i++ {\n        jobs <- i\n    }\n    close(jobs)\n    go func() {\n        wg.Wait()\n        close(results)\n    }()\n    total := 0\n    for r := range results {\n        total += r\n    }\n    fmt.Println(\"sum of squares =\", total)\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `fmt`...","...and `sync`.","Closes the import group.","","Opens `main`.","The jobs channel: work waiting to be done.","The results channel: finished work coming back.","A WaitGroup to know when all workers are done.","Starts three worker goroutines — the pool.","Registers each worker.","Each worker is a goroutine.","`Done` when the worker returns.","A worker pulls jobs until the channel is closed and drained.","Does the work (square it) and sends the result.","Closes the worker's range loop.","Closes and starts the worker.","Closes the pool-launch loop.","The main goroutine feeds five jobs...","...one at a time into the jobs channel.","Closes the feed loop.","`close(jobs)` tells the workers no more jobs are coming.","A closer goroutine...","...waits for all workers to finish...","...then closes results so the collector below can stop.","Closes and starts the closer.","The collected total.","Ranges over results until it is closed.","Adds each result.","Closes the collect loop.","Prints 55 = 1+4+9+16+25 — deterministic regardless of which worker did which job.","Closes `main`."],"explanation":"The pool bounds concurrency to three workers however many jobs arrive. Closing\n`jobs` ends each worker's `range`; a separate goroutine waits for them all, then\ncloses `results` so the collector can finish. The total `55` is deterministic: every\njob is processed exactly once and addition does not care about order.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d3-atomic","title":"A lock-free counter with sync/atomic","points":10,"difficulty":14,"intro":"For a single integer counter, `sync/atomic` is simpler than a mutex: the add is one\nindivisible hardware operation, so fifty goroutines produce exactly 50 with no lock\nand no race.\n","prompt":"Count to 50 across goroutines using `atomic.AddInt64` instead of a mutex.\n","target":"package main\n\nimport (\n    \"fmt\"\n    \"sync\"\n    \"sync/atomic\"\n)\n\nfunc main() {\n    var counter int64\n    var wg sync.WaitGroup\n    for i := 0; i < 50; i++ {\n        wg.Add(1)\n        go func() {\n            defer wg.Done()\n            atomic.AddInt64(&counter, 1)\n        }()\n    }\n    wg.Wait()\n    fmt.Println(\"counter =\", atomic.LoadInt64(&counter))\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `fmt`...","...of `sync` for the WaitGroup...","...and `sync/atomic` for lock-free counting.","Closes the import group.","","Opens `main`.","An int64 counter — `atomic` operates on sized integers.","A WaitGroup for the goroutines.","Launches fifty goroutines.","Registers each.","Starts a goroutine.","`Done` on return.","`atomic.AddInt64` increments safely without a mutex — one indivisible operation.","Closes and calls the goroutine.","Closes the loop.","Waits for all fifty.","Reads the counter atomically and prints 50.","Closes `main`."],"explanation":"Atomics are the lightest tool for a single shared counter: no lock to acquire, just a\nhardware-level read-modify-write. For anything more than one value (a map, several\nfields updated together) reach back for a `sync.Mutex`. Either way the result here is\na deterministic 50, and `-race` stays silent.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch14-parallelcount","title":"Implement ParallelCount","points":40,"difficulty":14,"intro":"Finish the track with the worker-pool pattern: dispatch the numbers to a fixed set\nof workers over a jobs channel, have them report over a results channel, and return\nhow many are even. Bounded concurrency, deterministic total.\n","instructions":"## Your turn\n\nImplement the function `ParallelCount`:\n\n```go\nfunc ParallelCount(nums []int) int { ... }\n```\n\nUsing a **worker pool** (a fixed number of goroutines reading from a shared jobs\nchannel and writing to a results channel), return how many values in `nums` are\n**even**. The answer must be deterministic regardless of scheduling.\n\nExamples:\n\n- `ParallelCount([]int{1, 2, 3, 4, 5, 6})` → `3`\n- `ParallelCount(nil)` → `0`\n- `ParallelCount([]int{1, 3, 5, 7})` → `0`\n\n**Hint:** start N workers that `range` over the jobs channel; feed the numbers and\n`close(jobs)`; in a separate goroutine `wg.Wait()` then `close(results)`; sum the\nresults (1 for even, 0 for odd) on the calling goroutine.\n\nHidden tests decide correctness. Implement it, then submit.\n","starter":"package student\n\n// ParallelCount returns how many values in nums are even, using a worker pool.\nfunc ParallelCount(nums []int) int {\n\t// TODO: N workers over a jobs channel, results channel, sum the evens\n\treturn 0\n}\n","tests":"package student\n\nimport \"testing\"\n\nfunc TestParallelCountBasic(t *testing.T) {\n\tif got := ParallelCount([]int{1, 2, 3, 4, 5, 6}); got != 3 {\n\t\tt.Fatalf(\"ParallelCount(1..6) = %d, want 3\", got)\n\t}\n}\n\nfunc TestParallelCountEmpty(t *testing.T) {\n\tif got := ParallelCount(nil); got != 0 {\n\t\tt.Fatalf(\"ParallelCount(nil) = %d, want 0\", got)\n\t}\n}\n\nfunc TestParallelCountAllOdd(t *testing.T) {\n\tif got := ParallelCount([]int{1, 3, 5, 7}); got != 0 {\n\t\tt.Fatalf(\"ParallelCount(all odd) = %d, want 0\", got)\n\t}\n}\n\nfunc TestParallelCountLarge(t *testing.T) {\n\tnums := make([]int, 1000)\n\tfor i := range nums {\n\t\tnums[i] = i\n\t}\n\tif got := ParallelCount(nums); got != 500 {\n\t\tt.Fatalf(\"ParallelCount(0..999) = %d, want 500\", got)\n\t}\n}\n","entry":"ParallelCount","gabarito":{"time":"O(n)","space":"O(1)","solution":"package student\n\nimport \"sync\"\n\nfunc ParallelCount(nums []int) int {\n\tconst workers = 4\n\tjobs := make(chan int)\n\tresults := make(chan int)\n\tvar wg sync.WaitGroup\n\twg.Add(workers)\n\tfor w := 0; w < workers; w++ {\n\t\tgo func() {\n\t\t\tdefer wg.Done()\n\t\t\tfor n := range jobs {\n\t\t\t\tif n%2 == 0 {\n\t\t\t\t\tresults <- 1\n\t\t\t\t} else {\n\t\t\t\t\tresults <- 0\n\t\t\t\t}\n\t\t\t}\n\t\t}()\n\t}\n\tgo func() {\n\t\tfor _, n := range nums {\n\t\t\tjobs <- n\n\t\t}\n\t\tclose(jobs)\n\t}()\n\tgo func() {\n\t\twg.Wait()\n\t\tclose(results)\n\t}()\n\ttotal := 0\n\tfor r := range results {\n\t\ttotal += r\n\t}\n\treturn total\n}\n","justification":"Each of the `n` numbers is processed once by some worker and produces one result, so\nthe work is **O(n)**; the pool is a fixed number of workers with unbuffered channels,\nso the extra space is **O(1)** (independent of `n`). The pool bounds concurrency, the\ncloser goroutine ends the results stream after every worker finishes, and because the\ncount is a sum of 0/1 flags, it is identical no matter which worker handled which\nnumber — deterministic.\n"}}]},{"id":"u15-stacks-queues","title":"Stacks & queues with slices","difficulty":15,"level":"advanced","intro":"Two of the most useful data structures need no library at all — a Go slice is enough.\nPush and pop from the right and a slice behaves as a **stack** (last in, first out);\ntake from the front instead and it is a **queue** (first in, first out). You will build\nboth, use a stack to reverse a slice, and finish by checking bracket balance — the\ncanonical stack problem.\n","steps":[{"kind":"concept","id":"c15-stacks-queues","title":"A slice is a stack and a queue","points":5,"difficulty":15,"intro":"`append` grows a slice on the right; reslicing shrinks it. Pop the right end and you have\na LIFO stack; take the left end and you have a FIFO queue. No container package required.\n","body":"## Stack (LIFO)\n\nPush with `append`, peek the last element, pop by reslicing away the last element:\n\n```go\nstack = append(stack, x)      // push\ntop := stack[len(stack)-1]    // peek the top\nstack = stack[:len(stack)-1]  // pop\n```\n\nLast in, first out: the most recent push is the first pop.\n\n## Queue (FIFO)\n\nPush on the right, but take from the **front**:\n\n```go\nqueue = append(queue, x)  // enqueue\nfront := queue[0]         // peek the front\nqueue = queue[1:]         // dequeue\n```\n\nFirst in, first out: the oldest element leaves first.\n\n## When to reach for what\n\nA stack models \"undo\", recursion, and matching brackets. A queue models work waiting in\nline and breadth-first traversal. Reslicing is O(1), so both are cheap. (Reslicing a\nqueue's front repeatedly keeps the dropped heads in the backing array; for long-lived\nqueues use a ring buffer or `container/list`. For exercises, a slice is perfect.)\n"},{"kind":"drill","id":"d1-stack","title":"Push and pop a stack","points":10,"difficulty":15,"intro":"Push three values onto a slice-stack, then pop one. Because the last value pushed is the\nfirst popped, the result is fully deterministic.\n","prompt":"Push 1, 2, 3 onto a stack, then pop the top.\n\n**Why:** a stack is the simplest use of `append`/reslice, and its last-in-first-out order\nis the backbone of bracket matching, undo stacks, and depth-first traversal.\n","target":"package main\n\nimport \"fmt\"\n\nfunc main() {\n    stack := []int{}\n    stack = append(stack, 1)\n    stack = append(stack, 2)\n    stack = append(stack, 3)\n    top := stack[len(stack)-1]\n    stack = stack[:len(stack)-1]\n    fmt.Println(\"popped\", top, \"left\", stack)\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt` for printing.","","Opens `main`.","An empty int slice used as a stack.","Push 1 — `append` grows the slice on the right (the top).","Push 2 on top.","Push 3 on top — the stack is now [1 2 3].","Peek the top: the last element.","Pop: reslice to drop the last element (LIFO).","Prints `popped 3 left [1 2]` — last in, first out.","Closes `main`."],"explanation":"The top of a slice-stack is its last element, so peeking is `stack[len(stack)-1]` and\npopping is `stack[:len(stack)-1]`. Push 1, 2, 3 and the top is 3 — the most recent push\nis the first pop. Deterministic every run.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d2-queue","title":"Enqueue and dequeue a queue","points":10,"difficulty":15,"intro":"Enqueue three strings on the right, then dequeue from the front. First in, first out — the\noldest value leaves first, so the output never varies.\n","prompt":"Enqueue \"a\", \"b\", \"c\", then dequeue the front.\n\n**Why:** the only difference between a stack and a queue is which end you remove from;\ntaking the front gives FIFO order, the shape of job queues and breadth-first search.\n","target":"package main\n\nimport \"fmt\"\n\nfunc main() {\n    queue := []string{}\n    queue = append(queue, \"a\")\n    queue = append(queue, \"b\")\n    queue = append(queue, \"c\")\n    front := queue[0]\n    queue = queue[1:]\n    fmt.Println(\"served\", front, \"left\", queue)\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","Opens `main`.","An empty string slice used as a queue.","Enqueue \"a\" at the back.","Enqueue \"b\".","Enqueue \"c\" — the queue is now [a b c].","Peek the front: the first element.","Dequeue: reslice to drop the first element (FIFO).","Prints `served a left [b c]` — first in, first out.","Closes `main`."],"explanation":"A queue removes from the front: peek is `queue[0]`, dequeue is `queue[1:]`. The first value\nenqueued (\"a\") is the first served, so FIFO order makes the output deterministic.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d3-stack-reverse","title":"Reverse a slice with a stack","points":10,"difficulty":15,"intro":"Push every value onto a stack, then pop them all. Popping yields the values in reverse\norder — a stack is a reversing machine.\n","prompt":"Reverse [1 2 3 4] by pushing each value, then popping all.\n\n**Why:** reversal falls out of LIFO for free; the same push-then-drain idea powers\ndepth-first traversal and expression evaluation.\n","target":"package main\n\nimport \"fmt\"\n\nfunc main() {\n    in := []int{1, 2, 3, 4}\n    stack := []int{}\n    for _, v := range in {\n        stack = append(stack, v)\n    }\n    out := []int{}\n    for len(stack) > 0 {\n        out = append(out, stack[len(stack)-1])\n        stack = stack[:len(stack)-1]\n    }\n    fmt.Println(out)\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","Opens `main`.","The input slice.","An empty stack.","Walk the input left to right...","...pushing each value onto the stack.","Closes the push loop.","The output slice.","While the stack is not empty...","...append its top to the output...","...and pop that top off (reslice).","Closes the pop loop.","Prints `[4 3 2 1]` — a stack reverses order.","Closes `main`."],"explanation":"Pushing 1,2,3,4 and then popping gives 4,3,2,1: the last pushed is the first popped. Draining\na stack into a new slice reverses it, with no index arithmetic and no extra copy.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch15-balancedparens","title":"Implement BalancedParens","points":40,"difficulty":15,"intro":"The classic stack problem: decide whether a string of brackets is balanced. Push each\nopener; on a closer, the top of the stack must be its matching opener. Empty stack at the\nend means balanced.\n","instructions":"## Your turn\n\nImplement the function `BalancedParens`:\n\n```go\nfunc BalancedParens(s string) bool { ... }\n```\n\nReturn `true` when every bracket in `s` is closed in the correct order, considering the\nthree pairs `()`, `[]` and `{}`. Any other character should be ignored.\n\nExamples:\n\n- `BalancedParens(\"\")` -> `true`\n- `BalancedParens(\"()[]{}\")` -> `true`\n- `BalancedParens(\"([{}])\")` -> `true`\n- `BalancedParens(\"(]\")` -> `false`\n- `BalancedParens(\")(\")` -> `false`\n\n**Hint:** keep a stack of open brackets. Push every opener. On a closer, fail if the stack\nis empty or its top is not the matching opener; otherwise pop. At the end, balanced means\nthe stack is empty.\n\nHidden tests decide correctness.\n","starter":"package student\n\n// BalancedParens reports whether every bracket in s is closed in the right order.\nfunc BalancedParens(s string) bool {\n\tpanic(\"todo\")\n}\n","tests":"package student\n\nimport \"testing\"\n\nfunc TestBalancedEmpty(t *testing.T) {\n\tif !BalancedParens(\"\") {\n\t\tt.Fatal(\"empty string should be balanced\")\n\t}\n}\n\nfunc TestBalancedSimple(t *testing.T) {\n\tif !BalancedParens(\"()[]{}\") {\n\t\tt.Fatal(\"()[]{} should be balanced\")\n\t}\n}\n\nfunc TestBalancedNested(t *testing.T) {\n\tif !BalancedParens(\"([{}])\") {\n\t\tt.Fatal(\"([{}]) should be balanced\")\n\t}\n}\n\nfunc TestBalancedMismatch(t *testing.T) {\n\tif BalancedParens(\"(]\") {\n\t\tt.Fatal(\"(] should not be balanced\")\n\t}\n}\n\nfunc TestBalancedUnclosed(t *testing.T) {\n\tif BalancedParens(\"(((\") {\n\t\tt.Fatal(\"((( should not be balanced\")\n\t}\n}\n\nfunc TestBalancedWrongOrder(t *testing.T) {\n\tif BalancedParens(\")(\") {\n\t\tt.Fatal(\")( should not be balanced\")\n\t}\n}\n\nfunc TestBalancedIgnoresOther(t *testing.T) {\n\tif !BalancedParens(\"a(b)c[d]e\") {\n\t\tt.Fatal(\"non-bracket characters should be ignored\")\n\t}\n}\n","entry":"BalancedParens","gabarito":{"time":"O(n)","space":"O(n)","solution":"package student\n\nfunc BalancedParens(s string) bool {\n\tpairs := map[rune]rune{')': '(', ']': '[', '}': '{'}\n\tvar stack []rune\n\tfor _, c := range s {\n\t\tswitch c {\n\t\tcase '(', '[', '{':\n\t\t\tstack = append(stack, c)\n\t\tcase ')', ']', '}':\n\t\t\tif len(stack) == 0 || stack[len(stack)-1] != pairs[c] {\n\t\t\t\treturn false\n\t\t\t}\n\t\t\tstack = stack[:len(stack)-1]\n\t\t}\n\t}\n\treturn len(stack) == 0\n}\n","justification":"Each character is visited once, so the scan is **O(n)**; the stack holds at most one entry\nper unmatched opener, so worst-case space is **O(n)**. A closer is legal only when the stack\ntop is its matching opener — otherwise the string is unbalanced. Leftover openers at the end\n(non-empty stack) also mean unbalanced. Non-bracket characters hit no `switch` case and are\nignored.\n"}}]},{"id":"u16-linked-list","title":"Singly linked lists","difficulty":16,"level":"advanced","intro":"A linked list stores each value in its own node that points to the next one. Unlike a\nslice, there is no contiguous block — just pointers hopping from node to node. You will\ndefine a `Node`, push to the front, pop from the front, measure length, and finish by\nreversing a slice through a list.\n","steps":[{"kind":"concept","id":"c16-linked-list","title":"Nodes and pointers","points":5,"difficulty":16,"intro":"A node holds a value and a pointer to the next node. A `nil` next marks the end. The list\nitself is just a pointer to the first node — the head.\n","body":"## The node\n\n```go\ntype Node struct {\n    Val  int\n    Next *Node\n}\n```\n\n`Next` is a pointer; `nil` means \"no next node\". An empty list is a `nil` head.\n\n## Push to the front\n\nMake a new node whose `Next` is the current head, then move the head to it — O(1):\n\n```go\nhead = &Node{Val: v, Next: head}\n```\n\n## Walk the list\n\nFollow `Next` from the head until you reach `nil`:\n\n```go\nfor n := head; n != nil; n = n.Next {\n    use(n.Val)\n}\n```\n\nPushing to the front is cheap and reverses insertion order: the last value pushed is the\nfirst one you meet when walking. Popping the front is just `head = head.Next`. That front\nbias is exactly what makes a linked list a natural reversing tool.\n"},{"kind":"drill","id":"d1-push-front","title":"Build a list by pushing to the front","points":10,"difficulty":16,"intro":"Push 1, 2, 3 to the front of a list, then walk it. Because each push lands in front, the\nwalk sees them newest-first — a deterministic 3 2 1.\n","prompt":"Push 1, 2, 3 to the front of a linked list and print the values.\n\n**Why:** front insertion is the O(1) building block of linked lists, and it naturally\nreverses the order you insert in.\n","target":"package main\n\nimport \"fmt\"\n\ntype Node struct {\n    Val  int\n    Next *Node\n}\n\nfunc main() {\n    var head *Node\n    head = &Node{Val: 1, Next: head}\n    head = &Node{Val: 2, Next: head}\n    head = &Node{Val: 3, Next: head}\n    for n := head; n != nil; n = n.Next {\n        fmt.Print(n.Val, \" \")\n    }\n    fmt.Println()\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","A singly linked list node...","...holding an int value...","...and a pointer to the next node (nil at the end).","Closes the struct.","","Opens `main`.","An empty list is just a nil head pointer.","Push 1 to the front: a node whose Next is the old head.","Push 2 to the front.","Push 3 to the front — head now points at 3.","Walk from head following Next until nil.","Print each value.","Closes the walk loop.","Finish the line.","Closes `main`."],"explanation":"Each `&Node{Val: v, Next: head}` splices a new node in front of the current head, then head\nmoves to it. Pushing 1,2,3 leaves the list 3 -> 2 -> 1 -> nil, so the walk prints `3 2 1`.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d2-pop-front","title":"Pop the front of a list","points":10,"difficulty":16,"intro":"Remove the first node by moving the head to the second node. The popped value and the new\nhead are both fixed, so the output is deterministic.\n","prompt":"Pop the front node of a two-node list and show the new head.\n\n**Why:** popping the front is just `head = head.Next` — O(1), and the mirror image of\npushing to the front.\n","target":"package main\n\nimport \"fmt\"\n\ntype Node struct {\n    Val  int\n    Next *Node\n}\n\nfunc main() {\n    head := &Node{Val: 10, Next: &Node{Val: 20, Next: nil}}\n    popped := head.Val\n    head = head.Next\n    fmt.Println(\"popped\", popped, \"newHead\", head.Val)\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","The list node type...","...an int value...","...and the next pointer.","Closes the struct.","","Opens `main`.","A two-node list: 10 -> 20 -> nil.","Remember the front value before removing it.","Pop the front: move head to the second node.","Prints `popped 10 newHead 20`.","Closes `main`."],"explanation":"Popping the front keeps a copy of `head.Val`, then advances `head` to `head.Next`. The old\nfirst node is now unreferenced (garbage collected). New head is 20 — deterministic.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d3-length","title":"Measure a list's length","points":10,"difficulty":16,"intro":"Count the nodes by walking from head to nil, one tick per node. A three-node list has\nlength 3, every time.\n","prompt":"Count the nodes in a three-node list.\n\n**Why:** length is O(n) for a linked list — there is no stored size, so you must walk it.\nThat walk is the template for every list operation.\n","target":"package main\n\nimport \"fmt\"\n\ntype Node struct {\n    Val  int\n    Next *Node\n}\n\nfunc length(head *Node) int {\n    count := 0\n    for n := head; n != nil; n = n.Next {\n        count++\n    }\n    return count\n}\n\nfunc main() {\n    list := &Node{Val: 1, Next: &Node{Val: 2, Next: &Node{Val: 3, Next: nil}}}\n    fmt.Println(\"length =\", length(list))\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","The list node type...","...an int value...","...and the next pointer.","Closes the struct.","","`length` counts the nodes starting at head.","Start the counter at zero.","Walk from head to nil...","...counting one per node.","Closes the walk loop.","Return the count.","Closes `length`.","","Opens `main`.","A three-node list: 1 -> 2 -> 3 -> nil.","Prints `length = 3`.","Closes `main`."],"explanation":"A linked list stores no size, so length means walking from head to `nil` and counting. Three\nnodes give `length = 3`. The same head-to-nil walk underpins search, print, and reverse.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch16-reverselist","title":"Implement ReverseList","points":40,"difficulty":16,"intro":"Put front insertion to work: push every input value onto the front of a list, then walk the\nlist collecting values. Because front insertion reverses order, you get the input reversed —\nwithout indexing from the back.\n","instructions":"## Your turn\n\nImplement the function `ReverseList`:\n\n```go\nfunc ReverseList(items []int) []int { ... }\n```\n\nBuild a singly linked list by pushing each value of `items` onto the **front**, then walk\nthe list from head to `nil` collecting the values into a new slice. The result is `items`\nreversed.\n\nExamples:\n\n- `ReverseList(nil)` -> `[]`\n- `ReverseList([]int{1})` -> `[1]`\n- `ReverseList([]int{1, 2, 3})` -> `[3 2 1]`\n\n**Hint:** start with a `nil` head. For each `v`, do `head = &Node{Val: v, Next: head}`.\nThen walk `head` collecting `n.Val` into a slice and return it.\n\nHidden tests decide correctness.\n","starter":"package student\n\n// Node is a singly linked list node.\ntype Node struct {\n\tVal  int\n\tNext *Node\n}\n\n// ReverseList returns items reversed by pushing each onto the front of a list.\nfunc ReverseList(items []int) []int {\n\tpanic(\"todo\")\n}\n","tests":"package student\n\nimport (\n\t\"reflect\"\n\t\"testing\"\n)\n\nfunc TestReverseEmpty(t *testing.T) {\n\tgot := ReverseList(nil)\n\tif len(got) != 0 {\n\t\tt.Fatalf(\"ReverseList(nil) = %v, want empty\", got)\n\t}\n}\n\nfunc TestReverseSingle(t *testing.T) {\n\tgot := ReverseList([]int{1})\n\tif !reflect.DeepEqual(got, []int{1}) {\n\t\tt.Fatalf(\"ReverseList([1]) = %v, want [1]\", got)\n\t}\n}\n\nfunc TestReverseThree(t *testing.T) {\n\tgot := ReverseList([]int{1, 2, 3})\n\tif !reflect.DeepEqual(got, []int{3, 2, 1}) {\n\t\tt.Fatalf(\"ReverseList([1 2 3]) = %v, want [3 2 1]\", got)\n\t}\n}\n\nfunc TestReverseFive(t *testing.T) {\n\tgot := ReverseList([]int{1, 2, 3, 4, 5})\n\tif !reflect.DeepEqual(got, []int{5, 4, 3, 2, 1}) {\n\t\tt.Fatalf(\"ReverseList([1..5]) = %v, want [5 4 3 2 1]\", got)\n\t}\n}\n","entry":"ReverseList","gabarito":{"time":"O(n)","space":"O(n)","solution":"package student\n\ntype Node struct {\n\tVal  int\n\tNext *Node\n}\n\nfunc ReverseList(items []int) []int {\n\tvar head *Node\n\tfor _, v := range items {\n\t\thead = &Node{Val: v, Next: head}\n\t}\n\tout := make([]int, 0, len(items))\n\tfor n := head; n != nil; n = n.Next {\n\t\tout = append(out, n.Val)\n\t}\n\treturn out\n}\n","justification":"Each value is pushed once (**O(n)**) and the list holds one node per value (**O(n)** space).\nFront insertion builds the list in reverse: the last value pushed becomes the head, so\nwalking head-to-nil yields the input reversed. Pre-sizing `out` with `make(..., 0, len)`\navoids re-allocations during the collecting walk.\n"}}]},{"id":"u17-maps-sets","title":"Maps, frequencies & sets","difficulty":17,"level":"advanced","intro":"A `map` gives you O(1) average lookup by key — the engine behind counting, grouping, de-\nduplication and membership tests. You will count frequencies, model a **set** with\n`map[int]struct{}`, test membership with the comma-ok idiom, and finish with Two Sum, where\na map turns a quadratic scan into a single pass. One rule throughout: map iteration order is\nrandomised, so sort keys before printing.\n","steps":[{"kind":"concept","id":"c17-maps-sets","title":"Counting, sets, and deterministic output","points":5,"difficulty":17,"intro":"`map[K]V` indexes values by key. A missing key reads as the zero value, so `m[k]++` counts\nwithout initialising. A set is a map whose value carries no data: `map[K]struct{}`.\n","body":"## Frequency counting\n\nA missing key yields the zero value, so incrementing just works:\n\n```go\nfreq := map[string]int{}\nfreq[word]++     // starts at 0 for a new word\n```\n\n## Sets with the empty struct\n\n`struct{}{}` is a value that occupies zero bytes — perfect as a set's payload:\n\n```go\nset := map[int]struct{}{}\nset[x] = struct{}{}          // add\n_, ok := set[x]              // membership (comma-ok)\n```\n\n## The comma-ok idiom\n\nIndexing a map returns an optional second boolean: `v, ok := m[k]`. `ok` is `true` only\nwhen the key is present, which distinguishes \"absent\" from \"present but zero\".\n\n## Determinism\n\n**Map iteration order is randomised by design.** Never print a map directly if order\nmatters. Collect the keys, `sort` them, then iterate:\n\n```go\nkeys := make([]string, 0, len(freq))\nfor k := range freq { keys = append(keys, k) }\nsort.Strings(keys)\n```\n\nThat one habit keeps map-derived output reproducible run after run.\n"},{"kind":"drill","id":"d1-frequency","title":"Count word frequencies","points":10,"difficulty":17,"intro":"Tally how often each word appears, then print the counts in sorted key order. Sorting the\nkeys first makes the output deterministic despite random map iteration.\n","prompt":"Count the words in a slice and print each word with its count, sorted.\n\n**Why:** `m[k]++` is the idiomatic counter, and sorting keys before printing is the fix for\nGo's deliberately randomised map iteration.\n","target":"package main\n\nimport (\n    \"fmt\"\n    \"sort\"\n)\n\nfunc main() {\n    words := []string{\"go\", \"rust\", \"go\", \"go\", \"rust\"}\n    freq := map[string]int{}\n    for _, w := range words {\n        freq[w]++\n    }\n    keys := make([]string, 0, len(freq))\n    for k := range freq {\n        keys = append(keys, k)\n    }\n    sort.Strings(keys)\n    for _, k := range keys {\n        fmt.Println(k, freq[k])\n    }\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `fmt`...","...and `sort` to order the keys deterministically.","Closes the import group.","","Opens `main`.","The input words (with repeats).","A map from word to its count.","For each word...","...increment its count (missing keys start at zero).","Closes the counting loop.","Collect the map keys into a slice.","Map iteration order is random, so gather the keys...","...appending each one.","Closes the key-collection loop.","Sort the keys so the output is deterministic.","Walk the keys in sorted order...","...printing each word and its count.","Closes the print loop.","Closes `main`."],"explanation":"`freq[w]++` relies on a missing key reading as 0, so no initialisation is needed. The map\nitself has no stable order, so we collect the keys, `sort.Strings` them, and print in that\norder — giving the fixed output `go 3` then `rust 2`.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d2-set","title":"De-duplicate with a set","points":10,"difficulty":17,"intro":"Insert every value into a `map[int]struct{}`; duplicates collapse to a single key. Collect\nthe keys, sort them, and the distinct values print in a fixed order.\n","prompt":"Remove duplicates from a slice using a set, then print the sorted unique values.\n\n**Why:** `map[int]struct{}` is the idiomatic Go set — zero-byte values, O(1) membership —\nand the natural tool for de-duplication.\n","target":"package main\n\nimport (\n    \"fmt\"\n    \"sort\"\n)\n\nfunc main() {\n    nums := []int{3, 1, 3, 2, 1, 2}\n    set := map[int]struct{}{}\n    for _, n := range nums {\n        set[n] = struct{}{}\n    }\n    unique := make([]int, 0, len(set))\n    for n := range set {\n        unique = append(unique, n)\n    }\n    sort.Ints(unique)\n    fmt.Println(unique)\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `fmt`...","...and `sort`.","Closes the import group.","","Opens `main`.","The input (with duplicates).","A set: a map whose value is the empty struct (zero bytes).","For each number...","...add it to the set — duplicates collapse to one key.","Closes the insert loop.","Collect the unique values.","Walk the set...","...appending each key.","Closes the collection loop.","Sort for deterministic output.","Prints `[1 2 3]` — the distinct values.","Closes `main`."],"explanation":"Writing `set[n] = struct{}{}` records membership using a value that costs zero bytes. Repeated\nnumbers overwrite the same key, so the set holds each value once. Sorting before printing\nturns the unordered set into the fixed output `[1 2 3]`.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d3-membership","title":"Test membership with comma-ok","points":10,"difficulty":17,"intro":"Build a set of permissions and ask whether two keys are present. The comma-ok form returns a\nboolean that is deterministic: `read` is in, `exec` is out.\n","prompt":"Check whether `read` and `exec` belong to a permission set.\n\n**Why:** the comma-ok idiom (`_, ok := m[k]`) is how Go distinguishes \"present\" from\n\"absent\", the heart of every set-membership test.\n","target":"package main\n\nimport \"fmt\"\n\nfunc main() {\n    allowed := map[string]struct{}{\n        \"read\":  {},\n        \"write\": {},\n    }\n    _, canRead := allowed[\"read\"]\n    _, canExec := allowed[\"exec\"]\n    fmt.Println(\"read:\", canRead, \"exec:\", canExec)\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","Opens `main`.","A set of allowed permissions...","...`read` is present ({} is the empty struct value)...","...and `write` is present.","Closes the set literal.","Comma-ok membership test: is `read` in the set?","Is `exec` in the set? (it is not).","Prints `read: true exec: false`.","Closes `main`."],"explanation":"Indexing a map yields an optional second value: `_, ok := m[k]` sets `ok` to `true` only when\nthe key exists. `read` was added, so `canRead` is true; `exec` was never added, so `canExec`\nis false. The literal `{}` is shorthand for `struct{}{}` inside the map.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch17-twosum","title":"Implement TwoSum","points":40,"difficulty":17,"intro":"Two Sum is the canonical map problem: find two indices whose values add up to a target. A\nmap of value->index lets you check for the needed complement in O(1), turning a nested-loop\nO(n^2) search into a single O(n) pass.\n","instructions":"## Your turn\n\nImplement the function `TwoSum`:\n\n```go\nfunc TwoSum(nums []int, target int) (int, int, bool) { ... }\n```\n\nReturn indices `i < j` such that `nums[i] + nums[j] == target`, with the smaller index\nfirst, and a boolean reporting whether such a pair was found. Return the **first** such pair\nin scan order. If no pair exists, return `0, 0, false`.\n\nExamples:\n\n- `TwoSum([]int{2, 7, 11, 15}, 9)` -> `0, 1, true`\n- `TwoSum([]int{3, 2, 4}, 6)` -> `1, 2, true`\n- `TwoSum([]int{3, 3}, 6)` -> `0, 1, true`\n- `TwoSum([]int{1, 2, 3}, 100)` -> `0, 0, false`\n\n**Hint:** scan with index `j`. Keep a map `seen` from value to its earliest index. If\n`target - nums[j]` is already in `seen`, you have your pair (its stored index, then `j`).\nOtherwise store `nums[j]` and continue.\n\nHidden tests decide correctness.\n","starter":"package student\n\n// TwoSum returns indices i < j with nums[i]+nums[j] == target; the bool reports found.\nfunc TwoSum(nums []int, target int) (int, int, bool) {\n\tpanic(\"todo\")\n}\n","tests":"package student\n\nimport \"testing\"\n\nfunc TestTwoSumBasic(t *testing.T) {\n\ti, j, ok := TwoSum([]int{2, 7, 11, 15}, 9)\n\tif !ok || i != 0 || j != 1 {\n\t\tt.Fatalf(\"TwoSum([2 7 11 15], 9) = (%d, %d, %v), want (0, 1, true)\", i, j, ok)\n\t}\n}\n\nfunc TestTwoSumMiddle(t *testing.T) {\n\ti, j, ok := TwoSum([]int{3, 2, 4}, 6)\n\tif !ok || i != 1 || j != 2 {\n\t\tt.Fatalf(\"TwoSum([3 2 4], 6) = (%d, %d, %v), want (1, 2, true)\", i, j, ok)\n\t}\n}\n\nfunc TestTwoSumDuplicate(t *testing.T) {\n\ti, j, ok := TwoSum([]int{3, 3}, 6)\n\tif !ok || i != 0 || j != 1 {\n\t\tt.Fatalf(\"TwoSum([3 3], 6) = (%d, %d, %v), want (0, 1, tru
