.\n","prompt":"Declare a `Greeter` interface, implement it with a `Robot`, and call it through\nthe interface.\n","target":"package main\n\nimport \"fmt\"\n\ntype Greeter interface {\n    Greet() string\n}\n\ntype Robot struct{}\n\nfunc (Robot) Greet() string {\n    return \"beep boop\"\n}\n\nfunc main() {\n    var g Greeter = Robot{}\n    fmt.Println(g.Greet())\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","Declares the `Greeter` interface...","...which requires one method: `Greet` returning a string.","Closes the interface.","","Declares an empty struct type `Robot`.","","Gives `Robot` a `Greet` method, so it satisfies `Greeter`.","Returns the robot's greeting.","Closes the method.","","Opens `main`.","Stores a `Robot` in a `Greeter` variable — allowed because it has `Greet`.","Calls the method through the interface.","Closes `main`."],"explanation":"`Robot` never declares that it implements `Greeter`; having the `Greet` method is\nenough. That implicit satisfaction is what makes Go interfaces so flexible.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d2-polymorphism","title":"One loop, many types","points":10,"difficulty":7,"intro":"Two different types, `Dog` and `Cat`, each implement `Stringer`. A slice of\n`Stringer` holds both, and one loop calls `String` on every element regardless of\nits concrete type.\n","prompt":"Put two different types that share a method into one interface slice, then loop\nover them.\n","target":"package main\n\nimport \"fmt\"\n\ntype Stringer interface {\n    String() string\n}\n\ntype Dog struct{}\ntype Cat struct{}\n\nfunc (Dog) String() string { return \"woof\" }\nfunc (Cat) String() string { return \"meow\" }\n\nfunc main() {\n    animals := []Stringer{Dog{}, Cat{}}\n    for _, a := range animals {\n        fmt.Println(a.String())\n    }\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","Declares a `Stringer` interface...","...requiring a `String` method.","Closes the interface.","","Declares an empty `Dog` type.","Declares an empty `Cat` type.","","`Dog` implements `String`.","`Cat` implements `String`.","","Opens `main`.","Builds a slice holding both a `Dog` and a `Cat` as `Stringer`s.","Loops over each element, ignoring the index with `_`.","Calls `String` through the interface — the right method runs for each type.","Closes the loop body.","Closes `main`."],"explanation":"The slice stores different concrete types behind one interface. The loop does not\ncare which is which — it just asks each for its `String`, and Go dispatches to the\ncorrect method.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch7-totalarea","title":"Implement TotalArea","points":30,"difficulty":8,"intro":"Apply interfaces. Define a `Shape` interface with an `Area` method, two concrete\nshapes that satisfy it, and a `TotalArea` function that sums the areas of any\nslice of shapes — one loop over the interface, whatever the concrete types.\n","instructions":"## Your turn\n\nDefine a `Shape` interface and a function that totals areas:\n\n```go\ntype Shape interface {\n    Area() float64\n}\n\nfunc TotalArea(shapes []Shape) float64 { ... }\n```\n\nAlso define two shapes that satisfy `Shape`:\n\n- `Square{Side float64}` with `Area() = Side * Side`\n- `Rect{Width, Height float64}` with `Area() = Width * Height`\n\n`TotalArea` returns the sum of `Area()` over every shape in the slice.\n\nExample:\n\n- `TotalArea([]Shape{Square{Side: 2}, Rect{Width: 3, Height: 4}})` → `16`\n\nHidden tests decide correctness. Implement it, then submit.\n","starter":"package student\n\n// Shape is anything with an area.\ntype Shape interface {\n\tArea() float64\n}\n\ntype Square struct{ Side float64 }\ntype Rect struct{ Width, Height float64 }\n\n// TODO: give Square and Rect an Area method, then sum them.\n\n// TotalArea sums the area of every shape.\nfunc TotalArea(shapes []Shape) float64 {\n\treturn 0\n}\n","tests":"package student\n\nimport \"testing\"\n\nfunc TestTotalAreaMixed(t *testing.T) {\n\tshapes := []Shape{Square{Side: 2}, Rect{Width: 3, Height: 4}}\n\tif got := TotalArea(shapes); got != 16 {\n\t\tt.Fatalf(\"TotalArea = %v, want 16\", got)\n\t}\n}\n\nfunc TestTotalAreaEmpty(t *testing.T) {\n\tif got := TotalArea(nil); got != 0 {\n\t\tt.Fatalf(\"TotalArea(nil) = %v, want 0\", got)\n\t}\n}\n","entry":"TotalArea","gabarito":{"time":"O(n)","space":"O(1)","solution":"package student\n\ntype Shape interface {\n\tArea() float64\n}\n\ntype Square struct{ Side float64 }\ntype Rect struct{ Width, Height float64 }\n\nfunc (s Square) Area() float64 { return s.Side * s.Side }\nfunc (r Rect) Area() float64   { return r.Width * r.Height }\n\nfunc TotalArea(shapes []Shape) float64 {\n\ttotal := 0.0\n\tfor _, s := range shapes {\n\t\ttotal += s.Area()\n\t}\n\treturn total\n}\n","justification":"`TotalArea` visits each of the `n` shapes once, calling a constant-time `Area` and\nadding it to a running total, so the time is **O(n)**. Only the single accumulator\nis stored, independent of `n`, so the extra space is **O(1)**.\n"}}]},{"id":"u8-slices-maps","title":"Slices & maps","difficulty":8,"level":"intermediate","intro":"Two collections power almost every Go program: the **slice** (a growable, ordered\nlist) and the **map** (a key→value lookup table). By the end you count how many\ntimes each word appears — a tiny search index.\n","steps":[{"kind":"concept","id":"c8-collections","title":"Slices and maps","points":5,"difficulty":8,"intro":"A slice is a view over a contiguous, growable array of elements of one type. A map\nstores key→value pairs with average constant-time lookup via hashing. Between them\nthey cover ordered lists and keyed lookups.\n","body":"## Slice\n\n```go\nnums := []int{1, 2, 3}\nnums = append(nums, 4)   // grows the slice\nfmt.Println(len(nums))   // 4\n```\n\n`append` returns a (possibly new) slice, so you assign it back. `len` reports the\nlength.\n\n## Map\n\n```go\nages := map[string]int{\"Ana\": 30}\nages[\"Bo\"] = 25             // insert\nfmt.Println(ages[\"Ana\"])    // 30\n\nn, ok := ages[\"Zed\"]        // ok is false when the key is absent\n```\n\nA map lookup is **O(1)** on average — that is why maps are the go-to tool for\ncounting, grouping, and de-duplicating. The comma-ok form (`n, ok := m[k]`) tells\nyou whether the key existed.\n"},{"kind":"drill","id":"d1-slice","title":"Grow a slice with append","points":10,"difficulty":8,"intro":"`append` adds an element and returns the resulting slice, which you store back into\n`nums`. `len` reports how many elements it now holds.\n","prompt":"Create a slice, append to it, and print the slice and its length.\n","target":"package main\n\nimport \"fmt\"\n\nfunc main() {\n    nums := []int{1, 2, 3}\n    nums = append(nums, 4)\n    fmt.Println(nums, len(nums))\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","Opens `main`.","Creates a slice of three integers.","Appends a 4; `append` returns the new slice, assigned back to `nums`.","Prints the slice and its length (4).","Closes `main`."],"explanation":"Slices grow with `append`, which may allocate a bigger backing array and return a\nnew slice header — so you always assign the result back.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d2-map","title":"Look things up with a map","points":10,"difficulty":8,"intro":"A map associates keys with values. You create one with a literal, insert with\n`m[key] = value`, and read with `m[key]`.\n","prompt":"Create a map from names to ages, insert a new pair, and print two values.\n","target":"package main\n\nimport \"fmt\"\n\nfunc main() {\n    ages := map[string]int{\"Ana\": 30}\n    ages[\"Bo\"] = 25\n    fmt.Println(ages[\"Ana\"], ages[\"Bo\"])\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","Opens `main`.","Creates a map from string keys to int values, with one pair.","Inserts a second pair by assigning to a new key.","Looks up both keys and prints their values.","Closes `main`."],"explanation":"Maps give you average constant-time lookup by key — the right tool whenever you\nneed to find a value by name rather than by position.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch8-wordcount","title":"Implement WordCount","points":30,"difficulty":9,"intro":"Apply slices and maps together. You walk a slice of words once and tally each word\nin a map — the core of every search index and histogram. One linear pass does it.\n","instructions":"## Your turn\n\nImplement the function `WordCount`:\n\n```go\nfunc WordCount(words []string) map[string]int { ... }\n```\n\nReturn a map from each distinct word to the number of times it appears in the\nslice.\n\nExamples:\n\n- `WordCount([]string{\"a\", \"b\", \"a\"})` → `{\"a\": 2, \"b\": 1}`\n- `WordCount(nil)` → `{}` (an empty, non-nil map)\n\n**Hint:** start with `counts := make(map[string]int)` and do `counts[w]++` for\neach word.\n\nHidden tests decide correctness. Implement it, then submit.\n","starter":"package student\n\n// WordCount tallies how many times each word appears.\nfunc WordCount(words []string) map[string]int {\n\t// TODO: count each word into a map\n\treturn nil\n}\n","tests":"package student\n\nimport \"testing\"\n\nfunc TestWordCountBasic(t *testing.T) {\n\tgot := WordCount([]string{\"a\", \"b\", \"a\"})\n\tif got[\"a\"] != 2 || got[\"b\"] != 1 {\n\t\tt.Fatalf(\"WordCount = %v, want a:2 b:1\", got)\n\t}\n}\n\nfunc TestWordCountEmpty(t *testing.T) {\n\tgot := WordCount(nil)\n\tif got == nil {\n\t\tt.Fatalf(\"WordCount(nil) returned a nil map, want empty map\")\n\t}\n\tif len(got) != 0 {\n\t\tt.Fatalf(\"WordCount(nil) = %v, want empty\", got)\n\t}\n}\n","entry":"WordCount","gabarito":{"time":"O(n)","space":"O(k)","solution":"package student\n\nfunc WordCount(words []string) map[string]int {\n\tcounts := make(map[string]int)\n\tfor _, w := range words {\n\t\tcounts[w]++\n\t}\n\treturn counts\n}\n","justification":"The function makes one pass over the `n` words, doing an average constant-time map\nupdate per word, so the time is **O(n)**. The map stores one entry per distinct\nword, so the space is **O(k)** where `k` is the number of distinct words\n(`k <= n`).\n"}}]},{"id":"u9-errors","title":"Errors","difficulty":9,"level":"intermediate","intro":"Go has no exceptions. Instead, a function that can fail returns an `error` as its\nlast result, and the caller checks it. You will use `errors.New`, `fmt.Errorf` with\n`%w`, and the `err != nil` pattern. By the end you divide safely, returning an error\non divide-by-zero.\n","steps":[{"kind":"concept","id":"c9-errors","title":"Errors are values","points":5,"difficulty":9,"intro":"In Go an error is just a value that implements the `error` interface (one method,\n`Error() string`). Returning errors instead of throwing them makes every failure\npath explicit and visible in the code.\n","body":"## Return and check\n\n```go\nimport (\n    \"errors\"\n    \"fmt\"\n)\n\nfunc check(age int) error {\n    if age < 0 {\n        return errors.New(\"age cannot be negative\")\n    }\n    return nil\n}\n\nerr := check(-1)\nif err != nil {\n    fmt.Println(\"failed:\", err)\n}\n```\n\n- **`errors.New(\"...\")`** builds a simple error value.\n- A successful call returns **`nil`** for the error.\n- The caller checks **`if err != nil`** — the single most common line in Go.\n\nTo add context while keeping the original error, wrap it:\n\n```go\nreturn fmt.Errorf(\"validate user: %w\", ErrEmpty)\n```\n\nThe `%w` verb wraps `ErrEmpty` so `errors.Is(err, ErrEmpty)` still recognises it\nfurther up the stack.\n"},{"kind":"drill","id":"d1-errors-new","title":"Return an error","points":10,"difficulty":9,"intro":"`check` returns an `error`: a real error value on bad input, or `nil` on success.\n`main` prints whatever came back.\n","prompt":"Write a function that returns an error for a negative age, and `nil` otherwise.\n","target":"package main\n\nimport (\n    \"errors\"\n    \"fmt\"\n)\n\nfunc check(age int) error {\n    if age < 0 {\n        return errors.New(\"age cannot be negative\")\n    }\n    return nil\n}\n\nfunc main() {\n    err := check(-1)\n    fmt.Println(err)\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `errors`, for building error values...","...and `fmt`, for printing.","Closes the import group.","","Declares `check`, returning an `error`.","If the age is negative...","...return a new error describing the problem.","Closes the `if`.","Otherwise return `nil` — no error.","Closes `check`.","","Opens `main`.","Calls `check` with a bad value and keeps the returned error.","Prints the error (nil would print `<nil>`).","Closes `main`."],"explanation":"An error is an ordinary return value. `errors.New` makes one; `nil` means success.\nThe caller decides what to do by checking the value.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d2-errorf-wrap","title":"Wrap an error with %w","points":10,"difficulty":9,"intro":"`fmt.Errorf` with `%w` adds context while keeping the original error inside, so\n`errors.Is` can still match it. A package-level sentinel error (`ErrEmpty`) is the\nvalue you compare against.\n","prompt":"Wrap a sentinel error with `fmt.Errorf(\"...: %w\", ...)` and check it with\n`errors.Is`.\n","target":"package main\n\nimport (\n    \"errors\"\n    \"fmt\"\n)\n\nvar ErrEmpty = errors.New(\"empty name\")\n\nfunc validate(name string) error {\n    if name == \"\" {\n        return fmt.Errorf(\"validate: %w\", ErrEmpty)\n    }\n    return nil\n}\n\nfunc main() {\n    err := validate(\"\")\n    fmt.Println(err, errors.Is(err, ErrEmpty))\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `errors`...","...and `fmt`.","Closes the import group.","","Declares a package-level sentinel error to compare against.","","Declares `validate`, returning an `error`.","If the name is empty...","...wrap the sentinel with extra context using `%w`.","Closes the `if`.","Otherwise return `nil`.","Closes `validate`.","","Opens `main`.","Calls `validate` with an empty name.","Prints the wrapped error and whether `errors.Is` still matches the sentinel.","Closes `main`."],"explanation":"`%w` wraps an error so context piles up without losing the original. `errors.Is`\nunwraps the chain and reports `true` because `ErrEmpty` is still in there.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch9-safedivide","title":"Implement SafeDivide","points":30,"difficulty":10,"intro":"Apply the error pattern. You return `(quotient, error)`: the real quotient and a\n`nil` error on success, or a zero quotient and a non-nil error when the divisor is\nzero. This is the canonical Go signature for an operation that can fail.\n","instructions":"## Your turn\n\nImplement the function `SafeDivide`:\n\n```go\nfunc SafeDivide(a, b int) (int, error) { ... }\n```\n\nReturn `(a/b, nil)` normally. When `b == 0`, return `(0, <some error>)` — build the\nerror with `errors.New`.\n\nExamples:\n\n- `SafeDivide(10, 2)` → `(5, nil)`\n- `SafeDivide(1, 0)` → `(0, <non-nil error>)`\n\nHidden tests decide correctness. Implement it, then submit.\n","starter":"package student\n\nimport \"errors\"\n\n// SafeDivide returns a/b, or an error when b is zero.\nfunc SafeDivide(a, b int) (int, error) {\n\t// TODO: guard against b == 0, then divide\n\t_ = errors.New\n\treturn 0, nil\n}\n","tests":"package student\n\nimport \"testing\"\n\nfunc TestSafeDivideOk(t *testing.T) {\n\tq, err := SafeDivide(10, 2)\n\tif err != nil {\n\t\tt.Fatalf(\"SafeDivide(10, 2) returned error %v, want nil\", err)\n\t}\n\tif q != 5 {\n\t\tt.Fatalf(\"SafeDivide(10, 2) = %d, want 5\", q)\n\t}\n}\n\nfunc TestSafeDivideByZero(t *testing.T) {\n\t_, err := SafeDivide(1, 0)\n\tif err == nil {\n\t\tt.Fatalf(\"SafeDivide(1, 0) returned nil error, want a non-nil error\")\n\t}\n}\n","entry":"SafeDivide","gabarito":{"time":"O(1)","space":"O(1)","solution":"package student\n\nimport \"errors\"\n\nfunc SafeDivide(a, b int) (int, error) {\n\tif b == 0 {\n\t\treturn 0, errors.New(\"division by zero\")\n\t}\n\treturn a / b, nil\n}\n","justification":"The function does one comparison and at most one division — a fixed amount of work\nregardless of the operands. No loops and no allocation that grows with input, so\nboth time and space are **O(1)**.\n"}}]},{"id":"u10-concurrency","title":"Goroutines, channels & packages","difficulty":10,"level":"intermediate","intro":"The two things real Go backends lean on most: lightweight **concurrency**\n(goroutines, channels, `sync.WaitGroup`) and the **module system** that pulls in\nother people's code with `go get`. You will run concurrent work, coordinate it, use\ntwo popular external packages, and finish by summing a slice concurrently.\n","steps":[{"kind":"concept","id":"c10-concurrency","title":"Goroutines, channels, and go get","points":5,"difficulty":10,"intro":"A goroutine is a function running concurrently, scheduled by the Go runtime on top\nof OS threads — cheap enough to launch thousands. Channels pass values safely\nbetween goroutines. And when your program needs code it did not write, the module\nsystem fetches it with `go get`.\n","body":"## Goroutines & channels\n\n```go\ndone := make(chan string)   // a channel of strings\ngo func() {                 // launch a goroutine\n    done <- \"finished\"      // send on the channel\n}()\nmsg := <-done               // receive (blocks until a value arrives)\n```\n\n- **`go f()`** runs `f` concurrently and returns immediately.\n- A **channel** (`make(chan T)`) is a typed pipe; `ch <- v` sends, `<-ch` receives.\n- Receiving **blocks** until a value is ready, which is how goroutines synchronise.\n\n## Waiting for many: sync.WaitGroup\n\n```go\nvar wg sync.WaitGroup\nfor i := 0; i < 3; i++ {\n    wg.Add(1)\n    go func() { defer wg.Done(); work() }()\n}\nwg.Wait()   // blocks until all three call Done\n```\n\n## Pulling in packages with go get\n\nReal services use libraries. You add one to your module and download it with:\n\n```sh\ngo get github.com/google/uuid\n```\n\nThen `import \"github.com/google/uuid\"` and run with `go run .`. The toolchain\nrecords the dependency in `go.mod` and its exact version in `go.sum`. The next two\ndrills do exactly this with two well-known packages — watch the tutor show you the\ninstall command.\n"},{"kind":"drill","id":"d1-goroutine","title":"Launch a goroutine, use a channel","points":10,"difficulty":10,"intro":"A goroutine runs the anonymous function concurrently; it sends a message on the\nchannel, and `main` blocks on the receive until that value arrives — a clean\nhand-off between concurrent work and the main flow.\n","prompt":"Start a goroutine that sends a string on a channel, and receive it in `main`.\n","target":"package main\n\nimport \"fmt\"\n\nfunc main() {\n    done := make(chan string)\n    go func() {\n        done <- \"work finished\"\n    }()\n    msg := <-done\n    fmt.Println(msg)\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","Opens `main`.","Creates a channel that carries strings.","Launches a goroutine running an anonymous function.","Sends a value into the channel (blocks until someone receives).","Closes and immediately calls the anonymous function.","Receives from the channel — blocks until the goroutine sends.","Prints the received message.","Closes `main`."],"explanation":"The `go` keyword starts concurrent work; the channel both passes the value and\nsynchronises the two goroutines — `main` waits at `<-done` until the value is sent.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d2-waitgroup","title":"Coordinate with sync.WaitGroup","points":10,"difficulty":10,"intro":"A `sync.WaitGroup` counts outstanding goroutines. Each `Add(1)` before launching,\neach `Done()` as it finishes, and `Wait()` blocks until the count returns to zero —\nso `main` does not exit before the workers do.\n","prompt":"Launch three goroutines and wait for all of them with a `sync.WaitGroup`.\n","target":"package main\n\nimport (\n    \"fmt\"\n    \"sync\"\n)\n\nfunc main() {\n    var wg sync.WaitGroup\n    for i := 1; i <= 3; i++ {\n        wg.Add(1)\n        go func(n int) {\n            defer wg.Done()\n            fmt.Println(\"worker\", n)\n        }(i)\n    }\n    wg.Wait()\n    fmt.Println(\"all done\")\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `fmt`...","...and `sync`, for the WaitGroup.","Closes the import group.","","Opens `main`.","Declares a WaitGroup to track running goroutines.","Loops to launch three workers.","Registers one more goroutine with the group.","Launches a goroutine, passing the loop value as `n`.","`defer` guarantees `Done` runs when the goroutine returns.","The worker prints its number.","Closes and calls the goroutine with the current `i`.","Closes the loop body.","Blocks until all three workers have called `Done`.","Prints a final line after everyone finished.","Closes `main`."],"explanation":"`Add`/`Done`/`Wait` are the counter that lets `main` wait for concurrent work.\nPassing `i` as an argument gives each goroutine its own copy. Worker lines may print\nin any order — that is concurrency.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d3-uuid-package","title":"Use a package: google/uuid","points":12,"difficulty":10,"intro":"Time to use code you did not write. `github.com/google/uuid` generates universally\nunique identifiers — the kind every backend stamps on a new record or request.\nFirst install it with `go get`, then import and call it. The tutor shows the exact\ninstall command above; the evaluator resolves the module for you with `go mod tidy`.\n","prompt":"Install `github.com/google/uuid` with `go get`, then generate and print a new UUID.\n\nRun it with `go run .` after installing.\n","target":"package main\n\nimport (\n    \"fmt\"\n\n    \"github.com/google/uuid\"\n)\n\nfunc main() {\n    id := uuid.New()\n    fmt.Println(\"generated id:\", id.String())\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of the standard-library `fmt`...","","...and the external package `github.com/google/uuid` (installed with go get).","Closes the import group.","","Opens `main`.","Calls `uuid.New()` to generate a fresh random UUID.","Prints the UUID as a string.","Closes `main`."],"explanation":"This is the everyday Go workflow: `go get` records the dependency in `go.mod`, the\nimport names it, and `go run .` builds and runs. You just used third-party code the\nsame way every production service does.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d4-quote-package","title":"Use a package: rsc.io/quote","points":12,"difficulty":10,"intro":"A second, tiny package to drive the module workflow home. `rsc.io/quote` (by a Go\nteam member) just returns famous sayings — ideal for practising `go get` without\nany setup. Install it, import it, and print one of Go's own proverbs.\n","prompt":"Install `rsc.io/quote` with `go get`, then print the Go proverb it returns.\n\nRun it with `go run .` after installing.\n","target":"package main\n\nimport (\n    \"fmt\"\n\n    \"rsc.io/quote\"\n)\n\nfunc main() {\n    fmt.Println(quote.Go())\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of the standard-library `fmt`...","","...and the external package `rsc.io/quote` (installed with go get).","Closes the import group.","","Opens `main`.","Calls `quote.Go()`, which returns a well-known Go proverb.","Closes `main`."],"explanation":"Two `go get` commands, two external packages, the same three steps each time:\ninstall, import, run. The module system makes reusing code routine — which is why\nGo backends are so quick to assemble.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch10-sumconcurrent","title":"Implement SumConcurrent","points":40,"difficulty":10,"intro":"Tie it together. You sum a slice of integers using concurrency: launch goroutines\nthat each report a partial result over a channel, then combine them. The answer must\nbe deterministic even though the work runs concurrently — the sum of a set does not\ndepend on the order you add it.\n","instructions":"## Your turn\n\nImplement the function `SumConcurrent`:\n\n```go\nfunc SumConcurrent(nums []int) int { ... }\n```\n\nReturn the sum of all the integers in `nums`, computed with the help of goroutines\nand a channel (or a `sync.WaitGroup`). The result must be correct and deterministic\nregardless of goroutine scheduling.\n\nExamples:\n\n- `SumConcurrent([]int{1, 2, 3, 4, 5})` → `15`\n- `SumConcurrent(nil)` → `0`\n\n**Hint:** send each number (or a partial sum) on a channel and add up everything\nyou receive. Addition is commutative, so order does not matter.\n\nHidden tests decide correctness. Implement it, then submit.\n","starter":"package student\n\n// SumConcurrent sums nums with the help of goroutines.\nfunc SumConcurrent(nums []int) int {\n\t// TODO: fan out over a channel, then combine the partial results\n\treturn 0\n}\n","tests":"package student\n\nimport \"testing\"\n\nfunc TestSumConcurrentBasic(t *testing.T) {\n\tif got := SumConcurrent([]int{1, 2, 3, 4, 5}); got != 15 {\n\t\tt.Fatalf(\"SumConcurrent(1..5) = %d, want 15\", got)\n\t}\n}\n\nfunc TestSumConcurrentEmpty(t *testing.T) {\n\tif got := SumConcurrent(nil); got != 0 {\n\t\tt.Fatalf(\"SumConcurrent(nil) = %d, want 0\", got)\n\t}\n}\n\nfunc TestSumConcurrentNegatives(t *testing.T) {\n\tif got := SumConcurrent([]int{-3, 3, -7, 7}); got != 0 {\n\t\tt.Fatalf(\"SumConcurrent = %d, want 0\", got)\n\t}\n}\n","entry":"SumConcurrent","gabarito":{"time":"O(n)","space":"O(n)","solution":"package student\n\nfunc SumConcurrent(nums []int) int {\n\tch := make(chan int, len(nums))\n\tfor _, n := range nums {\n\t\tgo func(v int) {\n\t\t\tch <- v\n\t\t}(n)\n\t}\n\ttotal := 0\n\tfor range nums {\n\t\ttotal += <-ch\n\t}\n\treturn total\n}\n","justification":"Each of the `n` numbers is handled by one goroutine that sends on the channel, and\nthe collector receives `n` values, so the work is **O(n)**. The buffered channel\nholds up to `n` pending values, so the extra space is **O(n)**. Because addition is\ncommutative, the total is the same no matter which goroutine is scheduled first,\nwhich keeps the result deterministic.\n"}}]},{"id":"udb1-connect-query","title":"Databases: connect & query","difficulty":10,"level":"intermediate","intro":"\nReal services keep their state in a database. Go talks to SQL databases through the\nstandard `database/sql` package plus a driver. Here you use SQLite with the pure-Go\ndriver `modernc.org/sqlite` (no C compiler needed): open a database, create a table,\ninsert rows with `?` placeholders, and read them back with `QueryRow` and `Query`.\n\n","steps":[{"kind":"concept","id":"cdb1-connect","title":"database/sql and a driver","points":5,"difficulty":10,"intro":"\n`database/sql` is a thin, driver-agnostic layer. You import a driver for its side\neffect (a blank import) so it registers itself, then open a handle by the driver's\nregistered name.\n\n","body":"\n## Open, exec, query\n\n```go\nimport (\n    \"database/sql\"\n\n    _ \"modernc.org/sqlite\"\n)\n\ndb, _ := sql.Open(\"sqlite\", \":memory:\")\ndefer db.Close()\n\ndb.Exec(`CREATE TABLE users (id INTEGER, name TEXT)`)\ndb.Exec(`INSERT INTO users VALUES (?, ?)`, 1, \"Ana\")\n\nvar n int\ndb.QueryRow(`SELECT COUNT(*) FROM users`).Scan(&n)\n```\n\n- The **blank import** `_ \"modernc.org/sqlite\"` registers the driver named `sqlite`.\n- **`sql.Open(\"sqlite\", \":memory:\")`** returns a `*sql.DB` handle — a pool, not a\n  single connection.\n- **`Exec`** runs statements that return no rows; **`?`** placeholders bind values\n  safely (never build SQL by string concatenation).\n- **`QueryRow(...).Scan(&n)`** reads exactly one row into Go variables.\n\nFor many rows, use `Query` and loop with `rows.Next()` / `rows.Scan(...)`, and always\n`defer rows.Close()`.\n\n"},{"kind":"drill","id":"ddb1-connect","title":"Open, create, count","points":10,"difficulty":10,"intro":"\nOpen an in-memory SQLite database, create a table, insert one row, and count the\nrows. The driver is registered by the blank import; `:memory:` is a throwaway\ndatabase that lives only while the program runs.\n\n","prompt":"\nOpen `:memory:`, create a table, insert a row with `?` placeholders, and print\n`COUNT(*)`.\n\n","target":"package main\n\nimport (\n\t\"database/sql\"\n\t\"fmt\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\nfunc main() {\n\tdb, _ := sql.Open(\"sqlite\", \":memory:\")\n\tdefer db.Close()\n\tdb.Exec(`CREATE TABLE users (id INTEGER, name TEXT)`)\n\tdb.Exec(`INSERT INTO users VALUES (?, ?)`, 1, \"Ana\")\n\tvar n int\n\tdb.QueryRow(`SELECT COUNT(*) FROM users`).Scan(&n)\n\tfmt.Println(n)\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `database/sql`, Go's standard database interface...","...and `fmt` for printing.","","...plus the pure-Go `modernc.org/sqlite` driver, blank-imported so it registers itself under the name `sqlite`.","Closes the import group.","","Opens `main`.","Opens an in-memory SQLite database; the driver name is `sqlite`.","Closes the database when `main` returns.","Creates a `users` table.","Inserts one row; the `?` placeholders bind the values safely.","Will hold the row count.","Runs `COUNT(*)` and scans the single result into `n`.","Prints the count.","Closes `main`."],"explanation":"\n`sql.Open` hands you a pool; `Exec` runs statements; `QueryRow(...).Scan` reads one\nvalue. Placeholders keep the values separate from the SQL text.\n\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"ddb1-queryrow","title":"QueryRow with a placeholder","points":10,"difficulty":10,"intro":"\n`QueryRow` plus a bound `?` fetches a single value for a single key — the everyday\nlookup. Insert two people, then read one person's age back by name.\n\n","prompt":"\nInsert two rows, then use `QueryRow(... WHERE name = ?, \"Ana\").Scan(&age)` and print\nthe age.\n\n","target":"package main\n\nimport (\n\t\"database/sql\"\n\t\"fmt\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\nfunc main() {\n\tdb, _ := sql.Open(\"sqlite\", \":memory:\")\n\tdefer db.Close()\n\tdb.Exec(`CREATE TABLE people (name TEXT, age INTEGER)`)\n\tdb.Exec(`INSERT INTO people VALUES (?, ?), (?, ?)`, \"Ana\", 30, \"Bo\", 20)\n\tvar age int\n\tdb.QueryRow(`SELECT age FROM people WHERE name = ?`, \"Ana\").Scan(&age)\n\tfmt.Println(age)\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `database/sql`, Go's standard database interface...","...and `fmt` for printing.","","...plus the pure-Go `modernc.org/sqlite` driver, blank-imported so it registers itself under the name `sqlite`.","Closes the import group.","","Opens `main`.","Opens an in-memory SQLite database.","Closes the database when `main` returns.","Creates a `people` table with a name and an age.","Inserts two rows in one statement; each `?` binds one value.","Will hold the age we look up.","Looks up Ana's age with a bound `?` and scans it into `age`.","Prints the age.","Closes `main`."],"explanation":"\nA bound parameter (`?`) is matched positionally with the argument you pass after the\nSQL. `Scan` copies the column into your Go variable.\n\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"ddb1-rows","title":"Loop over many rows","points":10,"difficulty":10,"intro":"\nWhen a query returns several rows you iterate with `rows.Next()` and `rows.Scan()`.\n`ORDER BY` makes the output deterministic. Remember to `defer rows.Close()`.\n\n","prompt":"\nInsert three numbers, `Query` them `ORDER BY x`, sum them in a `rows.Next()` loop,\nand print the total.\n\n","target":"package main\n\nimport (\n\t\"database/sql\"\n\t\"fmt\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\nfunc main() {\n\tdb, _ := sql.Open(\"sqlite\", \":memory:\")\n\tdefer db.Close()\n\tdb.Exec(`CREATE TABLE nums (x INTEGER)`)\n\tdb.Exec(`INSERT INTO nums VALUES (10), (20), (30)`)\n\trows, _ := db.Query(`SELECT x FROM nums ORDER BY x`)\n\tdefer rows.Close()\n\ttotal := 0\n\tfor rows.Next() {\n\t\tvar x int\n\t\trows.Scan(&x)\n\t\ttotal += x\n\t}\n\tfmt.Println(total)\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `database/sql`, Go's standard database interface...","...and `fmt` for printing.","","...plus the pure-Go `modernc.org/sqlite` driver, blank-imported so it registers itself under the name `sqlite`.","Closes the import group.","","Opens `main`.","Opens an in-memory SQLite database.","Closes the database when `main` returns.","Creates a one-column `nums` table.","Inserts three numbers.","Runs a query that returns many rows, ordered for determinism.","Closes the row set when done.","Running total of the scanned values.","Advances to the next row until there are none.","Holds the current row value.","Scans the row into `x`.","Adds it to the total.","Closes the loop.","Prints the total (10 + 20 + 30).","Closes `main`."],"explanation":"\n`Query` returns a cursor; each `Next()` advances it and `Scan` reads the current row.\nOrdering the query keeps the printed result stable run to run.\n\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"cdb1-countadults","title":"Implement CountAdults","points":40,"difficulty":11,"intro":"\nPut the query pattern to work. You receive rows of `(name, age)` as `[][2]any`,\ninsert them into a table, and return how many people are adults — counted by SQL,\nnot by a Go loop.\n\n","instructions":"\n## Your turn\n\nImplement the function `CountAdults`:\n\n```go\nfunc CountAdults(rows [][2]any) int { ... }\n```\n\nEach element is `[2]any{name, age}`. Open an in-memory database, create a table,\ninsert every row with `?` placeholders, and return `SELECT COUNT(*) ... WHERE\nage >= 18`.\n\nExamples:\n\n- `CountAdults([][2]any{{\"Ana\", 30}, {\"Bo\", 17}})` -> `1`\n- `CountAdults(nil)` -> `0`\n\nHidden tests decide correctness.\n\n","starter":"package student\n\nimport (\n\t\"database/sql\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\n// CountAdults inserts each (name, age) row into SQLite and returns how many\n// people are at least 18, counted with a SQL query.\nfunc CountAdults(rows [][2]any) int {\n\t// TODO: open an in-memory DB, CREATE a table, INSERT the rows with ?\n\t// placeholders, then SELECT COUNT(*) ... WHERE age >= 18.\n\t_ = sql.Open\n\treturn 0\n}\n","tests":"package student\n\nimport \"testing\"\n\nfunc TestCountAdultsMixed(t *testing.T) {\n\trows := [][2]any{{\"Ana\", 30}, {\"Bo\", 17}, {\"Cy\", 18}, {\"Di\", 5}}\n\tif got := CountAdults(rows); got != 2 {\n\t\tt.Fatalf(\"CountAdults mixed = %d, want 2\", got)\n\t}\n}\n\nfunc TestCountAdultsEmpty(t *testing.T) {\n\tif got := CountAdults(nil); got != 0 {\n\t\tt.Fatalf(\"CountAdults(nil) = %d, want 0\", got)\n\t}\n}\n\nfunc TestCountAdultsAllAdults(t *testing.T) {\n\trows := [][2]any{{\"Ana\", 18}, {\"Bo\", 40}}\n\tif got := CountAdults(rows); got != 2 {\n\t\tt.Fatalf(\"CountAdults allAdults = %d, want 2\", got)\n\t}\n}\n\nfunc TestCountAdultsBoundary(t *testing.T) {\n\trows := [][2]any{{\"Teen\", 17}}\n\tif got := CountAdults(rows); got != 0 {\n\t\tt.Fatalf(\"CountAdults boundary17 = %d, want 0\", got)\n\t}\n}\n","entry":"CountAdults","gabarito":{"time":"O(n)","space":"O(n)","solution":"package student\n\nimport (\n\t\"database/sql\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\nfunc CountAdults(rows [][2]any) int {\n\tdb, err := sql.Open(\"sqlite\", \":memory:\")\n\tif err != nil {\n\t\treturn 0\n\t}\n\tdefer db.Close()\n\tif _, err := db.Exec(`CREATE TABLE people (name TEXT, age INTEGER)`); err != nil {\n\t\treturn 0\n\t}\n\tfor _, r := range rows {\n\t\tdb.Exec(`INSERT INTO people (name, age) VALUES (?, ?)`, r[0], r[1])\n\t}\n\tvar n int\n\tdb.QueryRow(`SELECT COUNT(*) FROM people WHERE age >= 18`).Scan(&n)\n\treturn n\n}\n","justification":"\nEach of the `n` input rows is inserted once, so the work and the stored rows both\ngrow linearly: **O(n)** time and **O(n)** space. The `COUNT(*)` with a `WHERE` runs\ninside SQLite; the boundary `age >= 18` is handled by the database, not Go.\n\n"}}]},{"id":"udb2-transactions","title":"Transactions: all or nothing","difficulty":10,"level":"intermediate","intro":"\nA transaction groups several statements so they either all take effect or none do.\nYou use `db.Begin()` to start one, run statements on the returned `*sql.Tx`, then\n`Commit()` to keep the changes or `Rollback()` to discard them. You will build a\nmoney transfer that rolls back rather than leave an account negative.\n\n","steps":[{"kind":"concept","id":"cdb2-tx","title":"Begin, Commit, Rollback","points":5,"difficulty":10,"intro":"\nWithout a transaction, each statement commits on its own — a crash halfway leaves\ninconsistent data. A transaction makes a group of statements atomic.\n\n","body":"\n## The transaction shape\n\n```go\ntx, err := db.Begin()\nif err != nil {\n    return err\n}\ntx.Exec(`UPDATE accounts SET balance = balance - ? WHERE id = 1`, amount)\ntx.Exec(`UPDATE accounts SET balance = balance + ? WHERE id = 2`, amount)\n\nif bad {\n    tx.Rollback() // undo everything in this tx\n    return nil\n}\ntx.Commit() // make it permanent\n```\n\n- **`db.Begin()`** returns a `*sql.Tx`; run your statements on `tx`, not `db`.\n- **`tx.Commit()`** makes every change in the transaction permanent at once.\n- **`tx.Rollback()`** throws the whole group away — the database looks as if nothing\n  happened.\n- A transfer is the classic example: debit and credit must both succeed, or neither.\n\n"},{"kind":"drill","id":"ddb2-commit","title":"Commit keeps the change","points":10,"difficulty":10,"intro":"\nBegin a transaction, insert a row, and `Commit`. After committing, the row is really\nthere — the count is 1.\n\n","prompt":"\nInside a transaction insert one row, `Commit`, then print `COUNT(*)`.\n\n","target":"package main\n\nimport (\n\t\"database/sql\"\n\t\"fmt\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\nfunc main() {\n\tdb, _ := sql.Open(\"sqlite\", \":memory:\")\n\tdefer db.Close()\n\tdb.Exec(`CREATE TABLE t (x INTEGER)`)\n\ttx, _ := db.Begin()\n\ttx.Exec(`INSERT INTO t VALUES (1)`)\n\ttx.Commit()\n\tvar n int\n\tdb.QueryRow(`SELECT COUNT(*) FROM t`).Scan(&n)\n\tfmt.Println(n)\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `database/sql`, Go's standard database interface...","...and `fmt` for printing.","","...plus the pure-Go `modernc.org/sqlite` driver, blank-imported so it registers itself under the name `sqlite`.","Closes the import group.","","Opens `main`.","Opens an in-memory SQLite database.","Closes the database when `main` returns.","Creates a one-column table.","Begins a transaction.","Inserts a row inside the transaction.","Commits, making the insert permanent.","Will hold the row count.","Counts the rows after the commit.","Prints 1 — the committed row is there.","Closes `main`."],"explanation":"\nStatements run on the `*sql.Tx`. `Commit` publishes them; a later read on the `db`\nhandle sees the committed row.\n\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"ddb2-rollback","title":"Rollback undoes the change","points":10,"difficulty":10,"intro":"\nSame insert, but call `Rollback` instead of `Commit`. The insert is discarded, so the\ncount is 0 — proof that nothing in a rolled-back transaction survives.\n\n","prompt":"\nInside a transaction insert one row, `Rollback`, then print `COUNT(*)`.\n\n","target":"package main\n\nimport (\n\t\"database/sql\"\n\t\"fmt\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\nfunc main() {\n\tdb, _ := sql.Open(\"sqlite\", \":memory:\")\n\tdefer db.Close()\n\tdb.Exec(`CREATE TABLE t (x INTEGER)`)\n\ttx, _ := db.Begin()\n\ttx.Exec(`INSERT INTO t VALUES (1)`)\n\ttx.Rollback()\n\tvar n int\n\tdb.QueryRow(`SELECT COUNT(*) FROM t`).Scan(&n)\n\tfmt.Println(n)\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `database/sql`, Go's standard database interface...","...and `fmt` for printing.","","...plus the pure-Go `modernc.org/sqlite` driver, blank-imported so it registers itself under the name `sqlite`.","Closes the import group.","","Opens `main`.","Opens an in-memory SQLite database.","Closes the database when `main` returns.","Creates a one-column table.","Begins a transaction.","Inserts a row inside the transaction.","Rolls back, discarding everything the transaction did.","Will hold the row count.","Counts the rows after the rollback.","Prints 0 — the rolled-back insert left no trace.","Closes `main`."],"explanation":"\n`Rollback` discards every change made since `Begin`. The row never becomes visible,\nso the count stays at 0.\n\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"ddb2-atomic","title":"Two updates, one commit","points":10,"difficulty":10,"intro":"\nA transfer is two updates that must land together. Debit one account and credit\nanother inside a single transaction, commit, and read the destination balance.\n\n","prompt":"\nSeed two accounts, in one transaction move 40 from account 1 to account 2, commit,\nand print account 2's balance.\n\n","target":"package main\n\nimport (\n\t\"database/sql\"\n\t\"fmt\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\nfunc main() {\n\tdb, _ := sql.Open(\"sqlite\", \":memory:\")\n\tdefer db.Close()\n\tdb.Exec(`CREATE TABLE acct (id INTEGER, bal INTEGER)`)\n\tdb.Exec(`INSERT INTO acct VALUES (1, 100), (2, 0)`)\n\ttx, _ := db.Begin()\n\ttx.Exec(`UPDATE acct SET bal = bal - 40 WHERE id = 1`)\n\ttx.Exec(`UPDATE acct SET bal = bal + 40 WHERE id = 2`)\n\ttx.Commit()\n\tvar b int\n\tdb.QueryRow(`SELECT bal FROM acct WHERE id = 2`).Scan(&b)\n\tfmt.Println(b)\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `database/sql`, Go's standard database interface...","...and `fmt` for printing.","","...plus the pure-Go `modernc.org/sqlite` driver, blank-imported so it registers itself under the name `sqlite`.","Closes the import group.","","Opens `main`.","Opens an in-memory SQLite database.","Closes the database when `main` returns.","Creates an `acct` table with an id and a balance.","Seeds account 1 with 100 and account 2 with 0.","Begins a transaction so both updates land together.","Debits 40 from account 1.","Credits 40 to account 2.","Commits both updates atomically.","Will hold account 2's balance.","Reads account 2's balance after the commit.","Prints 40 — the transferred amount.","Closes `main`."],"explanation":"\nBoth `UPDATE`s run inside the same transaction, so `Commit` applies them atomically.\nAccount 2 ends with the 40 that left account 1.\n\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"cdb2-transfer","title":"Implement Transfer","points":40,"difficulty":11,"intro":"\nMake the transfer safe. Move `amount` from A to B inside one transaction; if either\nbalance would end up negative, roll the whole thing back and report the original\nbalances unchanged.\n\n","instructions":"\n## Your turn\n\nImplement the function `Transfer`:\n\n```go\nfunc Transfer(a0, b0, amount int) (int, int) { ... }\n```\n\nSeed account A with `a0` and account B with `b0`. In ONE transaction, subtract\n`amount` from A and add it to B. If either resulting balance is negative, `Rollback`\nand return `(a0, b0)`. Otherwise `Commit` and return the new `(A, B)`.\n\nExamples:\n\n- `Transfer(100, 50, 30)` -> `(70, 80)`\n- `Transfer(20, 0, 50)` -> `(20, 0)` (rolled back — A cannot go to -30)\n\nHidden tests decide correctness.\n\n","starter":"package student\n\nimport (\n\t\"database/sql\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\n// Transfer moves amount from account A (opening balance a0) to account B\n// (opening balance b0) inside ONE transaction. If either balance would go\n// negative, it rolls back and returns the original balances.\nfunc Transfer(a0, b0, amount int) (int, int) {\n\t// TODO: seed two accounts, Begin a tx, apply both updates, and Rollback\n\t// (returning a0, b0) if either balance is negative; otherwise Commit.\n\t_ = sql.Open\n\treturn a0, b0\n}\n","tests":"package student\n\nimport \"testing\"\n\nfunc TestTransferOk(t *testing.T) {\n\ta, b := Transfer(100, 50, 30)\n\tif a != 70 || b != 80 {\n\t\tt.Fatalf(\"Transfer(100,50,30) = (%d,%d), want (70,80)\", a, b)\n\t}\n}\n\nfunc TestTransferRollbackOverdraw(t *testing.T) {\n\ta, b := Transfer(20, 0, 50)\n\tif a != 20 || b != 0 {\n\t\tt.Fatalf(\"overdraw = (%d,%d), want original (20,0)\", a, b)\n\t}\n}\n\nfunc TestTransferExactZero(t *testing.T) {\n\ta, b := Transfer(50, 10, 50)\n\tif a != 0 || b != 60 {\n\t\tt.Fatalf(\"exact = (%d,%d), want (0,60)\", a, b)\n\t}\n}\n\nfunc TestTransferNegativeAmountRollback(t *testing.T) {\n\t// A negative amount would push B below zero: must roll back.\n\ta, b := Transfer(10, 5, -10)\n\tif a != 10 || b != 5 {\n\t\tt.Fatalf(\"negAmount = (%d,%d), want original (10,5)\", a, b)\n\t}\n}\n","entry":"Transfer","gabarito":{"time":"O(1)","space":"O(1)","solution":"package student\n\nimport (\n\t\"database/sql\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\nfunc Transfer(a0, b0, amount int) (int, int) {\n\tdb, err := sql.Open(\"sqlite\", \":memory:\")\n\tif err != nil {\n\t\treturn a0, b0\n\t}\n\tdefer db.Close()\n\tdb.Exec(`CREATE TABLE accounts (id INTEGER PRIMARY KEY, balance INTEGER)`)\n\tdb.Exec(`INSERT INTO accounts (id, balance) VALUES (1, ?), (2, ?)`, a0, b0)\n\ttx, err := db.Begin()\n\tif err != nil {\n\t\treturn a0, b0\n\t}\n\ttx.Exec(`UPDATE accounts SET balance = balance - ? WHERE id = 1`, amount)\n\ttx.Exec(`UPDATE accounts SET balance = balance + ? WHERE id = 2`, amount)\n\tvar na, nb int\n\ttx.QueryRow(`SELECT balance FROM accounts WHERE id = 1`).Scan(&na)\n\ttx.QueryRow(`SELECT balance FROM accounts WHERE id = 2`).Scan(&nb)\n\tif na < 0 || nb < 0 {\n\t\ttx.Rollback()\n\t\treturn a0, b0\n\t}\n\ttx.Commit()\n\treturn na, nb\n}\n","justification":"\nThe work is a fixed number of statements regardless of the inputs, so both time and\nspace are **O(1)**. Atomicity comes from the transaction: on the overdraw path the\n`Rollback` restores the opening balances, which is why the originals come back\nunchanged.\n\n"}}]},{"id":"udb3-wal-pool","title":"WAL mode & the connection pool","difficulty":10,"level":"intermediate","intro":"\n`*sql.DB` is a pool of connections, not a single wire — safe to share across\ngoroutines. SQLite's Write-Ahead Logging (WAL) mode lets readers and a writer work\nconcurrently. Here you turn on WAL, cap the pool with `SetMaxOpenConns`, and have\nseveral goroutines insert through the shared pool to a deterministic total.\n\n","steps":[{"kind":"concept","id":"cdb3-pool","title":"A pool you can share","points":5,"difficulty":10,"intro":"\n`sql.Open` returns a pool. Goroutines can call it concurrently; the pool hands each\none a free connection. WAL mode improves read/write concurrency on SQLite.\n\n","body":"\n## Pool and WAL\n\n```go\ndb, _ := sql.Open(\"sqlite\", \"file:app.db\")\ndb.SetMaxOpenConns(4) // at most 4 live connections\n\ndb.Exec(`PRAGMA journal_mode=WAL`) // readers don't block the writer\n\nvar wg sync.WaitGroup\nfor w := 0; w < 4; w++ {\n    wg.Add(1)\n    go func() {\n        defer wg.Done()\n        db.Exec(`INSERT INTO nums VALUES (?)`, 1)\n    }()\n}\nwg.Wait()\n```\n\n- **`*sql.DB` is safe for concurrent use** — share the one handle, never open a pool\n  per goroutine.\n- **`SetMaxOpenConns(n)`** bounds how many connections exist at once.\n- **WAL** (`PRAGMA journal_mode=WAL`) needs a real file, not `:memory:`, and lets\n  reads proceed while a write is in flight.\n- A **busy timeout** makes a connection wait briefly for a lock instead of failing\n  immediately — add it to the DSN so every pooled connection inherits it.\n\n"},{"kind":"drill","id":"ddb3-wal","title":"Turn on WAL","points":10,"difficulty":10,"intro":"\nWAL mode needs a file-backed database, so this drill creates a temporary file. The\n`PRAGMA journal_mode=WAL` statement both sets the mode and returns it, so you can\nread it back.\n\n","prompt":"\nOpen a file-backed database and run `PRAGMA journal_mode=WAL`, scanning and printing\nthe mode it returns.\n\n","target":"package main\n\nimport (\n\t\"database/sql\"\n\t\"fmt\"\n\t\"os\"\n\t\"path/filepath\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\nfunc main() {\n\tdir, _ := os.MkdirTemp(\"\", \"wal\")\n\tdefer os.RemoveAll(dir)\n\tdb, _ := sql.Open(\"sqlite\", \"file:\"+filepath.Join(dir, \"w.db\"))\n\tdefer db.Close()\n\tvar mode string\n\tdb.QueryRow(`PRAGMA journal_mode=WAL`).Scan(&mode)\n\tfmt.Println(mode)\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `database/sql`...","...`fmt`...","...`os`, for a temporary directory...","...and `path/filepath`, to build the file path.","","...plus the pure-Go `modernc.org/sqlite` driver, blank-imported.","Closes the import group.","","Opens `main`.","Makes a temporary directory (WAL needs a real file, not `:memory:`).","Removes the directory when `main` returns.","Opens a file-backed SQLite database under that directory.","Closes the database when `main` returns.","Will hold the journal mode the PRAGMA reports back.","Switches the database to Write-Ahead Logging and reads the mode back.","Prints `wal`, confirming the mode is active.","Closes `main`."],"explanation":"\nWAL is a durable journalling mode, so it only works on a real file. The PRAGMA\nreturns the active mode, which prints as `wal`.\n\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"ddb3-pool","title":"Cap the pool","points":10,"difficulty":10,"intro":"\n`SetMaxOpenConns` bounds the pool. Insert a handful of rows through it and sum them\nback — a warm-up before adding goroutines.\n\n","prompt":"\nOpen a file-backed database, `SetMaxOpenConns(4)`, insert 1..5, and print the `SUM`.\n\n","target":"package main\n\nimport (\n\t\"database/sql\"\n\t\"fmt\"\n\t\"os\"\n\t\"path/filepath\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\nfunc main() {\n\tdir, _ := os.MkdirTemp(\"\", \"pool\")\n\tdefer os.RemoveAll(dir)\n\tdb, _ := sql.Open(\"sqlite\", \"file:\"+filepath.Join(dir, \"p.db\"))\n\tdefer db.Close()\n\tdb.SetMaxOpenConns(4)\n\tdb.Exec(`CREATE TABLE nums (x INTEGER)`)\n\tfor i := 1; i <= 5; i++ {\n\t\tdb.Exec(`INSERT INTO nums VALUES (?)`, i)\n\t}\n\tvar sum int\n\tdb.QueryRow(`SELECT SUM(x) FROM nums`).Scan(&sum)\n\tfmt.Println(sum)\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `database/sql`...","...`fmt`...","...`os`, for a temporary directory...","...and `path/filepath`, to build the file path.","","...plus the pure-Go `modernc.org/sqlite` driver, blank-imported.","Closes the import group.","","Opens `main`.","Makes a temporary directory for the database file.","Removes the directory when `main` returns.","Opens a file-backed SQLite database.","Closes the database when `main` returns.","Caps the built-in connection pool at four open connections.","Creates a one-column table.","Loops i from 1 to 5.","Inserts i through the pool.","Closes the insert loop.","Will hold the sum.","Sums the column back out.","Prints 15 (1 + 2 + 3 + 4 + 5).","Closes `main`."],"explanation":"\nEven with a capped pool the API is identical — `Exec` borrows a connection and\nreturns it. The sum of 1..5 is 15.\n\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"ddb3-goroutines","title":"Workers share the pool","points":10,"difficulty":10,"intro":"\nFour goroutines insert disjoint stripes of 1..100 through the one shared pool, each\nsignalling a `WaitGroup` when done. A busy timeout in the DSN lets a worker wait for\na lock instead of failing, so the total is deterministic.\n\n","prompt":"\nLaunch four workers that insert a disjoint stripe of 1..100 through the shared pool,\n`Wait`, then print the `SUM` (5050).\n\n","target":"package main\n\nimport (\n\t\"database/sql\"\n\t\"fmt\"\n\t\"os\"\n\t\"path/filepath\"\n\t\"sync\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\nfunc main() {\n\tdir, _ := os.MkdirTemp(\"\", \"pool\")\n\tdefer os.RemoveAll(dir)\n\tdsn := \"file:\" + filepath.Join(dir, \"p.db\") + \"?_pragma=busy_timeout(10000)\"\n\tdb, _ := sql.Open(\"sqlite\", dsn)\n\tdefer db.Close()\n\tdb.SetMaxOpenConns(4)\n\tdb.Exec(`CREATE TABLE nums (x INTEGER)`)\n\tvar wg sync.WaitGroup\n\tfor w := 0; w < 4; w++ {\n\t\twg.Add(1)\n\t\tgo func(id int) {\n\t\t\tdefer wg.Done()\n\t\t\tfor v := id + 1; v <= 100; v += 4 {\n\t\t\t\tdb.Exec(`INSERT INTO nums VALUES (?)`, v)\n\t\t\t}\n\t\t}(w)\n\t}\n\twg.Wait()\n\tvar sum int\n\tdb.QueryRow(`SELECT SUM(x) FROM nums`).Scan(&sum)\n\tfmt.Println(sum)\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `database/sql`...","...`fmt`...","...`os`...","...`path/filepath`...","...and `sync`, for the `WaitGroup`.","","...plus the pure-Go `modernc.org/sqlite` driver, blank-imported.","Closes the import group.","","Opens `main`.","Makes a temporary directory for the database file.","Removes the directory when `main` returns.","Builds a DSN that gives every pooled connection a 10s busy timeout.","Opens the file-backed database with that DSN.","Closes the database when `main` returns.","Caps the pool at four connections — the workers will share them.","Creates a one-column table.","A WaitGroup to know when every worker has finished.","Launches four workers.","Registers this worker with the WaitGroup.","Starts the worker goroutine.","Signals completion when the goroutine returns.","Each worker inserts a disjoint stripe of 1..100 (step of four).","Inserts one value through the shared pool.","Closes the inner insert loop.","Closes the goroutine, passing the worker id by value.","Closes the launch loop.","Waits for all four workers.","Will hold the final sum.","Sums every inserted value.","Prints 5050, the sum of 1..100 — deterministic regardless of scheduling.","Closes `main`."],"explanation":"\nOne pool, many goroutines: the pool serialises access to connections and the busy\ntimeout absorbs lock contention. Every value 1..100 is inserted exactly once, so the\nsum is always 5050.\n\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"cdb3-pooledsum","title":"Implement PooledSum","points":40,"difficulty":11,"intro":"\nShare one pool across workers. Each of `workers` goroutines inserts a disjoint slice\nof `1..upto`; afterwards a single `SELECT SUM(x)` must equal `upto*(upto+1)/2` every\ntime, no matter how the goroutines interleave.\n\n","instructions":"\n## Your turn\n\nImplement the function `PooledSum`:\n\n```go\nfunc PooledSum(upto, workers int) int { ... }\n```\n\nOpen a file-backed database (WAL needs a file) with a busy timeout, call\n`SetMaxOpenConns(workers)`, and launch `workers` goroutines. Partition `1..upto` so\neach value is inserted exactly once (for example, worker `w` inserts `w+1, w+1+workers,\n...`). Wait for all workers, then return `SELECT SUM(x)`.\n\nExamples:\n\n- `PooledSum(100, 4)` -> `5050`\n- `PooledSum(0, 4)` -> `0`\n\nHidden tests decide correctness.\n\n","starter":"package student\n\nimport (\n\t\"database/sql\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\n// PooledSum has `workers` goroutines share one connection pool. Each worker\n// inserts a disjoint stripe of 1..upto, then it returns SELECT SUM(x), which\n// must equal upto*(upto+1)/2.\nfunc PooledSum(upto, workers int) int {\n\t// TODO: open a file-backed DB with a busy timeout, SetMaxOpenConns,\n\t// fan out inserts over a WaitGroup, then SUM the column.\n\t_ = sql.Open\n\treturn 0\n}\n","tests":"package student\n\nimport \"testing\"\n\nfunc TestPooledSumBasic(t *testing.T) {\n\tif got := PooledSum(100, 4); got != 5050 {\n\t\tt.Fatalf(\"PooledSum(100,4) = %d, want 5050\", got)\n\t}\n}\n\nfunc TestPooledSumOneWorker(t *testing.T) {\n\tif got := PooledSum(10, 1); got != 55 {\n\t\tt.Fatalf(\"PooledSum(10,1) = %d, want 55\", got)\n\t}\n}\n\nfunc TestPooledSumZero(t *testing.T) {\n\tif got := PooledSum(0, 4); got != 0 {\n\t\tt.Fatalf(\"PooledSum(0,4) = %d, want 0\", got)\n\t}\n}\n\nfunc TestPooledSumManyWorkers(t *testing.T) {\n\t// More workers than items: some workers insert nothing, result still exact.\n\tif got := PooledSum(5, 8); got != 15 {\n\t\tt.Fatalf(\"PooledSum(5,8) = %d, want 15\", got)\n\t}\n}\n","entry":"PooledSum","gabarito":{"time":"O(n)","space":"O(n)","solution":"package student\n\nimport (\n\t\"database/sql\"\n\t\"os\"\n\t\"path/filepath\"\n\t\"sync\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\nfunc PooledSum(upto, workers int) int {\n\tif workers < 1 {\n\t\tworkers = 1\n\t}\n\tdir, err := os.MkdirTemp(\"\", \"pool\")\n\tif err != nil {\n\t\treturn 0\n\t}\n\tdefer os.RemoveAll(dir)\n\tdsn := \"file:\" + filepath.Join(dir, \"p.db\") + \"?_pragma=busy_timeout(10000)&_pragma=journal_mode(WAL)\"\n\tdb, err := sql.Open(\"sqlite\", dsn)\n\tif err != nil {\n\t\treturn 0\n\t}\n\tdefer db.Close()\n\tdb.SetMaxOpenConns(workers)\n\tif _, err := db.Exec(`CREATE TABLE nums (x INTEGER)`); err != nil {\n\t\treturn 0\n\t}\n\tvar wg sync.WaitGroup\n\tfor w := 0; w < workers; w++ {\n\t\twg.Add(1)\n\t\tgo func(id int) {\n\t\t\tdefer wg.Done()\n\t\t\tfor v := id + 1; v <= upto; v += workers {\n\t\t\t\tdb.Exec(`INSERT INTO nums (x) VALUES (?)`, v)\n\t\t\t}\n\t\t}(w)\n\t}\n\twg.Wait()\n\tvar sum int\n\tdb.QueryRow(`SELECT COALESCE(SUM(x), 0) FROM nums`).Scan(&sum)\n\treturn sum\n}\n","justification":"\nEvery value in `1..upto` is inserted exactly once across the workers, so the work and\nthe stored rows are both **O(n)** with `n = upto`. The partition is disjoint and\ncovers the whole range, and addition is commutative, so the final `SUM` is\n`upto*(upto+1)/2` regardless of goroutine scheduling — deterministic by construction.\n\n"}}]},{"id":"udb4-n-plus-one","title":"The N+1 query problem","difficulty":10,"level":"intermediate","intro":"\nA loop that runs one query per id is the N+1 anti-pattern: for N ids you pay N round\ntrips (plus the one that produced the ids). Folding them into a single `IN (...)`\nquery is dramatically faster. You will count the queries both ways and then return a\ntotal using exactly one query.\n\n","steps":[{"kind":"concept","id":"cdb4-nplus1","title":"One query, not N","points":5,"difficulty":10,"intro":"\nEach database round trip has a cost. Doing one per item inside a loop multiplies that\ncost by N. A single set-based query does the same work in one trip.\n\n","body":"\n## N+1 vs a single query\n\n```go\n// N+1: one query per id (slow)\nfor _, id := range ids {\n    db.QueryRow(`SELECT price FROM orders WHERE id = ?`, id).Scan(&p)\n    total += p\n}\n\n// One query for all ids (fast)\ndb.QueryRow(`SELECT SUM(price) FROM orders WHERE id IN (1, 2, 3)`).Scan(&total)\n```\n\n- The loop issues **N** separate queries — the classic N+1 pattern.\n- The set-based version makes **one** round trip with an `IN (...)` list.\n- Build the `IN` list from `?` placeholders (one per id) and pass the ids as\n  arguments — never concatenate values into the SQL.\n- Fewer round trips is usually the single biggest database win in a service.\n\n"},{"kind":"drill","id":"ddb4-loop","title":"Count the N+1 queries","points":10,"difficulty":10,"intro":"\nRun the slow version on purpose: loop over three ids, query each one, and count the\nqueries. You get the right total but three round trips.\n\n","prompt":"\nLoop over three ids, `QueryRow` each price, count the queries, and print `total\nqueries` (`60 3`).\n\n","target":"package main\n\nimport (\n\t\"database/sql\"\n\t\"fmt\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\nfunc main() {\n\tdb, _ := sql.Open(\"sqlite\", \":memory:\")\n\tdefer db.Close()\n\tdb.Exec(`CREATE TABLE orders (id INTEGER, price INTEGER)`)\n\tdb.Exec(`INSERT INTO orders VALUES (1, 10), (2, 20), (3, 30)`)\n\tids := []int{1, 2, 3}\n\tqueries, total := 0, 0\n\tfor _, id := range ids {\n\t\tvar p int\n\t\tdb.QueryRow(`SELECT price FROM orders WHERE id = ?`, id).Scan(&p)\n\t\tqueries++\n\t\ttotal += p\n\t}\n\tfmt.Println(total, queries)\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `database/sql`, Go's standard database interface...","...and `fmt` for printing.","","...plus the pure-Go `modernc.org/sqlite` driver, blank-imported so it registers itself under the name `sqlite`.","Closes the import group.","","Opens `main`.","Opens an in-memory SQLite database.","Closes the database when `main` returns.","Creates an `orders` table with an id and a price.","Seeds three orders priced 10, 20 and 30.","The ids we need totals for.","Counters for the number of queries run and the running total.","Loops once per id — this is the N+1 anti-pattern.","Holds this order's price.","Runs ONE query for THIS id and scans the price.","Counts the query we just ran.","Adds the price to the total.","Closes the loop.","Prints `60 3`: the right total, but three separate queries.","Closes `main`."],"explanation":"\nOne query per id means the query counter ends at the number of ids. The total is\ncorrect, but the round trips add up — that is the cost N+1 hides.\n\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"ddb4-in","title":"Fold into one IN query","points":10,"difficulty":10,"intro":"\nNow the fast version: a single `IN (...)` query sums every price in one round trip.\nSame total, one query.\n\n","prompt":"\nSum the three prices with one `SELECT ... WHERE id IN (1, 2, 3)`, count one query,\nand print `total queries` (`60 1`).\n\n","target":"package main\n\nimport (\n\t\"database/sql\"\n\t\"fmt\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\nfunc main() {\n\tdb, _ := sql.Open(\"sqlite\", \":memory:\")\n\tdefer db.Close()\n\tdb.Exec(`CREATE TABLE orders (id INTEGER, price INTEGER)`)\n\tdb.Exec(`INSERT INTO orders VALUES (1, 10), (2, 20), (3, 30)`)\n\tqueries, total := 0, 0\n\tdb.QueryRow(`SELECT SUM(price) FROM orders WHERE id IN (1, 2, 3)`).Scan(&total)\n\tqueries++\n\tfmt.Println(total, queries)\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `database/sql`, Go's standard database interface...","...and `fmt` for printing.","","...plus the pure-Go `modernc.org/sqlite` driver, blank-imported so it registers itself under the name `sqlite`.","Closes the import group.","","Opens `main`.","Opens an in-memory SQLite database.","Closes the database when `main` returns.","Creates an `orders` table with an id and a price.","Seeds three orders priced 10, 20 and 30.","Counters for queries run and the total.","Sums all three prices in a single `IN (...)` query.","Counts the one query we ran.","Prints `60 1`: same total, but only ONE round trip.","Closes `main`."],"explanation":"\n`IN (...)` pushes the whole set into one statement, so the query counter stays at 1.\nThe database does the summing in a single pass.\n\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"ddb4-stream","title":"Stream rows in one query","points":10,"difficulty":10,"intro":"\nAnother one-query shape: select all the prices and add them up in a `rows.Next()`\nloop. Still a single round trip, with the loop on the Go side.\n\n","prompt":"\n`Query` all prices `ORDER BY id`, sum them in a loop, and print `total 1` (`60 1`).\n\n","target":"package main\n\nimport (\n\t\"database/sql\"\n\t\"fmt\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\nfunc main() {\n\tdb, _ := sql.Open(\"sqlite\", \":memory:\")\n\tdefer db.Close()\n\tdb.Exec(`CREATE TABLE orders (id INTEGER, price INTEGER)`)\n\tdb.Exec(`INSERT INTO orders VALUES (1, 10), (2, 20), (3, 30)`)\n\trows, _ := db.Query(`SELECT price FROM orders ORDER BY id`)\n\tdefer rows.Close()\n\ttotal := 0\n\tfor rows.Next() {\n\t\tvar p int\n\t\trows.Scan(&p)\n\t\ttotal += p\n\t}\n\tfmt.Println(total, 1)\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `database/sql`, Go's standard database interface...","...and `fmt` for printing.","","...plus the pure-Go `modernc.org/sqlite` driver, blank-imported so it registers itself under the name `sqlite`.","Closes the import group.","","Opens `main`.","Opens an in-memory SQLite database.","Closes the database when `main` returns.","Creates an `orders` table with an id and a price.","Seeds three orders priced 10, 20 and 30.","One query streams every price back, ordered for determinism.","Closes the row set when done.","Running total of the prices.","Walks each returned row.","Holds this row's price.","Scans the price.","Adds it to the total.","Closes the loop.","Prints `60 1`: all rows fetched with a single query.","Closes `main`."],"explanation":"\nFetching all rows with one `Query` and iterating them is still one round trip — the\nloop is in Go, not extra queries. Contrast this with the N+1 drill's N queries.\n\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"cdb4-totalprice","title":"Implement TotalPrice","points":40,"difficulty":11,"intro":"\nProve you avoided N+1. Return the summed price of the given orders AND the number of\nqueries you ran — and the query count must be exactly 1.\n\n","instructions":"\n## Your turn\n\nImplement the function `TotalPrice`:\n\n```go\nfunc TotalPrice(orderIDs []int) (int, int) { ... }\n```\n\nSeed an `orders` table, then total the prices of `orderIDs` using a SINGLE\n`IN (...)` query built from `?` placeholders. Return `(sum, queriesRun)` where\n`queriesRun == 1`. For an empty id list, return `(0, 0)` without querying.\n\nExamples:\n\n- `TotalPrice([]int{1, 2, 3})` -> `(60, 1)`\n- `TotalPrice(nil)` -> `(0, 0)`\n\nHidden tests decide correctness.\n\n","starter":"package student\n\nimport (\n\t\"database/sql\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\n// TotalPrice returns the summed price of the given orders AND the number of\n// queries it ran. Use a SINGLE IN (...) query so the count is exactly 1.\nfunc TotalPrice(orderIDs []int) (int, int) {\n\t// TODO: seed orders, build one IN (...) query with ? per id, run it once,\n\t// and return (sum, 1). Return (0, 0) for an empty id list.\n\t_ = sql.Open\n\treturn 0, 0\n}\n","tests":"package student\n\nimport \"testing\"\n\nfunc TestTotalPriceOneQuery(t *testing.T) {\n\tsum, q := TotalPrice([]int{1, 2, 3})\n\tif sum != 60 {\n\t\tt.Fatalf(\"sum = %d, want 60\", sum)\n\t}\n\tif q != 1 {\n\t\tt.Fatalf(\"queries = %d, want exactly 1\", q)\n\t}\n}\n\nfunc TestTotalPriceEmpty(t *testing.T) {\n\tsum, q := TotalPrice(nil)\n\tif sum != 0 || q != 0 {\n\t\tt.Fatalf(\"empty = (%d,%d), want (0,0)\", sum, q)\n\t}\n}\n\nfunc TestTotalPriceSingle(t *testing.T) {\n\tsum, q := TotalPrice([]int{100})\n\tif sum != 1000 || q != 1 {\n\t\tt.Fatalf(\"single = (%d,%d), want (1000,1)\", sum, q)\n\t}\n}\n\nfunc TestTotalPriceDuplicatesStillOneQuery(t *testing.T) {\n\t_, q := TotalPrice([]int{5, 5, 6, 7})\n\tif q != 1 {\n\t\tt.Fatalf(\"queries = %d, want exactly 1\", q)\n\t}\n}\n","entry":"TotalPrice","gabarito":{"time":"O(n)","space":"O(n)","solution":"package student\n\nimport (\n\t\"database/sql\"\n\t\"strings\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\nfunc TotalPrice(orderIDs []int) (int, int) {\n\tdb, err := sql.Open(\"sqlite\", \":memory:\")\n\tif err != nil {\n\t\treturn 0, 0\n\t}\n\tdefer db.Close()\n\tdb.Exec(`CREATE TABLE orders (id INTEGER PRIMARY KEY, price INTEGER)`)\n\tfor i := 1; i <= 100; i++ {\n\t\tdb.Exec(`INSERT INTO orders (id, price) VALUES (?, ?)`, i, i*10)\n\t}\n\tif len(orderIDs) == 0 {\n\t\treturn 0, 0\n\t}\n\tplaceholders := make([]string, len(orderIDs))\n\targs := make([]any, len(orderIDs))\n\tfor i, id := range orderIDs {\n\t\tplaceholders[i] = \"?\"\n\t\targs[i] = id\n\t}\n\tq := `SELECT COALESCE(SUM(price), 0) FROM orders WHERE id IN (` + strings.Join(placeholders, \",\") + `)`\n\tqueries := 0\n\tvar sum int\n\tdb.QueryRow(q, args...).Scan(&sum)\n\tqueries++\n\treturn sum, queries\n}\n","justification":"\nBuilding the placeholder list is **O(n)** in the number of ids, and the single query\nis one round trip whatever `n` is. The returned query count is literally `1`, which is\nthe point: the whole set is summed in one statement instead of one query per id.\n\n"}}]},{"id":"udb5-pagination","title":"Pagination: OFFSET vs keyset","difficulty":10,"level":"intermediate","intro":"\nListing results a page at a time has two common shapes. `LIMIT/OFFSET` is simple but\ngets slower as the offset grows, because the database still walks the skipped rows.\nKeyset pagination (`WHERE id > ? ORDER BY id LIMIT ?`) remembers the last id and jumps\nstraight past it. You will build both and then a keyset pager.\n\n","steps":[{"kind":"concept","id":"cdb5-paging","title":"OFFSET vs keyset","points":5,"difficulty":10,"intro":"\nBoth approaches return a page of rows. The difference is what happens deep into the\nlist: OFFSET re-scans the skipped rows, keyset seeks directly using the last id.\n\n","body":"\n## Two ways to page\n\n```go\n// OFFSET: skip the first (page*size) rows\ndb.Query(`SELECT id FROM items ORDER BY id LIMIT ? OFFSET ?`, size, page*size)\n\n// Keyset: continue after the last id you saw\ndb.Query(`SELECT id FROM items WHERE id > ? ORDER BY id LIMIT ?`, lastID, size)\n```\n\n- **`LIMIT ? OFFSET ?`** is easy, but a large `OFFSET` makes the database count past\n  all the skipped rows every time.\n- **Keyset** carries the last id forward; with an index on `id` it seeks straight to\n  the next page, so cost stays flat as you go deeper.\n- Keyset needs a stable sort key (here the primary key `id`) and `ORDER BY` on it.\n- The trade-off: OFFSET can jump to any page number; keyset only moves forward from a\n  known row.\n\n"},{"kind":"drill","id":"ddb5-offset","title":"LIMIT/OFFSET page","points":10,"difficulty":10,"intro":"\nSeed ids 1..10 and fetch the second page of three with `LIMIT 3 OFFSET 3` — skip the\nfirst three, take the next three.\n\n","prompt":"\nSeed 1..10, query `ORDER BY id LIMIT 3 OFFSET 3`, collect the ids, and print them\n(`[4 5 6]`).\n\n","target":"package main\n\nimport (\n\t\"database/sql\"\n\t\"fmt\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\nfunc main() {\n\tdb, _ := sql.Open(\"sqlite\", \":memory:\")\n\tdefer db.Close()\n\tdb.Exec(`CREATE TABLE items (id INTEGER PRIMARY KEY)`)\n\tfor i := 1; i <= 10; i++ {\n\t\tdb.Exec(`INSERT INTO items VALUES (?)`, i)\n\t}\n\trows, _ := db.Query(`SELECT id FROM items ORDER BY id LIMIT 3 OFFSET 3`)\n\tdefer rows.Close()\n\tvar got []int\n\tfor rows.Next() {\n\t\tvar id int\n\t\trows.Scan(&id)\n\t\tgot = append(got, id)\n\t}\n\tfmt.Println(got)\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `database/sql`, Go's standard database interface...","...and `fmt` for printing.","","...plus the pure-Go `modernc.org/sqlite` driver, blank-imported so it registers itself under the name `sqlite`.","Closes the import group.","","Opens `main`.","Opens an in-memory SQLite database.","Closes the database when `main` returns.","Creates an `items` table keyed by id.","Loops i from 1 to 10.","Inserts id i.","Closes the seed loop.","Fetches the third page with `LIMIT 3 OFFSET 3` (skip the first 3).","Closes the row set when done.","Collects the ids on this page.","Walks each returned row.","Holds this row's id.","Scans the id.","Appends it to the page.","Closes the loop.","Prints `[4 5 6]` — the second page of three.","Closes `main`."],"explanation":"\n`OFFSET 3` tells SQLite to skip the first three rows and `LIMIT 3` to return the next\nthree. Simple, but the skipped rows are still visited.\n\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"ddb5-keyset","title":"Keyset page","points":10,"difficulty":10,"intro":"\nThe same page, keyset-style: `WHERE id > 3 ORDER BY id LIMIT 3`. Instead of skipping\nrows, it seeks past the last id you saw.\n\n","prompt":"\nSeed 1..10, query `WHERE id > ? ORDER BY id LIMIT ?` with `(3, 3)`, and print the ids\n(`[4 5 6]`).\n\n","target":"package main\n\nimport (\n\t\"database/sql\"\n\t\"fmt\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\nfunc main() {\n\tdb, _ := sql.Open(\"sqlite\", \":memory:\")\n\tdefer db.Close()\n\tdb.Exec(`CREATE TABLE items (id INTEGER PRIMARY KEY)`)\n\tfor i := 1; i <= 10; i++ {\n\t\tdb.Exec(`INSERT INTO items VALUES (?)`, i)\n\t}\n\trows, _ := db.Query(`SELECT id FROM items WHERE id > ? ORDER BY id LIMIT ?`, 3, 3)\n\tdefer rows.Close()\n\tvar got []int\n\tfor rows.Next() {\n\t\tvar id int\n\t\trows.Scan(&id)\n\t\tgot = append(got, id)\n\t}\n\tfmt.Println(got)\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `database/sql`, Go's standard database interface...","...and `fmt` for printing.","","...plus the pure-Go `modernc.org/sqlite` driver, blank-imported so it registers itself under the name `sqlite`.","Closes the import group.","","Opens `main`.","Opens an in-memory SQLite database.","Closes the database when `main` returns.","Creates an `items` table keyed by id.","Loops i from 1 to 10.","Inserts id i.","Closes the seed loop.","Keyset page: everything with id greater than 3, next three ascending.","Closes the row set when done.","Collects the ids on this page.","Walks each returned row.","Holds this row's id.","Scans the id.","Appends it to the page.","Closes the loop.","Prints `[4 5 6]` — same page, found without a growing OFFSET.","Closes `main`."],"explanation":"\n`WHERE id > 3` lets the index jump straight to id 4, so no skipped rows are scanned.\nThe page matches the OFFSET version but scales better.\n\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"ddb5-next","title":"Next keyset page","points":10,"difficulty":10,"intro":"\nTo advance, feed the last id of the previous page back in. Starting after id 6 gives\nthe following three ids.\n\n","prompt":"\nSeed 1..10, query `WHERE id > ? ORDER BY id LIMIT ?` with `(6, 3)`, and print the ids\n(`[7 8 9]`).\n\n","target":"package main\n\nimport (\n\t\"database/sql\"\n\t\"fmt\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\nfunc main() {\n\tdb, _ := sql.Open(\"sqlite\", \":memory:\")\n\tdefer db.Close()\n\tdb.Exec(`CREATE TABLE items (id INTEGER PRIMARY KEY)`)\n\tfor i := 1; i <= 10; i++ {\n\t\tdb.Exec(`INSERT INTO items VALUES (?)`, i)\n\t}\n\trows, _ := db.Query(`SELECT id FROM items WHERE id > ? ORDER BY id LIMIT ?`, 6, 3)\n\tdefer rows.Close()\n\tvar got []int\n\tfor rows.Next() {\n\t\tvar id int\n\t\trows.Scan(&id)\n\t\tgot = append(got, id)\n\t}\n\tfmt.Println(got)\n}\n","line_comments":["Runnable `package main`.","","Begins a grouped import...","...of `database/sql`, Go's standard database interface...","...and `fmt` for printing.","","...plus the pure-Go `modernc.org/sqlite` driver, blank-imported so it registers itself under the name `sqlite`.","Closes the import group.","","Opens `main`.","Opens an in-memory SQLite database.","Closes the database when `main` returns.","Creates an `items` table keyed by id.","Loops i from 1 to 10.","Inserts id i.","Closes the seed loop.","Next keyset page: feed the last id (6) back in to get the following three.","Closes the row set when done.","Collects the ids on this page.","Walks each returned row.","Holds this row's id.","Scans the id.","Appends it to the page.","Closes the loop.","Prints `[7 8 9]` — the page after id 6.","Closes `main`."],"explanation":"\nKeyset paging moves forward by remembering the last id. Passing 6 returns 7, 8, 9 —\nthe next page, found with a seek rather than a growing offset.\n\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"cdb5-pageafter","title":"Implement PageAfter","points":40,"difficulty":11,"intro":"\nBuild a keyset pager. Given the last id a client saw and a page size, return the next\n`size` ids strictly greater than it, in ascending order.\n\n","instructions":"\n## Your turn\n\nImplement the function `PageAfter`:\n\n```go\nfunc PageAfter(lastID, size int) []int { ... }\n```\n\nSeed a table with ids `1..100`, then return the next `size` ids with\n`SELECT id FROM items WHERE id > ? ORDER BY id LIMIT ?`. Return an empty (non-nil is\nfine) slice when there is nothing after `lastID` or when `size <= 0`.\n\nExamples:\n\n- `PageAfter(0, 3)` -> `[1 2 3]`\n- `PageAfter(98, 5)` -> `[99 100]`\n- `PageAfter(100, 5)` -> `[]`\n\nHidden tests decide correctness.\n\n","starter":"package student\n\nimport (\n\t\"database/sql\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\n// PageAfter keyset-paginates a table seeded with ids 1..100: it returns the\n// next `size` ids strictly greater than lastID, ascending.\nfunc PageAfter(lastID, size int) []int {\n\t// TODO: seed ids 1..100, then\n\t// SELECT id FROM items WHERE id > ? ORDER BY id LIMIT ?.\n\t_ = sql.Open\n\treturn nil\n}\n","tests":"package student\n\nimport (\n\t\"reflect\"\n\t\"testing\"\n)\n\nfunc TestPageAfterStart(t *testing.T) {\n\tgot := PageAfter(0, 3)\n\tif !reflect.DeepEqual(got, []int{1, 2, 3}) {\n\t\tt.Fatalf(\"PageAfter(0,3) = %v, want [1 2 3]\", got)\n\t}\n}\n\nfunc TestPageAfterMiddle(t *testing.T) {\n\tgot := PageAfter(10, 2)\n\tif !reflect.DeepEqual(got, []int{11, 12}) {\n\t\tt.Fatalf(\"PageAfter(10,2) = %v, want [11 12]\", got)\n\t}\n}\n\nfunc TestPageAfterTailShort(t *testing.T) {\n\tgot := PageAfter(98, 5)\n\tif !reflect.DeepEqual(got, []int{99, 100}) {\n\t\tt.Fatalf(\"PageAfter(98,5) = %v, want [99 100]\", got)\n\t}\n}\n\nfunc TestPageAfterPastEnd(t *testing.T) {\n\tgot := PageAfter(100, 5)\n\tif len(got) != 0 {\n\t\tt.Fatalf(\"PageAfter(100,5) = %v, want empty\", got)\n\t}\n}\n\nfunc TestPageAfterZeroSize(t *testing.T) {\n\tgot := PageAfter(0, 0)\n\tif len(got) != 0 {\n\t\tt.Fatalf(\"PageAfter(0,0) = %v, want empty\", got)\n\t}\n}\n","entry":"PageAfter","gabarito":{"time":"O(size)","space":"O(size)","solution":"package student\n\nimport (\n\t\"database/sql\"\n\n\t_ \"modernc.org/sqlite\"\n)\n\nfunc PageAfter(lastID, size int) []int {\n\tout := []int{}\n\tif size <= 0 {\n\t\treturn out\n\t}\n\tdb, err := sql.Open(\"sqlite\", \":memory:\")\n\tif err != nil {\n\t\treturn out\n\t}\n\tdefer db.Close()\n\tdb.Exec(`CREATE TABLE items (id INTEGER PRIMARY KEY)`)\n\tfor i := 1; i <= 100; i++ {\n\t\tdb.Exec(`INSERT INTO items (id) VALUES (?)`, i)\n\t}\n\trows, err := db.Query(`SELECT id FROM items WHERE id > ? ORDER BY id LIMIT ?`, lastID, size)\n\tif err != nil {\n\t\treturn out\n\t}\n\tdefer rows.Close()\n\tfor rows.Next() {\n\t\tvar id int\n\t\trows.Scan(&id)\n\t\tout = append(out, id)\n\t}\n\treturn out\n}\n","justification":"\nThe query reads at most `size` rows and the result slice holds at most `size` ids, so\nboth time and space are **O(size)** — independent of how deep into the table the page\nsits. That flat cost is the whole advantage of keyset over a large `OFFSET`.\n\n"}}]},{"id":"udb6-indexes","title":"Indexes & EXPLAIN QUERY PLAN","difficulty":10,"level":"intermediate","intro":"\nAn index is a sorted structure that turns a full-table scan into a quick seek. Without\none, a `WHERE col = ?` lookup scans every row; with an index on that column, SQLite\nseeks straight to the match. `EXPLAIN QUERY PLAN` shows which strategy the database\nchose, so you can confirm an index is actually used.\n\n","steps":[{"kind":"concept","id":"cdb6-index","title":"Why indexes matter","points":5,"difficulty":10,"intro":"\nA lookup without an index is a linear SCAN. An index on the filtered column lets the\ndatabase jump to the rows it needs. `EXPLAIN QUERY PLAN` reveals which one happens.\n\n","body":"\n## Create an index, read the plan\n\n```go\ndb.Exec(`CREATE INDEX idx_users_email ON users(email)`)\n\nrows, _ := db.Query(`EXPLAIN QUERY PLAN SELECT name FROM users WHERE email = ?`, \"a@x\")\nfor rows.Next() {\n    var id, parent, notused int\n    var detail string\n    rows.Scan(&id, &parent, &notused, &detail)\n    // detail: \"SEARCH users USING INDEX idx_users_email (email=?)\"\n}\n```\n\n- **`CREATE INDEX`** builds a sorted lookup structure on one or more columns.\n- Without an index, the plan says **`SCAN`** — every row is examined.\n- With a matching index, the plan says **`SEARCH ... USING INDEX`** — a direct seek.\n- **`EXPLAIN QUERY PLAN`** returns rows whose last column (`detail`) is the\n  human-readable strategy; read it to verify your index is doing its job.\n\n"},{"kind":"drill","id":"ddb6-scan","title":"No index means a SCAN","points":10,"difficulty":10,"intro":"\nWith no index on the filtered column, SQLite has to examine every row. `EX
