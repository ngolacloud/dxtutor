do!(\"return \\\"negative\\\", \\\"zero\\\", or \\\"positive\\\"\")\n}\n","tests":"use student::sign;\n\n#[test]\nfn negatives() {\n    assert_eq!(sign(-5), \"negative\");\n    assert_eq!(sign(-1), \"negative\");\n}\n\n#[test]\nfn zero() {\n    assert_eq!(sign(0), \"zero\");\n}\n\n#[test]\nfn positives() {\n    assert_eq!(sign(7), \"positive\");\n    assert_eq!(sign(1), \"positive\");\n}\n","entry":"sign","gabarito":{"time":"O(1)","space":"O(1)","solution":"pub fn sign(n: i32) -> &'static str {\n    if n < 0 {\n        \"negative\"\n    } else if n == 0 {\n        \"zero\"\n    } else {\n        \"positive\"\n    }\n}\n","justification":"The function performs at most two comparisons and returns a reference to a string\nliteral already stored in the program's binary. There is no loop and no\nallocation, so time and space are both constant: **O(1)**. `&'static str` means\nthe returned text lives for the whole program, so nothing is created or copied.\n"}}]},{"id":"u4-loops","title":"Loops","difficulty":4,"level":"basic","intro":"Repetition is where computers earn their keep. `for` walks every item of a range\nor collection, `while` repeats until a condition changes, and `loop` runs until\nyou `break`. By the end you will sum the numbers from 1 to n under hidden tests.\n","steps":[{"kind":"concept","id":"c4-loops","title":"Doing something many times","points":5,"difficulty":4,"intro":"A loop is a controlled way to repeat work without copying code. The computer\nkeeps a small piece of state — a counter, or the loop's position in a range — and\nrepeats the body, updating that state each pass, until a stopping condition is\nmet. Choosing the right loop is about who controls the stopping: the range (`for`),\na condition (`while`), or your own `break` (`loop`).\n","body":"## Three ways to repeat\n\nA **`for`** loop walks each value an iterator yields. `0..n` is a range from `0`\nup to but not including `n`:\n\n```rust\nfor i in 0..3 {\n    println!(\"{i}\"); // 0, 1, 2\n}\n```\n\nA **`while`** loop repeats as long as its condition holds:\n\n```rust\nlet mut n = 3;\nwhile n > 0 {\n    println!(\"{n}\");\n    n -= 1;\n}\n```\n\nA plain **`loop`** runs forever until you `break`, and `break value` can even\nreturn a result. Reach for `for` whenever you are walking a known range — it is\nthe clearest and the hardest to get wrong (no off-by-one, no forgotten update).\n"},{"kind":"drill","id":"d10-for-range","title":"Count with a for loop","points":10,"difficulty":4,"intro":"A `for` over a range binds each value in turn to the loop variable and runs the\nbody once per value. `1..=3` is an **inclusive** range, so it yields 1, 2, and 3.\nThe loop variable is fresh each pass; you do not manage a counter by hand.\n","prompt":"Print the numbers 1, 2, 3 with a `for` loop over an inclusive range.\n\n**Why:** `1..=3` yields 1, 2, 3 (the `=` includes the end). The body runs once\nper value, with `i` bound to that value.\n","target":"fn main() {\n    for i in 1..=3 {\n        println!(\"count {i}\");\n    }\n}\n","line_comments":["Declares `main` and opens its body.","Loops over the inclusive range `1..=3`, binding `i` to 1, then 2, then 3.","Body: prints `count 1`, `count 2`, `count 3` on successive passes.","Closes the `for` loop body.","Closes `main`."],"explanation":"The `for` loop ran its body three times, with `i` taking the values 1, 2, 3 from\nthe inclusive range `1..=3`, so it printed three lines. The loop variable was\nmanaged for you — no counter to increment, no condition to get wrong.\n","placeholder_policy":"shown"},{"kind":"drill","id":"d11-while","title":"Count down with while","points":10,"difficulty":5,"intro":"A `while` loop checks its condition **before** each pass and stops when it turns\nfalse. You must change the state the condition depends on inside the body, or the\nloop never ends. Here the countdown decrements `n` until it reaches zero.\n","prompt":"Count down from 3 to 1 with a `while` loop.\n\n**Why:** `while n > 0` keeps looping as long as the condition holds. You must\nchange `n` inside the body (here with `n -= 1`) so it eventually stops.\n","target":"fn main() {\n    let mut n = 3;\n    while n > 0 {\n        println!(\"{n}\");\n        n -= 1;\n    }\n    println!(\"liftoff\");\n}\n","line_comments":["Declares `main` and opens its body.","Binds a mutable `n` to `3` — mutable because the loop will change it.","Checks `n > 0` before each pass; loops while it holds.","Body: prints the current value of `n`.","Decrements `n` by one; without this the loop would run forever.","Closes the `while` body; control jumps back to re-check the condition.","Runs after the loop ends (when `n` reached 0): prints `liftoff`.","Closes `main`."],"explanation":"The loop printed 3, 2, 1 — one per pass — and stopped when `n` reached `0` and\nthe condition `n > 0` became false. Then `liftoff` printed. The `n -= 1` is what\nmakes the loop terminate; forget it and the condition would stay true forever.\n","placeholder_policy":"shown"},{"kind":"drill","id":"d12-accumulate","title":"Accumulate a running total","points":10,"difficulty":5,"intro":"The accumulator pattern is everywhere: keep a running value outside the loop and\nupdate it each pass. Here `sum` starts at zero and grows by each `i`. This is\nexactly the shape of the challenge that ends this unit.\n","prompt":"Add the numbers 1 through 5 into a running total and print it.\n\n**Why:** the accumulator pattern — a `mut` total updated each pass — turns\nrepetition into a single computed result.\n","target":"fn main() {\n    let mut sum = 0;\n    for i in 1..=5 {\n        sum += i;\n    }\n    println!(\"sum = {sum}\");\n}\n","line_comments":["Declares `main` and opens its body.","Binds a mutable accumulator `sum` to `0`.","Loops over `1..=5`, binding `i` to each value in turn.","Adds the current `i` to `sum`; after the loop `sum` holds 1+2+3+4+5.","Closes the `for` body.","Prints `sum = 15`.","Closes `main`."],"explanation":"Each pass added `i` to `sum`, so after walking 1 through 5 the total was `15`.\nKeeping an accumulator outside the loop and updating it inside is the core idea\nbehind the `sum_to` challenge coming next.\n","placeholder_policy":"shown"},{"kind":"challenge","id":"ch4-sum-to","title":"Sum from 1 to n","points":30,"difficulty":6,"intro":"You apply the accumulator pattern. Return the sum `1 + 2 + ... + n`, and `0` when\n`n` is `0`. Use `u32` (unsigned) because the inputs and the total are never\nnegative. A single `for` over an inclusive range, adding into a running total,\nsolves it in one linear pass.\n","instructions":"## Your turn\n\nImplement `sum_to`:\n\n```rust\npub fn sum_to(n: u32) -> u32 { ... }\n```\n\nReturn the sum of all integers from `1` to `n` inclusive. `sum_to(0)` is `0`.\n\nExamples:\n\n- `sum_to(0)` → `0`\n- `sum_to(5)` → `15`\n- `sum_to(100)` → `5050`\n\n**Hint:** start a total at `0` and add each value from a `for i in 1..=n` loop.\n\nHidden tests decide correctness.\n","starter":"pub fn sum_to(n: u32) -> u32 {\n    todo!(\"accumulate 1 + 2 + ... + n\")\n}\n","tests":"use student::sum_to;\n\n#[test]\nfn zero_sums_to_zero() {\n    assert_eq!(sum_to(0), 0);\n}\n\n#[test]\nfn small() {\n    assert_eq!(sum_to(5), 15);\n}\n\n#[test]\nfn hundred() {\n    assert_eq!(sum_to(100), 5050);\n}\n","entry":"sum_to","gabarito":{"time":"O(n)","space":"O(1)","solution":"pub fn sum_to(n: u32) -> u32 {\n    let mut total = 0;\n    for i in 1..=n {\n        total += i;\n    }\n    total\n}\n","justification":"The loop runs exactly `n` times, doing constant work each pass, so the time grows\nin direct proportion to `n`: **O(n)**. Only one accumulator variable is kept\nregardless of `n`, so the space is **O(1)**. (A closed form `n*(n+1)/2` would be\nO(1) time, but the loop version is what this unit teaches and is plenty fast.)\n"}}]},{"id":"u5-functions","title":"Functions","difficulty":5,"level":"basic","intro":"Functions are how you name a piece of work and reuse it. You will pass arguments,\nreturn values, and compose small functions into bigger ones. By the end you will\ncompute the maximum of three numbers under hidden tests.\n","steps":[{"kind":"concept","id":"c5-functions","title":"Named, reusable work","points":5,"difficulty":5,"intro":"When `main` calls a function, the computer sets up a small region of memory — a\n**stack frame** — for that call: it copies the arguments into the parameters,\nruns the body, and the return value flows back to the caller. A function has\ntyped inputs and a typed output, and in Rust the final expression without a\nsemicolon is what it hands back.\n","body":"## Parameters, return values, composition\n\n```rust\nfn double(n: i32) -> i32 {\n    n * 2          // tail expression, no semicolon → the return value\n}\n\nfn quadruple(n: i32) -> i32 {\n    double(double(n)) // functions compose: the output of one feeds the next\n}\n```\n\n- `(n: i32)` declares a parameter `n` of type `i32`.\n- `-> i32` declares the return type.\n- The last expression with **no semicolon** is returned; `return` is only needed\n  to leave early.\n\nSmall, well-named functions are the building blocks of every program — you write\na calculation once and call it wherever you need it.\n"},{"kind":"drill","id":"d13-define-call","title":"Define a function and call it","points":10,"difficulty":5,"intro":"Here you declare your own function and call it from `main`. The argument `21` is\ncopied into the parameter `n`, the body computes `n * 2`, and that value flows\nback to be stored in `result`. The tail expression `n * 2` has no semicolon, so\nit is the return value.\n","prompt":"Define `double` and call it from `main`.\n\n**Why:** a function names a calculation. `double(21)` copies `21` into `n`,\nreturns `n * 2`, and you store the answer. The last expression (no semicolon) is\nwhat the function returns.\n","target":"fn double(n: i32) -> i32 {\n    n * 2\n}\n\nfn main() {\n    let result = double(21);\n    println!(\"double of 21 is {result}\");\n}\n","line_comments":["Declares `double`, taking an `i32` called `n` and returning an `i32`.","The tail expression `n * 2` (no semicolon) is the value returned.","Closes `double`.","","Declares `main` and opens its body.","Calls `double(21)`; `21` is copied into `n`, and the returned `42` is bound to `result`.","Prints `double of 21 is 42`.","Closes `main`."],"explanation":"`main` called `double(21)`, which computed `21 * 2` and returned `42`; you stored\nit in `result` and printed it. The blank line between the two functions is just\nfor readability — Rust ignores it.\n","placeholder_policy":"shown"},{"kind":"drill","id":"d14-compose","title":"Compose two functions","points":10,"difficulty":6,"intro":"Functions compose: the output of one can be the input of another. `min` and `max`\nare methods already on `i32`, called with a dot. Here you build `clamp_small` on\ntop of them, then call it from `main`. This is how larger behaviour is assembled\nfrom small, tested pieces.\n","prompt":"Write `clamp_small` that keeps a number within 0..=9, built on the `max` and\n`min` methods, then call it.\n\n**Why:** `n.max(0)` is never below 0; `.min(9)` is never above 9. Chaining them\nclamps the value — and wrapping that in a named function makes it reusable.\n","target":"fn clamp_small(n: i32) -> i32 {\n    n.max(0).min(9)\n}\n\nfn main() {\n    println!(\"{}\", clamp_small(15));\n    println!(\"{}\", clamp_small(-4));\n}\n","line_comments":["Declares `clamp_small`, taking and returning an `i32`.","`n.max(0)` lifts anything below 0 up to 0, then `.min(9)` caps it at 9; the result is returned.","Closes `clamp_small`.","","Declares `main` and opens its body.","Calls `clamp_small(15)`; 15 is capped to 9, which prints.","Calls `clamp_small(-4)`; -4 is lifted to 0, which prints.","Closes `main`."],"explanation":"`clamp_small` chained the `max` and `min` methods to keep its input within 0..=9,\nso `15` became `9` and `-4` became `0`. You composed two existing operations into\none named function and reused it twice.\n","placeholder_policy":"shown"},{"kind":"challenge","id":"ch5-max3","title":"Maximum of three","points":30,"difficulty":7,"intro":"You apply functions and comparison. Return the largest of three `i32` values.\nThe cleanest way reuses the `max` method twice — `a.max(b).max(c)` — but an\n`if`/`else` chain works too. The point is to return the right value, not to print\nit; hidden tests check it.\n","instructions":"## Your turn\n\nImplement `max_of_three`:\n\n```rust\npub fn max_of_three(a: i32, b: i32, c: i32) -> i32 { ... }\n```\n\nReturn the largest of the three values.\n\nExamples:\n\n- `max_of_three(1, 2, 3)` → `3`\n- `max_of_three(9, -4, 0)` → `9`\n- `max_of_three(5, 5, 5)` → `5`\n\n**Hint:** `a.max(b)` returns the larger of `a` and `b`; chain it with `.max(c)`.\n\nHidden tests decide correctness.\n","starter":"pub fn max_of_three(a: i32, b: i32, c: i32) -> i32 {\n    todo!(\"return the largest of a, b, c\")\n}\n","tests":"use student::max_of_three;\n\n#[test]\nfn last_is_biggest() {\n    assert_eq!(max_of_three(1, 2, 3), 3);\n}\n\n#[test]\nfn first_is_biggest() {\n    assert_eq!(max_of_three(9, -4, 0), 9);\n}\n\n#[test]\nfn all_equal() {\n    assert_eq!(max_of_three(5, 5, 5), 5);\n}\n\n#[test]\nfn middle_is_biggest() {\n    assert_eq!(max_of_three(-2, 8, 3), 8);\n}\n","entry":"max_of_three","gabarito":{"time":"O(1)","space":"O(1)","solution":"pub fn max_of_three(a: i32, b: i32, c: i32) -> i32 {\n    a.max(b).max(c)\n}\n","justification":"The function does a fixed number of comparisons — two — no matter what the inputs\nare, and keeps no extra data. Both time and space are therefore constant:\n**O(1)**. `a.max(b)` yields the larger of the first two, and `.max(c)` folds in\nthe third.\n"}}]},{"id":"u6-ownership","title":"Ownership & borrowing","difficulty":6,"level":"intermediate","intro":"Here is the idea at the heart of Rust: every value has a single **owner**, and\nwhen the owner goes out of scope the value is freed — no garbage collector, no\nmanual free. Instead of giving ownership away, you can **borrow** a value with\n`&`. By the end you will count characters in borrowed text under hidden tests.\n","steps":[{"kind":"concept","id":"c6-ownership","title":"Owning and borrowing values","points":5,"difficulty":6,"intro":"Memory safety usually costs you either a garbage collector (pauses, overhead) or\nmanual `free` calls (bugs, crashes). Rust takes a third path: the compiler tracks,\nat compile time, who owns each value and frees it exactly once when the owner\nleaves scope. Borrowing lets other code read or mutate a value temporarily\nwithout taking that ownership — all checked before your program runs.\n","body":"## Move, borrow, and scope\n\nA `String` has a single owner. Assigning it **moves** ownership; the old name can\nno longer be used:\n\n```rust\nlet a = String::from(\"hi\");\nlet b = a;        // ownership moves to `b`\n// println!(\"{a}\"); // error: `a` was moved\n```\n\n**Borrowing** with `&` lends access without moving:\n\n```rust\nfn len(s: &String) -> usize { s.len() } // borrows, does not own\nlet a = String::from(\"hi\");\nlet n = len(&a);  // lend a reference\nprintln!(\"{a}\");  // still usable — ownership never left\n```\n\nA `&` is a shared, read-only borrow; `&mut` is an exclusive borrow that may\nmutate. The rule — many readers **or** one writer, never both — is what makes\ndata races impossible. When the owner's scope ends, the value is freed\nautomatically.\n"},{"kind":"drill","id":"d15-borrow","title":"Borrow instead of move","points":10,"difficulty":6,"intro":"Passing `&s` lends a reference to the function instead of handing over ownership,\nso `s` is still usable afterwards. The function reads through the borrow with\n`.len()` and returns a number. Nothing was copied or freed; the owner stayed put.\n","prompt":"Pass a borrow of a `String` to a function that reads its length, then keep using\nthe original.\n\n**Why:** `&s` lends a read-only reference. Because ownership never moved, `s`\nremains valid after the call — borrowing is how functions look without taking.\n","target":"fn char_len(s: &String) -> usize {\n    s.len()\n}\n\nfn main() {\n    let s = String::from(\"hello\");\n    let n = char_len(&s);\n    println!(\"{s} has {n} bytes\");\n}\n","line_comments":["Declares `char_len`, borrowing a `String` by shared reference `&String`.","Reads the length through the borrow and returns it; the caller keeps ownership.","Closes `char_len`.","","Declares `main` and opens its body.","Creates an owned `String` `s` holding `\"hello\"`.","Lends a reference with `&s`; the returned length is bound to `n`.","Prints `hello has 5 bytes` — `s` is still usable because it was only borrowed.","Closes `main`; `s` goes out of scope here and its memory is freed automatically."],"explanation":"`char_len(&s)` borrowed `s` rather than taking it, so after the call `s` was\nstill valid and printable. The `&` is the whole point: the function looked at the\ndata without owning it, and Rust freed `s` only when `main` ended.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d16-mut-borrow","title":"Mutate through a borrow","points":10,"difficulty":7,"intro":"A `&mut` borrow lends **exclusive** write access. The function can change the\nvalue in place, and the change is visible to the owner afterwards. While a `&mut`\nborrow is active, no other borrow of the same value may exist — that exclusivity\nis what prevents data races.\n","prompt":"Pass a mutable borrow so a function can append to a `String` in place.\n\n**Why:** `&mut s` lends exclusive write access. `push_str` appends through the\nborrow, and the owner sees the change once the borrow ends.\n","target":"fn add_bang(s: &mut String) {\n    s.push_str(\"!\");\n}\n\nfn main() {\n    let mut s = String::from(\"hi\");\n    add_bang(&mut s);\n    println!(\"{s}\");\n}\n","line_comments":["Declares `add_bang`, taking an exclusive mutable borrow `&mut String`.","Appends `\"!\"` to the borrowed string in place; no value is returned.","Closes `add_bang`.","","Declares `main` and opens its body.","Creates a mutable `String` `s` holding `\"hi\"` — mutable so it can be borrowed `&mut`.","Lends an exclusive borrow with `&mut s`; the function mutates it.","Prints `hi!` — the append is visible to the owner now the borrow has ended.","Closes `main`; `s` is freed here."],"explanation":"`add_bang(&mut s)` borrowed `s` exclusively and appended through that borrow, so\nafterwards `s` read `hi!`. Only one `&mut` borrow may exist at a time — that\nexclusivity is exactly what makes in-place mutation safe in Rust.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d17-str-slice","title":"Borrow text as &str","points":10,"difficulty":7,"intro":"A `&str` is a borrowed, read-only view of UTF-8 text. Both a string literal and\nan owned `String` can be viewed as `&str`, so functions that only read text take\n`&str` to accept either. Here `first_word` returns a slice that borrows *into*\nthe original — no new text is allocated.\n","prompt":"Write a function taking `&str` that returns the first word, and call it with a\nliteral.\n\n**Why:** `&str` is a borrowed view of text. Taking `&str` (not `String`) lets the\nfunction accept literals and `String`s alike, without owning anything.\n","target":"fn first_word(text: &str) -> &str {\n    text.split(' ').next().unwrap_or(\"\")\n}\n\nfn main() {\n    let word = first_word(\"hello there\");\n    println!(\"first word: {word}\");\n}\n","line_comments":["Declares `first_word`, borrowing text as `&str` and returning a borrowed `&str`.","Splits on spaces, takes the first piece, and falls back to `\"\"` if there is none.","Closes `first_word`.","","Declares `main` and opens its body.","Calls `first_word` with a string literal (itself a `&str`); binds the slice to `word`.","Prints `first word: hello`.","Closes `main`."],"explanation":"`first_word` viewed the text through a `&str` borrow and returned a slice that\npoints *into* the same text — no copy, no allocation. Taking `&str` is why it\naccepted the literal directly; a `String` would have worked just as well.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch6-count-chars","title":"Count characters","points":30,"difficulty":8,"intro":"You apply borrowing. Take a `&str` — a borrowed view, so you never own or consume\nthe caller's text — and return how many **characters** it contains. Counting\n`chars()` (not bytes) matters for text like `héllo`, where one accented letter is\na single character but more than one byte. The count is a `usize`.\n","instructions":"## Your turn\n\nImplement `count_chars`:\n\n```rust\npub fn count_chars(s: &str) -> usize { ... }\n```\n\nReturn the number of Unicode characters in `s`.\n\nExamples:\n\n- `count_chars(\"\")` → `0`\n- `count_chars(\"abc\")` → `3`\n- `count_chars(\"héllo\")` → `5`\n\n**Hint:** `s.chars()` yields the characters; `.count()` counts them. Counting\nbytes with `.len()` would be wrong for accented letters.\n\nHidden tests decide correctness.\n","starter":"pub fn count_chars(s: &str) -> usize {\n    todo!(\"count the characters in the borrowed string\")\n}\n","tests":"use student::count_chars;\n\n#[test]\nfn empty() {\n    assert_eq!(count_chars(\"\"), 0);\n}\n\n#[test]\nfn ascii() {\n    assert_eq!(count_chars(\"abc\"), 3);\n}\n\n#[test]\nfn accented_is_one_char() {\n    assert_eq!(count_chars(\"héllo\"), 5);\n}\n\n#[test]\nfn spaces_count() {\n    assert_eq!(count_chars(\"a b\"), 3);\n}\n","entry":"count_chars","gabarito":{"time":"O(n)","space":"O(1)","solution":"pub fn count_chars(s: &str) -> usize {\n    s.chars().count()\n}\n","justification":"`chars()` walks the string once, decoding each UTF-8 character, and `count()`\ntallies them — a single linear pass over the `n` bytes of input, so the time is\n**O(n)**. No collection is built; only a running count is kept, so the space is\n**O(1)**. Because `s` is borrowed as `&str`, the caller's text is never owned or\ncopied.\n"}}]},{"id":"u7-collections","title":"Collections: Vec & HashMap","difficulty":7,"level":"intermediate","intro":"Real programs juggle many values at once. A `Vec<T>` is a growable list; a\n`HashMap<K, V>` maps keys to values. You will build them, iterate them, and use\niterator methods like `filter` and `collect`. By the end you will extract the\neven numbers from a slice under hidden tests.\n","steps":[{"kind":"concept","id":"c7-collections","title":"Lists and maps","points":5,"difficulty":7,"intro":"A collection stores many values behind one name and lets you add, read, and walk\nthem. A `Vec<T>` keeps its elements in order in a single block of memory, which\nmakes indexing and iteration fast. A `HashMap<K, V>` trades order for near-instant\nlookup by key. Iterators tie them together: a uniform way to visit every element\nand transform it without writing index loops by hand.\n","body":"## `Vec`, `HashMap`, and iterators\n\nA **`Vec<T>`** is a growable list:\n\n```rust\nlet mut xs = vec![1, 2, 3];\nxs.push(4);           // now [1, 2, 3, 4]\nprintln!(\"{}\", xs[0]); // index access: 1\n```\n\nA **`HashMap<K, V>`** maps keys to values:\n\n```rust\nuse std::collections::HashMap;\nlet mut ages = HashMap::new();\nages.insert(\"Al\", 30);\nprintln!(\"{:?}\", ages.get(\"Al\")); // Some(30)\n```\n\n**Iterators** visit each element. `iter()` borrows the elements; adapters like\n`filter` and `map` transform the stream lazily; `collect()` gathers the results:\n\n```rust\nlet evens: Vec<i32> = (1..=6).filter(|n| n % 2 == 0).collect(); // [2, 4, 6]\n```\n"},{"kind":"drill","id":"d18-vec","title":"Build and walk a Vec","points":10,"difficulty":7,"intro":"A `Vec` starts empty or from the `vec!` macro and grows with `push`. A `for` loop\nover `&xs` borrows each element in turn so the vector stays usable afterwards.\nHere you build a small list and print each item.\n","prompt":"Create a `Vec`, push a value, then print every element with a `for` loop.\n\n**Why:** `vec![..]` builds a list; `push` appends; `for x in &xs` borrows each\nelement so the vector is not consumed.\n","target":"fn main() {\n    let mut xs = vec![10, 20];\n    xs.push(30);\n    for x in &xs {\n        println!(\"item {x}\");\n    }\n}\n","line_comments":["Declares `main` and opens its body.","Builds a mutable `Vec` `xs` with `[10, 20]` using the `vec!` macro.","Appends `30` to the end; `xs` is now `[10, 20, 30]`.","Loops over `&xs`, borrowing each element as `x` without consuming the vector.","Body: prints `item 10`, `item 20`, `item 30` in turn.","Closes the `for` body.","Closes `main`; `xs` is freed here."],"explanation":"You built `[10, 20]`, pushed `30`, and the `for` over `&xs` borrowed each element\nto print it. Iterating by reference (`&xs`) means the vector was not consumed —\nyou could keep using it after the loop.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d19-hashmap","title":"Look up values in a HashMap","points":10,"difficulty":8,"intro":"A `HashMap` stores key→value pairs and looks them up fast. `get` returns an\n`Option`: `Some(value)` when the key is present, `None` when it is not — Rust's\nway of making \"might be missing\" impossible to ignore. Here you insert two scores\nand look one up.\n","prompt":"Insert two entries into a `HashMap` and look one up. `get` returns an `Option`.\n\n**Why:** a `HashMap` maps keys to values. `get` returns `Some(v)` if the key\nexists or `None` otherwise, so a missing key can never be mistaken for a value.\n","target":"use std::collections::HashMap;\n\nfn main() {\n    let mut scores = HashMap::new();\n    scores.insert(\"Al\", 90);\n    scores.insert(\"Mia\", 75);\n    println!(\"{:?}\", scores.get(\"Al\"));\n}\n","line_comments":["Brings `HashMap` into scope so it can be named without its full path.","","Declares `main` and opens its body.","Creates an empty, mutable `HashMap`; key and value types are inferred from use.","Inserts the pair `\"Al\" -> 90`.","Inserts the pair `\"Mia\" -> 75`.","Looks up `\"Al\"` and prints `Some(90)`; `get` returns an `Option`.","Closes `main`."],"explanation":"The map stored two name→score pairs, and `get(\"Al\")` returned `Some(90)`, printed\nwith the `{:?}` debug slot. Had you asked for a missing name, `get` would return\n`None` — the `Option` forces you to acknowledge that a key might not be there.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d20-iterator","title":"Transform with an iterator","points":10,"difficulty":8,"intro":"Iterator adapters build a pipeline: `iter()` produces a stream, `map` transforms\neach element, and `collect` gathers the results into a new `Vec`. The pipeline is\nlazy — nothing runs until `collect` pulls the values through. This is the idiom\nyou will use in the challenge.\n","prompt":"Double every number in a list using `iter().map(...).collect()`.\n\n**Why:** iterator adapters form a pipeline. `map` transforms each element and\n`collect` gathers them into a new `Vec`. The closure `|n| n * 2` is the transform.\n","target":"fn main() {\n    let xs = vec![1, 2, 3];\n    let doubled: Vec<i32> = xs.iter().map(|n| n * 2).collect();\n    println!(\"{doubled:?}\");\n}\n","line_comments":["Declares `main` and opens its body.","Builds the list `[1, 2, 3]` and binds it to `xs`.","Borrows `xs`, maps each element through `|n| n * 2`, and collects into a new `Vec<i32>`.","Prints `[2, 4, 6]` using the `{:?}` debug slot.","Closes `main`."],"explanation":"`iter()` streamed the elements, `map(|n| n * 2)` doubled each, and `collect()`\ngathered them into a brand-new `Vec`, leaving `xs` untouched. The type annotation\n`Vec<i32>` told `collect` what to build. This map/collect pipeline is exactly the\nshape of the `evens` challenge.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch7-evens","title":"Keep the even numbers","points":30,"difficulty":9,"intro":"You apply iterators and `Vec`. Take a borrowed slice `&[i32]` — a read-only view\nof a run of integers — and return a new `Vec<i32>` containing only the even ones,\nin their original order. The idiom is `iter().filter(...).collect()`: keep the\nelements for which `n % 2 == 0`. Because the input is borrowed, the caller's data\nis never consumed.\n","instructions":"## Your turn\n\nImplement `evens`:\n\n```rust\npub fn evens(nums: &[i32]) -> Vec<i32> { ... }\n```\n\nReturn a `Vec<i32>` with only the even numbers of `nums`, keeping their order.\n\nExamples:\n\n- `evens(&[1, 2, 3, 4])` → `[2, 4]`\n- `evens(&[])` → `[]`\n- `evens(&[2, 4, 6])` → `[2, 4, 6]`\n- `evens(&[1, 3, 5])` → `[]`\n\n**Hint:** `nums.iter().copied().filter(|n| n % 2 == 0).collect()`. `copied()`\nturns `&i32` references into owned `i32` values.\n\nHidden tests decide correctness.\n","starter":"pub fn evens(nums: &[i32]) -> Vec<i32> {\n    todo!(\"collect only the even numbers, in order\")\n}\n","tests":"use student::evens;\n\n#[test]\nfn mixed() {\n    assert_eq!(evens(&[1, 2, 3, 4]), vec![2, 4]);\n}\n\n#[test]\nfn empty() {\n    assert_eq!(evens(&[]), Vec::<i32>::new());\n}\n\n#[test]\nfn all_even() {\n    assert_eq!(evens(&[2, 4, 6]), vec![2, 4, 6]);\n}\n\n#[test]\nfn none_even() {\n    assert_eq!(evens(&[1, 3, 5]), Vec::<i32>::new());\n}\n","entry":"evens","gabarito":{"time":"O(n)","space":"O(n)","solution":"pub fn evens(nums: &[i32]) -> Vec<i32> {\n    nums.iter().copied().filter(|n| n % 2 == 0).collect()\n}\n","justification":"The iterator visits each of the `n` elements exactly once, testing `n % 2 == 0`\nin constant time, so the time is **O(n)**. The result `Vec` holds at most `n`\nelements, so the space is **O(n)** in the worst case (all even). The input is a\nborrowed slice, so nothing of the caller's is consumed; `copied()` turns each\n`&i32` into an owned `i32` for the new vector.\n"}}]},{"id":"u8-structs-enums","title":"Structs & enums","difficulty":8,"level":"intermediate","intro":"Now you model your own data. A `struct` groups related fields into one named type;\nan `enum` says a value is exactly one of a fixed set of variants. Methods attach\nbehaviour with `impl`. By the end you will compute the distance between two points\nyou modelled yourself, under hidden tests.\n","steps":[{"kind":"concept","id":"c8-structs-enums","title":"Modelling your own types","points":5,"difficulty":8,"intro":"Built-in types take you only so far; real programs describe their own domain. A\n`struct` bundles several fields into one value you can pass around as a unit — a\npoint, a user, a config. An `enum` captures a closed choice: a value is exactly\none variant, and `match` forces you to handle each. Together they let the type\nsystem encode the rules of your problem so invalid states become unrepresentable.\n","body":"## `struct`, `enum`, and `impl`\n\nA **`struct`** groups named fields:\n\n```rust\nstruct Point { x: i32, y: i32 }\nlet p = Point { x: 1, y: 2 };\nprintln!(\"{}\", p.x); // field access\n```\n\nAn **`enum`** is a closed set of variants, each optionally carrying data:\n\n```rust\nenum Shape {\n    Circle(f64),        // radius\n    Rect(f64, f64),     // width, height\n}\n```\n\n**`impl`** attaches methods. `&self` borrows the value the method is called on:\n\n```rust\nimpl Point {\n    fn sum(&self) -> i32 { self.x + self.y }\n}\n```\n\n`match` on an enum must cover every variant — the compiler checks it, so you can\nnever forget a case.\n"},{"kind":"drill","id":"d21-struct","title":"Define and use a struct","points":10,"difficulty":8,"intro":"A `struct` defines a new type with named fields. You create a value with the\n`Name { field: value }` syntax and read fields with a dot. Here `Point` groups an\nx and a y, and `main` builds one and prints its parts.\n","prompt":"Define a `Point` struct, create one, and print its fields.\n\n**Why:** a `struct` bundles related data under one type. You build it with\n`Point { x: .., y: .. }` and read fields with `p.x` / `p.y`.\n","target":"struct Point {\n    x: i32,\n    y: i32,\n}\n\nfn main() {\n    let p = Point { x: 3, y: 4 };\n    println!(\"({}, {})\", p.x, p.y);\n}\n","line_comments":["Declares a `struct` named `Point`.","Field `x` of type `i32`.","Field `y` of type `i32`.","Closes the struct definition.","","Declares `main` and opens its body.","Creates a `Point` with `x = 3` and `y = 4`.","Prints `(3, 4)` by reading the fields `p.x` and `p.y`.","Closes `main`."],"explanation":"You defined a `Point` type with two fields and built one with `Point { x: 3, y: 4 }`,\nthen read its fields with `p.x` and `p.y` to print `(3, 4)`. A struct lets you\ncarry related data as a single value.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d22-method","title":"Add a method with impl","points":10,"difficulty":9,"intro":"An `impl` block attaches methods to a type. A method whose first parameter is\n`&self` borrows the value it is called on, so it can read fields without taking\nownership. You call it with a dot, like `p.magnitude_squared()`.\n","prompt":"Give `Point` a method that reads its own fields, then call it.\n\n**Why:** `impl Point { fn ...(&self) }` attaches behaviour. `&self` borrows the\npoint so the method can read `self.x` and `self.y`. Call it with `p.method()`.\n","target":"struct Point {\n    x: i32,\n    y: i32,\n}\n\nimpl Point {\n    fn sum(&self) -> i32 {\n        self.x + self.y\n    }\n}\n\nfn main() {\n    let p = Point { x: 3, y: 4 };\n    println!(\"sum = {}\", p.sum());\n}\n","line_comments":["Declares the `Point` struct.","Field `x` of type `i32`.","Field `y` of type `i32`.","Closes the struct definition.","","Opens an `impl` block to attach methods to `Point`.","Declares a method `sum` that borrows the point via `&self` and returns an `i32`.","Returns the sum of the two fields.","Closes the `sum` method.","Closes the `impl` block.","","Declares `main` and opens its body.","Creates a `Point` with `x = 3`, `y = 4`.","Calls the method `p.sum()` and prints `sum = 7`.","Closes `main`."],"explanation":"The `impl Point` block attached a `sum` method that borrowed the point with\n`&self` and added its fields, so `p.sum()` returned `7`. Methods keep behaviour\nnext to the data it works on, called with the familiar dot syntax.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d23-enum-match","title":"Match on an enum","points":10,"difficulty":9,"intro":"An `enum` value is exactly one variant. `match` destructures it, pulling any data\na variant carries into names you can use. Because `match` must cover every\nvariant, the compiler guarantees you never forget one — a missing arm is a compile\nerror, not a runtime surprise.\n","prompt":"Define a small `enum`, then `match` on a value to describe it.\n\n**Why:** an `enum` is a closed set of variants. `match` runs the arm for the\nactual variant and binds any data it carries; covering every variant is required.\n","target":"enum Light {\n    Red,\n    Yellow,\n    Green,\n}\n\nfn main() {\n    let light = Light::Green;\n    let action = match light {\n        Light::Red => \"stop\",\n        Light::Yellow => \"slow down\",\n        Light::Green => \"go\",\n    };\n    println!(\"{action}\");\n}\n","line_comments":["Declares an `enum` named `Light`.","Variant `Red`.","Variant `Yellow`.","Variant `Green`.","Closes the enum definition.","","Declares `main` and opens its body.","Binds `light` to the `Green` variant (named with the `Light::` path).","Starts a `match` on `light`; its result is bound to `action`.","Arm for `Red` → `\"stop\"`.","Arm for `Yellow` → `\"slow down\"`.","Arm for `Green` → `\"go\"`; this one matches.","Closes the `match`.","Prints `go`.","Closes `main`."],"explanation":"`light` was the `Green` variant, so the matching arm made `action` be `\"go\"`. The\n`match` had to list every variant of `Light`, which is how Rust guarantees you\nhandle all cases — add a fourth variant and this code would stop compiling until\nyou handle it.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch8-manhattan","title":"Manhattan distance between points","points":30,"difficulty":10,"intro":"You model data and use it. First define a `Point` with public `x` and `y` fields\n(the tests build points directly), then implement `manhattan`, the grid distance\n`|ax - bx| + |ay - by|`. The `.abs()` method gives the absolute value. This proves\nyou can both declare a type and compute over it.\n","instructions":"## Your turn\n\nDefine a `Point` and implement `manhattan`:\n\n```rust\npub struct Point {\n    pub x: i32,\n    pub y: i32,\n}\n\npub fn manhattan(a: Point, b: Point) -> i32 { ... }\n```\n\nReturn the Manhattan (taxicab) distance: `|a.x - b.x| + |a.y - b.y|`.\n\nExamples:\n\n- `manhattan(Point { x: 0, y: 0 }, Point { x: 3, y: 4 })` → `7`\n- `manhattan(Point { x: 1, y: 1 }, Point { x: 1, y: 1 })` → `0`\n- `manhattan(Point { x: -2, y: 0 }, Point { x: 2, y: 0 })` → `4`\n\n**Hint:** `(a.x - b.x).abs()` is the absolute horizontal gap; add the vertical one.\n\nBoth `Point` (with public fields) and `manhattan` must be public so the tests can\nuse them. Hidden tests decide correctness.\n","starter":"pub struct Point {\n    pub x: i32,\n    pub y: i32,\n}\n\npub fn manhattan(a: Point, b: Point) -> i32 {\n    todo!(\"return |a.x - b.x| + |a.y - b.y|\")\n}\n","tests":"use student::{manhattan, Point};\n\n#[test]\nfn origin_to_point() {\n    assert_eq!(manhattan(Point { x: 0, y: 0 }, Point { x: 3, y: 4 }), 7);\n}\n\n#[test]\nfn same_point_is_zero() {\n    assert_eq!(manhattan(Point { x: 1, y: 1 }, Point { x: 1, y: 1 }), 0);\n}\n\n#[test]\nfn across_the_origin() {\n    assert_eq!(manhattan(Point { x: -2, y: 0 }, Point { x: 2, y: 0 }), 4);\n}\n\n#[test]\nfn both_axes() {\n    assert_eq!(manhattan(Point { x: -1, y: -1 }, Point { x: 2, y: 3 }), 7);\n}\n","entry":"manhattan","gabarito":{"time":"O(1)","space":"O(1)","solution":"pub struct Point {\n    pub x: i32,\n    pub y: i32,\n}\n\npub fn manhattan(a: Point, b: Point) -> i32 {\n    (a.x - b.x).abs() + (a.y - b.y).abs()\n}\n","justification":"The function reads four fields and does a fixed handful of subtractions, absolute\nvalues, and one addition — the same work for any input, with no loop and no\nallocation. Both time and space are therefore constant: **O(1)**. Public fields\non `Point` let the tests construct values directly.\n"}}]},{"id":"u9-error-handling","title":"Error handling: Option & Result","difficulty":9,"level":"intermediate","intro":"Rust has no `null` and no exceptions. Instead, \"might be missing\" is an `Option`\nand \"might fail\" is a `Result`, both ordinary enums the compiler makes you handle.\nBy the end you will write safe division that returns `None` instead of crashing,\nunder hidden tests.\n","steps":[{"kind":"concept","id":"c9-option-result","title":"Absence and failure as values","points":5,"difficulty":9,"intro":"Most languages signal \"no value\" with `null` and \"it broke\" with exceptions —\nboth easy to ignore until they crash you at runtime. Rust makes both explicit in\nthe type system. An `Option<T>` is `Some(value)` or `None`; a `Result<T, E>` is\n`Ok(value)` or `Err(error)`. Because they are enums, you cannot use the inner\nvalue without first handling the empty or failing case — the compiler insists.\n","body":"## `Option` and `Result`\n\n**`Option<T>`** models a value that may be absent:\n\n```rust\nfn first(xs: &[i32]) -> Option<i32> {\n    if xs.is_empty() { None } else { Some(xs[0]) }\n}\n```\n\n**`Result<T, E>`** models an operation that may fail:\n\n```rust\nfn parse(s: &str) -> Result<i32, std::num::ParseIntError> {\n    s.parse::<i32>() // Ok(n) or Err(..)\n}\n```\n\nYou unwrap them by **handling both cases**, usually with `match`:\n\n```rust\nmatch first(&xs) {\n    Some(n) => println!(\"first is {n}\"),\n    None => println!(\"empty\"),\n}\n```\n\nThere is no `null` to forget and no exception to swallow — absence and failure are\nvalues you must deal with, which is why Rust programs crash so rarely.\n\n## Shortcut: the `?` operator\n\nWriting a full `match` just to pass a `None`/`Err` upward gets noisy. When your\nfunction itself returns `Option`/`Result`, the **`?`** operator does it for you:\nit unwraps the `Some`/`Ok` value, or **returns early** with the `None`/`Err`.\n\n```rust\nfn first_doubled(xs: &[i32]) -> Option<i32> {\n    let first = xs.first()?; // None here → return None from the whole function\n    Some(first * 2)\n}\n```\n\n`?` only works inside a function whose return type fits (an `Option` in an\n`Option`-returning function, a `Result` in a `Result`-returning one). It is pure\nsugar for the `match` above — the same behaviour, far less code.\n"},{"kind":"drill","id":"d24-option","title":"Handle an Option with match","points":10,"difficulty":9,"intro":"`Option` is how Rust says \"maybe nothing\". A function returns `Some(value)` or\n`None`, and `match` forces you to handle both arms before you can touch the inner\nvalue. Here a lookup either finds a value or reports it is missing.\n","prompt":"Write a function returning `Option<i32>`, then handle both arms with `match`.\n\n**Why:** `Option` makes absence explicit. `match` must cover `Some(n)` and\n`None`, so you can never use a missing value by accident.\n","target":"fn halve(n: i32) -> Option<i32> {\n    if n % 2 == 0 {\n        Some(n / 2)\n    } else {\n        None\n    }\n}\n\nfn main() {\n    match halve(10) {\n        Some(h) => println!(\"half is {h}\"),\n        None => println!(\"not even\"),\n    }\n}\n","line_comments":["Declares `halve`, returning `Option<i32>` — a value that may be absent.","If `n` is even, the half exists...","...so return `Some(n / 2)`, wrapping the value.","Otherwise there is no clean half...","...so return `None`.","Closes the `if`/`else`.","Closes `halve`.","","Declares `main` and opens its body.","Matches on `halve(10)`, which is `Some(5)`.","`Some(h)` arm: binds `h` to `5` and prints `half is 5`.","`None` arm: would print `not even` for an odd input.","Closes the `match`.","Closes `main`."],"explanation":"`halve(10)` returned `Some(5)`, so the `Some(h)` arm ran, binding `h` to `5`. The\n`match` required both arms, so the `None` possibility could not be ignored — pass\nan odd number and the `None` arm would run instead. That is error handling as\nordinary, checked values.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d25-result","title":"Handle a Result","points":10,"difficulty":10,"intro":"A `Result` is `Ok(value)` on success or `Err(e)` on failure. Parsing text into a\nnumber is the classic example: it returns a `Result` because the text might not\nbe a number. `match` handles both outcomes; the failing case carries an error you\ncan inspect.\n","prompt":"Parse a string to a number and handle both `Ok` and `Err` with `match`.\n\n**Why:** operations that can fail return a `Result`. `match` on `Ok(n)` / `Err(_)`\nforces you to deal with the failure instead of letting it crash the program.\n","target":"fn main() {\n    let text = \"42\";\n    match text.parse::<i32>() {\n        Ok(n) => println!(\"parsed {n}\"),\n        Err(_) => println!(\"not a number\"),\n    }\n}\n","line_comments":["Declares `main` and opens its body.","Binds `text` to the string literal `\"42\"`.","Parses `text` as an `i32`; `parse` returns a `Result`, matched here.","`Ok(n)` arm: parsing succeeded, so `n` is `42` and this prints `parsed 42`.","`Err(_)` arm: would run if the text were not a number (the `_` ignores the error).","Closes the `match`.","Closes `main`."],"explanation":"`\"42\".parse::<i32>()` succeeded, returning `Ok(42)`, so the `Ok(n)` arm bound `n`\nto `42` and printed `parsed 42`. Feed it `\"oops\"` and it would return an `Err`,\nsending control to the other arm. The `Result` made the possibility of failure\nimpossible to overlook.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch9-safe-div","title":"Safe division","points":30,"difficulty":11,"intro":"You apply `Option` to make a dangerous operation safe. Integer division by zero\npanics (crashes) in Rust. Instead of letting that happen, return an\n`Option<i32>`: `None` when the divisor is zero, and `Some(a / b)` otherwise. The\ncaller is then forced to handle the \"cannot divide\" case — no crash, no silent\nwrong answer.\n","instructions":"## Your turn\n\nImplement `safe_div`:\n\n```rust\npub fn safe_div(a: i32, b: i32) -> Option<i32> { ... }\n```\n\nReturn `None` when `b` is `0`, otherwise `Some(a / b)`.\n\nExamples:\n\n- `safe_div(10, 2)` → `Some(5)`\n- `safe_div(7, 0)` → `None`\n- `safe_div(-9, 3)` → `Some(-3)`\n\n**Hint:** guard the zero case first with an `if`, then return `Some(a / b)`.\n\nHidden tests decide correctness.\n","starter":"pub fn safe_div(a: i32, b: i32) -> Option<i32> {\n    todo!(\"return None on divide-by-zero, else Some(a / b)\")\n}\n","tests":"use student::safe_div;\n\n#[test]\nfn divides() {\n    assert_eq!(safe_div(10, 2), Some(5));\n}\n\n#[test]\nfn by_zero_is_none() {\n    assert_eq!(safe_div(7, 0), None);\n}\n\n#[test]\nfn negative_result() {\n    assert_eq!(safe_div(-9, 3), Some(-3));\n}\n\n#[test]\nfn zero_numerator() {\n    assert_eq!(safe_div(0, 5), Some(0));\n}\n","entry":"safe_div","gabarito":{"time":"O(1)","space":"O(1)","solution":"pub fn safe_div(a: i32, b: i32) -> Option<i32> {\n    if b == 0 {\n        None\n    } else {\n        Some(a / b)\n    }\n}\n","justification":"The function does one comparison and at most one division — the same work for any\ninput, with no loop and no allocation — so time and space are both constant:\n**O(1)**. Returning `Option<i32>` turns a potential runtime panic (divide by zero)\ninto a value the caller must handle, which is the whole point of error handling in\nRust.\n"}}]},{"id":"udb1-connect-query","title":"Database: connect & query","difficulty":9,"level":"intermediate","intro":"Databases are how real programs remember things. In this track you drive SQLite directly from Rust with the `rusqlite` crate — no server to run, just a library. You start here by opening a database, creating a table, inserting rows with bound parameters, and reading results back as Rust values. By the end you let SQL count adults for you under hidden tests.\n","steps":[{"kind":"concept","id":"cdb1-connect","title":"Opening a database and running SQL","points":5,"difficulty":9,"intro":"A database is just structured storage you talk to in SQL. The `rusqlite` crate gives you a `Connection` — a handle to one SQLite database — and lets you run statements and read rows back as ordinary Rust values. You bind inputs as parameters instead of pasting them into the SQL text, which is both safer and faster.\n","body":"## Connecting and querying\n\nA `Connection` is your handle to one SQLite database. The easiest one to open is an in-memory database — perfect for tests, because it vanishes when the program ends:\n\n```rust\nuse rusqlite::Connection;\n\nlet conn = Connection::open_in_memory().unwrap();\n```\n\nYou create tables and insert rows with `execute`. Never paste values into the SQL string — **bind** them as parameters (`?1`, `?2`, ...) so the database parses the query once and the values can never be mistaken for SQL:\n\n```rust\nconn.execute(\"CREATE TABLE person (name TEXT, age INTEGER)\", []).unwrap();\nconn.execute(\"INSERT INTO person VALUES (?1, ?2)\", (\"Ana\", 30)).unwrap();\n```\n\nTo read one value back, `query_row` runs a query and hands the single row to a closure; to read many, `prepare` a statement and `query_map` over the rows:\n\n```rust\nlet n: i64 = conn\n    .query_row(\"SELECT COUNT(*) FROM person\", [], |r| r.get(0))\n    .unwrap();\n\nlet mut stmt = conn.prepare(\"SELECT age FROM person\").unwrap();\nlet ages: Vec<i64> = stmt\n    .query_map([], |r| r.get(0)).unwrap()\n    .map(|r| r.unwrap())\n    .collect();\n```\n\n`r.get(0)` reads column 0 of the current row, converting it to the Rust type you asked for. That is the whole loop: open, execute, query, read.\n"},{"kind":"drill","id":"ddb1-open","title":"Open, create, insert, count","points":10,"difficulty":9,"intro":"The smallest useful database program: open an in-memory database, create a table, insert a row with a bound parameter, and count the rows.\n","prompt":"Open an in-memory SQLite database, create a table, insert one row using a bound `?1` parameter, and read back the row count.\n\n**Why:** every database interaction is this loop — connect, run SQL, read a result as a Rust value. Binding `?1` keeps values out of the SQL text, the habit that prevents injection.\n","target":"use rusqlite::Connection;\n\nfn main() {\n    let conn = Connection::open_in_memory().unwrap();\n    conn.execute(\"CREATE TABLE city (name TEXT)\", []).unwrap();\n    conn.execute(\"INSERT INTO city (name) VALUES (?1)\", [\"Luanda\"]).unwrap();\n    let n: i64 = conn\n        .query_row(\"SELECT COUNT(*) FROM city\", [], |r| r.get(0))\n        .unwrap();\n    println!(\"rows = {n}\");\n}\n","line_comments":["Brings `Connection`, rusqlite's handle to one database, into scope.","","Declares `main` and opens its body.","Opens a brand-new SQLite database that lives only in memory.","Runs a `CREATE TABLE` statement; `[]` means no bound parameters.","Inserts one row, binding the name to the `?1` placeholder (no string-building).","Begins a single-row read; `query_row` expects exactly one row.","The SQL counts the rows; the closure reads column 0 of the result.","Unwraps the `Result`, panicking only if the query failed.","Prints `rows = 1` — the one row we inserted.","Closes `main`."],"explanation":"The program opened a private in-memory database, created a table, inserted one row (binding the city name to `?1`), and asked SQLite to count the rows — `rows = 1`. No file, no server: the database lived entirely in memory and disappeared when `main` returned.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"ddb1-param","title":"Read one value with a bound lookup","points":10,"difficulty":9,"intro":"A `WHERE` clause with a bound parameter is how you fetch exactly the row you want. Here you store a product and read its price back by id.\n","prompt":"Insert a product row, then read its price back with a `WHERE id = ?1` lookup.\n\n**Why:** `query_row` is the one-row read, and binding the id as `?1` means the database — not string concatenation — decides what the value is.\n","target":"use rusqlite::Connection;\n\nfn main() {\n    let conn = Connection::open_in_memory().unwrap();\n    conn.execute(\"CREATE TABLE product (id INTEGER, price INTEGER)\", [])\n        .unwrap();\n    conn.execute(\"INSERT INTO product VALUES (?1, ?2)\", [1, 250])\n        .unwrap();\n    let price: i64 = conn\n        .query_row(\"SELECT price FROM product WHERE id = ?1\", [1], |r| r.get(0))\n        .unwrap();\n    println!(\"price = {price}\");\n}\n","line_comments":["Brings `Connection` into scope.","","Declares `main` and opens its body.","Opens an in-memory database to work in.","Begins a `CREATE TABLE` for a product with an id and a price...","...and `.unwrap()` checks the statement succeeded.","Inserts a row, binding `1` to `?1` and `250` to `?2`...","...unwrapping the insert.","Starts a single-row read into `price`.","Selects the price of the row whose id equals the bound `?1` (`1`).","Unwraps the lookup result.","Prints `price = 250`.","Closes `main`."],"explanation":"Binding `1` to `?1` in the `WHERE` clause fetched exactly one row, and `query_row` handed its `price` column to the closure — `price = 250`. The value travelled as a parameter, never as text spliced into the SQL.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"ddb1-rows","title":"Iterate many rows with query_map","points":10,"difficulty":10,"intro":"When a query returns many rows, `prepare` a statement once and `query_map` turns each row into a Rust value you can iterate.\n","prompt":"Seed three numbers, then read them all back with a prepared statement and sum them.\n\n**Why:** `query_row` is for one row; `prepare` + `query_map` is the pattern for many, giving you an iterator of typed results.\n","target":"use rusqlite::Connection;\n\nfn main() {\n    let conn = Connection::open_in_memory().unwrap();\n    conn.execute(\"CREATE TABLE n (v INTEGER)\", []).unwrap();\n    for v in [10, 20, 30] {\n        conn.execute(\"INSERT INTO n (v) VALUES (?1)\", [v]).unwrap();\n    }\n    let mut stmt = conn.prepare(\"SELECT v FROM n ORDER BY v\").unwrap();\n    let rows = stmt.query_map([], |r| r.get::<_, i64>(0)).unwrap();\n    let sum: i64 = rows.map(|r| r.unwrap()).sum();\n    println!(\"sum = {sum}\");\n}\n","line_comments":["Brings `Connection` into scope.","","Declares `main` and opens its body.","Opens an in-memory database.","Creates a one-column table `n`.","Loops over three literal numbers to seed the table.","Inserts each number, bound to `?1`.","Closes the `for` loop.","Prepares a reusable statement that selects every `v` in order.","`query_map` turns each row into an `i64`, yielding an iterator.","Sums the iterator after unwrapping each row.","Prints `sum = 60` (10 + 20 + 30).","Closes `main`."],"explanation":"The prepared statement was run once and `query_map` yielded one `i64` per row; summing them gave `sum = 60`. Preparing the statement separates compiling the SQL from executing it, which is what you want when a query runs more than once.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"chdb1-count-adults","title":"Count adults","points":40,"difficulty":11,"intro":"You apply the open-insert-query loop end to end. Given a list of `(name, age)` pairs, insert them into a table and let SQL — not a Rust loop — count how many are adults (age 18 or older) with a `COUNT(*) ... WHERE` query.\n","instructions":"## Your turn\n\nImplement `count_adults`:\n\n```rust\npub fn count_adults(rows: &[(String, i64)]) -> i64 { ... }\n```\n\nCreate an in-memory table, insert every `(name, age)` row with bound parameters, then return the result of `SELECT COUNT(*) FROM ... WHERE age >= 18`.\n\nExamples:\n\n- `[]` → `0`\n- `[(\"A\", 20), (\"B\", 10), (\"C\", 40)]` → `2`\n- `[(\"A\", 18), (\"B\", 17)]` → `1` (18 counts)\n\n**Hint:** open with `Connection::open_in_memory()`, insert in a loop with `params![name, age]`, and let the database do the counting.\n\nHidden tests decide correctness.\n","starter":"use rusqlite::Connection;\n\npub fn count_adults(rows: &[(String, i64)]) -> i64 {\n    todo!(\"insert the rows, then COUNT(*) WHERE age >= 18\")\n}\n","tests":"use student::count_adults;\n\nfn mk(v: &[(&str, i64)]) -> Vec<(String, i64)> {\n    v.iter().map(|(n, a)| (n.to_string(), *a)).collect()\n}\n\n#[test]\nfn empty_is_zero() {\n    assert_eq!(count_adults(&[]), 0);\n}\n\n#[test]\nfn counts_adults() {\n    let rows = mk(&[(\"A\", 20), (\"B\", 10), (\"C\", 40)]);\n    assert_eq!(count_adults(&rows), 2);\n}\n\n#[test]\nfn boundary_eighteen_counts() {\n    let rows = mk(&[(\"A\", 18), (\"B\", 17)]);\n    assert_eq!(count_adults(&rows), 1);\n}\n\n#[test]\nfn all_minors_is_zero() {\n    let rows = mk(&[(\"A\", 1), (\"B\", 17), (\"C\", 0)]);\n    assert_eq!(count_adults(&rows), 0);\n}\n\n#[test]\nfn all_adults() {\n    let rows = mk(&[(\"A\", 18), (\"B\", 65), (\"C\", 100)]);\n    assert_eq!(count_adults(&rows), 3);\n}\n","entry":"count_adults","gabarito":{"time":"O(n)","space":"O(n)","solution":"use rusqlite::Connection;\n\npub fn count_adults(rows: &[(String, i64)]) -> i64 {\n    let conn = Connection::open_in_memory().unwrap();\n    conn.execute(\n        \"CREATE TABLE people (name TEXT NOT NULL, age INTEGER NOT NULL)\",\n        [],\n    )\n    .unwrap();\n    for (name, age) in rows {\n        conn.execute(\n            \"INSERT INTO people (name, age) VALUES (?1, ?2)\",\n            rusqlite::params![name, age],\n        )\n        .unwrap();\n    }\n    conn.query_row(\n        \"SELECT COUNT(*) FROM people WHERE age >= 18\",\n        [],\n        |r| r.get(0),\n    )\n    .unwrap()\n}\n","justification":"Inserting the `n` rows is linear work, and the `COUNT(*) ... WHERE age >= 18` scans them once — so time is **O(n)**; the rows live in the table, so space is **O(n)** too. Pushing the count into SQL (a `WHERE` plus `COUNT`) rather than looping in Rust lets the database filter and tally in a single pass, which is the whole point of querying instead of fetching everything and counting by hand.\n"}}]},{"id":"udb2-transactions","title":"Database: transactions & atomicity","difficulty":9,"level":"intermediate","intro":"A transaction is a group of changes that must all succeed together or all be undone — no middle ground. That is how a bank transfer never loses money to a crash halfway through. Here you commit, roll back, and lean on `rusqlite`'s automatic rollback-on-drop, then prove atomicity by moving money between two accounts under hidden tests.\n","steps":[{"kind":"concept","id":"cdb2-tx","title":"Transactions: all or nothing","points":5,"difficulty":9,"intro":"Some changes must happen together or not at all — moving money out of one account and into another, for instance. A transaction groups statements so they either all commit or all roll back, never halfway. This 'all-or-nothing' guarantee is called atomicity, and it is the reason databases can be trusted with money.\n","body":"## Atomicity with transactions\n\nA transaction wraps several statements into one unit. Until you **commit**, the changes are pending; a **rollback** throws them all away. In `rusqlite` you start one with `Connection::transaction`, which borrows the connection mutably:\n\n```rust\nlet tx = conn.transaction().unwrap();\ntx.execute(\"UPDATE acct SET bal = bal - 100 WHERE id = 1\", []).unwrap();\ntx.execute(\"UPDATE acct SET bal = bal + 100 WHERE id = 2\", []).unwrap();\ntx.commit().unwrap(); // both updates become permanent together\n```\n\nIf anything is wrong, you roll back instead, and the database is left exactly as it was:\n\n```rust\ntx.rollback().unwrap(); // neither update survives\n```\n\nThere is a safety net: if a `Transaction` is dropped without `commit`, `rusqlite` **rolls it back automatically**. So an early return or a panic cannot leave a half-finished change behind — the default is to undo. That default is what makes transactions a guarantee rather than a hope.\n"},{"kind":"drill","id":"ddb2-commit","title":"Commit a transaction","points":10,"difficulty":9,"intro":"A committed transaction makes its changes permanent. Subtract from a balance inside a transaction, commit, and read the new value.\n","prompt":"Open a transaction, update a balance, `commit`, and read it back.\n\n**Why:** `commit` is the moment pending changes become real. Before it, nothing is visible outside the transaction; after it, the change is durable.\n","target":"use rusqlite::Connection;\n\nfn main() {\n    let mut conn = Connection::open_in_memory().unwrap();\n    conn.execute(\"CREATE TABLE acct (bal INTEGER)\", []).unwrap();\n    conn.execute(\"INSERT INTO acct VALUES (100)\", []).unwrap();\n    let tx = conn.transaction().unwrap();\n    tx.execute(\"UPDATE acct SET bal = bal - 40\", []).unwrap();\n    tx.commit().unwrap();\n    let bal: i64 = conn\n        .query_row(\"SELECT bal FROM acct\", [], |r| r.get(0))\n        .unwrap();\n    println!(\"bal = {bal}\");\n}\n","line_comments":["Brings `Connection` into scope.","","Declares `main` and opens its body.","Opens the database as `mut` — a transaction needs a mutable borrow.","Creates an `acct` table with a single balance column.","Seeds one account with a balance of 100.","Begins a transaction; changes now stay pending until committed.","Subtracts 40 from the balance inside the transaction.","`commit` makes the change permanent and ends the transaction.","Starts reading the balance back out.","Selects the single balance value.","Unwraps the read.","Prints `bal = 60` — the committed change stuck.","Closes `main`."],"explanation":"Inside the transaction the balance dropped from 100 to 60, and `commit` made that permanent — the read afterwards saw `bal = 60`. Commit is the dividing line between a provisional change and a durable one.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"ddb2-rollback","title":"Roll a transaction back","points":10,"difficulty":9,"intro":"A rollback discards everything the transaction did. Make the same change as before, but roll back instead of committing, and watch it vanish.\n","prompt":"Open a transaction, update a balance, `rollback`, and read it back unchanged.\n\n**Why:** rollback is the escape hatch. When a step fails, rolling back restores the database to exactly where it started — the heart of atomicity.\n","target":"use rusqlite::Connection;\n\nfn main() {\n    let mut conn = Connection::open_in_memory().unwrap();\n    conn.execute(\"CREATE TABLE acct (bal INTEGER)\", []).unwrap();\n    conn.execute(\"INSERT INTO acct VALUES (100)\", []).unwrap();\n    let tx = conn.transaction().unwrap();\n    tx.execute(\"UPDATE acct SET bal = bal - 40\", []).unwrap();\n    tx.rollback().unwrap();\n    let bal: i64 = conn\n        .query_row(\"SELECT bal FROM acct\", [], |r| r.get(0))\n        .unwrap();\n    println!(\"bal = {bal}\");\n}\n","line_comments":["Brings `Connection` into scope.","","Declares `main` and opens its body.","Opens the database as `mut` for the transaction.","Creates the `acct` table.","Seeds the account with 100.","Begins a transaction.","Subtracts 40 — but only provisionally, inside the transaction.","`rollback` throws the pending change away.","Starts reading the balance.","Selects the balance.","Unwraps the read.","Prints `bal = 100` — rollback undid the subtraction.","Closes `main`."],"explanation":"The subtraction happened inside the transaction, but `rollback` discarded it, so the balance read back as `bal = 100` — exactly its starting value. Nothing the transaction did survived, which is the guarantee you lean on when a step fails.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"ddb2-drop","title":"An uncommitted transaction auto-rolls-back","points":10,"difficulty":10,"intro":"`rusqlite` rolls a transaction back automatically if you drop it without committing. Change a balance inside a scope, leave without committing, and see the change undone.\n","prompt":"Make a change inside an inner scope, never call `commit`, and read the balance back unchanged after the scope ends.\n\n**Why:** the safe default is *undo*. A panic or early return drops the transaction, and the automatic rollback means a half-finished change can never leak out.\n","target":"use rusqlite::Connection;\n\nfn main() {\n    let mut conn = Connection::open_in_memory().unwrap();\n    conn.execute(\"CREATE TABLE acct (bal INTEGER)\", []).unwrap();\n    conn.execute(\"INSERT INTO acct VALUES (100)\", []).unwrap();\n    {\n        let tx = conn.transaction().unwrap();\n        tx.execute(\"UPDATE acct SET bal = bal + 500\", []).unwrap();\n    }\n    let bal: i64 = conn\n        .query_row(\"SELECT bal FROM acct\", [], |r| r.get(0))\n        .unwrap();\n    println!(\"bal = {bal}\");\n}\n","line_comments":["Brings `Connection` into scope.","","Declares `main` and opens its body.","Opens the database as `mut`.","Creates the `acct` table.","Seeds the account with 100.","Opens an inner scope to bound the transaction's lifetime.","Begins a transaction inside the scope.","Adds 500 provisionally — but we never call `commit`.","The scope ends, dropping `tx`; an uncommitted transaction auto-rolls-back.","Starts reading the balance.","Selects the balance.","Unwraps the read.","Prints `bal = 100` — the dropped transaction left nothing behind.","Closes `main`."],"explanation":"The `+ 500` update ran inside the transaction, but the inner scope ended without a `commit`, so dropping `tx` rolled it back — the balance stayed `bal = 100`. Because undo is the default, forgetting to commit fails safe instead of corrupting data.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"chdb2-transfer","title":"Atomic transfer","points":40,"difficulty":11,"intro":"You prove atomicity with money. Two accounts start with balances `a0` and `b0`. In a single transaction, move `amount` from A to B. If that would push *either* balance below zero, roll the whole transaction back and return the original balances unchanged. Otherwise commit and return the new balances.\n","instructions":"## Your turn\n\nImplement `transfer`:\n\n```rust\npub fn transfer(a0: i64, b0: i64, amount: i64) -> (i64, i64) { ... }\n```\n\nSeed two accounts, open one transaction, debit A and credit B, then check: if either balance is now negative, `rollback` and return `(a0, b0)`; otherwise `commit` and return the new `(a, b)`.\n\nExamples:\n\n- `transfer(100, 0, 30)` → `(70, 30)` (commits)\n- `transfer(50, 0, 80)` → `(50, 0)` (A would go negative → rolls back)\n- `transfer(100, 0, -10)` → `(100, 0)` (B would go negative → rolls back)\n- `transfer(100, 0, 100)` → `(0, 100)` (exact, still valid)\n\n**Hint:** open the database as `mut`, do both `UPDATE`s inside `conn.transaction()`, read the two balances, then `rollback` or `commit` based on the sign.\n\nHidden tests decide correctness.\n","starter":"use rusqlite::Connection;\n\npub fn transfer(a0: i64, b0: i64, amount: i64) -> (i64, i64) {\n    todo!(\"move amount A->B in one transaction; rollback to the originals if either would go negative\")\n}\n","tests":"use student::transfer;\n\n#[test]\nfn normal_transfer_commits() {\n    assert_eq!(transfer(100, 0, 30), (70, 30));\n}\n\n#[test]\nfn overdraw_rolls_back() {\n    assert_eq!(transfer(50, 0, 80), (50, 0));\n}\n\n#[test]\nfn exact_drain_ok() {\n    assert_eq!(transfer(100, 0, 100), (0, 100));\n}\n\n#[test]\nfn negative_amount_would_underflow_b_rolls_back() {\n    assert_eq!(transfer(100, 0, -10), (100, 0));\n}\n\n#[test]\nfn zero_amount_no_change() {\n    assert_eq!(transfer(100, 50, 0), (100, 50));\n}\n","entry":"transfer","gabarito":{"time":"O(1)","space":"O(1)","solution":"use rusqlite::Connection;\n\npub fn transfer(a0: i64, b0: i64, amount: i64) -> (i64, i64) {\n    let mut conn = Connection::open_in_memory().unwrap();\n    conn.execute(\n        \"CREATE TABLE accounts (id INTEGER PRIMARY KEY, balance INTEGER NOT NULL)\",\n        [],\n    )\n    .unwrap();\n    conn.execute(\"INSERT INTO accounts (id, balance) VALUES (1, ?1)\", [a0])\n        .unwrap();\n    conn.execute(\"INSERT INTO accounts (id, balance) VALUES (2, ?1)\", [b0])\n        .unwrap();\n\n    let tx = conn.transaction().unwrap();\n    tx.execute(\"UPDATE accounts SET balance = balance - ?1 WHERE id = 1\", [amount])\n        .unwrap();\n    tx.execute(\"UPDATE accounts SET balance = balance + ?1 WHERE id = 2\", [amount])\n        .unwrap();\n    let a: i64 = tx\n        .query_row(\"SELECT balance FROM accounts WHERE id = 1\", [], |r| r.get(0))\n        .unwrap();\n    let b: i64 = tx\n        .query_row(\"SELECT balance FROM accounts WHERE id = 2\", [], |r| r.get(0))\n        .unwrap();\n    if a < 0 || b < 0 {\n        tx.rollback().unwrap();\n    } else {\n        tx.commit().unwrap();\n    }\n\n    let fa: i64 = conn\n        .query_row(\"SELECT balance FROM accounts WHERE id = 1\", [], |r| r.get(0))\n        .unwrap();\n    let fb: i64 = conn\n        .query_row(\"SELECT balance FROM accounts WHERE id = 2\", [], |r| r.get(0))\n        .unwrap();\n    (fa, fb)\n}\n","justification":"The work is a fixed handful of statements regardless of the numbers — two updates, two reads, and one commit-or-rollback — so time and space are both **O(1)**. The transaction is what makes the result trustworthy: debit and credit either both land or both vanish, so the two accounts can never be seen in a half-moved state, and a would-be-negative balance leaves the books exactly as they started.\n"}}]},{"id":"udb3-wal-pool","title":"Database: WAL & connection pools","difficulty":9,"level":"intermediate","intro":"Real services hit one database from many threads at once. This unit shows the two tools that make that safe and fast: WAL mode, which lets readers run while a writer writes, and a connection pool (`r2d2` + `r2d2_sqlite`) that lends each thread its own connection. You finish by making several threads cooperate on a shared database and produce the same total every time, under hidden tests.\n","steps":[{"kind":"concept","id":"cdb3-pool","title":"Concurrency: WAL and connection pools","points":5,"difficulty":9,"intro":"When several threads touch one database, two things help. WAL mode (write-ahead logging) lets readers keep reading while a writer writes, instead of everyone blocking. A connection pool hands each thread its own connection from a managed set, so you neither open a new one every time nor share one unsafely. Writes still serialize — SQLite allows one writer at a time — but the result stays correct and, when the work is commutative, deterministic.\n","body":"## WAL mode\n\nBy default SQLite blocks readers during a write. **WAL** (write-ahead logging) lets readers continue against the last committed state while one writer appends — far better under concurrency. You turn it on with a pragma (it needs a real file, not an in-memory database):\n\n```rust\nlet mode: String = conn\n    .query_row(\"PRAGMA journal_mode=WAL\", [], |r| r.get(0))\n    .unwrap();\nassert_eq!(mode, \"wal\");\n```\n\n## Connection pools\n\nOpening a connection per task is wasteful; sharing one across threads is unsafe. A **pool** keeps a set of ready connections and lends one out on demand. The `r2d2` crate plus `r2d2_sqlite` give you exactly that:\n\n```rust\nuse r2d2_sqlite::SqliteConnectionManager;\n\nlet manager = SqliteConnectionManager::file(\"app.db\")\n    .with_init(|c| c.execute_batch(\"PRAGMA journal_mode=WAL; PRAGMA busy_timeout=5000;\"));\nlet pool = r2d2::Pool::builder().max_size(8).build(manager).unwrap();\n\nlet conn = pool.get().unwrap(); // checked out; returns to the pool when dropped\n```\n\n`with_init` runs on every new connection — a good place to set WAL and a **busy_timeout** so a thread that meets a locked database waits a moment and retries instead of failing. Writes still happen one at a time, so if each thread adds to a shared total the final sum is the same no matter who went first — concurrent, yet deterministic.\n"},{"kind":"drill","id":"ddb3-wal","title":"Turn on WAL mode","points":10,"difficulty":9,"intro":"WAL mode needs a real file. Open a file-backed database and switch its journal mode to WAL, reading back the mode SQLite confirms.\n","prompt":"Open a file-backed SQLite database and set `PRAGMA journal_mode=WAL`, printing the mode it reports.\n\n**Why:** WAL is the setting that lets readers and a writer work at once. It only applies to on-disk databases, so the program writes to a temp file.\n","target":"use rusqlite::Connection;\n\nfn main() {\n    let path = std::env::temp_dir().join(\"dxtutor_wal_demo.db\");\n    let _ = std::fs::remove_file(&path);\n    let conn = Connection::open(&path).unwrap();\n    let mode: String = conn\n        .query_row(\"PRAGMA journal_mode=WAL\", [], |r| r.get(0))\n        .unwrap();\n    println!(\"mode = {mode}\");\n}\n","line_comments":["Brings `Connection` into scope.","","Declares `main` and opens its body.","Builds a path to a database file in the system temp directory.","Removes any leftover file so we start from a clean database.","Opens (creating) that on-disk database — WAL needs a real file, not memory.","Starts reading the result of the pragma.","Sets the journal mode to WAL and reads back the mode SQLite chose.","Unwraps the pragma result.","Prints `mode = wal` — write-ahead logging is now on.","Closes `main`."],"explanation":"Setting `PRAGMA journal_mode=WAL` on the file-backed database returned `wal`, so readers can now proceed alongside a writer. The same pragma on an in-memory database would report `memory` instead — WAL is a property of a real file.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"ddb3-pool","title":"Check a connection out of a pool","points":10,"difficulty":10,"intro":"A pool lends you a connection and takes it back when you are done. Build a small pool and run a trivial query through a borrowed connection.\n","prompt":"Build an `r2d2` pool over `r2d2_sqlite`, check out one connection, and run `SELECT 1`.\n\n**Why:** pooling is how you share a database across many tasks without opening a fresh connection each time or unsafely sharing one.\n","target":"use r2d2_sqlite::SqliteConnectionManager;\n\nfn main() {\n    let manager = SqliteConnectionManager::memory();\n    let pool = r2d2::Pool::builder().max_size(4).build(manager).unwrap();\n    let conn = pool.get().unwrap();\n    let one: i64 = conn.query_row(\"SELECT 1\", [], |r| r.get(0)).unwrap();\n    println!(\"one = {one}\");\n}\n","line_comments":["Brings the pooled connection manager from `r2d2_sqlite` into scope.","","Declares `main` and opens its body.","Creates a manager that hands out in-memory SQLite connections.","Builds an r2d2 pool holding up to four live connections.","Checks one connection out of the pool.","Runs `SELECT 1` through the pooled connection.","Prints `one = 1`.","Closes `main`; the connection returns to the pool when dropped."],"explanation":"The pool built four connections up front and lent one out for `pool.get()`; `SELECT 1` ran on it and returned `one = 1`. When the borrowed connection is dropped it goes back to the pool, ready for the next caller — no per-task open.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"ddb3-threads","title":"Pooled writes from four threads","points":10,"difficulty":11,"intro":"Each thread borrows its own pooled connection and inserts one value into a shared file-backed database. Because addition is commutative and writes serialize, the final sum is always the same.\n","prompt":"Share a pool across four threads, each inserting one number into a shared database, then read the total.\n\n**Why:** this is the shape of real concurrent database work — a pool per worker, serialized writes, and a result that does not depend on thread order.\n","target":"use r2d2_sqlite::SqliteConnectionManager;\nuse std::thread;\n\nfn main() {\n    let path = std::env::temp_dir().join(\"dxtutor_pool_demo.db\");\n    let _ = std::fs::remove_file(&path);\n    let manager = SqliteConnectionManager::file(&path)\n        .with_init(|c| c.execute_batch(\"PRAGMA busy_timeout=5000;\"));\n    let pool = r2d2::Pool::builder().max_size(4).build(manager).unwrap();\n    pool.get().unwrap().execute(\"CREATE TABLE n (v INTEGER)\", []).unwrap();\n    let mut hs = Vec::new();\n    for v in [1, 2, 3, 4] {\n        let pool = pool.clone();\n        hs.push(thread::spawn(move || {\n            let c = pool.get().unwrap();\n            c.execute(\"INSERT INTO n (v) VALUES (?1)\", [v]).unwrap();\n        }));\n    }\n    for h in hs {\n        h.join().unwrap();\n    }\n    let c = pool.get().unwrap();\n    let sum: i64 = c.query_row(\"SELECT SUM(v) FROM n\", [], |r| r.get(0)).unwrap();\n    println!(\"sum = {sum}\");\n}\n","line_comments":["Brings the pooled connection manager into scope.","Brings `thread` in so we can spawn workers.","","Declares `main` and opens its body.","Builds a temp-file path so every pooled connection shares one database.","Clears any leftover file first.","Creates a file-backed manager...","...initialising each connection with a busy timeout so writers wait, not fail.","Builds a four-connection pool over that manager.","Checks out one connection to create the shared table.","Prepares a vector to hold the worker handles.","Loops over four values, one per worker.","Clones the pool handle (a cheap `Arc`) to move into the thread.","Spawns a worker thread.","Each worker checks out its own pooled connection.","...and inserts its one value; SQLite serializes the writes.","Closes the thread closure and stores the handle.","Closes the `for` loop.","Joins every worker...","...so `main` waits for all inserts to finish.","Closes the join loop.","Checks out a connection for the final read.","Sums all inserted values with `SELECT SUM(v)`.","Prints `sum = 10` — the same result whichever thread ran first.","Closes `main`."],"explanation":"Four threads each borrowed a pooled connection and inserted one value; the writes took turns (SQLite allows one writer at a time), and summing afterwards gave `sum = 10` — 1 + 2 + 3 + 4. The order the threads ran in never mattered, because addition is commutative and every write landed before the final read.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"chdb3-pooled-sum","title":"Deterministic pooled sum","points":40,"difficulty":12,"intro":"You make concurrency produce a guaranteed answer. Using a WAL, file-backed, pooled SQLite database, spawn `workers` threads. Each thread inserts a disjoint slice of the numbers `1..=upto`, then after all threads finish you read `SELECT SUM(x)`. The result must always equal `upto*(upto+1)/2`, no matter how the threads interleave.\n","instructions":"## Your turn\n\nImplement `pooled_sum`:\n\n```rust\npub fn pooled_sum(upto: i64, workers: usize) -> i64 { ... }\n```\n\nBuild a pool over a file-backed SQLite database with WAL on and a busy timeout. Partition `1..=upto` into `workers` disjoint slices (for example, worker `w` takes every number congruent to `w` modulo `workers`), insert each slice from its own thread, join, then return `SELECT SUM(x)`.\n\nExamples:\n\n- `pooled_sum(100, 4)` → `5050`\n- `pooled_sum(1000, 8)` → `500500`\n- `pooled_sum(0, 4)` → `0`\n- `pooled_sum(10, 1)` → `55`\n\n**Hint:** give each new connection `PRAGMA journal_mode=WAL; PRAGMA busy_timeout=5000;` via `with_init`, use a unique temp-file path per call, clone the pool into each thread, and `join` them all before reading the sum.\n\nHidden tests decide correctness.\n","starter":"use r2d2_sqlite::SqliteConnectionManager;\n\npub fn pooled_sum(upto: i64, workers: usize) -> i64 {\n    todo!(\"pooled WAL db: workers insert disjoint slices of 1..=upto, then SELECT SUM(x)\")\n}\n","tests":"use student::pooled_sum;\n\n#[test]\nfn sum_100_four_workers() {\n    assert_eq!(pooled_sum(100, 4), 5050);\n}\n\n#[test]\nfn sum_1000_eight_workers() {\n    assert_eq!(pooled_sum(1000, 8), 500500);\n}\n\n#[test]\nfn zero_upto_is_zero() {\n    assert_eq!(pooled_sum(0, 4), 0);\n}\n\n#[test]\nfn more_workers_than_items() {\n    assert_eq!(pooled_sum(1, 4), 1);\n}\n\n#[test]\nfn single_worker() {\n    assert_eq!(pooled_sum(10, 1), 55);\n}\n\n#[test]\nfn deterministic_repeat() {\n    let a = pooled_sum(500, 7);\n    let b = pooled_sum(500, 7);\n    assert_eq!(a, b);\n    assert_eq!(a, 125250);\n}\n","entry":"pooled_sum","gabarito":{"time":"O(n)","space":"O(n)","solution":"use r2d2_sqlite::SqliteConnectionManager;\nuse std::sync::atomic::{AtomicU64, Ordering};\nuse std::thread;\n\nstatic SEQ: AtomicU64 = AtomicU64::new(0);\n\npub fn pooled_sum(upto: i64, workers: usize) -> i64 {\n    let workers = workers.max(1);\n    let seq = SEQ.fetch_add(1, Ordering::SeqCst);\n    let path = std::env::temp_dir().join(format!(\n        \"dxtutor_pooled_{}_{}.db\",\n        std::process::id(),\n        seq\n    ));\n    let _ = std::fs::remove_file(&path);\n\n    let manager = SqliteConnectionManager::file(&path)\n        .with_init(|c| c.execute_batch(\"PRAGMA journal_mode=WAL; PRAGMA busy_timeout=5000;\"));\n    let pool = r2d2::Pool::builder()\n        .max_size((workers as u32).max(2))\n        .build(manager)\n        .unwrap();\n\n    {\n        let conn = pool.get().unwrap();\n        conn.execute(\"CREATE TABLE nums (x INTEGER NOT NULL)\", [])\n            .unwrap();\n    }\n\n    let mut handles = Vec::new();\n    for w in 0..workers {\n        let pool = pool.clone();\n        handles.push(thread::spawn(move || {\n            let conn = pool.get().unwrap();\n            let mut n = (w as i64) + 1;\n            while n <= upto {\n                conn.execute(\"INSERT INTO nums (x) VALUES (?1)\", [n]).unwrap();\n                n += workers as i64;\n            }\n        }));\n    }\n    for h in handles {\n        h.join().unwrap();\n    }\n\n    let conn = pool.get().unwrap();\n    let sum: i64 = conn\n        .query_row(\"SELECT COALESCE(SUM(x), 0) FROM nums\", [], |r|
