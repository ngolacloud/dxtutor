er. A generic would have forced a single element type; `Box<dyn\nShape>` erases it.\n"}}]},{"id":"u15-lifetimes","title":"Lifetimes: how long a reference is valid","difficulty":15,"level":"advanced","intro":"A reference borrows data owned by someone else, and it must never outlive that\ndata. Lifetimes are the compiler's names for \"how long\" — usually inferred, but\nsometimes you write them (`'a`) to relate the lifetimes of inputs and outputs.\nThey are purely a compile-time check: no runtime cost, just a guarantee that no\nreference ever dangles. By the end you return a borrow of the longest word in a\nsentence, with the lifetime tying output to input.\n","steps":[{"kind":"concept","id":"c15-lifetimes","title":"Borrows that never dangle","points":5,"difficulty":15,"intro":"A dangling pointer — a reference to freed memory — is a classic source of crashes\nand exploits in systems languages. Rust abolishes it at compile time with\nlifetimes: every reference carries an invisible tag saying how long the data it\npoints to lives, and the borrow checker refuses any use that could outlast it.\nMost of the time this is inferred; naming lifetimes is how you teach the compiler\nabout relationships it cannot guess.\n","body":"## `'a`: naming how long a borrow lives\n\nMost references need no annotation — the compiler infers lifetimes (**elision**):\n\n```rust\nfn first_line(s: &str) -> &str { s.lines().next().unwrap_or(\"\") }\n```\n\nWhen a function takes several references and returns one, you sometimes must say\nhow they relate. A named lifetime `'a` does that:\n\n```rust\nfn longest<'a>(a: &'a str, b: &'a str) -> &'a str {\n    if a.len() >= b.len() { a } else { b }\n}\n```\n\nThis reads: \"for some lifetime `'a`, both inputs live at least `'a`, and the\nresult lives no longer than that.\" The caller cannot keep the result after either\ninput is gone.\n\nA struct that *holds* a reference must name the lifetime too:\n\n```rust\nstruct Excerpt<'a> { text: &'a str }\n```\n\nLifetimes are checked entirely at compile time — they vanish from the running\nprogram. They are not about *how long* things live, but about the compiler\nproving a reference can never point at data that is already gone.\n"},{"kind":"drill","id":"d42-lifetime-fn","title":"A named lifetime on a function","points":10,"difficulty":15,"intro":"When a function returns one of several borrowed inputs, the compiler needs you to\nrelate their lifetimes. `longest` ties both parameters and the result to one\nlifetime `'a`, promising the output lives no longer than the inputs.\n","prompt":"Write `longest<'a>` returning the longer of two string slices.\n\n**Why:** with two reference inputs and a reference output, elision cannot guess\nthe relationship — a named `'a` states it.\n","target":"fn longest<'a>(a: &'a str, b: &'a str) -> &'a str {\n    if a.len() >= b.len() {\n        a\n    } else {\n        b\n    }\n}\n\nfn main() {\n    let x = String::from(\"hello\");\n    let y = String::from(\"hi\");\n    println!(\"{}\", longest(&x, &y));\n}\n","line_comments":["`longest` declares a lifetime `'a`; both inputs and the output share it.","Compares the two lengths.","Returns the first borrow when it is at least as long.","Otherwise...","...returns the second borrow.","Closes the `if`/`else`.","Closes `longest`.","","`main` opens.","Owns a `String` `x`.","Owns a `String` `y`.","Borrows both, prints the longer: `hello`.","Closes `main`."],"explanation":"The annotation `'a` told the compiler that the returned reference lives no longer\nthan both inputs, so printing `longest(&x, &y)` — `hello` — is provably safe. No\nruntime work happened; the lifetime was a compile-time promise that the result\ncan never dangle.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d43-struct-lifetime","title":"A struct that holds a reference","points":10,"difficulty":16,"intro":"If a struct stores a borrow, it must name that borrow's lifetime, so the compiler\ncan stop the struct from outliving the data. `Excerpt<'a>` keeps a `&'a str`, and\nits method returns a slice of the same text.\n","prompt":"Define a struct holding `&'a str` and give it a method.\n\n**Why:** a struct that borrows must tie its own lifetime to the data it points at,\nor it could outlive and dangle.\n","target":"struct Excerpt<'a> {\n    text: &'a str,\n}\n\nimpl<'a> Excerpt<'a> {\n    fn first_word(&self) -> &str {\n        self.text.split(' ').next().unwrap_or(\"\")\n    }\n}\n\nfn main() {\n    let novel = String::from(\"Call me Ishmael\");\n    let e = Excerpt { text: &novel };\n    println!(\"{}\", e.first_word());\n}\n","line_comments":["Declares `Excerpt` parameterised by a lifetime `'a`.","It holds a borrow `&'a str` — valid as long as `'a`.","Closes the struct.","","The `impl` block also names `'a`.","A method borrowing `self` and returning a slice of the text.","Splits on spaces and takes the first piece (or empty).","Closes the method.","Closes the `impl`.","","`main` opens.","Owns the source `String`.","Builds an `Excerpt` borrowing that string.","Prints the first word: `Call`.","Closes `main`."],"explanation":"`Excerpt<'a>` named the lifetime of the string it borrows, so the compiler\nguarantees the excerpt can never outlive `novel`. `first_word` returned a slice of\nthat same text — `Call` — still tied to the original data, never dangling.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d44-lifetime-elision","title":"When lifetimes are inferred","points":10,"difficulty":16,"intro":"You usually write no lifetimes at all. For one reference in and one reference out,\nthe compiler applies elision rules and ties them automatically. `first_line`\nreturns a borrow of its input without a single `'a` in sight.\n","prompt":"Write a function that returns a borrow of its one `&str` input — no annotation.\n\n**Why:** with a single reference input, elision infers that the output borrows\nfrom it. Explicit lifetimes would be noise.\n","target":"fn first_line(s: &str) -> &str {\n    s.lines().next().unwrap_or(\"\")\n}\n\nfn main() {\n    let doc = \"alpha\\nbeta\\ngamma\";\n    println!(\"{}\", first_line(doc));\n}\n","line_comments":["`first_line` — one reference in, one out; the lifetime is elided (inferred).","Returns the first line, or empty if there is none.","Closes `first_line`.","","`main` opens.","A multi-line string literal (the \\\\n are newlines).","Prints the first line: `alpha`.","Closes `main`."],"explanation":"No `'a` appeared, yet the borrow checker still tied the returned slice to the input\n`s` through elision, so `first_line(doc)` safely yielded `alpha`. Explicit\nlifetimes are only needed when the relationship is ambiguous; here one reference in\nand one out made it obvious.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch15-longest-word","title":"Longest word","points":35,"difficulty":16,"intro":"You return a borrow safely. Implement `longest_word`, which returns the longest\nword of a sentence as a slice *of the input* — no new allocation. The signature\n`fn longest_word(sentence: &str) -> &str` relies on lifetime elision to tie the\nresult to the argument, so the caller can never keep it after the sentence is\ngone.\n","instructions":"## Your turn\n\nReturn the longest word, borrowing from the input:\n\n```rust\npub fn longest_word(sentence: &str) -> &str { ... }\n```\n\nReturn a slice of `sentence` — the longest whitespace-separated word. For an\nempty input, return `\"\"`. If several words tie for longest, return the last of\nthem (that is what `max_by_key` does).\n\nExamples:\n\n- `longest_word(\"the quickest brown fox\")` → `\"quickest\"`\n- `longest_word(\"aa bb cc\")` → `\"cc\"` (ties pick the last)\n- `longest_word(\"\")` → `\"\"`\n\n**Hint:** `split_whitespace().max_by_key(|w| w.len()).unwrap_or(\"\")`.\n\nHidden tests decide correctness.\n","starter":"pub fn longest_word(sentence: &str) -> &str {\n    todo!(\"return the longest whitespace-separated word, or an empty slice\")\n}\n","tests":"use student::longest_word;\n\n#[test]\nfn basic() {\n    assert_eq!(longest_word(\"the quickest brown fox\"), \"quickest\");\n}\n\n#[test]\nfn ties_pick_last() {\n    assert_eq!(longest_word(\"aa bb cc\"), \"cc\");\n}\n\n#[test]\nfn single_word() {\n    assert_eq!(longest_word(\"hello\"), \"hello\");\n}\n\n#[test]\nfn empty() {\n    assert_eq!(longest_word(\"\"), \"\");\n}\n","entry":"longest_word","gabarito":{"time":"O(n)","space":"O(1)","solution":"pub fn longest_word(sentence: &str) -> &str {\n    sentence\n        .split_whitespace()\n        .max_by_key(|w| w.len())\n        .unwrap_or(\"\")\n}\n","justification":"One scan over the sentence inspects each word's length, so time is **O(n)** in the\ninput size; nothing is allocated — the result is a slice *into* the original\nstring — so extra space is **O(1)**. The elided lifetime ties that returned slice\nto `sentence`, which is why the borrow checker proves it can never dangle. `ties\npick the last` because `max_by_key` keeps the later of equal maxima.\n"}}]},{"id":"u16-send-sync","title":"Send, Sync & object safety","difficulty":16,"level":"advanced","intro":"The capstone of Rust's type system is fearless concurrency, enforced by two\nmarker traits. `Send` means a value can be *moved* to another thread; `Sync` means\nit can be *shared* (`&T`) across threads. The compiler tracks them automatically\nand refuses data races before the program runs. A companion rule — object safety\n— decides which traits can become `dyn` trait objects. By the end you sum a vector\nin parallel across real OS threads, using only the standard library.\n","steps":[{"kind":"concept","id":"c16-send-sync-object-safety","title":"Thread safety the compiler checks","points":5,"difficulty":16,"intro":"Data races — two threads touching the same memory, one writing, without\nsynchronisation — are undefined behaviour in most languages and found only by luck\nor crashes. Rust promotes thread safety into the type system with two\nauto-derived marker traits, so a racy program simply does not compile. Object\nsafety is a separate but related type-level rule about when a trait can be used\ndynamically.\n","body":"## `Send`, `Sync`, and object safety\n\nTwo **marker traits** (no methods — just facts the compiler tracks):\n\n- **`Send`**: the type can be moved to another thread. Almost everything is;\n  `Rc<T>` is a notable exception (its counter is not thread-safe).\n- **`Sync`**: `&T` can be shared between threads. `T` is `Sync` iff `&T` is\n  `Send`.\n\nThey are derived automatically, so `thread::spawn` can simply require `Send`:\n\n```rust\nlet data = vec![1, 2, 3];\nlet h = std::thread::spawn(move || data.iter().sum::<i32>());\nlet total = h.join().unwrap();\n```\n\nTo *share* (not move) data, wrap it in **`Arc<T>`** — an atomically reference-\ncounted pointer that is `Send + Sync`:\n\n```rust\nuse std::sync::Arc;\nlet shared = Arc::new(vec![10, 20, 30]);\nlet copy = Arc::clone(&shared); // another thread can read through this\n```\n\n**Object safety** decides whether a trait can become `dyn Trait`. A trait is\nobject-safe when its methods take `self`/`&self`/`&mut self`, are not generic, and\ndo not return `Self`. `Shape { fn area(&self) -> f64 }` is object-safe — hence the\nearlier `Box<dyn Shape>` worked. A trait with a generic method or a `-> Self`\ncannot be made into a trait object, because there would be no single vtable to\npoint at.\n"},{"kind":"drill","id":"d45-thread-send","title":"Move data into a thread (Send)","points":10,"difficulty":16,"intro":"Spawning a thread with a `move` closure transfers ownership of the captured data\nto the new thread. That transfer is only allowed because the data is `Send`. The\nparent waits with `join`, which hands back the thread's result.\n","prompt":"Move a vector into a spawned thread, compute in it, and join the result.\n\n**Why:** `thread::spawn` requires the closure (and what it captures) to be `Send`.\nMoving an owned `Vec` across threads is safe and the compiler verifies it.\n","target":"use std::thread;\n\nfn main() {\n    let data = vec![1, 2, 3];\n    let handle = thread::spawn(move || {\n        let sum: i32 = data.iter().sum();\n        sum\n    });\n    let result = handle.join().unwrap();\n    println!(\"{result}\");\n}\n","line_comments":["Brings `std::thread` into scope.","","`main` opens.","Owns a vector on this thread.","Spawns a thread; `move` transfers `data` into it (requires `Send`).","Inside the thread: sum the vector.","The closure returns the sum.","Closes the closure/spawn call.","`join` waits for the thread and unwraps its returned value.","Prints the result: `6`.","Closes `main`."],"explanation":"The `move` closure carried ownership of `data` into the new thread — legal because\n`Vec<i32>` is `Send` — and `join` handed the computed sum, `6`, back to the parent.\nThe compiler proved there was no shared mutable access, so no data race is\npossible.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d46-arc-sync","title":"Share data with Arc (Sync)","points":10,"difficulty":17,"intro":"To let several threads *read the same* data, wrap it in an `Arc` and clone the\nhandle for each thread. `Arc<T>` is `Send + Sync`, so sharing is safe; the atomic\ncounter frees the data when the last handle is gone.\n","prompt":"Share a vector across three threads with `Arc`, reading one element in each.\n\n**Why:** moving gives one thread ownership; to share read access you need a\nthread-safe pointer. `Arc` is exactly that — `Send + Sync`, reference-counted.\n","target":"use std::sync::Arc;\nuse std::thread;\n\nfn main() {\n    let shared = Arc::new(vec![10, 20, 30]);\n    let mut handles = Vec::new();\n    for i in 0..3 {\n        let data = Arc::clone(&shared);\n        handles.push(thread::spawn(move || data[i]));\n    }\n    let mut total = 0;\n    for h in handles {\n        total += h.join().unwrap();\n    }\n    println!(\"{total}\");\n}\n","line_comments":["Brings `Arc` into scope.","Brings `std::thread` into scope.","","`main` opens.","Wraps the vector in an `Arc` (Send + Sync).","A place to keep the thread handles.","For each of three indices...","...clone the `Arc` — a cheap new handle to the same data.","Spawn a thread that reads one element and returns it.","Closes the loop.","A running total.","For each handle...","...join it and add its returned element.","Closes the loop.","Prints the total: `60`.","Closes `main`."],"explanation":"Each thread got its own `Arc` handle to the *same* vector and read one element —\nsafe because `Arc<Vec<i32>>` is `Send + Sync` and the access was read-only. Summing\nthe three results gave `60`. `Arc`'s atomic counter dropped the data only after the\nlast handle was done.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d47-object-safe","title":"Object-safe traits become dyn","points":10,"difficulty":17,"intro":"A trait can be used as `dyn Trait` only if it is object-safe: its methods take\n`&self` (not generic, not returning `Self`). `Draw` qualifies, so a\n`Vec<Box<dyn Draw>>` can hold a mix of shapes and render them through one vtable.\n","prompt":"Define an object-safe trait and store implementers in a `Vec<Box<dyn Draw>>`.\n\n**Why:** object safety is the rule that lets a trait become a trait object. A\nsimple `&self -> String` method satisfies it.\n","target":"trait Draw {\n    fn draw(&self) -> String;\n}\n\nstruct Dot;\nstruct Line;\n\nimpl Draw for Dot {\n    fn draw(&self) -> String {\n        String::from(\".\")\n    }\n}\n\nimpl Draw for Line {\n    fn draw(&self) -> String {\n        String::from(\"---\")\n    }\n}\n\nfn render(items: &[Box<dyn Draw>]) -> String {\n    items.iter().map(|i| i.draw()).collect::<Vec<_>>().join(\" \")\n}\n\nfn main() {\n    let items: Vec<Box<dyn Draw>> = vec![Box::new(Dot), Box::new(Line), Box::new(Dot)];\n    println!(\"{}\", render(&items));\n}\n","line_comments":["Declares the trait `Draw`.","An object-safe method: `&self`, not generic, does not return `Self`.","Closes the trait.","","A unit struct `Dot`.","A unit struct `Line`.","","Implements `Draw` for `Dot`...","...opens the `draw` method...","...drawing a dot.","Closes the method.","Closes the `Dot` impl.","","Implements `Draw` for `Line`...","...opens the `draw` method...","...drawing a line.","Closes the method.","Closes the `Line` impl.","","`render` takes a slice of trait objects (allowed: `Draw` is object-safe).","Maps each to its drawing and joins them with spaces.","Closes `render`.","","`main` opens.","A mixed vector of boxed `Draw` objects.","Renders them; prints `. --- .`.","Closes `main`."],"explanation":"Because every `Draw` method takes `&self`, is non-generic and never returns `Self`,\nthe trait is object-safe — so `Box<dyn Draw>` and `Vec<Box<dyn Draw>>` are legal.\n`render` dispatched `draw` through each vtable and produced `. --- .`. A trait with\na generic method or a `-> Self` could not be used this way.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch16-parallel-sum","title":"Parallel sum across threads","points":40,"difficulty":17,"intro":"The capstone. Implement `parallel_sum`, which splits a vector into chunks, sums\neach chunk on its own OS thread, and combines the partial sums — standard library\nonly (`std::thread`, `std::sync::Arc`). It must return the same answer as a plain\nsequential sum for any number of workers, which is `Send`/`Sync` doing their job:\nthe data is shared safely and no thread races another.\n","instructions":"## Your turn\n\nSum a vector using several threads:\n\n```rust\npub fn parallel_sum(data: Vec<i64>, workers: usize) -> i64 { ... }\n```\n\nSplit `data` into roughly equal chunks, sum each chunk on its own thread, and add\nthe partial sums. The result must equal `data.iter().sum()` for any `workers`.\n\nRules:\n\n- `workers` of `0` behaves like `1`.\n- An empty vector sums to `0`.\n- Use only `std::thread` and `std::sync::Arc` — no external crates.\n\nExamples:\n\n- `parallel_sum((1..=100).collect(), 4)` → `5050`\n- `parallel_sum(vec![1, 2, 3, 4], 1)` → `10`\n\n**Hint:** wrap the data in an `Arc`, give each thread a start/end range and its own\n`Arc::clone`, then sum the values each thread returns from `join`.\n\nHidden tests decide correctness.\n","starter":"use std::sync::Arc;\nuse std::thread;\n\npub fn parallel_sum(data: Vec<i64>, workers: usize) -> i64 {\n    todo!(\"split into chunks, sum each on a thread, combine the partial sums\")\n}\n","tests":"use student::parallel_sum;\n\n#[test]\nfn matches_sequential() {\n    let data: Vec<i64> = (1..=100).collect();\n    assert_eq!(parallel_sum(data, 4), 5050);\n}\n\n#[test]\nfn single_worker() {\n    assert_eq!(parallel_sum(vec![1, 2, 3, 4], 1), 10);\n}\n\n#[test]\nfn more_workers_than_items() {\n    assert_eq!(parallel_sum(vec![5, 5, 5], 10), 15);\n}\n\n#[test]\nfn empty_is_zero() {\n    assert_eq!(parallel_sum(Vec::new(), 4), 0);\n}\n\n#[test]\nfn zero_workers_defaults_to_one() {\n    assert_eq!(parallel_sum(vec![7, 8], 0), 15);\n}\n","entry":"parallel_sum","gabarito":{"time":"O(n)","space":"O(n)","solution":"use std::sync::Arc;\nuse std::thread;\n\npub fn parallel_sum(data: Vec<i64>, workers: usize) -> i64 {\n    if data.is_empty() {\n        return 0;\n    }\n    let workers = workers.max(1);\n    let shared = Arc::new(data);\n    let len = shared.len();\n    let chunk = len.div_ceil(workers);\n    let mut handles = Vec::new();\n    for w in 0..workers {\n        let start = w * chunk;\n        if start >= len {\n            break;\n        }\n        let end = (start + chunk).min(len);\n        let part = Arc::clone(&shared);\n        handles.push(thread::spawn(move || {\n            let mut acc: i64 = 0;\n            for &x in &part[start..end] {\n                acc += x;\n            }\n            acc\n        }));\n    }\n    handles.into_iter().map(|h| h.join().unwrap()).sum()\n}\n","justification":"Every element is added exactly once across all threads, so the total work is\n**O(n)**; the `Arc` holds the single shared vector and the handles are `O(workers)`\n≤ `O(n)`, so space is **O(n)**. Correctness regardless of `workers` is the lesson:\n`Arc<Vec<i64>>` is `Send + Sync`, so each thread safely reads its own disjoint\nrange, and because no two threads touch the same element there is no data race —\nthe compiler would reject the code otherwise.\n"}}]},{"id":"u17-threads","title":"Threads","difficulty":17,"level":"advanced","intro":"A single program can do several things at once by running them on separate\nthreads of execution. This unit is the start of an advanced concurrency track:\nyou learn what a thread is, how to start one with `std::thread::spawn`, how to\nwait for it with `join`, and how to hand owned data to a thread with `move`.\nEverything is standard library, and every result is deterministic.\n","steps":[{"kind":"concept","id":"c17-threads","title":"What a thread is","points":5,"difficulty":17,"intro":"Until now your programs ran one instruction after another on a single line of\nexecution. A thread lets a program run more than one such line at the same time.\nThat power comes with a hazard — shared memory — which the rest of this track\nteaches you to tame.\n","body":"## Threads: doing several things at once\n\nA **thread** is an independent sequence of instructions that the operating system\ncan run at the same time as other threads. Every program starts with one thread,\nthe one that runs `main`. You can start more.\n\nThreads of the same program **share the same memory**. That is what makes them\nfast to create and able to cooperate — but it is also the source of danger: if two\nthreads touch the same data at the same time and at least one writes, you have a\n**data race**, a bug that is undefined behaviour in most languages.\n\nRust's job is to make that danger visible at compile time. For now, the mechanics:\n\n```rust\nuse std::thread;\n\nlet handle = thread::spawn(|| {\n    // work that runs on a new thread\n});\nhandle.join().unwrap(); // wait for it to finish\n```\n\n- **`thread::spawn`** starts a new thread running the given closure and returns a\n  **`JoinHandle`**.\n- **`join`** blocks the current thread until that thread finishes, and returns\n  whatever the closure produced (inside a `Result`, so you `unwrap`).\n- A thread outlives the local variables of the function that spawned it, so a\n  closure that captures data must usually take ownership with **`move`**. Moving\n  owned data into a thread is allowed because the type is `Send`.\n\nStart a thread, give it work, `join` it to collect the answer: that is the whole\nshape of the simplest concurrency.\n"},{"kind":"drill","id":"d48-spawn-join","title":"Spawn a thread and join it","points":10,"difficulty":17,"intro":"The two basic moves: `thread::spawn` starts a thread running a closure, and\n`join` waits for it to finish. Without `join`, `main` could end — and tear the\nwhole program down — before the thread ran.\n","prompt":"Spawn a thread that prints a line, then wait for it with `join`.\n\n**Why:** a spawned thread runs concurrently with `main`. Joining it guarantees the\nthread has finished before the program continues.\n","target":"use std::thread;\n\nfn main() {\n    let handle = thread::spawn(|| {\n        println!(\"hello from a thread\");\n    });\n    handle.join().unwrap();\n    println!(\"main is done\");\n}\n","line_comments":["Brings `std::thread` into scope.","","`main` opens.","Spawns a new OS thread running this closure; returns a join handle.","The thread prints its own line.","Closes the closure and the spawn call; the thread is now running.","`join` blocks until the thread finishes; `unwrap` surfaces a panic if any.","Back on the main thread, print that we are done.","Closes `main`."],"explanation":"`spawn` launched the closure on a new thread while `main` kept going; `join` paused\n`main` until that thread finished. Because we joined, the program never ended\nbefore the thread's line was printed.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d49-move-into-thread","title":"Move owned data into a thread","points":10,"difficulty":18,"intro":"A thread may run after the spawning function's locals would normally end, so a\nclosure that uses local data must *own* it. `move` transfers ownership of the\ncaptured values into the thread — allowed because the data is `Send`.\n","prompt":"Build a `String` on the main thread and `move` it into a spawned thread that uses\nit.\n\n**Why:** without `move`, the closure would only borrow `name`, and the borrow could\noutlive the owner. `move` gives the thread its own copy of the ownership.\n","target":"use std::thread;\n\nfn main() {\n    let name = String::from(\"Rust\");\n    let handle = thread::spawn(move || {\n        println!(\"hello, {name}\");\n    });\n    handle.join().unwrap();\n}\n","line_comments":["Brings `std::thread` into scope.","","`main` opens.","Owns a `String` on the main thread.","`move` transfers ownership of `name` into the new thread.","The thread uses the value it now owns.","Closes the closure and spawn call.","Wait for the thread to finish.","Closes `main`."],"explanation":"`move` handed ownership of `name` to the thread, so the closure could safely use it\nno matter when the thread actually ran. Moving a `String` across threads is sound\nbecause `String` is `Send`.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d50-two-threads-values","title":"Two threads, two results, combined","points":10,"difficulty":18,"intro":"A thread's closure can *return* a value; `join` hands it back. Spawn two threads\nthat each compute a partial answer, then join both and combine — a tiny taste of\nthe parallel-sum pattern.\n","prompt":"Sum two halves of the work on two separate threads and add the results.\n\n**Why:** each thread owns its own data and returns its own sum; joining both and\nadding them gives a result that does not depend on which thread finished first.\n","target":"use std::thread;\n\nfn main() {\n    let left = vec![1, 2, 3];\n    let right = vec![4, 5, 6];\n    let h1 = thread::spawn(move || left.iter().sum::<i32>());\n    let h2 = thread::spawn(move || right.iter().sum::<i32>());\n    let total = h1.join().unwrap() + h2.join().unwrap();\n    println!(\"{total}\");\n}\n","line_comments":["Brings `std::thread` into scope.","","`main` opens.","The first half of the work, owned here.","The second half of the work.","Thread 1 takes `left` (move) and returns its sum.","Thread 2 takes `right` and returns its sum.","Join both threads and add the two partial sums.","Prints the combined total: `21`.","Closes `main`."],"explanation":"Each thread owned a disjoint half and returned its partial sum; `join` delivered\nboth numbers and we added them. The answer, `21`, is the same no matter which\nthread finished first — the hallmark of a correct parallel computation.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch17-sum-two-threads","title":"Sum a vector in two threads","points":40,"difficulty":18,"intro":"Apply the unit. Implement `sum_in_two_threads`: split the data down the middle,\nsum each half on its own thread, and add the two partial sums. The result must\nequal a plain sequential sum — threading changes the *how*, never the *what*.\n","instructions":"## Your turn\n\nSum a vector using exactly two threads:\n\n```rust\npub fn sum_in_two_threads(data: Vec<i64>) -> i64 { ... }\n```\n\nSplit `data` into two halves, sum each half on its own spawned thread, join both,\nand return the sum of the partials. The result must equal `data.iter().sum()`.\n\nRules:\n\n- An empty vector sums to `0`.\n- An odd length is fine — the two halves need not be equal.\n- Use only `std::thread` — no external crates.\n\nExamples:\n\n- `sum_in_two_threads((1..=100).collect())` → `5050`\n- `sum_in_two_threads(vec![1, 2, 3, 4])` → `10`\n\n**Hint:** `Vec::split_off(mid)` gives you the second half as an owned `Vec` and\nleaves the first half behind. `move` each half into its own thread.\n\nHidden tests decide correctness.\n","starter":"use std::thread;\n\npub fn sum_in_two_threads(data: Vec<i64>) -> i64 {\n    todo!(\"split data in two, sum each half on its own thread, then add them\")\n}\n","tests":"use student::sum_in_two_threads;\n\n#[test]\nfn matches_sequential() {\n    let data: Vec<i64> = (1..=100).collect();\n    assert_eq!(sum_in_two_threads(data), 5050);\n}\n\n#[test]\nfn even_length() {\n    assert_eq!(sum_in_two_threads(vec![1, 2, 3, 4]), 10);\n}\n\n#[test]\nfn odd_length() {\n    assert_eq!(sum_in_two_threads(vec![1, 2, 3, 4, 5]), 15);\n}\n\n#[test]\nfn single_element() {\n    assert_eq!(sum_in_two_threads(vec![42]), 42);\n}\n\n#[test]\nfn empty_is_zero() {\n    assert_eq!(sum_in_two_threads(Vec::new()), 0);\n}\n","entry":"sum_in_two_threads","gabarito":{"time":"O(n)","space":"O(n)","solution":"use std::thread;\n\npub fn sum_in_two_threads(data: Vec<i64>) -> i64 {\n    let mut data = data;\n    let mid = data.len() / 2;\n    let right = data.split_off(mid);\n    let left = data;\n    let h_left = thread::spawn(move || left.iter().sum::<i64>());\n    let h_right = thread::spawn(move || right.iter().sum::<i64>());\n    h_left.join().unwrap() + h_right.join().unwrap()\n}\n","justification":"Every element is summed exactly once across the two threads, so the work is\n**O(n)**; the two owned halves together hold `n` elements, so space is **O(n)**.\n`split_off` behaves for every length — an empty input leaves both halves empty and\nthe sum is `0`. Correctness is independent of scheduling because the halves are\ndisjoint: no element is counted twice and no two threads touch the same memory, so\nthere is no data race.\n"}}]},{"id":"u18-channels","title":"Channels","difficulty":18,"level":"advanced","intro":"Sharing memory between threads is dangerous; passing *messages* is safe. A channel\nis a one-way pipe: threads send values down it and another thread receives them.\nThis unit covers `std::sync::mpsc` — create a channel, `send`, `recv`, iterate the\nreceiver until it closes, and clone the sender for several producers.\n","steps":[{"kind":"concept","id":"c18-channels","title":"Communicate by passing messages","points":5,"difficulty":18,"intro":"There are two ways for threads to cooperate: share memory and guard it, or send\neach other messages and share nothing. Message passing sidesteps a whole class of\nbugs, and Rust's standard library gives you a channel to do it.\n","body":"## Channels: `std::sync::mpsc`\n\nA popular slogan captures the idea: *do not communicate by sharing memory; share\nmemory by communicating.* A **channel** is a queue with two ends:\n\n```rust\nuse std::sync::mpsc;\n\nlet (tx, rx) = mpsc::channel();\ntx.send(42).unwrap();        // producer end\nlet got = rx.recv().unwrap(); // consumer end, blocks until a value arrives\n```\n\n- **`mpsc::channel()`** returns a pair: a **transmitter** `tx` and a **receiver**\n  `rx`. The name `mpsc` means *multi-producer, single-consumer*.\n- **`tx.send(value)`** pushes a value into the channel. It returns a `Result`\n  because sending fails if the receiver is gone.\n- **`rx.recv()`** blocks until a value is available and returns it.\n- You can loop over the receiver directly — `for value in rx { ... }` — and the\n  loop ends automatically when **every** sender has been dropped and the channel\n  is empty.\n- `tx` is `Clone`: clone it so several producer threads can send into the same\n  channel. The receiver only stops iterating once *all* clones are gone.\n\nBecause a value is *moved* into the channel on `send` and *moved* out on `recv`,\nonly one thread ever owns it at a time. There is no shared mutable state, so there\nis nothing to race.\n"},{"kind":"drill","id":"d51-channel-basic","title":"Send one value, receive it","points":10,"difficulty":18,"intro":"The smallest channel program: a thread sends one value, the main thread receives\nit. `recv` blocks until the value arrives, so the order is never in doubt.\n","prompt":"Create a channel, send a value from a spawned thread, and receive it in `main`.\n\n**Why:** `send` moves the value into the channel; `recv` moves it out. Ownership\npasses cleanly from one thread to the other — no sharing, no race.\n","target":"use std::sync::mpsc;\nuse std::thread;\n\nfn main() {\n    let (tx, rx) = mpsc::channel();\n    thread::spawn(move || {\n        tx.send(42).unwrap();\n    });\n    let received = rx.recv().unwrap();\n    println!(\"{received}\");\n}\n","line_comments":["Brings the multi-producer, single-consumer channel into scope.","Brings `std::thread` into scope.","","`main` opens.","Creates a channel: `tx` sends, `rx` receives.","Spawn a thread; `move` gives it the sender `tx`.","The thread sends one value down the channel.","Closes the thread closure.","`recv` blocks until a value arrives, then returns it.","Prints the received value: `42`.","Closes `main`."],"explanation":"The value `42` was *moved* into the channel by `send` and *moved* out by `recv`, so\nexactly one thread owned it at any moment. `recv` blocked until the value was\nthere, making the result deterministic.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d52-channel-iterate","title":"Iterate the receiver until it closes","points":10,"difficulty":19,"intro":"A producer can send many values; the consumer loops over the receiver to take them\none by one. The loop ends on its own when the sender is dropped and the channel\ndrains — no sentinel value needed.\n","prompt":"Send three numbers from a thread and iterate the receiver to print each.\n\n**Why:** `for value in rx` yields every sent value in order and stops cleanly once\nthe sender is gone. That is the idiomatic consumer loop.\n","target":"use std::sync::mpsc;\nuse std::thread;\n\nfn main() {\n    let (tx, rx) = mpsc::channel();\n    thread::spawn(move || {\n        for i in 1..=3 {\n            tx.send(i).unwrap();\n        }\n    });\n    for value in rx {\n        println!(\"got {value}\");\n    }\n}\n","line_comments":["Brings the channel into scope.","Brings `std::thread` into scope.","","`main` opens.","Create the channel.","Spawn a producer thread; it owns `tx`.","Send the numbers 1, 2, 3...","...one at a time down the channel.","Closes the inner loop.","Closes the thread; dropping `tx` will close the channel.","Iterating `rx` yields each value until the channel closes.","Print each value received.","Closes the consumer loop.","Closes `main`."],"explanation":"The producer sent `1, 2, 3` and then ended, which dropped `tx` and closed the\nchannel; the `for value in rx` loop yielded each value in order and stopped by\nitself. No sentinel or counter was needed to know when to stop.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d53-multiple-producers","title":"Many producers, one consumer","points":10,"difficulty":19,"intro":"The `mp` in `mpsc` is multi-producer: clone the sender and each clone can feed the\nsame channel from its own thread. The receiver keeps going until *every* sender is\ndropped, so summing what arrives is deterministic even if the order is not.\n","prompt":"Clone the sender so two threads each send a value, then sum everything received.\n\n**Why:** cloning `tx` lets several threads produce into one channel. The total of\nthe received values does not depend on which producer sent first.\n","target":"use std::sync::mpsc;\nuse std::thread;\n\nfn main() {\n    let (tx, rx) = mpsc::channel();\n    let tx2 = tx.clone();\n    thread::spawn(move || tx.send(10).unwrap());\n    thread::spawn(move || tx2.send(20).unwrap());\n    let mut total = 0;\n    for value in rx {\n        total += value;\n    }\n    println!(\"{total}\");\n}\n","line_comments":["Brings the channel into scope.","Brings `std::thread` into scope.","","`main` opens.","Create the channel (multi-producer, single-consumer).","Clone the sender so a second thread can also send.","Producer 1 owns `tx` and sends `10`.","Producer 2 owns the clone `tx2` and sends `20`.","A running total on the consumer side.","Iterate until both senders are dropped and the channel closes.","Add each received value.","Closes the consumer loop.","Prints the total: `30`.","Closes `main`."],"explanation":"Both the original `tx` and its clone `tx2` fed the same channel from different\nthreads; the receiver only stopped once both were dropped. Summing the arrivals\ngave `30` regardless of which producer sent first — order did not affect the total.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch18-sum-via-channel","title":"Producer/consumer sum","points":40,"difficulty":19,"intro":"Apply the unit. Implement `sum_via_channel`: a producer thread sends every element\nof the vector down a channel, and the consumer sums what it receives. The total\nmust equal a sequential sum — message passing moves the data safely, one owner at a\ntime.\n","instructions":"## Your turn\n\nSum a vector by passing its elements through a channel:\n\n```rust\npub fn sum_via_channel(data: Vec<i64>) -> i64 { ... }\n```\n\nSpawn a producer thread that sends each element of `data` down an `mpsc` channel.\nOn the consumer side, receive the values and add them up. The result must equal\n`data.iter().sum()`.\n\nRules:\n\n- An empty vector sums to `0`.\n- Use only `std::sync::mpsc` and `std::thread` — no external crates.\n\nExamples:\n\n- `sum_via_channel((1..=100).collect())` → `5050`\n- `sum_via_channel(vec![1, 2, 3, 4])` → `10`\n\n**Hint:** move `data` into the producer thread and `send` each element. On the main\nthread, sum the receiver with `rx.iter().sum()` — the iterator ends when the\nproducer drops its sender.\n\nHidden tests decide correctness.\n","starter":"use std::sync::mpsc;\nuse std::thread;\n\npub fn sum_via_channel(data: Vec<i64>) -> i64 {\n    todo!(\"spawn a producer that sends each item; sum what the receiver yields\")\n}\n","tests":"use student::sum_via_channel;\n\n#[test]\nfn matches_sequential() {\n    let data: Vec<i64> = (1..=100).collect();\n    assert_eq!(sum_via_channel(data), 5050);\n}\n\n#[test]\nfn small_vector() {\n    assert_eq!(sum_via_channel(vec![1, 2, 3, 4]), 10);\n}\n\n#[test]\nfn single_element() {\n    assert_eq!(sum_via_channel(vec![7]), 7);\n}\n\n#[test]\nfn negatives_cancel() {\n    assert_eq!(sum_via_channel(vec![-5, 5]), 0);\n}\n\n#[test]\nfn empty_is_zero() {\n    assert_eq!(sum_via_channel(Vec::new()), 0);\n}\n","entry":"sum_via_channel","gabarito":{"time":"O(n)","space":"O(n)","solution":"use std::sync::mpsc;\nuse std::thread;\n\npub fn sum_via_channel(data: Vec<i64>) -> i64 {\n    let (tx, rx) = mpsc::channel();\n    thread::spawn(move || {\n        for x in data {\n            tx.send(x).unwrap();\n        }\n    });\n    rx.iter().sum()\n}\n","justification":"Each element is sent once and received once, so the work is **O(n)**; the channel\nbuffers values in flight, bounded by `n`, so space is **O(n)**. The result is\ndeterministic because a channel moves one value at a time — there is no shared\nmutable state to race — and `rx.iter()` ends exactly when the producer drops `tx`,\nso every element is accounted for, including zero elements for an empty input.\n"}}]},{"id":"u19-shared-state","title":"Shared state","difficulty":19,"level":"advanced","intro":"Sometimes threads really must share one piece of mutable state. The safe tool is\n`Arc<Mutex<T>>`: an `Arc` shares ownership across threads and a `Mutex` guarantees\nonly one thread touches the value at a time. This unit builds a counter incremented\nby many threads and a vector filled in parallel — always with a correct total.\n","steps":[{"kind":"concept","id":"c19-shared-state","title":"One value, many threads, no races","points":5,"difficulty":19,"intro":"When several threads must read and write the *same* value, you need two things at\nonce: shared ownership so every thread may hold the value, and mutual exclusion so\nonly one writes at a time. `Arc` and `Mutex` provide exactly those two guarantees.\n","body":"## `Arc<Mutex<T>>`: shared, synchronised state\n\nTwo separate problems, two tools, combined:\n\n- **`Arc<T>`** — *atomically reference-counted* — lets many threads **share\n  ownership** of one value. Clone it (cheaply) and each thread holds a handle; the\n  value is freed when the last handle is dropped. `Arc` alone only grants shared\n  *read* access.\n- **`Mutex<T>`** — *mutual exclusion* — guards a value so only one thread can\n  access it at a time. Calling **`lock()`** blocks until the lock is free and\n  returns a **guard**; while you hold the guard you have exclusive access, and the\n  lock releases automatically when the guard is dropped.\n\nPut them together — `Arc<Mutex<T>>` — to share one mutable value safely:\n\n```rust\nuse std::sync::{Arc, Mutex};\n\nlet counter = Arc::new(Mutex::new(0));\nlet c = Arc::clone(&counter);        // a handle for another thread\nlet mut n = c.lock().unwrap();       // exclusive access\n*n += 1;                             // safe mutation\n```\n\n- `lock()` returns a `Result` (it fails only if another thread panicked while\n  holding the lock), so you `unwrap`.\n- Keep the critical section — the time you hold the guard — as short as possible;\n  the lock serialises threads, so long holds throw away parallelism.\n\nWith the mutex in place, the final count is exact no matter how the threads\ninterleave: every increment happens under the lock, so none is ever lost.\n"},{"kind":"drill","id":"d54-mutex-basic","title":"Lock a Mutex to change a value","points":10,"difficulty":19,"intro":"Before adding threads, see the `Mutex` alone: `lock()` hands you a guard with\nexclusive access, and dropping the guard releases the lock. An inner scope makes\nthe release point obvious.\n","prompt":"Guard an integer with a `Mutex`, increment it under the lock, then read it back.\n\n**Why:** `lock()` returns a guard that gives exclusive access; the lock is held\nonly while the guard lives. Scoping the guard controls exactly when it releases.\n","target":"use std::sync::Mutex;\n\nfn main() {\n    let counter = Mutex::new(0);\n    {\n        let mut guard = counter.lock().unwrap();\n        *guard += 1;\n    }\n    println!(\"{}\", *counter.lock().unwrap());\n}\n","line_comments":["Brings `Mutex` into scope.","","`main` opens.","A `Mutex` guarding an integer, starting at 0.","Open an inner scope so the lock releases at its end.","`lock` returns a guard giving exclusive access to the value.","Change the value through the guard.","Leaving the scope drops the guard and unlocks the mutex.","Lock again to read, and print `1`.","Closes `main`."],"explanation":"`lock()` gave exclusive access through a guard; mutating `*guard` changed the\nprotected value, and leaving the inner scope released the lock so the final `lock`\ncould read it. Holding the guard for the shortest span keeps other threads waiting\nas little as possible.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d55-arc-mutex-counter","title":"A counter shared by many threads","points":10,"difficulty":20,"intro":"Now the real thing: wrap the counter in `Arc<Mutex<i32>>`, clone a handle for each\nthread, and have every thread lock and increment. The mutex serialises the writes,\nso no increment is lost and the final total is exact.\n","prompt":"Share a counter across four threads with `Arc<Mutex<_>>`; each thread adds one.\n\n**Why:** `Arc` lets every thread own a handle to the same counter; the `Mutex`\nensures their increments never collide. The result is deterministic: exactly four.\n","target":"use std::sync::{Arc, Mutex};\nuse std::thread;\n\nfn main() {\n    let counter = Arc::new(Mutex::new(0));\n    let mut handles = Vec::new();\n    for _ in 0..4 {\n        let c = Arc::clone(&counter);\n        handles.push(thread::spawn(move || {\n            let mut n = c.lock().unwrap();\n            *n += 1;\n        }));\n    }\n    for h in handles {\n        h.join().unwrap();\n    }\n    println!(\"{}\", *counter.lock().unwrap());\n}\n","line_comments":["Brings `Arc` and `Mutex` into scope.","Brings `std::thread` into scope.","","`main` opens.","`Arc` shares the `Mutex` across threads; the `Mutex` guards the count.","Keep the thread handles here.","Spawn four worker threads.","Each worker gets its own `Arc` handle to the same mutex.","Spawn a thread capturing that handle...","...lock the mutex for exclusive access...","...and increment the shared count.","The lock releases here; store the handle.","Closes the spawning loop.","For each handle...","...wait for the thread to finish.","Closes the join loop.","Lock once more to read and print `4`.","Closes `main`."],"explanation":"Four threads each locked the shared mutex and added one; because the lock\nserialised them, not a single increment was lost and the total was exactly `4`.\nWithout the mutex the compiler would have rejected the shared mutable access.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d56-mutex-vec","title":"Fill a shared vector in parallel","points":10,"difficulty":20,"intro":"A mutex can guard any type, not just a number. Here threads push into a shared\n`Vec`. The order they push is unpredictable, so we sort the result to get a stable,\ndeterministic output.\n","prompt":"Have three threads push their index into a shared vector, then sort and print it.\n\n**Why:** the mutex makes concurrent `push` calls safe; sorting afterwards removes\nthe only non-determinism — the arrival order — leaving a stable result.\n","target":"use std::sync::{Arc, Mutex};\nuse std::thread;\n\nfn main() {\n    let items = Arc::new(Mutex::new(Vec::new()));\n    let mut handles = Vec::new();\n    for i in 0..3 {\n        let shared = Arc::clone(&items);\n        handles.push(thread::spawn(move || {\n            shared.lock().unwrap().push(i);\n        }));\n    }\n    for h in handles {\n        h.join().unwrap();\n    }\n    let mut result = items.lock().unwrap().clone();\n    result.sort();\n    println!(\"{result:?}\");\n}\n","line_comments":["Brings `Arc` and `Mutex` into scope.","Brings `std::thread` into scope.","","`main` opens.","A shared, mutex-guarded vector, shared via `Arc`.","Keep the thread handles.","For three worker indices...","...clone the `Arc` handle to the shared vector.","Spawn a thread that...","...locks the vector and pushes its index.","Store the handle.","Closes the spawning loop.","For each handle...","...wait for it to finish.","Closes the join loop.","Copy the shared vector out under the lock.","Sort so the output is deterministic regardless of thread order.","Prints `[0, 1, 2]`.","Closes `main`."],"explanation":"Each thread locked the vector to push its index safely; because threads can finish\nin any order, we sorted the copy before printing. The result `[0, 1, 2]` is stable\nacross runs even though the push order is not.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch19-parallel-counter","title":"Parallel counter","points":40,"difficulty":20,"intro":"Apply the unit. Implement `parallel_counter(n_threads, per_thread)`: start\n`n_threads` threads that each add `1` to a shared counter `per_thread` times, then\nreturn the final total. With `Arc<Mutex<_>>` guarding the count, the answer is\nalways exactly `n_threads * per_thread`.\n","instructions":"## Your turn\n\nCount in parallel with a shared, locked counter:\n\n```rust\npub fn parallel_counter(n_threads: usize, per_thread: usize) -> i64 { ... }\n```\n\nCreate a counter shared by `n_threads` threads. Each thread increments it\n`per_thread` times. After all threads finish, return the counter's value. It must\nequal `n_threads * per_thread`.\n\nRules:\n\n- `n_threads` or `per_thread` of `0` yields a total of `0`.\n- Use only `std::sync::{Arc, Mutex}` and `std::thread` — no external crates.\n\nExamples:\n\n- `parallel_counter(4, 1000)` → `4000`\n- `parallel_counter(3, 7)` → `21`\n\n**Hint:** wrap the count in `Arc::new(Mutex::new(0i64))`, give each thread an\n`Arc::clone`, and inside each thread loop `per_thread` times, locking and adding\none. Join every thread before reading the total.\n\nHidden tests decide correctness.\n","starter":"use std::sync::{Arc, Mutex};\nuse std::thread;\n\npub fn parallel_counter(n_threads: usize, per_thread: usize) -> i64 {\n    todo!(\"share a counter across n_threads; each adds per_thread; return the total\")\n}\n","tests":"use student::parallel_counter;\n\n#[test]\nfn four_threads_many_each() {\n    assert_eq!(parallel_counter(4, 1000), 4000);\n}\n\n#[test]\nfn single_thread() {\n    assert_eq!(parallel_counter(1, 5), 5);\n}\n\n#[test]\nfn product_holds() {\n    assert_eq!(parallel_counter(3, 7), 21);\n}\n\n#[test]\nfn zero_per_thread() {\n    assert_eq!(parallel_counter(8, 0), 0);\n}\n\n#[test]\nfn zero_threads() {\n    assert_eq!(parallel_counter(0, 10), 0);\n}\n","entry":"parallel_counter","gabarito":{"time":"O(n_threads * per_thread)","space":"O(n_threads)","solution":"use std::sync::{Arc, Mutex};\nuse std::thread;\n\npub fn parallel_counter(n_threads: usize, per_thread: usize) -> i64 {\n    let counter = Arc::new(Mutex::new(0i64));\n    let mut handles = Vec::new();\n    for _ in 0..n_threads {\n        let c = Arc::clone(&counter);\n        handles.push(thread::spawn(move || {\n            for _ in 0..per_thread {\n                let mut n = c.lock().unwrap();\n                *n += 1;\n            }\n        }));\n    }\n    for h in handles {\n        h.join().unwrap();\n    }\n    let total = *counter.lock().unwrap();\n    total\n}\n","justification":"There are exactly `n_threads * per_thread` increments, each done once under the\nlock, so the work is **O(n_threads * per_thread)**; the only extra storage is one\njoin handle per thread, so space is **O(n_threads)**. Correctness is independent of\nscheduling: every increment happens inside the mutex's critical section, so no two\noverlap and none is lost — the total is always the product, including `0` when\neither factor is `0`.\n"}}]},{"id":"u20-parallelism","title":"Parallelism","difficulty":20,"level":"advanced","intro":"The payoff of the whole track: split a large job across threads, let them work on\ndisjoint pieces, and combine the pieces into one answer. This unit uses\n`thread::scope` to borrow local data without `Arc`, divides a vector into chunks,\nand finishes by counting primes in parallel — always with a deterministic result.\n","steps":[{"kind":"concept","id":"c20-parallelism","title":"Divide the work, combine the answers","points":5,"difficulty":20,"intro":"Concurrency is about *dealing with* many things at once; parallelism is about\n*doing* many things at once to go faster. The recipe is always the same: split the\ninput into independent parts, process the parts on different threads, and reduce\ntheir results into one.\n","body":"## Data parallelism: split, compute, combine\n\nTo make a big computation faster with threads, give each thread a **disjoint**\nslice of the data. Because the slices do not overlap, the threads never touch the\nsame memory — no locks, no races — and the partial results combine into the whole:\n\n1. **Split** the data into `k` roughly equal chunks.\n2. **Compute** a partial result for each chunk on its own thread.\n3. **Combine** (reduce) the partials into the final answer.\n\nBecause a thread must not outlive the data it borrows, sharing owned data usually\nneeds `Arc`. But the standard library offers a lighter tool for the common case\nwhere the data outlives the threads: **`thread::scope`**.\n\n```rust\nuse std::thread;\n\nlet data = vec![1, 2, 3, 4];\nlet total: i32 = thread::scope(|s| {\n    let h = s.spawn(|| data.iter().sum::<i32>());\n    h.join().unwrap()\n});\n```\n\n- Inside `thread::scope`, scoped threads created with **`s.spawn`** may **borrow**\n  local variables directly — no `move`, no `Arc` — because the scope guarantees\n  every scoped thread finishes before `scope` returns.\n- Gathering the partials in a fixed order (for example, by chunk index) makes the\n  combined result **deterministic**: the final answer never depends on which thread\n  happened to finish first.\n\nSplit into disjoint chunks, compute in parallel, reduce in order: that is the\nengine of data parallelism.\n"},{"kind":"drill","id":"d57-scoped-threads","title":"Borrow local data with thread::scope","points":10,"difficulty":20,"intro":"`thread::scope` lets a scoped thread borrow a local value directly, because the\nscope guarantees the thread finishes before the borrowed data can go away. No\n`move`, no `Arc` — just a borrow.\n","prompt":"Sum a local vector inside a scoped thread and read the result out.\n\n**Why:** scoped threads may borrow the surrounding function's locals, because\n`thread::scope` joins them before returning. It is the lightest way to fan out over\nborrowed data.\n","target":"use std::thread;\n\nfn main() {\n    let data = vec![1, 2, 3, 4];\n    let mut total = 0;\n    thread::scope(|s| {\n        let handle = s.spawn(|| data.iter().sum::<i32>());\n        total = handle.join().unwrap();\n    });\n    println!(\"{total}\");\n}\n","line_comments":["Brings `std::thread` into scope.","","`main` opens.","Some data owned on the main thread.","Where the result will go.","`thread::scope` lets scoped threads borrow local data safely.","A scoped thread borrows `data` (no `move`, no `Arc`) and sums it.","Join it and store the result.","The scope ends; all scoped threads are guaranteed finished here.","Prints `10`.","Closes `main`."],"explanation":"The scoped thread borrowed `data` directly — allowed because `thread::scope`\nguarantees it finishes before the scope returns, so the borrow can never dangle.\nThat removed the need for `move` or `Arc` entirely.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d58-split-chunks","title":"Split into chunks and reduce in order","points":10,"difficulty":20,"intro":"The core data-parallel pattern: cut the data into disjoint chunks, sum each on its\nown scoped thread, then gather the partials by index. Gathering in index order is\nwhat makes the final sum deterministic.\n","prompt":"Divide ten numbers into two chunks, sum each on a thread, and reduce the partials.\n\n**Why:** disjoint chunks mean no shared memory and no races; collecting the\npartials by index gives the same total every run, independent of thread timing.\n","target":"use std::thread;\n\nfn main() {\n    let data: Vec<i64> = (1..=10).collect();\n    let workers = 2;\n    let chunk = data.len() / workers;\n    let mut partials = vec![0i64; workers];\n    thread::scope(|s| {\n        let mut handles = Vec::new();\n        for w in 0..workers {\n            let slice = &data[w * chunk..(w + 1) * chunk];\n            handles.push(s.spawn(move || slice.iter().sum::<i64>()));\n        }\n        for (i, h) in handles.into_iter().enumerate() {\n            partials[i] = h.join().unwrap();\n        }\n    });\n    let total: i64 = partials.iter().sum();\n    println!(\"{total}\");\n}\n","line_comments":["Brings `std::thread` into scope.","","`main` opens.","Ten numbers to add in parallel.","Use two worker threads.","Each worker handles an equal chunk of the data.","A slot per worker for its partial sum.","Open a scope so threads may borrow `data`.","Collect the scoped-thread handles.","For each worker index...","...take a disjoint slice of the data (no overlap, so no races).","Spawn a scoped thread that sums its slice; `move` captures the slice reference.","Closes the spawning loop.","Join handles in index order...","...storing each partial in its slot (deterministic order).","Closes the gather loop.","The scope ends; all workers have finished.","Reduce the partials into the final total.","Prints `55`.","Closes `main`."],"explanation":"Each thread summed a disjoint slice, so there was no shared memory to race over;\ngathering the partials by index and adding them produced `55`. The result is\nidentical on every run because the reduce order is fixed, not tied to thread timing.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d59-count-parallel","title":"Count matches in parallel","points":10,"difficulty":20,"intro":"Parallelism is not only for sums: any per-element test that is combined by addition\nworks. Here two threads count the even numbers in two halves, and the counts add up\nto the whole — a direct rehearsal for the prime-counting challenge.\n","prompt":"Count the even numbers in `1..=100` using two threads over two halves.\n\n**Why:** counting matches is an associative reduction, so splitting the range and\nadding the per-half counts gives the same answer as scanning it all at once.\n","target":"use std::thread;\n\nfn is_even(n: i64) -> bool {\n    n % 2 == 0\n}\n\nfn main() {\n    let data: Vec<i64> = (1..=100).collect();\n    let mid = data.len() / 2;\n    let (left, right) = data.split_at(mid);\n    let (a, b) = thread::scope(|s| {\n        let h1 = s.spawn(|| left.iter().filter(|&&n| is_even(n)).count());\n        let h2 = s.spawn(|| right.iter().filter(|&&n| is_even(n)).count());\n        (h1.join().unwrap(), h2.join().unwrap())\n    });\n    println!(\"{}\", a + b);\n}\n","line_comments":["Brings `std::thread` into scope.","","A helper: is this number even?","True when the remainder on division by two is zero.","Closes `is_even`.","","`main` opens.","The numbers 1 to 100.","The midpoint index.","Split into two non-overlapping halves.","Open a scope and capture its two results.","Thread 1 counts evens in the left half.","Thread 2 counts evens in the right half.","The scope block yields the pair of partial counts.","The scope ends; both threads have finished.","Prints the total count of evens: `50`.","Closes `main`."],"explanation":"Each thread counted evens in its own half, and the two counts added to `50` — the\nsame as counting the whole range. Because counting is an associative reduction,\nsplitting the work left the answer unchanged.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch20-count-primes","title":"Count primes in parallel","points":40,"difficulty":20,"intro":"The capstone of the concurrency track. Implement `count_primes_parallel(upto,\nworkers)`: count the prime numbers in `2..=upto` by splitting the range across\n`workers` threads and summing the per-chunk counts. The answer must match a\nsequential count exactly — parallelism must change only the speed, never the result.\n","instructions":"## Your turn\n\nCount primes using several threads:\n\n```rust\npub fn count_primes_parallel(upto: u64, workers: usize) -> usize { ... }\n```\n\nCount how many primes are in `2..=upto`. Split the candidates across `workers`\nthreads, count the primes in each chunk, and sum the counts. The result must equal\na single-threaded count.\n\nRules:\n\n- `upto < 2` yields `0`.\n- `workers` of `0` behaves like `1`.\n- Use only `std::thread` (and `std::sync::Arc` if you like) — no external crates.\n\nExamples:\n\n- `count_primes_parallel(10, 4)` → `4` (2, 3, 5, 7)\n- `count_primes_parallel(100, 7)` → `25`\n\n**Hint:** build the candidates `2..=upto`, split them into chunks, and give each\nthread a chunk to count with a simple `is_prime` test. Sum what the threads return.\nA trial-division `is_prime` (test divisors up to `sqrt(n)`) is plenty.\n\nHidden tests decide correctness.\n","starter":"use std::sync::Arc;\nuse std::thread;\n\npub fn count_primes_parallel(upto: u64, workers: usize) -> usize {\n    todo!(\"split 2..=upto across workers, count primes in each, then sum the counts\")\n}\n","tests":"use student::count_primes_parallel;\n\n#[test]\nfn up_to_ten() {\n    assert_eq!(count_primes_parallel(10, 4), 4);\n}\n\n#[test]\nfn up_to_twenty() {\n    assert_eq!(count_primes_parallel(20, 3), 8);\n}\n\n#[test]\nfn up_to_one_hundred() {\n    assert_eq!(count_primes_parallel(100, 7), 25);\n}\n\n#[test]\nfn below_two_is_zero() {\n    assert_eq!(count_primes_parallel(1, 4), 0);\n}\n\n#[test]\nfn two_is_one_prime() {\n    assert_eq!(count_primes_parallel(2, 4), 1);\n}\n\n#[test]\nfn zero_workers_defaults_to_one() {\n    assert_eq!(count_primes_parallel(30, 0), 10);\n}\n","entry":"count_primes_parallel","gabarito":{"time":"O(n * sqrt(n))","space":"O(n)","solution":"use std::sync::Arc;\nuse std::thread;\n\nfn is_prime(n: u64) -> bool {\n    if n < 2 {\n        return false;\n    }\n    let mut d = 2;\n    while d * d <= n {\n        if n % d == 0 {\n            return false;\n        }\n        d += 1;\n    }\n    true\n}\n\npub fn count_primes_parallel(upto: u64, workers: usize) -> usize {\n    if upto < 2 {\n        return 0;\n    }\n    let workers = workers.max(1);\n    let candidates: Arc<Vec<u64>> = Arc::new((2..=upto).collect());\n    let len = candidates.len();\n    let chunk = len.div_ceil(workers);\n    let mut handles = Vec::new();\n    for w in 0..workers {\n        let start = w * chunk;\n        if start >= len {\n            break;\n        }\n        let end = (start + chunk).min(len);\n        let nums = Arc::clone(&candidates);\n        handles.push(thread::spawn(move || {\n            nums[start..end].iter().filter(|&&n| is_prime(n)).count()\n        }));\n    }\n    handles.into_iter().map(|h| h.join().unwrap()).sum()\n}\n","justification":"Each of the `n = upto - 1` candidates is tested once with trial division up to its\nsquare root, so the work is **O(n * sqrt(n))**; the shared `Arc<Vec<u64>>` holds the\n`n` candidates, so space is **O(n)**. The count is deterministic because the chunks\nare disjoint — every candidate is tested exactly once, on exactly one thread — so no\nprimality test is duplicated or lost, and summing the per-chunk counts yields the\nsame total as a single-threaded scan, for any number of workers.\n"}}]},{"id":"u21-stacks-queues","title":"Stacks and Queues","difficulty":21,"level":"advanced","intro":"Two of the most useful containers in programming are built straight from the\nstandard library. A **stack** is last-in, first-out: `Vec` already is one — `push`\nputs an item on top, `pop` takes the top back off. A **queue** is first-in,\nfirst-out: `VecDeque` adds at the back with `push_back` and removes from the front\nwith `pop_front`. This unit uses both, then checks balanced brackets with a stack.\n","steps":[{"kind":"concept","id":"c21-stacks-queues","title":"Last in first out, first in first out","points":5,"difficulty":21,"intro":"A stack and a queue differ only in *which end* you take from. Pick the stack when\nyou want to undo the most recent thing first; pick the queue when you want to serve\nthings in arrival order.\n","body":"## `Vec` is a stack\n\nA `Vec` grows and shrinks at its end, which is exactly a **stack** — last in, first\nout (LIFO). `push` adds to the top; `pop` removes the top and returns it as an\n`Option` (`None` when empty):\n\n```rust\nlet mut stack = Vec::new();\nstack.push(1);\nstack.push(2);\nassert_eq!(stack.pop(), Some(2)); // the last pushed comes off first\n```\n\n## `VecDeque` is a queue\n\nA **queue** serves in arrival order — first in, first out (FIFO). `VecDeque` is a\ndouble-ended queue that can push and pop at *both* ends cheaply. Use `push_back` to\nenqueue and `pop_front` to dequeue:\n\n```rust\nuse std::collections::VecDeque;\n\nlet mut queue = VecDeque::new();\nqueue.push_back(\"a\");\nqueue.push_back(\"b\");\nassert_eq!(queue.pop_front(), Some(\"a\")); // the first enqueued leaves first\n```\n\n- Both `pop` and `pop_front` return `Option`, so an empty container yields `None`\n  instead of panicking — handle that case with `while let Some(x) = ...` or a match.\n- A stack reverses order (the last in leaves first); a queue preserves it.\n\nReach for a stack to process *most recent first* (undo, bracket matching,\ndepth-first search) and a queue for *fair, in-order* processing (task lists,\nbreadth-first search).\n"},{"kind":"drill","id":"d60-vec-stack","title":"Use a Vec as a stack","points":10,"difficulty":21,"intro":"A `Vec` is already a stack: `push` adds to the top and `pop` removes the top,\nreturning it as an `Option`. Three pushes then one pop shows the last-in,\nfirst-out order directly.\n","prompt":"Push three numbers onto a `Vec`, pop one, and print the popped value and the rest.\n\n**Why:** `push`/`pop` operate at the end of the `Vec`, which is the defining\nbehaviour of a stack — the most recently added item is the first one back out.\n","target":"fn main() {\n    let mut stack: Vec<i32> = Vec::new();\n    stack.push(1);\n    stack.push(2);\n    stack.push(3);\n    let top = stack.pop();\n    println!(\"{:?} {:?}\", top, stack);\n}\n","line_comments":["`main` opens.","An empty `Vec` — we will use it as a stack.","`push` adds `1` to the top.","`push` adds `2` on top of that.","`push` adds `3` — the stack is now `[1, 2, 3]`.","`pop` removes and returns the top element as an `Option`.","Prints `Some(3) [1, 2]` — last in, first out.","Closes `main`."],"explanation":"`pop` returned `Some(3)` — the value pushed most recently — and left `[1, 2]`\nbehind. That last-in, first-out behaviour is what makes a `Vec` a ready-made stack.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d61-vecdeque-queue","title":"Use a VecDeque as a queue","points":10,"difficulty":21,"intro":"`VecDeque` is a double-ended queue. Enqueue at the back with `push_back` and\ndequeue from the front with `pop_front`, and items leave in the same order they\narrived — first in, first out.\n","prompt":"Enqueue three strings with `push_back`, dequeue one with `pop_front`, and print both.\n\n**Why:** a queue serves in arrival order; taking from the front while adding at the\nback preserves that order, unlike a stack which reverses it.\n","target":"use std::collections::VecDeque;\n\nfn main() {\n    let mut queue: VecDeque<&str> = VecDeque::new();\n    queue.push_back(\"a\");\n    queue.push_back(\"b\");\n    queue.push_back(\"c\");\n    let first = queue.pop_front();\n    println!(\"{:?} {:?}\", first, queue);\n}\n","line_comments":["Brings `VecDeque` into scope.","","`main` opens.","An empty double-ended queue.","`push_back` enqueues `\"a\"` at the back.","`push_back` enqueues `\"b\"`.","`push_back` enqueues `\"c\"`.","`pop_front` dequeues from the front as an `Option`.","Prints `Some(\"a\") [\"b\", \"c\"]` — first in, first out.","Closes `main`."],"explanation":"`pop_front` returned `Some(\"a\")` — the item enqueued first — leaving `b` and `c` in\norder. A queue preserves arrival order, which is exactly what `push_back` paired\nwith `pop_front` gives you.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d62-drain-stack","title":"Drain a stack to reverse","points":10,"difficulty":21,"intro":"Popping a stack until it is empty visits the items in reverse order. A\n`while let Some(x) = stack.pop()` loop is the idiomatic way to drain it, because\n`pop` yields `None` exactly when the stack runs out.\n","prompt":"Pop a four-element stack until empty, collecting into a new vector.\n\n**Why:** each `pop` takes the current top, so draining a stack naturally reverses\nit — the first item out is the one that was on top (pushed last).\n","target":"fn main() {\n    let mut stack = vec![1, 2, 3, 4];\n    let mut out = Vec::new();\n    while let Some(x) = stack.pop() {\n        out.push(x);\n    }\n    println!(\"{:?}\", out);\n}\n","line_comments":["`main` opens.","A stack holding `[1, 2, 3, 4]`.","Where popped values will go.","`while let` keeps popping until the stack is empty.","Push each popped value onto `out`.","Closes the loop.","Prints `[4, 3, 2, 1]` — popping reverses the order.","Closes `main`."],"explanation":"The loop ran until `pop` returned `None`, pulling `4, 3, 2, 1` off the top in turn.\nDraining a stack is a tidy way to reverse a sequence without any index arithmetic.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch21-balanced-parens","title":"Balanced brackets","points":40,"difficulty":21,"intro":"The classic use of a stack. Implement `balanced_parens(s)`: return `true` when every\nopening bracket `(`, `[`, `{` has a matching closing bracket of the same kind, in the\nright nesting order. A stack remembers what is still open — push on an opener, and on\na closer check that the top is its match.\n","instructions":"## Your turn\n\nCheck that brackets are balanced using a stack:\n\n```rust\npub fn balanced_parens(s: &str) -> bool { ... }\n```\n\nReturn `true` when the brackets `()`, `[]`, `{}` in `s` are balanced and correctly\nnested; `false` otherwise. Any other character is ignored.\n\nRules:\n\n- An empty string is balanced (`true`).\n- Push each opener onto a stack; on each closer, pop and check it matches.\n- A closer with an empty stack, or a mismatched top, means `false`.\n- Left-over openers at the end (non-empty stack) mean `false`.\n\nExamples:\n\n- `balanced_parens(\"([{}])\")` → `true`\n- `balanced_parens(\"([)]\")` → `false` (wrong nesting)\n- `balanced_parens(\"(((\")` → `false` (never closed)\n\n**Hint:** iterate `s.chars()`. On `(`, `[`, `{` push the character. On `)`, `]`, `}`\npop and compare with the expected opener; return `false` on any mismatch or empty\npop. At the end the string is balanced exactly when the stack is empty.\n\nHidden tests decide correctness.\n","starter":"pub fn balanced_parens(s: &str) -> bool {\n    todo!(\"push openers on a stack; on each closer, pop and check it matches\")\n}\n","tests":"use student::balanced_parens;\n\n#[test]\nfn empty_is_balanced() {\n    assert!(balanced_parens(\"\"));\n}\n\n#[test]\nfn simple_pairs() {\n    assert!(balanced_parens(\"()[]{}\"));\n}\n\n#[test]\nfn nested_ok() {\n    assert!(balanced_parens(\"([{}])\"));\n}\n\n#[test]\nfn ignores_other_chars() {\n    assert!(balanced_parens(\"a(b[c]d)e\"));\n}\n\n#[test]\nfn wrong_nesting() {\n    assert!(!balanced_parens(\"([)]\"));\n}\n\n#[test]\nfn unclosed() {\n    assert!(!balanced_parens(\"(((\"));\n}\n\n#[test]\nfn extra_close() {\n    assert!(!balanced_parens(\"())\"));\n}\n","entry":"balanced_parens","gabarito":{"time":"O(n)","space":"O(n)","solution":"pub fn balanced_parens(s: &str) -> bool {\n    let mut stack: Vec<char> = Vec::new();\n    for c in s.chars() {\n        match c {\n            '(' | '[' | '{' => stack.push(c),\n            ')' => {\n                if stack.pop() != Some('(') {\n                    return false;\n                }\n            }\n            ']' => {\n                if stack.pop() != Some('[') {\n                    return false;\n                }\n            }\n            '}' => {\n                if stack.pop() != Some('{') {\n                    return false;\n                }\n            }\n            _ => {}\n        }\n    }\n    stack.is_empty()\n}\n","justification":"Each character is examined once and triggers at most one `push` or `pop`, so the time\nis **O(n)** in the length of `s`. The stack holds at most one entry per unmatched\nopener, so worst-case space is **O(n)** (a string of all openers). Correctness follows\nfrom the invariant that the stack always holds exactly the still-open brackets in\nnesting order: a closer must match the top, and a fully balanced string ends with an\nempty stack.\n"}}]},{"id":"u22-linked-list","title":"Linked Lists","difficulty":22,"level":"advanced","intro":"A linked list is the first data structure you build from pointers rather than a\ncontiguous block. In Rust the shape is `Option<Box<Node>>`: each node owns the next\nthrough a `Box`, and `None` marks the end. This unit builds a singly linked list —\npush to the front, pop from the front, measure its length — then reverses a sequence\nby pushing every item to the front.\n","steps":[{"kind":"concept","id":"c22-linked-list","title":"Nodes that own the next node","points":5,"difficulty":22,"intro":"A linked list stores each value in its own node, and each node *owns* the rest of\nthe list. Because ownership must have a known size, the link goes through a `Box` —\na pointer to heap data — and ends with `None`.\n","body":"## The shape: `Option<Box<Node>>`\n\nA node holds a value and a link to the next node. The link is\n`Option<Box<Node>>`: `Some(box)` points at another node, `None` ends the list. The\n`Box` is essential — without it the type would contain itself and have infinite\nsize:\n\n```rust\nstruct Node {\n    val: i32,\n    next: Option<Box<Node>>,\n}\n```\n\n## Push to the front\n\nThe cheapest insertion is at the head: make a new node whose `next` is the old\nhead, then make it the new head. `Option::take` swaps the old head out (leaving\n`None` in its place) so it can be moved into the new node:\n\n```rust\nlet mut head: Option<Box<Node>> = None;\nhead = Some(Box::new(Node { val: 1, next: head.take() }));\nhead = Some(Box::new(Node { val: 2, next: head.take() })); // 2 -> 1 -> end\n```\n\n- `Box<Node>` owns one node on the heap; dropping the head drops the whole chain.\n- `head.take()` is the idiom for moving an owned value *out* of an `Option` while\n  leaving it valid (`None`) — exactly what you need when re-linking.\n- To walk the list, follow `&node.next` with a `while let Some(node) = cur` loop.\n\nPush-front then walk is the backbone of every operation in this unit — including\nreversing a sequence, which push-front does almost for free.\n"},{"kind":"drill","id":"d63-push-front","title":"Build a list by pushing to the front","points":10,"difficulty":22,"intro":"Pushing each value to the front links it ahead of the previous head. `head.take()`\nmoves the old head out of the `Option` (leaving `None`) so it can become the new\nnode's `next`. Walking the result shows the order reversed.\n","prompt":"Push `1, 2, 3` to the front of a list, then walk it collecting the values.\n\n**Why:** `Option::take` lets you move the owned head out while leaving the `Option`\nvalid, which is exactly what re-linking the head needs; push-front reverses order.\n","target":"struct Node {\n    val: i32,\n    next: Option<Box<Node>>,\n}\n\nfn main() {\n    let mut head: Option<Box<Node>> = None;\n    for x in [1, 2, 3] {\n        head = Some(Box::new(Node { val: x, next: head.take() }));\n    }\n    let mut out = Vec::new();\n    let mut cur = &head;\n    while let Some(node) = cur {\n        out.push(node.val);\n        cur = &node.next;\n    }\n    println!(\"{:?}\", out);\n}\n","line_comments":["A list node: a value plus an optional boxed next node.","The payload.","`Option<Box<Node>>` — `Some` for a next node, `None` for the end.","Closes `Node`.","","`main` opens.","An empty list is just `None`.","For each value in order...","...push it to the front: the old head becomes the new node's `next`.","Closes the build loop.","Collect the values into a vector.","Start a walking reference at the head.","`while let` follows the chain while a node is present.","Record this node's value.","Advance to the next node.","Closes the walk loop.","Prints `[3, 2, 1]` — push-front reverses the input order.","Closes `main`."],"explanation":"Each value was linked ahead of the previous head, so walking from the head produced\n`[3, 2, 1]` — the reverse of the input. That is the whole idea behind the reversal\nchallenge: push every item to the front.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d64-list-len","title":"Measure a list's length","points":10,"difficulty":22,"intro":"Length is a walk: start a reference at the head and follow `next` links, counting\none per node, until you reach `None`. Reassigning the walking reference to\n`&node.next` is how you move along the chain without taking ownership.\n","prompt":"Write `len` that counts the nodes in a borrowed list, and call it on a two-node list.\n\n**Why:** walking by shared reference (`&Option<Box<Node>>`) visits every node without\nmoving or mutating the list, so the list is still usable afterwards.\n","target":"struct Node {\n    val: i32,\n    next: Option<Box<Node>>,\n}\n\nfn len(mut cur: &Option<Box<Node>>) -> usize {\n    let mut n = 0;\n    while let Some(node) = cur {\n        n += 1;\n        cur = &node.next;\n    }\n    n\n}\n\nfn main() {\n    let a = Node { val: 1, next: None };\n    let b = Node { val: 2, next: Some(Box::new(a)) };\n    let head = Some(Box::new(b));\n    println!(\"{}\", len(&head));\n}\n","line_comments":["A singly linked list node.","The payload.","The link to the rest of the list, or `None`.","Closes `Node`.","","`len` walks the chain from a borrowed head.","A running count.","`while let` continues while there is a node.","Count this node.","Move the reference to the next link.","Closes the `while let` loop.","Return the final count.","Closes `len`.","","`main` opens.","The tail node, ending the list.","A second node pointing at `a`.","The head owns the two-node list.","Prints `2` — the list has two nodes.","Closes `main`."],"explanation":"`len` followed the `next` links from the head, counting two nodes before reaching\n`None`. Because it borrowed the list (`&`), the list was untouched and still usable\nafter the call.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d65-pop-front","title":"Pop the front node","points":10,"difficulty":22,"intro":"Popping the front means taking the head out, reading its value, and promoting its\n`next` to be the new head. `head.take()` removes the head (leaving `None`), and the\nnode it hands back owns the rest of the list through its `next` field.\n","prompt":"Pop the front of a two-node list, printing the popped value and the new front.\n\n**Why:** `take` moves the head node out so you own it; its `next` field *is* the\nremainder of the list, so assigning it back to `head` drops exactly one node.\n","target":"struct Node {\n    val: i32,\n    next: Option<Box<Node>>,\n}\n\nfn main() {\n    let a = Node { val: 20, next: None };\n    let b = Node { val: 10, next: Some(Box::new(a)) };\n    let mut head = Some(Box::new(b));\n    let mut popped = None;\n    if let Some(node) = head.take() {\n        popped = Some(node.val);\n        head = node.next;\n    }\n    println!(\"{:?} {:?}\", popped, head.map(|n| n.val));\n}\n","line_comments":["A singly linked list node.","The payload.","The link to the next node, or `None`.","Closes `Node`.","","`main` opens.","The tail node holding `20`.","The head node holding `10`, linked to `a`.","`head` owns the two-node list.","Where the popped value will go.","`take` removes the head node, leaving `head` as `None`.","Record the old head's value.","Reattach the rest of the list as the new head.","Closes the `if let`.","Prints `Some(10) Some(20)` — popped value, then the new front.","Closes `main`."],"explanation":"`take` handed back the head node holding `10`; its `next` field — the rest of the\nlist — became the new head, so the front is now `20`. Popping the front is just\nowning the head and promoting its `next`.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch22-reverse-list","title":"Reverse with a linked list","points":40,"difficulty":22,"intro":"Put push-front to work. Implement `reverse_list(items)`: build a singly linked list\nby pushing each item to the front, then walk the list collecting the values into a\n`Vec`. Because every push puts the item ahead of the rest, the collected order is the\nreverse of the input — a linked list reverses a sequence for free.\n","instructions":"## Your turn\n\nReverse a sequence using a linked list:\n\n```rust\npub fn reverse_list(items: Vec<i32>) -> Vec<i32> { ... }\n```\n\nBuild a singly linked list of `Option<Box<Node>>` by pushing each element of `items`\nto the **front**, then walk the list from the head and collect the values into a\n`Vec`. The result is `items` reversed.\n\nRules:\n\n- An empty input yields an empty `Vec`.\n- Use your own `Node` type with an `Option<Box<Node>>` link — no `.rev()` shortcut.\n- Push-front: the new node's `next` is the old head.\n\nExamples:\n\n- `reverse_list(vec![1, 2, 3, 4])` → `vec![4, 3, 2, 1]`\n- `reverse_list(vec![7])` → `vec![7]`\n\n**Hint:** start with `head = None`. For each `x`, set\n`head = Some(Box::new(Node { val: x, next: head.take() }))`. Then walk with\n`while let Some(node) = cur { out.push(node.val); cur = node.next; }`.\n\nHidden tests decide correctness.\n","starter":"pub
