e)\", i, j, ok)\n\t}\n}\n\nfunc TestTwoSumNone(t *testing.T) {\n\t_, _, ok := TwoSum([]int{1, 2, 3}, 100)\n\tif ok {\n\t\tt.Fatal(\"TwoSum([1 2 3], 100) should report not found\")\n\t}\n}\n\nfunc TestTwoSumEmpty(t *testing.T) {\n\t_, _, ok := TwoSum(nil, 0)\n\tif ok {\n\t\tt.Fatal(\"TwoSum(nil, 0) should report not found\")\n\t}\n}\n","entry":"TwoSum","gabarito":{"time":"O(n)","space":"O(n)","solution":"package student\n\nfunc TwoSum(nums []int, target int) (int, int, bool) {\n\tseen := map[int]int{}\n\tfor j, v := range nums {\n\t\tif i, ok := seen[target-v]; ok {\n\t\t\treturn i, j, true\n\t\t}\n\t\tif _, ok := seen[v]; !ok {\n\t\t\tseen[v] = j\n\t\t}\n\t}\n\treturn 0, 0, false\n}\n","justification":"One pass over `nums` (**O(n)**) with a map holding at most one index per value (**O(n)**\nspace). For each `v` at index `j`, the complement `target - v` is looked up in O(1); if it was\nseen earlier its stored index is smaller than `j`, so returning `(i, j)` gives the smaller\nindex first. Storing only the first occurrence of each value keeps `i` minimal. Finding the\ncomplement before inserting `v` prevents using one element twice.\n"}}]},{"id":"u18-binary-search-tree","title":"Binary search trees","difficulty":18,"level":"advanced","intro":"A binary search tree keeps its values ordered: every node's left subtree holds smaller\nvalues, its right subtree larger ones. That invariant makes lookup and ordered traversal\nfall out naturally. You will build a tree, insert recursively, search it, walk it in order\n(which yields sorted values), and finish by turning a bag of inserts into a sorted slice.\n","steps":[{"kind":"concept","id":"c18-bst","title":"The ordering invariant","points":5,"difficulty":18,"intro":"A BST node has a value and two children. The invariant: everything in the left subtree is\nsmaller than the node, everything in the right is larger. Keep it, and the tree stays sorted.\n","body":"## The node\n\n```go\ntype Node struct {\n    Val   int\n    Left  *Node\n    Right *Node\n}\n```\n\n## Insert (recursive)\n\nDescend left for smaller values, right for larger; create the node at the empty spot:\n\n```go\nfunc insert(root *Node, v int) *Node {\n    if root == nil {\n        return &Node{Val: v}\n    }\n    if v < root.Val {\n        root.Left = insert(root.Left, v)\n    } else if v > root.Val {\n        root.Right = insert(root.Right, v)\n    }\n    return root\n}\n```\n\nEqual values are ignored here, so the tree holds each value at most once.\n\n## In-order traversal = sorted\n\nVisit left, then the node, then right, and values come out ascending:\n\n```go\nfunc inorder(root *Node, out *[]int) {\n    if root == nil {\n        return\n    }\n    inorder(root.Left, out)\n    *out = append(*out, root.Val)\n    inorder(root.Right, out)\n}\n```\n\nSearch mirrors insert: go left or right by comparison, so lookup costs the tree's height —\nO(log n) when balanced, O(n) in the worst case.\n"},{"kind":"drill","id":"d1-bst-build","title":"Build a tree by hand","points":10,"difficulty":18,"intro":"Wire a root with a smaller left child and a larger right child. Reading the three values back\nshows the ordering invariant directly.\n","prompt":"Make a root holding 5, a left child 3, and a right child 8; print all three.\n\n**Why:** seeing left < root < right by hand makes the BST invariant concrete before any\nrecursion enters the picture.\n","target":"package main\n\nimport \"fmt\"\n\ntype Node struct {\n    Val   int\n    Left  *Node\n    Right *Node\n}\n\nfunc main() {\n    root := &Node{Val: 5}\n    root.Left = &Node{Val: 3}\n    root.Right = &Node{Val: 8}\n    fmt.Println(root.Val, root.Left.Val, root.Right.Val)\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","A binary search tree node...","...an int value...","...a left child (smaller values)...","...and a right child (larger values).","Closes the struct.","","Opens `main`.","The root holds 5.","Smaller value 3 goes on the left.","Larger value 8 goes on the right.","Prints `5 3 8` — the BST ordering invariant.","Closes `main`."],"explanation":"The invariant is just left < root < right. Placing 3 on the left of 5 and 8 on the right\nsatisfies it, and reading `root.Val`, `root.Left.Val`, `root.Right.Val` prints `5 3 8`.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d2-bst-insert","title":"Insert recursively","points":10,"difficulty":18,"intro":"Insert 5, 3, 8 into an empty tree with a recursive helper that returns the subtree root. The\nresulting shape — 5 at the root, 3 left, 8 right — is fixed.\n","prompt":"Insert 5, 3, 8 into an empty BST and print root, left, right.\n\n**Why:** the return-the-root recursion (`root.Left = insert(root.Left, v)`) is the standard,\nnil-safe way to grow a tree, handling the empty tree and every subtree the same way.\n","target":"package main\n\nimport \"fmt\"\n\ntype Node struct {\n    Val   int\n    Left  *Node\n    Right *Node\n}\n\nfunc insert(root *Node, v int) *Node {\n    if root == nil {\n        return &Node{Val: v}\n    }\n    if v < root.Val {\n        root.Left = insert(root.Left, v)\n    } else {\n        root.Right = insert(root.Right, v)\n    }\n    return root\n}\n\nfunc main() {\n    var root *Node\n    for _, v := range []int{5, 3, 8} {\n        root = insert(root, v)\n    }\n    fmt.Println(root.Val, root.Left.Val, root.Right.Val)\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","A BST node...","...an int value...","...a left child...","...and a right child.","Closes the struct.","","`insert` returns the (possibly new) subtree root.","An empty spot: create the node here.","Return the freshly created node.","Closes the base case.","Smaller values go left...","...insert recursively into the left subtree.","Otherwise (equal or larger)...","...insert into the right subtree.","Closes the if/else.","Return this subtree's root unchanged.","Closes `insert`.","","Opens `main`.","Start with an empty tree.","Insert 5, then 3, then 8...","...reassigning root each time.","Closes the insert loop.","Prints `5 3 8` — 5 at the root, 3 left, 8 right.","Closes `main`."],"explanation":"`insert` returns the subtree root, so `root = insert(root, v)` handles the empty tree (returns\na fresh node) and deeper subtrees uniformly. Inserting 5 then 3 then 8 builds 5 with 3 on the\nleft and 8 on the right, printing `5 3 8`.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d3-inorder","title":"In-order traversal is sorted","points":10,"difficulty":18,"intro":"Walk left, node, right and collect the values. For a BST this emits them ascending, so the\nsmall tree 5/3/8 prints as [3 5 8].\n","prompt":"Collect the in-order traversal of a 5/3/8 tree into a slice.\n\n**Why:** in-order traversal of a BST is exactly a sorted walk — the property that makes a\ntree double as an ordering structure.\n","target":"package main\n\nimport \"fmt\"\n\ntype Node struct {\n    Val   int\n    Left  *Node\n    Right *Node\n}\n\nfunc inorder(root *Node, out *[]int) {\n    if root == nil {\n        return\n    }\n    inorder(root.Left, out)\n    *out = append(*out, root.Val)\n    inorder(root.Right, out)\n}\n\nfunc main() {\n    root := &Node{Val: 5}\n    root.Left = &Node{Val: 3}\n    root.Right = &Node{Val: 8}\n    var out []int\n    inorder(root, &out)\n    fmt.Println(out)\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","A BST node...","...an int value...","...a left child...","...and a right child.","Closes the struct.","","`inorder` appends values left-root-right into `out`.","Nothing to do for an empty subtree...","...return.","Closes the base case.","Visit the left subtree first (smaller values).","Then record this node's value.","Then visit the right subtree (larger values).","Closes `inorder`.","","Opens `main`.","Root holds 5.","3 on the left.","8 on the right.","The slice that will collect the traversal.","Run the in-order traversal.","Prints `[3 5 8]` — in-order of a BST is sorted.","Closes `main`."],"explanation":"Visiting left subtree, then node, then right subtree yields values in ascending order for any\nBST. The pointer-to-slice parameter lets each recursive call append to the same `out`. The\n5/3/8 tree prints `[3 5 8]`.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch18-sortedfrominserts","title":"Implement SortedFromInserts","points":40,"difficulty":18,"intro":"Combine insert and in-order traversal: feed every item into a BST, then read it back in\norder. Duplicates are ignored by the tree, so you get the distinct values, sorted — a tiny\ntree-sort.\n","instructions":"## Your turn\n\nImplement the function `SortedFromInserts`:\n\n```go\nfunc SortedFromInserts(items []int) []int { ... }\n```\n\nInsert every value of `items` into a binary search tree, then return the in-order traversal.\nThe result must be sorted ascending, with **duplicates removed** (a repeated value is only\nstored once by the tree).\n\nExamples:\n\n- `SortedFromInserts(nil)` -> `[]`\n- `SortedFromInserts([]int{5, 3, 8, 1, 4})` -> `[1 3 4 5 8]`\n- `SortedFromInserts([]int{5, 1, 5, 3, 1})` -> `[1 3 5]`\n- `SortedFromInserts([]int{3, 3, 3})` -> `[3]`\n\n**Hint:** reuse the recursive `insert` (ignore a value equal to the current node) and the\n`inorder` walk from the drills. Insert all items, traverse into a slice, return it.\n\nHidden tests decide correctness.\n","starter":"package student\n\n// Node is a binary search tree node.\ntype Node struct {\n\tVal   int\n\tLeft  *Node\n\tRight *Node\n}\n\n// SortedFromInserts inserts every item into a BST and returns the in-order values\n// (sorted ascending, duplicates ignored).\nfunc SortedFromInserts(items []int) []int {\n\tpanic(\"todo\")\n}\n","tests":"package student\n\nimport (\n\t\"reflect\"\n\t\"testing\"\n)\n\nfunc TestSortedEmpty(t *testing.T) {\n\tif got := SortedFromInserts(nil); len(got) != 0 {\n\t\tt.Fatalf(\"SortedFromInserts(nil) = %v, want empty\", got)\n\t}\n}\n\nfunc TestSortedBasic(t *testing.T) {\n\tgot := SortedFromInserts([]int{5, 3, 8, 1, 4})\n\tif !reflect.DeepEqual(got, []int{1, 3, 4, 5, 8}) {\n\t\tt.Fatalf(\"got %v, want [1 3 4 5 8]\", got)\n\t}\n}\n\nfunc TestSortedDuplicates(t *testing.T) {\n\tgot := SortedFromInserts([]int{5, 1, 5, 3, 1})\n\tif !reflect.DeepEqual(got, []int{1, 3, 5}) {\n\t\tt.Fatalf(\"got %v, want [1 3 5] (duplicates ignored)\", got)\n\t}\n}\n\nfunc TestSortedAllSame(t *testing.T) {\n\tgot := SortedFromInserts([]int{3, 3, 3})\n\tif !reflect.DeepEqual(got, []int{3}) {\n\t\tt.Fatalf(\"got %v, want [3]\", got)\n\t}\n}\n\nfunc TestSortedAlreadySorted(t *testing.T) {\n\tgot := SortedFromInserts([]int{1, 2, 3, 4})\n\tif !reflect.DeepEqual(got, []int{1, 2, 3, 4}) {\n\t\tt.Fatalf(\"got %v, want [1 2 3 4]\", got)\n\t}\n}\n","entry":"SortedFromInserts","gabarito":{"time":"O(n log n) average","space":"O(n)","solution":"package student\n\ntype Node struct {\n\tVal   int\n\tLeft  *Node\n\tRight *Node\n}\n\nfunc insert(root *Node, v int) *Node {\n\tif root == nil {\n\t\treturn &Node{Val: v}\n\t}\n\tif v < root.Val {\n\t\troot.Left = insert(root.Left, v)\n\t} else if v > root.Val {\n\t\troot.Right = insert(root.Right, v)\n\t}\n\treturn root\n}\n\nfunc inorder(root *Node, out *[]int) {\n\tif root == nil {\n\t\treturn\n\t}\n\tinorder(root.Left, out)\n\t*out = append(*out, root.Val)\n\tinorder(root.Right, out)\n}\n\nfunc SortedFromInserts(items []int) []int {\n\tvar root *Node\n\tfor _, v := range items {\n\t\troot = insert(root, v)\n\t}\n\tout := []int{}\n\tinorder(root, &out)\n\treturn out\n}\n","justification":"Each insert costs the tree's height — **O(log n)** on average over `n` items, so building is\n**O(n log n)**; the traversal is O(n). Space is **O(n)** for the nodes. Insert ignores a value\nequal to the current node, so duplicates never enter the tree, and in-order traversal of a BST\nis sorted — giving distinct, ascending output. `out` starts as `[]int{}` so an empty input\nreturns a non-nil empty slice.\n"}}]},{"id":"u19-sorting-searching","title":"Sorting & searching by hand","difficulty":19,"level":"advanced","intro":"The standard library can sort for you, but knowing how is the point here. You will write\nbinary search on a sorted slice, merge two sorted runs into one, sort in place with insertion\nsort, and finish by implementing **merge sort** end to end — a new sorted slice with no help\nfrom the `sort` package.\n","steps":[{"kind":"concept","id":"c19-sorting-searching","title":"Divide, merge, and search","points":5,"difficulty":19,"intro":"Binary search halves a sorted range each step — O(log n). Merge sort splits a slice in two,\nsorts each half, and merges them back — O(n log n). Both are built from simple index work.\n","body":"## Binary search\n\nOn a sorted slice, compare the middle and discard half each iteration:\n\n```go\nlo, hi := 0, len(v)-1\nfor lo <= hi {\n    mid := (lo + hi) / 2\n    if v[mid] == target { return mid }\n    if v[mid] < target { lo = mid + 1 } else { hi = mid - 1 }\n}\nreturn -1\n```\n\n## Merge\n\nCombine two sorted slices by always taking the smaller front element:\n\n```go\nfor i < len(a) && j < len(b) {\n    if a[i] <= b[j] { out = append(out, a[i]); i++ } else { out = append(out, b[j]); j++ }\n}\nout = append(out, a[i:]...)   // drain the rest\nout = append(out, b[j:]...)\n```\n\n## Merge sort\n\nSplit, recurse, merge:\n\n```go\nmid := len(v) / 2\nleft := MergeSort(v[:mid])\nright := MergeSort(v[mid:])\nreturn merge(left, right)\n```\n\nA slice of length 0 or 1 is already sorted — that is the base case. Using `<=` in the merge\nkeeps equal elements in their original relative order, so merge sort is **stable**.\n"},{"kind":"drill","id":"d1-binary-search","title":"Binary search a sorted slice","points":10,"difficulty":19,"intro":"Search a sorted slice by repeatedly halving the range. A present value returns its index; an\nabsent one returns -1 — both deterministic.\n","prompt":"Find 7 (present) and 4 (absent) in a sorted slice with binary search.\n\n**Why:** binary search is the payoff for keeping data sorted — O(log n) lookups instead of a\nlinear scan, using nothing but index arithmetic.\n","target":"package main\n\nimport \"fmt\"\n\nfunc search(v []int, target int) int {\n    lo, hi := 0, len(v)-1\n    for lo <= hi {\n        mid := (lo + hi) / 2\n        if v[mid] == target {\n            return mid\n        }\n        if v[mid] < target {\n            lo = mid + 1\n        } else {\n            hi = mid - 1\n        }\n    }\n    return -1\n}\n\nfunc main() {\n    v := []int{1, 3, 5, 7, 9, 11}\n    fmt.Println(search(v, 7), search(v, 4))\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","`search` finds target in a sorted slice, or returns -1.","Two bounds: the whole slice.","While the range is non-empty...","...pick the midpoint.","Found it?","Return the index.","Closes the hit check.","Midpoint too small?","Search the right half.","Otherwise...","...search the left half.","Closes the if/else.","Closes the loop.","Not found.","Closes `search`.","","Opens `main`.","A sorted slice.","Prints `3 -1` — 7 is at index 3, 4 is absent.","Closes `main`."],"explanation":"Each iteration compares the midpoint and throws away half the range, so the search is O(log n).\n7 sits at index 3; 4 is never found, so the loop exits and returns -1. Output: `3 -1`.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d2-merge","title":"Merge two sorted slices","points":10,"difficulty":19,"intro":"Walk two sorted slices with a cursor each, always taking the smaller front value, then drain\nwhatever remains. The merged slice is one sorted run.\n","prompt":"Merge [1 4 7] and [2 3 8] into one sorted slice.\n\n**Why:** merging two sorted runs in linear time is the engine of merge sort — and of any\nexternal sort that cannot fit data in memory.\n","target":"package main\n\nimport \"fmt\"\n\nfunc merge(a, b []int) []int {\n    out := make([]int, 0, len(a)+len(b))\n    i, j := 0, 0\n    for i < len(a) && j < len(b) {\n        if a[i] <= b[j] {\n            out = append(out, a[i])\n            i++\n        } else {\n            out = append(out, b[j])\n            j++\n        }\n    }\n    out = append(out, a[i:]...)\n    out = append(out, b[j:]...)\n    return out\n}\n\nfunc main() {\n    fmt.Println(merge([]int{1, 4, 7}, []int{2, 3, 8}))\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","`merge` combines two sorted slices into one sorted slice.","Pre-size the output.","Two read cursors, one per input.","While both inputs still have elements...","...take the smaller front element:","append from `a`...","...and advance `a`'s cursor.","Otherwise...","...append from `b`...","...and advance `b`'s cursor.","Closes the if/else.","Closes the merge loop.","Append whatever remains of `a`.","Append whatever remains of `b`.","Return the merged slice.","Closes `merge`.","","Opens `main`.","Prints `[1 2 3 4 7 8]` — one sorted run from two.","Closes `main`."],"explanation":"With both inputs already sorted, the smaller of the two front elements is the next output\nelement. When one input empties, the rest of the other is appended wholesale. `<=` keeps equal\nelements stable. Merging [1 4 7] and [2 3 8] gives `[1 2 3 4 7 8]`.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d3-insertion-sort","title":"Insertion sort in place","points":10,"difficulty":19,"intro":"Grow a sorted prefix one element at a time: lift each value out and slide larger neighbours\nright until it drops into place. The slice ends up sorted ascending.\n","prompt":"Sort [4 2 5 1 3] in place with insertion sort.\n\n**Why:** insertion sort is the simplest in-place sort and the base case many hybrid sorts fall\nback to for small inputs — worth writing once by hand.\n","target":"package main\n\nimport \"fmt\"\n\nfunc main() {\n    v := []int{4, 2, 5, 1, 3}\n    for i := 1; i < len(v); i++ {\n        key := v[i]\n        j := i - 1\n        for j >= 0 && v[j] > key {\n            v[j+1] = v[j]\n            j--\n        }\n        v[j+1] = key\n    }\n    fmt.Println(v)\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","Opens `main`.","An unsorted slice.","Insertion sort: grow a sorted prefix one element at a time.","The element to place into the sorted prefix.","Start comparing just left of it.","While the left neighbour is larger than the key...","...shift it one slot to the right...","...and step left.","Closes the shift loop.","Drop the key into the open slot.","Closes the outer loop.","Prints `[1 2 3 4 5]` — sorted by hand, no `sort` package.","Closes `main`."],"explanation":"Everything left of `i` is kept sorted. Each new `key` slides past the larger elements (shifting\nthem right) until it reaches its slot. After the pass, the slice is fully sorted: `[1 2 3 4 5]`.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch19-mergesort","title":"Implement MergeSort","points":40,"difficulty":19,"intro":"Put divide-and-conquer together: split the slice, sort each half recursively, and merge the\nhalves. Return a brand-new sorted slice — and leave the input untouched — without calling the\n`sort` package.\n","instructions":"## Your turn\n\nImplement the function `MergeSort`:\n\n```go\nfunc MergeSort(v []int) []int { ... }\n```\n\nReturn a **new** slice with `v`'s values in ascending order. You may **not** use the `sort`\npackage. The input slice must be left unmodified, and duplicates must be preserved.\n\nExamples:\n\n- `MergeSort(nil)` -> `[]`\n- `MergeSort([]int{42})` -> `[42]`\n- `MergeSort([]int{5, 4, 3, 2, 1})` -> `[1 2 3 4 5]`\n- `MergeSort([]int{3, 1, 2, 3, 1})` -> `[1 1 2 3 3]`\n\n**Hint:** base case — a slice of length 0 or 1 is already sorted, so return a copy. Otherwise\nsplit at `len(v)/2`, recurse on each half, and merge the two sorted halves by repeatedly\ntaking the smaller front element.\n\nHidden tests decide correctness.\n","starter":"package student\n\n// MergeSort returns a new slice with v's values in ascending order,\n// without using the sort package.\nfunc MergeSort(v []int) []int {\n\tpanic(\"todo\")\n}\n","tests":"package student\n\nimport (\n\t\"reflect\"\n\t\"testing\"\n)\n\nfunc TestMergeSortEmpty(t *testing.T) {\n\tif got := MergeSort(nil); len(got) != 0 {\n\t\tt.Fatalf(\"MergeSort(nil) = %v, want empty\", got)\n\t}\n}\n\nfunc TestMergeSortSingle(t *testing.T) {\n\tgot := MergeSort([]int{42})\n\tif !reflect.DeepEqual(got, []int{42}) {\n\t\tt.Fatalf(\"got %v, want [42]\", got)\n\t}\n}\n\nfunc TestMergeSortReversed(t *testing.T) {\n\tgot := MergeSort([]int{5, 4, 3, 2, 1})\n\tif !reflect.DeepEqual(got, []int{1, 2, 3, 4, 5}) {\n\t\tt.Fatalf(\"got %v, want [1 2 3 4 5]\", got)\n\t}\n}\n\nfunc TestMergeSortDuplicates(t *testing.T) {\n\tgot := MergeSort([]int{3, 1, 2, 3, 1})\n\tif !reflect.DeepEqual(got, []int{1, 1, 2, 3, 3}) {\n\t\tt.Fatalf(\"got %v, want [1 1 2 3 3]\", got)\n\t}\n}\n\nfunc TestMergeSortLeavesInputUnchanged(t *testing.T) {\n\tin := []int{3, 1, 2}\n\t_ = MergeSort(in)\n\tif !reflect.DeepEqual(in, []int{3, 1, 2}) {\n\t\tt.Fatalf(\"input mutated to %v, want [3 1 2]\", in)\n\t}\n}\n","entry":"MergeSort","gabarito":{"time":"O(n log n)","space":"O(n)","solution":"package student\n\nfunc merge(a, b []int) []int {\n\tout := make([]int, 0, len(a)+len(b))\n\ti, j := 0, 0\n\tfor i < len(a) && j < len(b) {\n\t\tif a[i] <= b[j] {\n\t\t\tout = append(out, a[i])\n\t\t\ti++\n\t\t} else {\n\t\t\tout = append(out, b[j])\n\t\t\tj++\n\t\t}\n\t}\n\tout = append(out, a[i:]...)\n\tout = append(out, b[j:]...)\n\treturn out\n}\n\nfunc MergeSort(v []int) []int {\n\tif len(v) <= 1 {\n\t\tout := make([]int, len(v))\n\t\tcopy(out, v)\n\t\treturn out\n\t}\n\tmid := len(v) / 2\n\tleft := MergeSort(v[:mid])\n\tright := MergeSort(v[mid:])\n\treturn merge(left, right)\n}\n","justification":"The slice is halved log n times and each level does O(n) merging, so the total is\n**O(n log n)**; the merged outputs use **O(n)** extra space. The base case copies the 0- or\n1-element slice, so a fresh slice is always returned and the input is never mutated. `merge`\nuses `<=`, keeping equal elements in order — a stable sort — and duplicates are preserved.\n"}}]},{"id":"u20-recursion-dp","title":"Recursion & dynamic programming","difficulty":20,"level":"advanced","intro":"Recursion solves a problem by solving smaller versions of itself. When those subproblems\noverlap, plain recursion redoes the same work exponentially — and **dynamic programming** fixes\nit by solving each subproblem once and storing the answer. You will write classic recursions,\nwatch naive Fibonacci blow up, rebuild it bottom-up, and finish with the coin-change problem.\n","steps":[{"kind":"concept","id":"c20-recursion-dp","title":"From recursion to memoized DP","points":5,"difficulty":20,"intro":"A recursive function needs a base case (when to stop) and a recursive case (how to shrink the\nproblem). When subproblems repeat, caching their results — dynamic programming — removes the\nexponential blow-up.\n","body":"## Recursion\n\nBase case plus a smaller call:\n\n```go\nfunc fact(n int) int {\n    if n <= 1 {\n        return 1       // base case\n    }\n    return n * fact(n-1)   // recursive case\n}\n```\n\n## The overlap problem\n\nNaive Fibonacci recomputes the same values over and over:\n\n```go\nfunc fib(n int) int {\n    if n < 2 { return n }\n    return fib(n-1) + fib(n-2)   // exponential: fib(n-2) computed twice, and so on\n}\n```\n\n## Dynamic programming (bottom-up)\n\nSolve each subproblem once, smallest first, and store it in a table:\n\n```go\nif n == 0 {\n    return 0 // base case first: dp[1] below would be out of range for n == 0\n}\ndp := make([]int, n+1)\ndp[1] = 1\nfor i := 2; i <= n; i++ {\n    dp[i] = dp[i-1] + dp[i-2]   // each entry filled once\n}\nreturn dp[n]\n```\n\nThe exponential recursion becomes a linear loop. The recipe generalises: define the\nsubproblem, find the recurrence (how an answer builds from smaller ones), pick the base cases,\nand fill the table from the bottom up.\n"},{"kind":"drill","id":"d1-factorial","title":"Factorial by recursion","points":10,"difficulty":20,"intro":"Factorial is the gentlest recursion: a base case at 1 and a single smaller call. The answer\nfor 5 is a fixed 120.\n","prompt":"Compute 5! recursively.\n\n**Why:** factorial shows the two essential parts of any recursion — a base case to stop and a\nrecursive case that shrinks the input — with no overlap to worry about.\n","target":"package main\n\nimport \"fmt\"\n\nfunc fact(n int) int {\n    if n <= 1 {\n        return 1\n    }\n    return n * fact(n-1)\n}\n\nfunc main() {\n    fmt.Println(fact(5))\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","`fact` computes n! recursively.","Base case: 0! and 1! are 1.","Return 1.","Closes the base case.","Recursive case: n times (n-1)!.","Closes `fact`.","","Opens `main`.","Prints `120` — that is 5!.","Closes `main`."],"explanation":"`fact` stops at `n <= 1` (the base case) and otherwise multiplies `n` by `fact(n-1)`. Unwinding\n5*4*3*2*1 gives 120. No subproblem repeats, so plain recursion is already efficient here.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d2-fib-naive","title":"Naive recursive Fibonacci","points":10,"difficulty":20,"intro":"Fibonacci branches into two recursive calls, which recompute the same values repeatedly. It\nstill returns the right answer (fib(10) = 55) — just with wasteful, exponential work.\n","prompt":"Compute fib(10) with the naive two-branch recursion.\n\n**Why:** this is the textbook example of overlapping subproblems — correct but exponential —\nand the motivation for dynamic programming in the next drill.\n","target":"package main\n\nimport \"fmt\"\n\nfunc fib(n int) int {\n    if n < 2 {\n        return n\n    }\n    return fib(n-1) + fib(n-2)\n}\n\nfunc main() {\n    fmt.Println(fib(10))\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","`fib` computes the nth Fibonacci number naively.","Base cases: fib(0)=0 and fib(1)=1.","Return n itself.","Closes the base case.","Recursive case — recomputes overlapping subproblems (exponential work).","Closes `fib`.","","Opens `main`.","Prints `55` — that is fib(10).","Closes `main`."],"explanation":"Each call spawns two more, and the same `fib(k)` is recomputed across branches, so the work\ngrows exponentially. The result is correct — fib(10) = 55 — but the method is wasteful, which\nis exactly what dynamic programming repairs.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d3-fib-dp","title":"Fibonacci with bottom-up DP","points":10,"difficulty":20,"intro":"Fill a table from the bottom up: each entry is the sum of the two before it, computed once.\nSame answer as the naive version — fib(10) = 55 — in linear time.\n","prompt":"Compute fib(10) by filling a DP table from the bottom up.\n\n**Why:** solving each subproblem once and storing it turns the exponential recursion into a\nsingle linear pass — the core idea of dynamic programming.\n","target":"package main\n\nimport \"fmt\"\n\nfunc fib(n int) int {\n    dp := make([]int, n+1)\n    dp[0] = 0\n    if n >= 1 {\n        dp[1] = 1\n    }\n    for i := 2; i <= n; i++ {\n        dp[i] = dp[i-1] + dp[i-2]\n    }\n    return dp[n]\n}\n\nfunc main() {\n    fmt.Println(fib(10))\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","`fib` computes the nth Fibonacci number with bottom-up DP.","A table holding fib(0)..fib(n).","Seed fib(0) = 0.","If n is at least 1...","...seed fib(1) = 1.","Closes the guard.","Fill the table from the bottom up...","...each entry is the sum of the two before it (each solved once).","Closes the fill loop.","The answer is the last table entry.","Closes `fib`.","","Opens `main`.","Prints `55` — same result as the naive version, far less work.","Closes `main`."],"explanation":"The table `dp` stores each Fibonacci number once, smallest first, so `dp[i] = dp[i-1] + dp[i-2]`\nnever recomputes. The guard handles small `n` safely. fib(10) is `dp[10] = 55`, in O(n) time\nand O(n) space instead of exponential.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch20-coinchange","title":"Implement CoinChange","points":40,"difficulty":20,"intro":"The coin-change problem is a dynamic-programming classic: given coin denominations, make an\namount using as few coins as possible. Build the answer bottom-up, one amount at a time, and\nreport -1 when the amount cannot be made.\n","instructions":"## Your turn\n\nImplement the function `CoinChange`:\n\n```go\nfunc CoinChange(coins []int, amount int) int { ... }\n```\n\nReturn the **fewest** coins from `coins` (each usable any number of times) that sum exactly to\n`amount`, or `-1` if it cannot be made. `amount` 0 needs 0 coins.\n\nExamples:\n\n- `CoinChange([]int{1, 2, 5}, 11)` -> `3`  (5 + 5 + 1)\n- `CoinChange([]int{2}, 3)` -> `-1`\n- `CoinChange([]int{1, 2, 5}, 0)` -> `0`\n- `CoinChange([]int{1, 3, 4}, 6)` -> `2`  (3 + 3, not 4 + 1 + 1)\n\n**Hint:** let `dp[x]` be the fewest coins for amount `x`, with `dp[0] = 0` and every other\nentry starting at \"infinity\". For each `x` from 1 to `amount`, try every coin `c <= x`:\n`dp[x] = min(dp[x], dp[x-c] + 1)`. If `dp[amount]` is still infinite, return -1.\n\nHidden tests decide correctness.\n","starter":"package student\n\n// CoinChange returns the fewest coins that sum to amount, or -1 if impossible.\nfunc CoinChange(coins []int, amount int) int {\n\tpanic(\"todo\")\n}\n","tests":"package student\n\nimport \"testing\"\n\nfunc TestCoinChangeBasic(t *testing.T) {\n\tif got := CoinChange([]int{1, 2, 5}, 11); got != 3 {\n\t\tt.Fatalf(\"CoinChange([1 2 5], 11) = %d, want 3\", got)\n\t}\n}\n\nfunc TestCoinChangeImpossible(t *testing.T) {\n\tif got := CoinChange([]int{2}, 3); got != -1 {\n\t\tt.Fatalf(\"CoinChange([2], 3) = %d, want -1\", got)\n\t}\n}\n\nfunc TestCoinChangeZero(t *testing.T) {\n\tif got := CoinChange([]int{1, 2, 5}, 0); got != 0 {\n\t\tt.Fatalf(\"CoinChange([1 2 5], 0) = %d, want 0\", got)\n\t}\n}\n\nfunc TestCoinChangeGreedyTrap(t *testing.T) {\n\tif got := CoinChange([]int{1, 3, 4}, 6); got != 2 {\n\t\tt.Fatalf(\"CoinChange([1 3 4], 6) = %d, want 2\", got)\n\t}\n}\n\nfunc TestCoinChangeSingleCoin(t *testing.T) {\n\tif got := CoinChange([]int{1}, 5); got != 5 {\n\t\tt.Fatalf(\"CoinChange([1], 5) = %d, want 5\", got)\n\t}\n}\n","entry":"CoinChange","gabarito":{"time":"O(amount * len(coins))","space":"O(amount)","solution":"package student\n\nfunc CoinChange(coins []int, amount int) int {\n\tif amount < 0 {\n\t\treturn -1\n\t}\n\tconst inf = 1 << 30\n\tdp := make([]int, amount+1)\n\tfor i := 1; i <= amount; i++ {\n\t\tdp[i] = inf\n\t\tfor _, c := range coins {\n\t\t\tif c > 0 && c <= i && dp[i-c]+1 < dp[i] {\n\t\t\t\tdp[i] = dp[i-c] + 1\n\t\t\t}\n\t\t}\n\t}\n\tif dp[amount] >= inf {\n\t\treturn -1\n\t}\n\treturn dp[amount]\n}\n","justification":"`dp[x]` is the fewest coins for amount `x`. The outer loop runs `amount` times, the inner over\nevery coin, giving **O(amount * len(coins))** time and **O(amount)** space. Each `dp[x]` is\nbuilt from already-solved smaller amounts (`dp[x-c]`), so a bottom-up pass fills the table once.\n`dp[0]` stays 0 (base case), and an entry still at infinity means that amount is unreachable, so\n`dp[amount]` infinite returns -1. Trying every coin — not the largest greedily — is what makes\n`[1 3 4]` for 6 yield 2 (3+3) rather than 3.\n"}}]}]}};

  if(cur===id)show(TB.length?TB[Math.max(0,i-1)].id:null);else drawTabs();}
function stepTab(d){if(!TB.length)return;const i=TB.findIndex(t=>t.id===cur);show(TB[(i+d+TB.length)%TB.length].id);}

/* editor de ficheiros */
VIEW.file=(t,host)=>{const f=FS[t.path];host.innerHTML=`<div class="ed"><div class="ed-gut" id="ed-gut"></div><div class="ed-wrap"><div class="ed-hl" id="ed-hl"></div><textarea id="ed-ta" class="ed-ta" spellcheck="false" wrap="off" autocomplete="off" autocapitalize="off"></textarea></div></div>`;
  const ta=$('#ed-ta');ta.value=f.content;paintEd(t.path);
  ta.oninput=()=>{f.content=ta.value;paintEd(t.path);clearTimeout(ta._t);ta._t=setTimeout(()=>refresh(true),180);};
  ta.onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();if(!document.execCommand('insertText',false,'    '))ta.setRangeText('    ',ta.selectionStart,ta.selectionEnd,'end');ta.oninput();}};
  ta.onkeyup=ta.onclick=ta.onfocus=()=>stPos();};
function paintEd(p){const f=FS[p],lines=f.content.split('\n'),dg={},ext=extOf(p);diagnostics().forEach(d=>{if(d.p===p&&dg[d.line]!=='e')dg[d.line]=d.sev;});
  $('#ed-gut').innerHTML=lines.map((_,i)=>`<div${dg[i+1]?` class="g-${dg[i+1]}"`:''}>${i+1}</div>`).join('');
  $('#ed-hl').innerHTML=lines.map((l,i)=>`<div class="l${dg[i+1]?' d-'+dg[i+1]:''}">${hlLine(l,ext)||' '}</div>`).join('');
  const mm=$('#minimap');mm.classList.remove('hidden');$('#ebody').classList.add('with-mm');
  mm.innerHTML='<div class="mm-view"></div>'+lines.slice(0,120).map((l,i)=>`<div class="mm-line${dg[i+1]==='e'?' err':''}" style="width:${l.trim()?Math.max(6,Math.min(52,l.length*.9)):0}px"></div>`).join('');}
function gotoLine(n){const ta=$('#ed-ta');if(!ta)return;const ls=ta.value.split('\n');n=Math.max(1,Math.min(ls.length,n|0));let o=0;for(let i=0;i<n-1;i++)o+=ls[i].length+1;ta.focus({preventScroll:true});ta.setSelectionRange(o,o+ls[n-1].length);$('#ebody').scrollTop=Math.max(0,(n-1)*22-90);stPos();}
function stPos(){const ta=$('#ed-ta'),el=$('#st-pos');if(!ta){el.textContent='';return;}const b=ta.value.slice(0,ta.selectionStart).split('\n');el.textContent=`Ln ${b.length}, Col ${b[b.length-1].length+1}`;}
function stLang(){const t=tabOf(cur);$('#st-lang').textContent=t&&t.path?(LANG[extOf(t.path)]||'Texto'):'';stPos();}
function edCmd(c){const ta=$('#ed-ta');if(!ta){toast('Abre um ficheiro primeiro');return;}ta.focus();if(c==='selectAll')ta.select();else if(c==='line'){const b=ta.value.slice(0,ta.selectionStart).split('\n').length;gotoLine(b);}else{document.execCommand(c);ta.oninput();}}
function selText(){const ta=$('#ed-ta');return ta?ta.value.slice(ta.selectionStart,ta.selectionEnd):'';}

/* diff */
function diffLines(a,b){const A=a?a.split('\n'):[],B=b?b.split('\n'):[],n=A.length,m=B.length,L=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const out=[];let i=0,j=0;while(i<n&&j<m){if(A[i]===B[j]){out.push([' ',A[i],i+1,j+1]);i++;j++;}else if(L[i+1][j]>=L[i][j+1]){out.push(['-',A[i],i+1,'']);i++;}else{out.push(['+',B[j],'',j+1]);j++;}}
  while(i<n){out.push(['-',A[i],i+1,'']);i++;}while(j<m){out.push(['+',B[j],'',j+1]);j++;}return out;}
function diffStat(a,b){const d=diffLines(a,b);return{add:d.filter(x=>x[0]==='+').length,del:d.filter(x=>x[0]==='-').length};}
VIEW.diff=(t,host)=>{const a=t.fixed?t.a:(FS[t.path]?FS[t.path].orig:''),b=t.fixed?t.b:(FS[t.path]?FS[t.path].content:''),d=diffLines(a,b),ext=extOf(t.path),s=diffStat(a,b);
  host.innerHTML=`<div class="diff"><div class="diff-h"><b style="color:var(--fg)">${short(t.path)}</b><span class="tag">${esc(t.label||'HEAD ↔ área de trabalho')}</span><span style="color:var(--green)">+${s.add}</span><span style="color:var(--red)">−${s.del}</span><button class="mini" onclick="openPath('${t.path}')">Abrir ficheiro</button></div>${d.length?d.map(x=>`<div class="dl ${x[0]==='+'?'add':x[0]==='-'?'del':''}"><span class="n">${x[2]}</span><span class="n">${x[3]}</span><span class="s">${x[0]}</span><span>${hlLine(x[1],ext)||' '}</span></div>`).join(''):'<div class="sec-empty">Sem diferenças.</div>'}</div>`;};
function openDiff(p,a,b,label){const fixed=a!==undefined;openTab({id:(fixed?'prop:':'diff:')+p,title:p.split('/').pop()+(fixed?' (proposta)':' (diff)'),kind:'diff',path:p,fixed,a,b,label});}

/* ───── actualização global ───── */
let SIG='';
function refresh(fromEd,force){const sig=Object.keys(FS).map(p=>p+stOf(p)).join('|');
  TB.filter(t=>t.kind==='file'&&!FS[t.path]).forEach(t=>{TB.splice(TB.indexOf(t),1);if(cur===t.id)cur=null;});
  if(sig!==SIG||force){SIG=sig;syncTree();buildExplorer();}
  drawProblems();badges();if(RP[PANE]&&PANE!=='search')RP[PANE]();hydrate();
  if(!fromEd){const t=tabOf(cur);if(!t)show(TB.length?TB[TB.length-1].id:null);else if(t.kind==='file'){const ta=$('#ed-ta'),top=$('#ebody').scrollTop;if(ta&&ta.value!==FS[t.path].content){ta.value=FS[t.path].content;}if(ta){paintEd(t.path);$('#ebody').scrollTop=top;}drawTabs();}else if(t.kind==='diff'||t.kind==='manager'){const top=$('#ebody').scrollTop;show(cur);$('#ebody').scrollTop=top;}else drawTabs();}
  else if(tabOf(cur)&&tabOf(cur).kind==='file')paintEd(tabOf(cur).path);drawOutline();}
function badges(){const set=(p,v)=>{const b=$(`.act[data-pane="${p}"] .badge`);if(b){b.textContent=v;b.style.display=v?'grid':'none';}};set('scm',changes().length||'');set('codev',typeof RUN!=='undefined'&&RUN.active?'●':'');}

const RP={};
function buildActivity(){const bar=$('#activity');bar.innerHTML='';ACTS.forEach(a=>{const el=document.createElement('button');el.className='act'+(a.spacer?' spacer':'');el.title=a.title;el.dataset.pane=a.pane||'';el.innerHTML=svg(a.ic)+`<span class="badge${a.acc?' acc':''}" style="display:none"></span>`;
  el.onclick=e=>{e.stopPropagation();a.overflow?openOverflow(el):setPane(a.pane,true);};bar.appendChild(el);});}
const sideOpen=()=>getVar('--side-w')!=='0px';
function setPane(p,tgl){if(p==='settings'){openSettings();return;}if(tgl===true&&PANE===p&&sideOpen()){toggleSide();return;}if(!sideOpen())toggleSide();PANE=p;
  $$('.act').forEach(a=>a.classList.toggle('on',a.dataset.pane===p));$$('.pane').forEach(x=>x.classList.remove('show'));const pe=$('#pane-'+p);if(pe)pe.classList.add('show');if(RP[p])RP[p]();hydrate();}

function togglePanel(){const o=getVar('--panel-h')!=='0px';setVar('--panel-h',o?'0px':'230px');$('#tgl-panel').classList.toggle('on',!o);}
const hd=(t,acts)=>`<div class="side-hd"><span class="t">${t}</span><span class="acts">${acts||''}</span></div>`;

RP.search=()=>{const el=$('#pane-search');if(!el.dataset.b){el.dataset.b=1;el.innerHTML=hd('Pesquisa')+`<div class="sections"><input class="inp" id="s-q" placeholder="Procurar em todos os ficheiros"><input class="inp" id="s-r" placeholder="Substituir por…"><button class="btn ghost" onclick="replaceAll()">Substituir tudo</button><div id="s-res"></div></div>`;$('#s-q').oninput=doSearch;}doSearch();};
function doSearch(){const q=$('#s-q').value,res=$('#s-res');if(!q){res.innerHTML='<div class="sec-empty">Escreve para procurar no workspace dxtutor.</div>';return;}const lq=q.toLowerCase();let n=0,files=0,h='';
  Object.keys(FS).sort().forEach(p=>{const hits=[];FS[p].content.split('\n').forEach((l,i)=>{const k=l.toLowerCase().indexOf(lq);if(k>=0)hits.push([i+1,l,k]);});if(!hits.length)return;files++;n+=hits.length;
    h+=`<div class="row" style="padding-left:8px" onclick="openPath('${p}')">${fIcon(p)}<span class="nm">${esc(p.split('/').pop())}</span><span class="deco" style="color:var(--fg-muted)">${hits.length}</span></div>`+hits.slice(0,30).map(x=>`<div class="s-hit" onclick="openPath('${p}',${x[0]})"><span class="n">${x[0]}</span><span>${esc(x[1].slice(Math.max(0,x[2]-18),x[2]))}<mark>${esc(x[1].substr(x[2],q.length))}</mark>${esc(x[1].slice(x[2]+q.length,x[2]+q.length+60))}</span></div>`).join('');});
  res.innerHTML=`<div class="sec-empty"><b style="color:var(--accent-hover)">${n}</b> resultados em <b style="color:var(--accent-hover)">${files}</b> ficheiros</div><div class="tree">${h}</div>`;}
function replaceAll(){const q=$('#s-q').value,r=$('#s-r').value;if(!q){toast('Indica o texto a procurar');return;}let n=0;Object.keys(FS).forEach(p=>{const c=FS[p].content;if(c.includes(q)){n+=c.split(q).length-1;FS[p].content=c.split(q).join(r);}});refresh();doSearch();toast(n?`${n} ocorrências substituídas`:'Nada para substituir');}

RP.scm=()=>{const el=$('#pane-scm'),ch=changes(),st=ch.filter(p=>STAGED.has(p)),un=ch.filter(p=>!STAGED.has(p));
  const row=(p,staged)=>`<div class="scm-row" onclick="openDiff('${p}')">${fIcon(p)}<span class="nm">${esc(p.split('/').pop())}</span><span class="pth">${esc(short(p).split('/').slice(0,-1).join('/'))}</span><span class="ra"><button title="Abrir ficheiro" onclick="event.stopPropagation();openPath('${p}')">↗</button><button title="Descartar alterações" onclick="event.stopPropagation();discard('${p}')">↶</button><button title="${staged?'Retirar do stage':'Stage'}" onclick="event.stopPropagation();stage('${p}')">${staged?'−':'+'}</button></span><span class="g ${stOf(p)}">${stOf(p)}</span></div>`;
  el.innerHTML=hd('Source Control',`<button title="Actualizar" onclick="refresh()">${svg('refresh')}</button>`)+`<div class="sections"><div class="scm-grp">dxtutor · ${esc(BRANCH)}<span class="cnt">${ch.length}</span></div>
    <input class="inp" id="scm-msg" placeholder="Mensagem de commit" value="${esc(COMMIT_MSG)}"><button class="btn" onclick="commit()">✓ Commit${st.length?' (staged)':''} em ${esc(BRANCH)}</button>
    ${st.length?`<div class="scm-grp">Staged<span class="cnt">${st.length}</span></div>`+st.map(p=>row(p,1)).join(''):''}
    <div class="scm-grp">Alterações<span class="cnt">${un.length}</span></div>${un.map(p=>row(p,0)).join('')||'<div class="sec-empty">Área de trabalho limpa.</div>'}
    <div class="scm-grp">Commits</div>${COMMITS.slice(0,6).map(c=>`<div class="s-hit" style="padding-left:12px;cursor:default"><span style="color:var(--accent-hover)">${c.h}</span><span>${esc(c.m)}</span></div>`).join('')}</div>`;
  const i=$('#scm-msg');i.oninput=()=>COMMIT_MSG=i.value;i.onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))commit();};};
function stage(p){STAGED.has(p)?STAGED.delete(p):STAGED.add(p);RP.scm();}
function discard(p){const f=FS[p];if(f.orig==null)delete FS[p];else f.content=f.orig;STAGED.delete(p);refresh();toast('Alterações descartadas: '+p.split('/').pop());}
function commit(msg){msg=msg||COMMIT_MSG.trim();const list=(STAGED.size?[...STAGED]:changes()).filter(p=>FS[p]&&stOf(p));if(!list.length){toast('Nada para commitar');return null;}if(!msg){toast('Escreve a mensagem de commit');goPane('scm');const i=$('#scm-msg');if(i)i.focus();return null;}
  list.forEach(p=>{FS[p].orig=FS[p].content;});STAGED.clear();COMMIT_MSG='';const c={h:Math.random().toString(16).slice(2,9),m:msg,n:list.length};COMMITS.unshift(c);refresh(false,true);drawTimeline();toast(`Commit ${c.h} · ${list.length} ficheiro(s)`);return c;}
function pickBranch(){palette('',{ph:'Mudar de ramo…',items:BRANCHES.map(b=>({l:b,d:b===BRANCH?'actual':'',run:()=>{BRANCH=b;$('#st-branch-l').textContent=b;refresh();termRefreshPrompt();toast('Ramo: '+b);}}))});}

RP.run=()=>{$('#pane-run').innerHTML=hd('Run and Debug')+`<div class="sections"><div class="sec-empty">Configurações de arranque do workspace. Cada uma corre no terminal integrado.</div>${[['cargo build','Compilar todos os crates'],['cargo test','Correr todos os testes'],['cargo test -p lexer','Testes do lexer'],['cargo test -p store','Testes do store'],['dx lint','Lint do Design System'],['npm run dev','Servidor de desenvolvimento']].map(c=>`<div class="scm-row" onclick="runTask('${c[0]}')"><span class="ic" style="color:var(--green)">${svg('run')}</span><span class="nm">${c[0]}</span><span class="pth">${c[1]}</span></div>`).join('')}</div>`;};

RP.ext=()=>{$('#pane-ext').innerHTML=hd('Extensions')+`<div class="sections"><div class="scm-grp">Provedores de LLM<span class="cnt">${Object.values(PROV).filter(p=>p.on).length}/4</span></div>${Object.entries(PROV).map(([k,p])=>`<div class="scm-row" onclick="toggleProv('${k}')"><span class="pdot${p.on?'':' off'}" style="background:${p.col}"></span><span class="nm">${p.name}</span><span class="pth">${p.vendor}</span><span class="sw${p.on?' on':''}" style="margin-left:auto"></span></div>`).join('')}
  <div class="scm-grp">Linguagem e qualidade<span class="cnt">4</span></div>${[['rust','rust-analyzer','diagnósticos Rust'],['shield','Design System Lint','dx lint'],['test','Test Explorer','cargo test'],['check','Spell Checker','pt-AO (pré-AO90)']].map(e=>`<div class="scm-row" style="cursor:default"><span class="ic">${svg(e[0])}</span><span class="nm">${e[1]}</span><span class="pth">${e[2]}</span></div>`).join('')}<button class="btn ghost" onclick="openSettings()">Configurar provedores…</button></div>`;};
RP.remote=()=>{$('#pane-remote').innerHTML=hd('Remote Explorer')+`<div class="sections"><div class="scm-grp">Local</div><div class="scm-row" style="cursor:default"><span class="pdot" style="background:var(--green)"></span><span class="nm">delonix</span><span class="pth">ligado · este protótipo</span></div><div class="scm-grp">SSH</div>${['kaeso-preprod','ngolacloud-cp-01'].map(h=>`<div class="scm-row" onclick="toast('${h}: ligação remota não disponível no protótipo')"><span class="pdot off"></span><span class="nm">${h}</span><span class="pth">desligado</span></div>`).join('')}<div class="sec-empty">Ligações remotas reais dependem do backend da aplicação.</div></div>`;};

   <div class="scm-grp">Routing</div>${Object.keys(ROUTE).map(r=>`<div class="kv"><span class="pdot" style="background:${PROV[provFor(r)].col}"></span>${ROLE[r]}<span class="v">${PROV[provFor(r)].name}</span></div>`).join('')}</div>`;};

/* ───── painel inferior ───── */
function log(src,msg){const o=$('#pc-output');o.insertAdjacentHTML('beforeend',`<div>[${hhmm()}] <span class="r">${esc(src)}</span> ${esc(msg)}</div>`);o.scrollTop=o.scrollHeight;}

/* ───── terminal (comandos ligados ao estado real) ───── */
function promptHTML(){return `<span class="pr"><span>${USER}</span><span class="at">@</span><span>${HOST}</span><span class="at">:</span><span class="pth">${CWD.join('/')}</span><span class="br"> (${esc(BRANCH)})</span><span class="at">$</span></span> `;}
function newInput(nofocus){const t=$('#term'),old=$('#inputwrap');if(old)old.remove();const w=document.createElement('div');w.id='inputwrap';w.className='line inputline';w.innerHTML=promptHTML()+'<input id="cmd" autocomplete="off" spellcheck="false"/>';t.appendChild(w);const c=$('#cmd');c.onkeydown=onKey;if(!nofocus)c.focus({preventScroll:true});scrollTerm();}
function termRefreshPrompt(){const c=$('#cmd'),v=c?c.value:'';newInput(true);$('#cmd').value=v;}
function termExec(v){echoCmd(v);const[cmd,...a]=v.trim().split(/\s+/);let r=null;if(XC[cmd])r=XC[cmd](a,v);else echo('<span class="er">'+esc(cmd)+': comando não encontrado</span>');newInput(true);return r;}
const XC={
  help(){echo(`<span class="ac">ficheiros</span>  <span class="ok">ls</span> <span class="ok">cd</span> <span class="ok">pwd</span> <span class="ok">cat</span> <span class="ok">tree</span>\n<span class="ac">git</span>        <span class="ok">git</span> status | add . | commit -m "msg" | log | branch | checkout &lt;ramo&gt; | diff | push\n<span class="ac">build</span>      <span class="ok">cargo</span> build | test [-p lexer|store] | run     <span class="ok">npm</span> run dev\n<span class="ac">co-dev</span>     <span class="ok">dx</span> lint | status | modo manual|assist|auto | missao a|b\n<span class="ac">outros</span>     <span class="ok">echo</span> <span class="ok">whoami</span> <span class="ok">date</span> <span class="ok">neofetch</span> <span class="ok">history</span> <span class="ok">clear</span>`);},
  cat(a){if(!a[0]){echo('<span class="er">cat: falta o ficheiro</span>');return;}const rel=CWD.slice(4).concat(a[0].split('/')).join('/');const p=FS[rel]?rel:Object.keys(FS).find(k=>k.endsWith('/'+a[0].split('/').pop()));if(!p){echo('<span class="er">cat: '+esc(a[0])+': não encontrado</span>');return;}echo(FS[p].content.split('\n').map(l=>hlLine(l,extOf(p))).join('\n'));},
  git(a,raw){const s=a[0],ch=changes();
    if(s==='status'){if(!ch.length){echo(`No ramo <span class="ac">${esc(BRANCH)}</span>\nnada para commitar, área de trabalho limpa`);return{ok:true};}
      echo(`No ramo <span class="ac">${esc(BRANCH)}</span>`+(STAGED.size?`\n<span class="dim">Staged:</span>\n`+[...STAGED].map(p=>`  <span class="ok">${stOf(p)==='U'?'new file:':'modified:'}   ${short(p)}</span>`).join('\n'):'')+`\n<span class="dim">Alterações:</span>\n`+ch.filter(p=>!STAGED.has(p)).map(p=>stOf(p)==='U'?`  <span class="er">untracked:  ${short(p)}</span>`:`  <span class="warn">modified:</span>   ${short(p)}`).join('\n'));}
    else if(s==='add'){ch.forEach(p=>STAGED.add(p));refresh();echo(`<span class="dim">${ch.length} ficheiro(s) em stage</span>`);}

function fuzzy(q,s){q=q.toLowerCase();s=s.toLowerCase();let i=0;for(const c of s){if(c===q[i])i++;if(i===q.length)return true;}return!q.length;}
function palDraw(){const q=$('#pal-in').value;

  const on=$('#pal-list .on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest'});}
let PAL_TEXT=()=>{};

    phase(1,'Entender requisitos');const c=card(who('plan'),'<p><span class="spin"></span> A ler as regras do projecto, os ADRs e o código relevante…</p>');for(const p of S.reads)await doTool({t:'read',p},c.tools);use(provFor('plan'),4200);
    c.bd.innerHTML=`<p>${S.understand}</p>${S.reqs.map(r=>`<div class="req"><b>${r.t}</b>${r.ac.map(a=>`<div class="ac">${a}</div>`).join('')}</div>`).join('')}`;scrollMsgs();await beat(500);
    phase(2,'Clarificar');for(const q of S.questions)await decideQ(q,M);
    const pick=await council(S,M);
    phase(4,'Planear e executar');await execSteps(pick.steps||S.steps,'Plano · '+pick.title,true);
    let ev=await evaluate(S,M,false);
    while(!ev.ok&&M.retries<2){M.retries++;await reflect(S,M,ev);ev=await evaluate(S,M,true);}
    if(!ev.ok){phase(8,'Pedir orientação');card(who('plan'),`<p>Depois de 2 tentativas a avaliação continua em <b>${ev.score}/100</b>. Em vez de insistir, paro aqui.</p>${ev.fails.map(k=>`<div class="fixl"><b>✗ ${k.l}</b><span>${k.cause}</span></div>`).join('')}<p style="margin-top:8px">Diz-me como queres avançar, ou restaura o checkpoint inicial no Gestor de missões.</p>`);M.state='bloqueada';note('Missão bloqueada: '+S.title);}
    else{phase(8,'Entregar');checkpoint('Entrega · '+S.title);const ass=M.decs.filter(d=>d.status==='pressuposto');
      const d=card(who('plan'),`<p><b>${S.title}</b> — concluído com auto-avaliação <b style="color:var(--green)">${ev.score}/100</b>${M.retries?`, depois de ${M.retries} correcção(ões) feita(s) por mim`:''}.</p><ul>${S.done.map(x=>`<li>${x}</li>`).join('')}</ul>${ass.length?`<p><span class="tag warn">pressuposto a rever</span> ${ass.map(a=>a.q+' → <b>'+a.choice+'</b>').join('; ')}</p>`:''}<p style="color:var(--fg-dim)">${M.decs.length} decisões registadas · ${M.files.size} ficheiro(s) alterado(s).</p><div class="gate"><button class="gb" onclick="goPane('scm')">Ver alterações</button><button class="gb" onclick="openManager()">Registo de decisões</button></div>`);
      const doC=MODE==='auto'?1:await ask(d.bd,[{l:'Fazer commit',v:1,pri:1,done:'✓ commit aprovado por ti'},{l:'Deixar por commitar',v:0,done:'fica por commitar'}]);
      if(doC){STAGED.clear();M.files.forEach(p=>{if(stOf(p))STAGED.add(p);});const k=commit(S.commit);if(k)d.bd.insertAdjacentHTML('beforeend',`<p>Commit <code>${k.h}</code> ${MODE==='auto'?'feito automaticamente':'feito'}: <code>${esc(S.commit)}</code>. O <code>git push</code> fica contigo — exige sempre aprovação humana.</p>`);}
      await gfAsk(d.bd,M);M.state='concluída';note('Missão concluída: '+S.title+' ('+ev.score+'/100)');}
  }catch(e){if(e!==STOP){console.error(e);card('sistema','Erro inesperado: '+esc(e.message||e));}else card('co-dev','Execução parada a teu pedido. O que já foi alterado continua nos ficheiros; podes restaurar o checkpoint inicial no Gestor de missões.');M.state=e===STOP?'parada':'erro';}
  finally{AUTHOR='w';M.dur=Math.round((Date.now()-M.t0)/1000);runState(false);refresh();scrollMsgs();}}

/* ───── conversa livre: Claude ao vivo com ferramentas sobre o workspace ───── */
function handlePrompt(q){if(RUN.active){toast('Há uma execução em curso — pára-a ou espera');return;}focusAgent(true);
  if(q==='/test'||q==='/lint'){user(q);const r=runTask(q==='/test'?'cargo test':'dx lint');card('co-dev',`<code>${q==='/test'?'cargo test':'dx lint'}</code> → ${r&&r.ok?'✓':'✖'} ${esc(r?r.sum:'')}`);return;}
  const S=SCN.find(s=>s.match.test(q));if(S)runMission(S,q);else liveChat(q);}
function agSend(){const i=$('#ag-input'),q=i.value.trim();if(!q)return;i.value='';handlePrompt(q);}
async function liveChat(q){user(q);const P=PROV[ACTIVE];
  if(!P.on){card('sistema',`<b>${P.name}</b> está desligado. Liga-o nas Definições ou escolhe outro modelo.`);return;}
  if(ACTIVE!=='claude'){card('sistema',`<b>${P.name}</b> está <b>simulado</b> neste protótipo: a página não pode chamar ${esc(P.ep)}. Para uma resposta real muda para Claude, ou corre uma missão guionada:${demoChips}`);return;}
  if(!SAMPLE){card('sistema',`A ligação ao vivo ao Claude não está disponível nesta vista. As missões guionadas funcionam na mesma:${demoChips}`);return;}
  const t=tabOf(cur),af=CTX_ON&&t&&t.path&&FS[t.path]?t.path:null;
  const sys=`És o Co-Dev do dxtutor IDE: um co-programador sénior que entende requisitos, arquitectura, design system, padrões de projecto e base de dados. Trabalhas orientado por um programador humano.
Modo de autonomia actual: ${MODES[MODE].l}. Em modo Manual as tuas edições e comandos podem ser rejeitados pelo humano.
Tens ferramentas para listar, ler e escrever ficheiros do workspace, correr os testes e o lint do Design System. Lê antes de editar. write_file recebe o conteúdo COMPLETO do ficheiro. Depois de editar, corre run_tests e design_lint, avalia o teu próprio resultado e corrige se falhar (no máximo 2 tentativas).
Responde em português (ortografia pré-AO90), de forma curta e concreta. Usa markdown simples.

Regras do projecto:
${FS[ROOT+'.dxtutor/regras.md']?FS[ROOT+'.dxtutor/regras.md'].content:''}
Ficheiros do workspace:
${Object.keys(FS).map(short).join('\n')}
${af?`\nFicheiro activo (${short(af)}):\n${FS[af].content.slice(0,6000)}`:''}`;
  CHAT.push({role:'user',content:q});const sysA=sys+agentSys();const msgs=CHAT.slice(-9).map(m=>({...m}));while(msgs.length&&msgs[0].role!=='user')msgs.shift();msgs[0].content=sysA+'\n\n———\n\n'+msgs[0].content;
  const c=card(AGENTS[AGENT].n.toLowerCase()+' · claude ao vivo','<span class="spin"></span> a pensar…');runState(true,'Claude ao vivo');RUN.abort=new AbortController();
  const tools=[
    {name:'list_files',description:'Lista os caminhos de todos os ficheiros do workspace.',inputSchema:{type:'object',properties:{}},execute:async()=>{tl(c.tools,'list_files','');return Object.keys(FS).map(short);}},
    {name:'read_file',description:'Lê o conteúdo de um ficheiro do workspace.',inputSchema:{type:'object',properties:{path:{type:'string'}},required:['path']},execute:async({path})=>{const p=norm(path);if(!FS[p])throw new Error('ficheiro não existe: '+path);tl(c.tools,'read_file',short(p)).querySelector('.tr').innerHTML='<span class="okc">✓</span>';return FS[p].content;}},
    {name:'write_file',description:'Cria ou substitui um ficheiro com o conteúdo completo indicado. Pode exigir aprovação humana.',inputSchema:{type:'object',properties:{path:{type:'string'},content:{type:'string'}},required:['path','content']},execute:async({path,content})=>{harnessCheck(norm(path));const ok=await doTool({t:'edit',p:norm(path),content:String(content)},c.tools,'plan');if(!ok)throw new Error('edição rejeitada pelo humano');return'ok';}},
    {name:'run_tests',description:'Corre cargo test. Parâmetro opcional package: "lexer" ou "store".',inputSchema:{type:'object',properties:{package:{type:'string'}}},execute:async(i)=>{harnessCmd('cargo test');const r=await doTool({t:'run',cmd:'cargo test'+(i&&i.package?' -p '+i.package:'')},c.tools);return r?r.sum:'o humano não autorizou o comando';}},
    {name:'design_lint',description:'Corre o lint do Design System (cores fixas fora dos tokens).',inputSchema:{type:'object',properties:{}},execute:async()=>{harnessCmd('dx lint');const r=await doTool({t:'run',cmd:'dx lint'},c.tools);return r?r.sum:'o humano não autorizou o comando';}}];
  try{const r=await SAMPLE(msgs,{tools,signal:RUN.abort.signal,cache:false,onText:({text})=>{c.bd.innerHTML=md(text);scrollMsgs();}});
    c.bd.innerHTML=md(r.text||'(sem texto)');CHAT.push({role:'assistant',content:r.text||''});LIVE_OK=true;use('claude',Math.round((sys.length+q.length+(r.text||'').length)/4));
  }catch(e){CHAT.pop();const code=e&&e.code;c.bd.innerHTML=RUN.stop||e===STOP?'Resposta interrompida.':code==='not_granted'?'O acesso ao Claude não foi autorizado nesta página. As missões guionadas continuam disponíveis.':code==='rate_limited'?'Limite de pedidos atingido — tenta daqui a pouco.':'Não consegui obter resposta do Claude ('+esc((e&&e.message)||code||'erro')+').';}
  finally{runState(false);refresh();ctxPill();scrollMsgs();}}

  const row=(p,s)=>`<div class="scm-row" onclick="openDiff('${p}')">${fIcon(p)}<span class="nm">${esc(p.split('/').pop())}</span><span class="pth">${esc(short(p).split('/').slice(0,-1).join('/'))}</span><span class="ra"><button title="Abrir ficheiro" onclick="event.stopPropagation();openPath('${p}')">↗</button><button title="Descartar" onclick="event.stopPropagation();discard('${p}')">↶</button><button title="${s?'Retirar do stage':'Stage'}" onclick="event.stopPropagation();stage('${p}')">${s?'−':'+'}</button></span><span class="g ${stOf(p)}">${stOf(p)}</span></div>`;
  el.innerHTML=hd('Source Control',`<button title="Grafo de commits" onclick="openGraph()">${svg('graph')}</button><button title="Actualizar" onclick="refresh()">${svg('refresh')}</button>`)+`<div class="sections"><div class="scm-grp">dxtutor · ${esc(BRANCH)}<span class="cnt">${ch.length}</span></div>
    <input class="inp" id="scm-msg" placeholder="Mensagem de commit" value="${esc(COMMIT_MSG)}"><button class="btn" onclick="commit()">✓ Commit${st.length?' (staged)':''} em ${esc(BRANCH)}</button>
    ${st.length?`<div class="scm-grp">Staged<span class="cnt">${st.length}</span></div>`+st.map(p=>row(p,1)).join(''):''}<div class="scm-grp">Alterações<span class="cnt">${un.length}</span></div>${un.map(p=>row(p,0)).join('')||'<div class="sec-empty">Área de trabalho limpa.</div>'}
    <div class="scm-grp">Gitflow — próximo passo</div>${gfGuide()}
    <div class="scm-grp">Ramos<span class="cnt">${Object.keys(GIT.refs).length}</span></div>${Object.keys(GIT.refs).map(b=>{const r=lay.rows.find(x=>x.h===GIT.refs[b]);return `<div class="scm-row" onclick="checkout('${b}')"><span class="pdot" style="background:${LANE[(r?r.col:0)%LANE.length]}"></span><span class="nm" style="max-width:none${b===BRANCH?';font-weight:600':''}">${esc(b)}</span>${b===BRANCH?'<span class="tag acc" style="margin-left:auto">HEAD</span>':''}</div>`;}).join('')}
    <div class="scm-grp">Commits</div>${GIT.order.slice(0,7).map(h=>{const c=GIT.c[h],a=authorOf(c.a);return `<div class="s-hit" style="padding-left:12px" onclick="openGraph('${h}')" title="${esc(a.n)} · ${rel(c.t)}"><span class="pdot" style="background:${a.col}"></span><span style="color:var(--accent-hover)">${h}</span><span>${esc(c.m)}</span></div>`;}).join('')}<button class="btn ghost" onclick="openGraph()">Abrir grafo de commits</button></div>`;
  const i=$('#scm-msg');i.oninput=()=>COMMIT_MSG=i.value;i.onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))commit();};};
function graphLayout(){const lanes=[],rows=[],idx={};let max=1;
  GIT.order.forEach((h,i)=>{const c=GIT.c[h];let col=lanes.indexOf(h);if(col<0){col=lanes.indexOf(null);if(col<0)col=lanes.length;}
    lanes.forEach((x,k)=>{if(x===h)lanes[k]=null;});lanes[col]=null;const pl=[];
    c.p.forEach((ph,k)=>{let l;if(k===0){l=col;lanes[col]=ph;}else{l=lanes.indexOf(ph);if(l<0){l=lanes.indexOf(null);if(l<0)l=lanes.length;lanes[l]=ph;}}pl.push(l);});
    idx[h]=i;rows.push({h,col,pl});max=Math.max(max,lanes.length,col+1);});
  return{rows,idx,max};}
function openGraph(sel){if(sel)GSEL=sel;openTab({id:'graph',title:'Grafo de commits',kind:'graph'});}
VIEW.graph=(t,host)=>{const L=graphLayout(),W=18,H=32,X=c=>14+c*W,Y=i=>H/2+i*H,gw=28+L.max*W;let paths='',dots='';
  L.rows.forEach((r,i)=>{const c=GIT.c[r.h];c.p.forEach((ph,k)=>{const j=L.idx[ph];if(j==null)return;const pr=L.rows[j],x0=X(r.col),y0=Y(i),xl=X(r.pl[k]),xp=X(pr.col),y1=Y(j),col=LANE[(k===0?r.col:r.pl[k])%LANE.length];
      let d=`M${x0} ${y0}`;if(j===i+1)d+=x0===xp?`L${xp} ${y1}`:`C${x0} ${y0+H*.6} ${xp} ${y1-H*.6} ${xp} ${y1}`;
      else{d+=xl===x0?`L${xl} ${y0+H}`:`C${x0} ${y0+H*.6} ${xl} ${y0+H*.4} ${xl} ${y0+H}`;d+=`L${xl} ${y1-H}`;d+=xp===xl?`L${xp} ${y1}`:`C${xl} ${y1-H*.4} ${xp} ${y1-H*.6} ${xp} ${y1}`;}
      paths+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round"/>`;});
    const col=LANE[r.col%LANE.length],mg=c.p.length>1;dots+=`<circle cx="${X(r.col)}" cy="${Y(i)}" r="${mg?4:5}" fill="${mg?'var(--bg-editor)':col}" stroke="${col}" stroke-width="2"/>`;});
  const refsAt=h=>Object.keys(GIT.refs).filter(b=>GIT.refs[b]===h);
  host.innerHTML=`<div class="gl"><div class="gl-bar"><button class="mini" onclick="pickBranch()">⎇ ${esc(BRANCH)} ▾</button>${BRANCH==='develop'?`<button class="mini" onclick="gfPrompt('feature')">+ feature</button><button class="mini" onclick="gfPrompt('fix')">+ fix</button><button class="mini" onclick="gfPrompt('release')">+ release</button>`:isFlow(BRANCH)?`<button class="mini pri" onclick="gfFinish()">Finalizar ${esc(BRANCH)}</button>`:`<button class="mini" onclick="checkout('develop');rerender('graph')">Ir para develop</button>`}<span class="sp"></span><span style="color:var(--fg-muted);font-size:11.5px">${GIT.order.length} commits · ${Object.keys(GIT.refs).length} ramos</span></div>
   <div class="gl-body" style="--gw:${gw}px"><svg class="gl-svg" width="${gw}" height="${L.rows.length*H}">${paths}${dots}</svg>${L.rows.map((r,i)=>{const c=GIT.c[r.h],a=authorOf(c.a),col=LANE[r.col%LANE.length],sel=GSEL===r.h;
     return `<div class="gl-row${sel?' sel':''}" onclick="GSEL=GSEL==='${r.h}'?null:'${r.h}';rerender('graph')"><span class="gl-refs">${refsAt(r.h).map(b=>`<span class="gl-ref${b===BRANCH?' head':''}" style="--c:${col}">${b===BRANCH?'● ':''}${esc(b)}</span>`).join('')}${GIT.tags[r.h]?`<span class="gl-ref tagr">${GIT.tags[r.h]}</span>`:''}</span><span class="gl-msg">${esc(c.m)}</span><span class="gl-au"><i style="background:${a.col}">${a.n.charAt(0)}</i>${esc(a.n)}</span><span class="gl-h">${r.h}</span><span class="gl-t">${rel(c.t)}</span></div>`+(sel?`<div class="gl-det">${c.files.length?c.files.map(p=>`<button class="mini" onclick="event.stopPropagation();FS['${p}']?openPath('${p}'):toast('O ficheiro não existe neste ramo')">${esc(short(p))}</button>`).join(''):'<span style="color:var(--fg-muted)">Commit anterior ao protótipo — sem lista de ficheiros.</span>'}${c.p.length>1?`<span class="tag">merge de ${c.p.length} pais</span>`:''}</div>`:'');}).join('')}</div></div>`;};
XC.git=(a,raw)=>{const s=a[0],ch=changes();
  if(s==='status'){echo(`No ramo <span class="ac">${esc(BRANCH)}</span>\n`+(ch.length?ch.map(p=>stOf(p)==='U'?`  <span class="er">untracked:  ${short(p)}</span>`:`  <span class="warn">modified:</span>   ${short(p)}`).join('\n'):'nada para commitar, área de trabalho limpa'));return{ok:true};}
  if(s==='add'){ch.forEach(p=>STAGED.add(p));refresh();echo(`<span class="dim">${ch.length} ficheiro(s) em stage</span>`);return;}
  if(s==='commit'){const m=raw.match(/-m\s+(["'])(.*?)\1/)||raw.match(/-m\s+(.+)$/)||[],msg=(m[2]||m[1]||'').trim();if(!msg){echo('<span class="er">uso: git commit -m "mensagem"</span>');return;}const c=commit(msg);echo(c?`[${esc(BRANCH)} <span class="ac">${c.h}</span>] ${esc(msg)}`:'<span class="dim">nada para commitar</span>');return{ok:!!c};}
  if(s==='log'){const L=graphLayout();echo(L.rows.slice(0,14).map(r=>{const c=GIT.c[r.h],rf=Object.keys(GIT.refs).filter(b=>GIT.refs[b]===r.h);return `<span class="dim">${'│ '.repeat(r.col)}${c.p.length>1?'◆':'●'}</span> <span class="ac">${r.h}</span>${rf.length?` <span class="ok">(${rf.join(', ')})</span>`:''} ${esc(c.m)}`;}).join('\n'));return;}
  if(s==='branch'){echo(Object.keys(GIT.refs).map(b=>b===BRANCH?`<span class="ok">* ${b}</span>`:'  '+b).join('\n'));return;}
  if(s==='checkout'){const nb=a[1]==='-b',b=nb?a[2]:a[1];if(!b){echo('<span class="er">uso: git checkout [-b] &lt;ramo&gt;</span>');return;}echo(checkout(b,nb)?`Mudou para o ramo '${esc(b)}'`:'<span class="er">não foi possível mudar para '+esc(b)+'</span>');rerender('graph');return;}
  if(s==='merge'){const m=a[1]&&gitMerge(a[1]);echo(m?`Merge feito: <span class="ac">${m.h}</span> ${esc(m.m)}`:'<span class="er">uso: git merge &lt;ramo&gt;</span>');rerender('graph');return{ok:!!m};}
  if(s==='flow'){if(a[2]==='start'&&a[3]){gfStart(a[1],a[3]);echo(`Ramo <span class="ac">${esc(BRANCH)}</span> criado`);}else if(a[2]==='finish'){const m=gfFinish();echo(m?'Finalizado: '+esc(m.m):'<span class="er">não estás num ramo de gitflow</span>');}else echo('<span class="dim">git flow feature|fix|release|hotfix start &lt;nome&gt; · git flow x finish</span>');return;}
  if(s==='diff'){echo(ch.map(p=>{const d=diffStat(FS[p].orig,FS[p].content);return ` ${short(p)} | <span class="ok">+${d.add}</span> <span class="er">-${d.del}</span>`;}).join('\n')||'<span class="dim">sem diferenças</span>');return;}
  if(s==='push'){echo(`<span class="ok">push simulado ✓</span> <span class="dim">origin/${esc(BRANCH)} (o protótipo não tem remoto)</span>`);return{ok:true};}
  echo('<span class="dim">git: status | add . | commit -m | log | branch | checkout [-b] | merge | flow | diff | push</span>');};
function checkpoint(label){const c={id:++CID,label,t:hhmm(),fs:JSON.stringify(FS),git:JSON.stringify(GIT),br:BRANCH};CKPT.unshift(c);log('checkpoint',label);return c.id;}
function restoreCkpt(id,silent){const c=CKPT.find(x=>x.id===id);if(!c)return;Object.keys(FS).forEach(k=>delete FS[k]);Object.assign(FS,JSON.parse(c.fs));Object.assign(GIT,JSON.parse(c.git));BRANCH=c.br;$('#st-branch-l').textContent=BRANCH;STAGED.clear();refresh(false,true);termRefreshPrompt();log('checkpoint','restaurado: '+c.label);if(!silent)toast('Restaurado: '+c.label);}
async function gfAsk(host,M){const b=BRANCH;if(!/^(feature|fix)\//.test(b))return;if([...M.files].some(p=>stOf(p))){host.insertAdjacentHTML('beforeend',`<p>Gitflow: o ramo <code>${esc(b)}</code> fica aberto com alterações por commitar.</p>`);return;}
  const go=MODE==='auto'?1:await ask(host,[{l:`Finalizar: merge de ${b} em develop`,v:1,pri:1,done:'✓ merge aprovado por ti'},{l:'Manter o ramo aberto',v:0,done:'ramo mantido'}]);
  if(go){const m=gfFinish(b);host.insertAdjacentHTML('beforeend',`<p>Gitflow: <code>${esc(b)}</code> → <code>develop</code> (merge <code>${m.h}</code>), ramo apagado. A release para <code>main</code> fica sempre contigo.</p>`);}}

/* ───── equipa: vários assistentes, cada um com o seu harness ───── */
const AGENTS={
  lead:{n:'Co-Dev',d:'Orquestrador: decompõe, delega e integra',col:'#e06c3b',paths:['**'],cmds:['*'],task:'arch',model:'auto',max:20},
  arq:{n:'Arquitecto',d:'Requisitos, arquitectura, ADRs e backlog',col:'#e08a5b',paths:['.dxtutor/**','docs/**'],cmds:[],task:'arch',model:'auto',max:4},
  be:{n:'Backend',d:'Crates Rust e comandos Tauri',col:'#dea584',paths:['crates/**'],cmds:['cargo build','cargo test','cargo clippy'],task:'code',model:'auto',max:6},
  db:{n:'Base de dados',d:'Esquema, migrações e índices',col:'#5cc9a7',paths:['db/migrations/**'],cmds:['cargo test -p store'],task:'db',model:'auto',max:3},
  fe:{n:'Frontend',d:'Interface e Design System',col:'#6ea8ff',paths:['desktop/src/**'],cmds:['dx lint','npm run dev','npm run lint'],task:'ui',model:'auto',max:6},
  qa:{n:'QA',d:'Testes automáticos',col:'#e0b64a',paths:['crates/*/tests/**','tests/**'],cmds:['cargo test','dx lint','dx test'],task:'test',model:'auto',max:6},
  ops:{n:'Plataforma',d:'Infra, CI/CD e deploy',col:'#c678dd',paths:['deploy/**','.ci/**','Cargo.toml'],cmds:['cargo build','git push'],task:'ops',model:'auto',max:4},
  tutor:{n:'Tutor',d:'Explica e orienta; nunca escreve por ti',col:'#5fcad6',paths:[],cmds:[],task:'teach',model:'auto',max:0}};
let AGENT='lead';
const globRe=g=>new RegExp('^'+g.split('**').map(s=>s.split('*').map(x=>x.replace(/[.+^${}()|[\]\\]/g,'\\$&')).join('[^/]*')).join('.*')+'$');
const inScope=(a,p)=>AGENTS[a].paths.some(g=>globRe(g).test(short(p)));
const canRun=(a,cmd)=>AGENTS[a].cmds.some(c=>c==='*'||cmd.startsWith(c));
const ownerOf=p=>Object.keys(AGENTS).find(k=>k!=='lead'&&inScope(k,p))||'lead';
function harnessCheck(p){if(!inScope(AGENT,p)){const o=ownerOf(p);throw new Error(`fora do escopo do assistente ${AGENTS[AGENT].n}. Pode escrever em: ${AGENTS[AGENT].paths.join(', ')||'nada'}. Este caminho pertence a: ${AGENTS[o].n}.`);}}
function harnessCmd(c){if(!canRun(AGENT,c))throw new Error(`o assistente ${AGENTS[AGENT].n} não tem permissão para correr "${c}".`);}
const agentSys=()=>{const a=AGENTS[AGENT];return `\nÉs o assistente «${a.n}» (${a.d}). Harness: só podes escrever em [${a.paths.join(', ')||'nenhum caminho'}] e correr [${a.cmds.join(', ')||'nenhum comando'}]. Se a tarefa exigir sair deste escopo, não o faças: diz que assistente da equipa (${Object.values(AGENTS).map(x=>x.n).join(', ')}) deve tratar dessa parte.`+(AGENT==='tutor'?'\nComo Tutor: não dês a solução completa. Faz perguntas, explica o conceito, dá pistas graduais e pede ao aluno que tente.':'');};
function saveTeam(){LS.set('team3',Object.fromEntries(Object.entries(AGENTS).map(([k,a])=>[k,{paths:a.paths,cmds:a.cmds,model:a.model,max:a.max}])));}
function loadTeam(){const t=LS.get('team3',null);if(t)Object.keys(AGENTS).forEach(k=>{if(t[k]){['paths','cmds'].forEach(f=>{if(Array.isArray(t[k][f]))AGENTS[k][f]=t[k][f];});if(t[k].model)AGENTS[k].model=t[k].model;if(t[k].max!=null)AGENTS[k].max=t[k].max;}});}
function pickAgent(){palette('',{ph:'Com que assistente queres falar?',items:Object.entries(AGENTS).map(([k,a])=>({l:a.n,d:a.d,run:()=>{AGENT=k;agentPill();toast('Assistente: '+a.n);}}))});}
function agentPill(){const p=$('#pill-agent');if(p){p.innerHTML=`<span class="pdot" style="background:${AGENTS[AGENT].col}"></span>${AGENTS[AGENT].n}`;}}
function openTeam(){openTab({id:'team',title:'Equipa',kind:'team'});}
function scopeProbe(v){const o=$('#probe-out');if(!v.trim()){o.textContent='';return;}const who=Object.keys(AGENTS).filter(k=>k!=='lead'&&inScope(k,norm(v)));o.innerHTML=who.length?'Pode escrever: '+who.map(k=>`<b style="color:${AGENTS[k].col}">${AGENTS[k].n}</b>`).join(', '):'Nenhum assistente especializado — só o orquestrador, com a tua aprovação.';}
VIEW.team=(t,host)=>{host.innerHTML=`<div class="page"><h1>Equipa de assistentes</h1><div class="sub">Cada assistente tem uma responsabilidade e um <b>harness</b>: os caminhos onde pode escrever, os comandos que pode correr e o limite de ficheiros por tarefa. O harness é aplicado em cada chamada de ferramenta — se um assistente tentar sair do escopo, a acção é bloqueada e delegada a quem é dono do caminho.</div>
  <h2>Testar o escopo</h2><div class="tbl-wrap"><div class="rowline"><input class="inp" style="margin:0;width:320px" placeholder="ex.: db/migrations/0005_x.sql" oninput="scopeProbe(this.value)"><span id="probe-out" style="color:var(--fg-dim)"></span></div></div>
  <h2>Assistentes</h2><div class="pgrid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">${Object.entries(AGENTS).map(([k,a])=>`<div class="pcard"><div class="ph"><span class="av" style="background:${a.col}">${a.n.charAt(0)}</span>${a.n}${AGENT===k?'<span class="tag acc">na conversa</span>':`<button class="mini" style="margin-left:auto" onclick="AGENT='${k}';agentPill();show(cur)">Falar</button>`}</div><div class="pd">${a.d}</div>
    <div><label>Pode escrever em (um padrão por linha)</label><textarea rows="2" onchange="AGENTS.${k}.paths=this.value.split('\\n').map(s=>s.trim()).filter(Boolean);saveTeam()">${esc(a.paths.join('\n'))}</textarea></div>
    <div><label>Comandos permitidos</label><textarea rows="2" onchange="AGENTS.${k}.cmds=this.value.split('\\n').map(s=>s.trim()).filter(Boolean);saveTeam()">${esc(a.cmds.join('\n'))}</textarea></div>
    <div style="display:grid;grid-template-columns:1fr 90px;gap:8px"><div><label>Modelo</label><select onchange="AGENTS.${k}.model=this.value;saveTeam()"><option value="auto"${a.model==='auto'?' selected':''}>Automático (router)</option>${Object.entries(PROV).map(([p,v])=>`<option value="${p}"${a.model===p?' selected':''}>${v.name}</option>`).join('')}</select></div><div><label>Máx. ficheiros</label><input type="number" min="0" max="50" value="${a.max}" onchange="AGENTS.${k}.max=+this.value;saveTeam()"></div></div></div>`).join('')}</div>
  <h2>Router de modelos</h2><div class="sub">Com o modelo em «Automático», o assistente descreve a tarefa e pede o modelo mais adequado. Os perfis abaixo são valores de exemplo, editáveis na aplicação real.</div><div class="tbl-wrap"><table class="tbl"><tr><th>Provedor</th>${Object.keys(CAPL).map(c=>`<th>${CAPL[c]}</th>`).join('')}</tr>${Object.entries(PROV).map(([p,v])=>`<tr><td><span class="pdot${v.on?'':' off'}" style="background:${v.col}"></span> ${v.name}</td>${Object.keys(CAPL).map(c=>`<td class="c">${CAP[p][c]}</td>`).join('')}</tr>`).join('')}</table></div>
  <div class="tbl-wrap" style="margin-top:10px">${Object.entries(TASKP).map(([k,p])=>{const r=rankModels(k);return `<div class="rowline"><b style="width:210px;flex:none">${p.l}</b><span style="color:var(--fg-muted)">${Object.entries(p.w).map(([c,w])=>CAPL[c]+' ×'+w).join(' · ')}</span><span class="sp"></span>${r.length?`<span class="pdot" style="background:${PROV[r[0].p].col}"></span>${PROV[r[0].p].name}`:'—'}</div>`;}).join('')}</div></div>`;};

/* ───── router: o assistente pede o melhor modelo para a tarefa ───── */
const CAPL={reason:'Raciocínio',code:'Código',speed:'Rapidez',cost:'Economia',priv:'Privacidade',ctx:'Contexto'};
const CAP={claude:{reason:10,code:9,speed:6,cost:4,priv:3,ctx:9},gemini:{reason:8,code:8,speed:8,cost:7,priv:3,ctx:10},codex:{reason:8,code:10,speed:7,cost:6,priv:3,ctx:7},ollama:{reason:5,code:6,speed:5,cost:10,priv:10,ctx:4}};
const TASKP={arch:{l:'Arquitectura e decomposição',w:{reason:5,ctx:3,code:1}},code:{l:'Implementação',w:{code:5,reason:2,speed:1}},db:{l:'Modelação de dados',w:{reason:4,code:3,ctx:1}},ui:{l:'Interface',w:{code:3,speed:3,cost:2}},test:{l:'Testes',w:{code:3,speed:3,cost:3}},ops:{l:'Infra e pipelines',w:{reason:3,code:3,cost:2}},teach:{l:'Explicação e tutoria',w:{reason:5,speed:2}},sens:{l:'Dados sensíveis',w:{priv:10,cost:1}}};
let LIVE_OK=false;const ROUTE_CACHE={};
function rankModels(task){const w=TASKP[task].w;return connected().map(p=>({p,s:Object.entries(w).reduce((s,[c,x])=>s+CAP[p][c]*x,0)})).sort((a,b)=>b.s-a.s);}
async function routeModel(agent,title){const a=AGENTS[agent],task=a.task,r=rankModels(task);if(!r.length)return{p:ACTIVE,why:'nenhum provedor ligado',by:'—'};
  if(a.model!=='auto'&&PROV[a.model].on)return{p:a.model,why:'fixado no harness do assistente',by:'harness'};
  const top=Object.entries(TASKP[task].w).sort((x,y)=>y[1]-x[1]).slice(0,2).map(x=>CAPL[x[0]].toLowerCase()).join(' e '),heur={p:r[0].p,why:`tarefa de ${TASKP[task].l.toLowerCase()}: pesa mais ${top}`,by:'perfil'};
  if(!SAMPLE||!LIVE_OK)return heur;if(ROUTE_CACHE[task])return ROUTE_CACHE[task];
  try{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),7000);const res=await SAMPLE(`Escolhe o melhor modelo para esta tarefa de desenvolvimento.\nTarefa: ${title}\nTipo: ${TASKP[task].l}\nModelos disponíveis (capacidades 0-10): ${JSON.stringify(Object.fromEntries(r.map(x=>[x.p,CAP[x.p]])))}\nResponde só com JSON: {"provider":"<id>","why":"<uma frase em português>"}`,{modelTier:'quick',signal:ac.signal});clearTimeout(tm);
    const j=JSON.parse((res.text.match(/\{[\s\S]*\}/)||['{}'])[0]);if(PROV[j.provider]&&PROV[j.provider].on)return ROUTE_CACHE[task]={p:j.provider,why:String(j.why||'').slice(0,140),by:'LLM'};}catch(e){}
  return heur;}

function tplNode(n){const s=slug(n.n),rs=s.replace(/-/g,'_'),P=pascal(n.n),lib=ROOT+`crates/${s}/src/lib.rs`,out=[];
