 fn reverse_list(items: Vec<i32>) -> Vec<i32> {\n    todo!(\"push each item to the front of a linked list, then collect the values\")\n}\n","tests":"use student::reverse_list;\n\n#[test]\nfn empty() {\n    assert_eq!(reverse_list(vec![]), Vec::<i32>::new());\n}\n\n#[test]\nfn single() {\n    assert_eq!(reverse_list(vec![7]), vec![7]);\n}\n\n#[test]\nfn several() {\n    assert_eq!(reverse_list(vec![1, 2, 3, 4]), vec![4, 3, 2, 1]);\n}\n\n#[test]\nfn duplicates() {\n    assert_eq!(reverse_list(vec![5, 5, 9]), vec![9, 5, 5]);\n}\n","entry":"reverse_list","gabarito":{"time":"O(n)","space":"O(n)","solution":"struct Node {\n    val: i32,\n    next: Option<Box<Node>>,\n}\n\npub fn reverse_list(items: Vec<i32>) -> Vec<i32> {\n    let mut head: Option<Box<Node>> = None;\n    for x in items {\n        head = Some(Box::new(Node {\n            val: x,\n            next: head.take(),\n        }));\n    }\n    let mut out = Vec::new();\n    let mut cur = head;\n    while let Some(node) = cur {\n        out.push(node.val);\n        cur = node.next;\n    }\n    out\n}\n","justification":"Building the list does one `push_front` per item (constant work each), and walking it\nvisits each node once, so the total time is **O(n)**. The list owns one heap node per\nelement plus the output vector, giving **O(n)** space. Each push links the new value\nahead of the previous head, so the head-to-tail order is the reverse of the insertion\norder — walking from the head collects the input reversed.\n"}}]},{"id":"u23-maps-sets","title":"Maps and Sets","difficulty":23,"level":"advanced","intro":"Hashing gives you two indispensable tools in near-constant time. A `HashMap<K, V>`\nassociates keys with values — perfect for counting how often each thing appears. A\n`HashSet<T>` stores only keys — perfect for dedup and fast membership tests. This\nunit counts frequencies, de-duplicates, tests membership, and finishes with two-sum\nusing a map to find a pair in a single pass.\n","steps":[{"kind":"concept","id":"c23-maps-sets","title":"Key to value, and keys alone","points":5,"difficulty":23,"intro":"A map remembers a value for each key; a set remembers only that a key is present.\nBoth answer *\"have I seen this?\"* in roughly constant time, which turns many\nquadratic scans into single passes.\n","body":"## `HashMap`: count with the entry API\n\nA `HashMap<K, V>` looks up, inserts, and updates by key in average O(1). The\n`entry` API is the clean way to update-or-insert: `entry(k).or_insert(0)` hands you\na mutable reference to the value for `k`, creating it with a default first if\nneeded:\n\n```rust\nuse std::collections::HashMap;\n\nlet mut counts: HashMap<&str, i32> = HashMap::new();\nfor w in [\"a\", \"b\", \"a\"] {\n    *counts.entry(w).or_insert(0) += 1; // count occurrences\n}\nassert_eq!(counts[\"a\"], 2);\n```\n\n## `HashSet`: membership and dedup\n\nA `HashSet<T>` is a map with no values — it stores unique keys. `insert` returns\n`false` if the item was already present, and `contains` tests membership in O(1).\nCollecting an iterator into a `HashSet` drops duplicates:\n\n```rust\nuse std::collections::HashSet;\n\nlet set: HashSet<i32> = [3, 1, 2, 3].iter().copied().collect();\nassert_eq!(set.len(), 3); // the duplicate 3 is gone\n```\n\n- Iteration order of a `HashMap`/`HashSet` is **unspecified** — never print one\n  directly if you need stable output. Collect into a `Vec` and `sort` first.\n- A hash map lets you trade memory for speed: remember what you have seen so you\n  never have to rescan for it.\n\nCounting, de-duplicating, and *\"have I seen the complement?\"* lookups are the three\npatterns that carry this unit into the two-sum challenge.\n"},{"kind":"drill","id":"d66-frequency-count","title":"Count frequencies with a HashMap","points":10,"difficulty":23,"intro":"The `entry` API counts in one line: `entry(w).or_insert(0)` gives a mutable slot\n(created at `0` the first time), and `+= 1` bumps it. Because map order is\nunspecified, collect into a `Vec` and `sort` before printing.\n","prompt":"Count how often each word appears, then print the pairs in sorted order.\n\n**Why:** `entry(...).or_insert(0)` avoids a separate \"is it there yet?\" check;\nsorting before printing makes the output deterministic despite the map's random order.\n","target":"use std::collections::HashMap;\n\nfn main() {\n    let words = [\"a\", \"b\", \"a\", \"c\", \"b\", \"a\"];\n    let mut counts: HashMap<&str, i32> = HashMap::new();\n    for w in words {\n        *counts.entry(w).or_insert(0) += 1;\n    }\n    let mut pairs: Vec<_> = counts.into_iter().collect();\n    pairs.sort();\n    println!(\"{:?}\", pairs);\n}\n","line_comments":["Brings `HashMap` into scope.","","`main` opens.","The input words, with repeats.","A map from word to its running count.","For each word...","...`entry(w).or_insert(0)` gives a mutable slot (default `0`), then `+= 1`.","Closes the counting loop.","Collect the pairs into a vector so we can order them.","Sort for deterministic output (map order is unspecified).","Prints `[(\"a\", 3), (\"b\", 2), (\"c\", 1)]`.","Closes `main`."],"explanation":"The `entry` API counted each word in a single pass, and sorting the pairs made the\noutput stable: `[(\"a\", 3), (\"b\", 2), (\"c\", 1)]`. Never print a map directly — its\niteration order is deliberately randomised.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d67-hashset-dedup","title":"De-duplicate with a HashSet","points":10,"difficulty":23,"intro":"Collecting into a `HashSet` keeps one copy of each value and discards the rest.\nSince set order is unspecified, move the uniques into a `Vec` and `sort` for a\nstable result.\n","prompt":"Collect numbers with duplicates into a `HashSet`, then print the sorted unique values.\n\n**Why:** a set stores each key once, so `collect` into a `HashSet` is the shortest\nway to dedup; sorting afterwards restores a predictable order for output.\n","target":"use std::collections::HashSet;\n\nfn main() {\n    let nums = [3, 1, 2, 3, 1, 4];\n    let set: HashSet<i32> = nums.iter().copied().collect();\n    let mut unique: Vec<i32> = set.into_iter().collect();\n    unique.sort();\n    println!(\"{:?}\", unique);\n}\n","line_comments":["Brings `HashSet` into scope.","","`main` opens.","Numbers with duplicates.","Collecting into a `HashSet` drops duplicates automatically.","Move the unique values into a vector.","Sort for deterministic output (set order is unspecified).","Prints `[1, 2, 3, 4]`.","Closes `main`."],"explanation":"Collecting into the set left one of each value; sorting the result gave\n`[1, 2, 3, 4]`. A `HashSet` is the quickest route to unique elements when you do not\nneed to preserve the original order.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d68-hashset-membership","title":"Test membership with contains","points":10,"difficulty":23,"intro":"`HashSet::contains` answers membership in average O(1). Building a set from one group\nand testing another against it beats a nested loop, which would be O(n*m).\n","prompt":"Build a set from one group of numbers and count how many of a second group are in it.\n\n**Why:** a set membership test is near-constant time, so checking each element of the\nsecond group against the set is linear overall — not quadratic.\n","target":"use std::collections::HashSet;\n\nfn main() {\n    let a: HashSet<i32> = [1, 2, 3, 4].iter().copied().collect();\n    let b = [3, 4, 5, 6];\n    let common = b.iter().filter(|x| a.contains(x)).count();\n    println!(\"{common}\");\n}\n","line_comments":["Brings `HashSet` into scope.","","`main` opens.","Build a set from the first group of numbers.","A second group to test against the set.","`contains` is O(1) membership; count how many of `b` are in `a`.","Prints `2` — only `3` and `4` are shared.","Closes `main`."],"explanation":"Each element of `b` was tested against the set in constant time, so the whole count\nwas linear and gave `2`. Pre-loading one side into a `HashSet` turns a quadratic\ncross-check into a single pass.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch23-two-sum","title":"Two-sum with a HashMap","points":40,"difficulty":23,"intro":"The interview classic, solved in one pass. Implement `two_sum(nums, target)`: find\ntwo *distinct* indices whose values add up to `target`. As you scan, a `HashMap`\nremembers each value you have already seen and where; for the current value you look\nup its complement (`target - n`) — if it is in the map, you have your pair.\n","instructions":"## Your turn\n\nFind a pair of indices that sum to the target:\n\n```rust\npub fn two_sum(nums: &[i32], target: i32) -> Option<(usize, usize)> { ... }\n```\n\nReturn `Some((i, j))` with `i < j` and `nums[i] + nums[j] == target`, or `None` if no\nsuch pair exists. Return the first such pair found while scanning left to right, with\nthe smaller index first.\n\nRules:\n\n- Each index may be used once; the two indices must differ.\n- Do it in a single pass with a `HashMap` from value to index — not a nested loop.\n- An empty or single-element slice yields `None`.\n\nExamples:\n\n- `two_sum(&[2, 7, 11, 15], 9)` → `Some((0, 1))`\n- `two_sum(&[3, 2, 4], 6)` → `Some((1, 2))`\n- `two_sum(&[1, 2, 3], 100)` → `None`\n\n**Hint:** keep a `HashMap<i32, usize>` of values you have seen. For each `(i, n)`,\ncompute `need = target - n`; if `need` is in the map at index `j`, return\n`Some((j, i))`. Otherwise record `n -> i` (only if absent) and continue.\n\nHidden tests decide correctness.\n","starter":"use std::collections::HashMap;\n\npub fn two_sum(nums: &[i32], target: i32) -> Option<(usize, usize)> {\n    todo!(\"scan once, remembering value -> index, and look up target - n\")\n}\n","tests":"use student::two_sum;\n\n#[test]\nfn basic() {\n    assert_eq!(two_sum(&[2, 7, 11, 15], 9), Some((0, 1)));\n}\n\n#[test]\nfn later_pair() {\n    assert_eq!(two_sum(&[3, 2, 4], 6), Some((1, 2)));\n}\n\n#[test]\nfn no_solution() {\n    assert_eq!(two_sum(&[1, 2, 3], 100), None);\n}\n\n#[test]\nfn empty() {\n    assert_eq!(two_sum(&[], 0), None);\n}\n\n#[test]\nfn same_value_twice() {\n    assert_eq!(two_sum(&[3, 3], 6), Some((0, 1)));\n}\n","entry":"two_sum","gabarito":{"time":"O(n)","space":"O(n)","solution":"use std::collections::HashMap;\n\npub fn two_sum(nums: &[i32], target: i32) -> Option<(usize, usize)> {\n    let mut seen: HashMap<i32, usize> = HashMap::new();\n    for (i, &n) in nums.iter().enumerate() {\n        let need = target - n;\n        if let Some(&j) = seen.get(&need) {\n            return Some((j, i));\n        }\n        seen.entry(n).or_insert(i);\n    }\n    None\n}\n","justification":"The slice is scanned once, and each step does an average O(1) map lookup and insert,\nso the total time is **O(n)**. The map stores at most one entry per element, giving\n**O(n)** space. For the current index `i`, the complement `target - nums[i]` is looked\nup among the earlier values; if present at index `j`, then `j < i`, so `(j, i)` is\nreturned smaller-index-first and is the first such pair in scan order.\n"}}]},{"id":"u24-binary-search-tree","title":"Binary Search Trees","difficulty":24,"level":"advanced","intro":"A binary search tree keeps values ordered by *where* they sit: everything smaller\nthan a node goes left, everything larger goes right. That invariant makes `insert`\nand `contains` follow a single path down the tree, and an in-order traversal reads\nthe values back in sorted order. This unit builds a BST of `i32` with\n`Option<Box<Node>>`, then returns a sorted, de-duplicated sequence from raw inserts.\n","steps":[{"kind":"concept","id":"c24-binary-search-tree","title":"Smaller left, larger right","points":5,"difficulty":24,"intro":"The binary-search-tree invariant is one rule applied at every node: left subtree\nholds smaller values, right subtree holds larger ones. Keep that rule and search,\ninsertion, and sorted output all fall out naturally.\n","body":"## The node and the invariant\n\nEach node owns two optional children, both `Option<Box<Node>>`. The invariant: for\nevery node, all values in its left subtree are **smaller**, and all in its right\nsubtree are **larger**:\n\n```rust\nstruct Node {\n    val: i32,\n    left: Option<Box<Node>>,\n    right: Option<Box<Node>>,\n}\n```\n\n## Insert and search follow one path\n\nTo insert or search, compare at the current node and step left or right — never\nboth. That is why both are O(height): one comparison per level.\n\n```rust\nfn insert(root: &mut Option<Box<Node>>, v: i32) {\n    match root {\n        None => *root = Some(Box::new(Node { val: v, left: None, right: None })),\n        Some(n) if v < n.val => insert(&mut n.left, v),\n        Some(n) if v > n.val => insert(&mut n.right, v),\n        Some(_) => {} // equal: already present, ignore\n    }\n}\n```\n\n## In-order traversal reads sorted\n\nVisit the left subtree, then the node, then the right subtree. Because left is\nalways smaller and right always larger, this yields the values in **ascending\norder**:\n\n```rust\nfn walk(root: &Option<Box<Node>>, out: &mut Vec<i32>) {\n    if let Some(n) = root {\n        walk(&n.left, out);\n        out.push(n.val);\n        walk(&n.right, out);\n    }\n}\n```\n\n- Matching on `&mut Option<Box<Node>>` lets `insert` plant a new node exactly where\n  the search falls off the tree (the `None` arm).\n- Ignoring the equal case keeps the tree a *set* — duplicates are dropped.\n\nInsert each value, walk in order, and you have sorted unique output — the challenge\nin a nutshell.\n"},{"kind":"drill","id":"d69-bst-insert","title":"Insert into a binary search tree","points":10,"difficulty":24,"intro":"`insert` matches on the current slot: an empty slot (`None`) gets a new leaf;\notherwise it recurses left for smaller values and right for larger ones. Matching on\n`&mut Option<Box<Node>>` lets it plant the node exactly where the search ends.\n","prompt":"Insert `5, 3, 8` into an empty tree and print the root with its two children.\n\n**Why:** comparing at each node and stepping one way keeps every value on the correct\nside, so the first value inserted becomes the root and the rest hang beneath it.\n","target":"struct Node { val: i32, left: Option<Box<Node>>, right: Option<Box<Node>> }\n\nfn insert(root: &mut Option<Box<Node>>, v: i32) {\n    match root {\n        None => *root = Some(Box::new(Node { val: v, left: None, right: None })),\n        Some(n) if v < n.val => insert(&mut n.left, v),\n        Some(n) if v > n.val => insert(&mut n.right, v),\n        Some(_) => {}\n    }\n}\n\nfn main() {\n    let mut root = None;\n    for v in [5, 3, 8] {\n        insert(&mut root, v);\n    }\n    let r = root.unwrap();\n    println!(\"{} {} {}\", r.val, r.left.unwrap().val, r.right.unwrap().val);\n}\n","line_comments":["A binary-search-tree node with left and right children.","","`insert` places `v` in the subtree rooted at `root`.","Match on the current slot.","Empty slot: plant a new leaf node here.","Smaller than this node: recurse into the left child.","Greater than this node: recurse into the right child.","Equal: already present, so do nothing (duplicates ignored).","Closes the `match`.","Closes `insert`.","","`main` opens.","Start with an empty tree.","Insert each value in turn...","...building the tree in place.","Closes the insert loop.","Unwrap the root (the first value inserted).","Prints `5 3 8` — root, left child, right child.","Closes `main`."],"explanation":"`5` became the root; `3` went left because it is smaller and `8` went right because\nit is larger, printing `5 3 8`. Each insert followed one comparison per level to\nreach its empty slot.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d70-bst-inorder","title":"In-order traversal reads sorted","points":10,"difficulty":24,"intro":"An in-order walk visits left subtree, node, then right subtree. Because the BST\ninvariant puts smaller values left and larger values right, this emits the values in\nascending order — no sorting step required.\n","prompt":"Walk a small tree (root `5`, children `3` and `8`) in order and collect the values.\n\n**Why:** visiting left-node-right at every node interleaves the subtrees so that each\nvalue is emitted only after everything smaller than it — i.e. in sorted order.\n","target":"struct Node { val: i32, left: Option<Box<Node>>, right: Option<Box<Node>> }\n\nfn walk(root: &Option<Box<Node>>, out: &mut Vec<i32>) {\n    if let Some(n) = root {\n        walk(&n.left, out);\n        out.push(n.val);\n        walk(&n.right, out);\n    }\n}\n\nfn leaf(v: i32) -> Option<Box<Node>> {\n    Some(Box::new(Node { val: v, left: None, right: None }))\n}\n\nfn main() {\n    let root = Some(Box::new(Node { val: 5, left: leaf(3), right: leaf(8) }));\n    let mut out = Vec::new();\n    walk(&root, &mut out);\n    println!(\"{:?}\", out);\n}\n","line_comments":["A binary-search-tree node with two child links.","","`walk` does an in-order traversal, appending values to `out`.","If there is a node here...","...visit the entire left subtree first (smaller values).","Then record this node's value.","Then visit the right subtree (larger values).","Closes the `if let`.","Closes `walk`.","","`leaf` builds a childless node wrapped in `Some`.","A node with both children `None`.","Closes `leaf`.","","`main` opens.","A tree: root `5`, left `3`, right `8`.","Where the traversal collects values.","Run the in-order walk.","Prints `[3, 5, 8]` — in-order visits a BST in sorted order.","Closes `main`."],"explanation":"Visiting left, then node, then right produced `[3, 5, 8]` — ascending — straight from\nthe tree's shape. The BST invariant is what makes in-order traversal a sort.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d71-bst-contains","title":"Search a binary search tree","points":10,"difficulty":24,"intro":"`contains` mirrors `insert`: compare at each node and step one way. Equal means\nfound; smaller means go left; larger means go right; falling off the tree (`None`)\nmeans absent. Only one path is ever examined.\n","prompt":"Search a small tree for a value that is present and one that is not, printing both.\n\n**Why:** because smaller values are always left and larger always right, a search can\ndiscard half the remaining tree at every step — it never needs to look at both sides.\n","target":"struct Node { val: i32, left: Option<Box<Node>>, right: Option<Box<Node>> }\n\nfn contains(root: &Option<Box<Node>>, target: i32) -> bool {\n    match root {\n        None => false,\n        Some(n) if target == n.val => true,\n        Some(n) if target < n.val => contains(&n.left, target),\n        Some(n) => contains(&n.right, target),\n    }\n}\n\nfn leaf(v: i32) -> Option<Box<Node>> {\n    Some(Box::new(Node { val: v, left: None, right: None }))\n}\n\nfn main() {\n    let root = Some(Box::new(Node { val: 5, left: leaf(3), right: leaf(8) }));\n    println!(\"{} {}\", contains(&root, 8), contains(&root, 4));\n}\n","line_comments":["A binary-search-tree node.","","`contains` searches for `target`, returning a `bool`.","Match on the current slot.","Ran off the tree: not found.","Found it: the values match.","Target is smaller: search the left subtree only.","Otherwise it is larger: search the right subtree.","Closes the `match`.","Closes `contains`.","","`leaf` builds a childless node.","A node with no children.","Closes `leaf`.","","`main` opens.","A tree: root `5`, left `3`, right `8`.","Prints `true false` — `8` is present, `4` is not.","Closes `main`."],"explanation":"Searching for `8` stepped right to a match; searching for `4` stepped left and ran off\nthe tree, giving `true false`. Each search followed a single root-to-leaf path.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch24-sorted-from-inserts","title":"Sort by building a BST","points":40,"difficulty":24,"intro":"Bring insert and in-order traversal together. Implement\n`sorted_from_inserts(items)`: insert every element into a binary search tree, then\nreturn its in-order traversal. The invariant does the sorting, and the equal-value\ncase being ignored means duplicates drop out — so the result is the input's values,\nsorted and unique.\n","instructions":"## Your turn\n\nProduce a sorted, de-duplicated sequence via a BST:\n\n```rust\npub fn sorted_from_inserts(items: Vec<i32>) -> Vec<i32> { ... }\n```\n\nInsert each element of `items` into a binary search tree (smaller left, larger\nright, equal ignored), then return the in-order traversal as a `Vec<i32>`.\n\nRules:\n\n- The output is ascending and contains no duplicates.\n- Empty input yields an empty `Vec`.\n- Build a real BST with `Option<Box<Node>>` — do not call `sort`/`dedup`.\n\nExamples:\n\n- `sorted_from_inserts(vec![5, 3, 8, 1, 4])` → `vec![1, 3, 4, 5, 8]`\n- `sorted_from_inserts(vec![2, 2, 1, 3, 3])` → `vec![1, 2, 3]`\n\n**Hint:** reuse the `insert` (smaller left, larger right, equal does nothing) and the\nin-order `walk` (left, node, right) from the drills. Insert all items, then walk the\nroot into an output `Vec`.\n\nHidden tests decide correctness.\n","starter":"pub fn sorted_from_inserts(items: Vec<i32>) -> Vec<i32> {\n    todo!(\"insert every item into a BST, then return the in-order traversal\")\n}\n","tests":"use student::sorted_from_inserts;\n\n#[test]\nfn empty() {\n    assert_eq!(sorted_from_inserts(vec![]), Vec::<i32>::new());\n}\n\n#[test]\nfn sorts() {\n    assert_eq!(sorted_from_inserts(vec![5, 3, 8, 1, 4]), vec![1, 3, 4, 5, 8]);\n}\n\n#[test]\nfn drops_duplicates() {\n    assert_eq!(sorted_from_inserts(vec![2, 2, 1, 3, 3]), vec![1, 2, 3]);\n}\n\n#[test]\nfn already_sorted() {\n    assert_eq!(sorted_from_inserts(vec![1, 2, 3, 4]), vec![1, 2, 3, 4]);\n}\n\n#[test]\nfn single() {\n    assert_eq!(sorted_from_inserts(vec![42]), vec![42]);\n}\n","entry":"sorted_from_inserts","gabarito":{"time":"O(n log n) average, O(n^2) worst","space":"O(n)","solution":"struct Node {\n    val: i32,\n    left: Option<Box<Node>>,\n    right: Option<Box<Node>>,\n}\n\nfn insert(root: &mut Option<Box<Node>>, v: i32) {\n    match root {\n        None => *root = Some(Box::new(Node { val: v, left: None, right: None })),\n        Some(n) if v < n.val => insert(&mut n.left, v),\n        Some(n) if v > n.val => insert(&mut n.right, v),\n        Some(_) => {}\n    }\n}\n\nfn walk(root: &Option<Box<Node>>, out: &mut Vec<i32>) {\n    if let Some(n) = root {\n        walk(&n.left, out);\n        out.push(n.val);\n        walk(&n.right, out);\n    }\n}\n\npub fn sorted_from_inserts(items: Vec<i32>) -> Vec<i32> {\n    let mut root: Option<Box<Node>> = None;\n    for x in items {\n        insert(&mut root, x);\n    }\n    let mut out = Vec::new();\n    walk(&root, &mut out);\n    out\n}\n","justification":"Each insert costs O(height): about **O(log n)** on a balanced tree but **O(n)** on\nalready-sorted input, so the build is **O(n log n)** average and **O(n^2)** worst case;\nthe in-order walk is **O(n)**. The tree holds at most one node per distinct value, so\nspace is **O(n)**. The BST invariant (smaller left, larger right) makes the in-order\ntraversal ascending, and the equal case doing nothing drops duplicates, so the output\nis sorted and unique.\n"}}]},{"id":"u25-sorting-searching","title":"Sorting and Searching","difficulty":25,"level":"advanced","intro":"Two algorithms are worth implementing by hand at least once. **Merge sort** divides\na vector in half, sorts each half, and merges the two sorted halves in linear time —\nO(n log n), and stable. **Binary search** halves its search window each step to find\na value in a sorted slice in O(log n). This unit builds the merge and the search\npiece by piece, then assembles a full merge sort.\n","steps":[{"kind":"concept","id":"c25-sorting-searching","title":"Divide, merge, and halve","points":5,"difficulty":25,"intro":"Merge sort and binary search are both *divide and conquer*: split the problem in\nhalf and recombine (or discard) half the work each step. That halving is where the\nlogarithm in their running time comes from.\n","body":"## Merge: combine two sorted slices\n\nThe engine of merge sort is merging two already-sorted slices into one. Walk both\nwith a cursor, always taking the smaller front; using `<=` (take from the left on a\ntie) keeps the sort **stable**:\n\n```rust\nfn merge(a: &[i32], b: &[i32]) -> Vec<i32> {\n    let mut out = Vec::new();\n    let (mut i, mut j) = (0, 0);\n    while i < a.len() && j < b.len() {\n        if a[i] <= b[j] { out.push(a[i]); i += 1; }\n        else { out.push(b[j]); j += 1; }\n    }\n    out.extend_from_slice(&a[i..]);\n    out.extend_from_slice(&b[j..]);\n    out\n}\n```\n\n## Merge sort: split, sort halves, merge\n\nSplit the vector at the midpoint, merge-sort each half, then merge the results. A\nslice of length 0 or 1 is already sorted — that is the base case:\n\n```rust\nfn merge_sort(v: Vec<i32>) -> Vec<i32> {\n    if v.len() <= 1 { return v; }\n    let mid = v.len() / 2;\n    let left = merge_sort(v[..mid].to_vec());\n    let right = merge_sort(v[mid..].to_vec());\n    merge(&left, &right)\n}\n```\n\n## Binary search: halve the window\n\nOn a **sorted** slice, keep a half-open window `[lo, hi)`. Compare the midpoint: on a\nmatch return it; if the midpoint is too small discard the left half, else discard the\nright. Each step halves the window, so it finishes in O(log n):\n\n```rust\nfn binary_search(v: &[i32], target: i32) -> Option<usize> {\n    let (mut lo, mut hi) = (0, v.len());\n    while lo < hi {\n        let mid = lo + (hi - lo) / 2;\n        if v[mid] == target { return Some(mid); }\n        else if v[mid] < target { lo = mid + 1; }\n        else { hi = mid; }\n    }\n    None\n}\n```\n\n- Writing the midpoint as `lo + (hi - lo) / 2` avoids overflow that `(lo + hi) / 2`\n  risks for large indices.\n- Merge sort is stable and O(n log n); binary search needs sorted input and is\n  O(log n).\n\nBuild the merge, build the binary search, and merge sort is just recursion over the\ntwo.\n"},{"kind":"drill","id":"d72-merge-sorted","title":"Merge two sorted slices","points":10,"difficulty":25,"intro":"Merging is the heart of merge sort. Two cursors walk the inputs; at each step the\nsmaller front is taken, and `<=` (favour the left on ties) keeps equal elements in\ntheir original order — a stable merge. Leftovers are appended at the end.\n","prompt":"Merge `[1, 3, 5]` and `[2, 4, 6]` into one sorted vector.\n\n**Why:** because both inputs are already sorted, comparing only their fronts is\nenough to emit the next-smallest value, so the whole merge is linear in the total length.\n","target":"fn merge(a: &[i32], b: &[i32]) -> Vec<i32> {\n    let mut out = Vec::new();\n    let (mut i, mut j) = (0, 0);\n    while i < a.len() && j < b.len() {\n        if a[i] <= b[j] {\n            out.push(a[i]);\n            i += 1;\n        } else {\n            out.push(b[j]);\n            j += 1;\n        }\n    }\n    out.extend_from_slice(&a[i..]);\n    out.extend_from_slice(&b[j..]);\n    out\n}\n\nfn main() {\n    let merged = merge(&[1, 3, 5], &[2, 4, 6]);\n    println!(\"{:?}\", merged);\n}\n","line_comments":["`merge` combines two already-sorted slices into one sorted vector.","The output vector.","Two cursors, one per input slice.","While both slices still have elements...","...compare the fronts; `<=` keeps the merge stable.","Take from `a` when it is not larger.","Advance the `a` cursor.","Otherwise...","...take from `b`.","Advance the `b` cursor.","Closes the `if`/`else`.","Closes the `while`.","Append whatever remains in `a`.","Append whatever remains in `b`.","Return the merged vector.","Closes `merge`.","","`main` opens.","Merge two sorted slices.","Prints `[1, 2, 3, 4, 5, 6]`.","Closes `main`."],"explanation":"Comparing only the fronts of the two sorted inputs emitted `[1, 2, 3, 4, 5, 6]` in a\nsingle linear pass. This merge, applied recursively to halves, is the whole of merge\nsort.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d73-binary-search","title":"Binary search by hand","points":10,"difficulty":25,"intro":"On a sorted slice, keep a half-open window `[lo, hi)` and inspect its midpoint. A\nmatch returns the index; too small moves `lo` past the midpoint; too large pulls `hi`\ndown to it. The window halves every step, so the search is O(log n).\n","prompt":"Search a sorted slice for a value that is present and one that is absent.\n\n**Why:** each comparison rules out half of the remaining window, so even a large\nsorted slice is searched in a handful of steps — logarithmic, not linear.\n","target":"fn binary_search(v: &[i32], target: i32) -> Option<usize> {\n    let (mut lo, mut hi) = (0, v.len());\n    while lo < hi {\n        let mid = lo + (hi - lo) / 2;\n        if v[mid] == target {\n            return Some(mid);\n        } else if v[mid] < target {\n            lo = mid + 1;\n        } else {\n            hi = mid;\n        }\n    }\n    None\n}\n\nfn main() {\n    let v = [1, 3, 5, 7, 9];\n    println!(\"{:?} {:?}\", binary_search(&v, 7), binary_search(&v, 4));\n}\n","line_comments":["`binary_search` finds `target` in a sorted slice, returning its index.","Half-open search window `[lo, hi)`.","While the window is non-empty...","...pick the midpoint (written to avoid overflow).","If the midpoint is the target...","...return its index.","If the midpoint is too small...","...discard the left half.","Otherwise the midpoint is too large...","...discard the right half.","Closes the `if` chain.","Closes the `while`.","Window emptied without a match: not found.","Closes `binary_search`.","","`main` opens.","A sorted slice to search.","Prints `Some(3) None` — `7` is at index 3, `4` is absent.","Closes `main`."],"explanation":"The window halved on every comparison, finding `7` at index 3 and exhausting the\nwindow for the absent `4` (giving `None`). Binary search trades a sorted-input\nrequirement for logarithmic lookups.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d74-split-off","title":"Split a vector in half","points":10,"difficulty":25,"intro":"Merge sort first splits the input in two. `Vec::split_off(mid)` does exactly that:\nit truncates the vector to `[0, mid)` and returns the removed tail `[mid, len)` as a\nnew `Vec` — the two halves the recursion will sort.\n","prompt":"Split `[1, 2, 3, 4, 5]` at its midpoint and print both halves.\n\n**Why:** `split_off` is the clean, allocation-light way to divide a `Vec` into the\ntwo owned halves merge sort recurses on, with no manual index juggling.\n","target":"fn main() {\n    let mut v = vec![1, 2, 3, 4, 5];\n    let mid = v.len() / 2;\n    let right = v.split_off(mid);\n    println!(\"{:?} {:?}\", v, right);\n}\n","line_comments":["`main` opens.","A vector to divide.","The midpoint index.","`split_off` keeps `[0, mid)` in `v` and returns the rest.","Prints `[1, 2] [3, 4, 5]` — the two halves merge sort recurses on.","Closes `main`."],"explanation":"`split_off(2)` left `[1, 2]` in `v` and returned `[3, 4, 5]`. Dividing the input into\ntwo owned halves is the first move of merge sort, before each half is sorted and merged.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch25-merge-sort","title":"Implement merge sort","points":40,"difficulty":25,"intro":"Put the pieces together. Implement `merge_sort(v)`: split the vector in half,\nrecursively sort each half, and merge the two sorted halves back into one. The result\nis a stable, ascending sort in O(n log n) — all from the merge and the split you\nalready built, with no call to `slice::sort`.\n","instructions":"## Your turn\n\nSort a vector with merge sort:\n\n```rust\npub fn merge_sort(mut v: Vec<i32>) -> Vec<i32> { ... }\n```\n\nReturn a sorted (ascending, stable) copy of `v`. Split at the midpoint, sort each\nhalf recursively, and merge the halves.\n\nRules:\n\n- Do **not** use `slice::sort` or `sort_unstable` — write the merge yourself.\n- A slice of length 0 or 1 is already sorted (the base case).\n- The sort must be stable: keep equal elements in their original relative order\n  (take from the left half on a tie with `<=`).\n\nExamples:\n\n- `merge_sort(vec![5, 1, 4, 2, 8])` → `vec![1, 2, 4, 5, 8]`\n- `merge_sort(vec![])` → `vec![]`\n\n**Hint:** if `v.len() <= 1` return `v`. Otherwise `let right = v.split_off(v.len() /\n2);`, recurse on both parts, then merge them with two cursors, pushing the smaller\nfront each step and appending the leftovers.\n\nHidden tests decide correctness.\n","starter":"pub fn merge_sort(mut v: Vec<i32>) -> Vec<i32> {\n    todo!(\"split in half, sort each half recursively, then merge the two\")\n}\n","tests":"use student::merge_sort;\n\n#[test]\nfn empty() {\n    assert_eq!(merge_sort(vec![]), Vec::<i32>::new());\n}\n\n#[test]\nfn single() {\n    assert_eq!(merge_sort(vec![9]), vec![9]);\n}\n\n#[test]\nfn unsorted() {\n    assert_eq!(merge_sort(vec![5, 1, 4, 2, 8]), vec![1, 2, 4, 5, 8]);\n}\n\n#[test]\nfn reversed() {\n    assert_eq!(merge_sort(vec![9, 7, 5, 3, 1]), vec![1, 3, 5, 7, 9]);\n}\n\n#[test]\nfn duplicates_and_negatives() {\n    assert_eq!(merge_sort(vec![3, -1, 3, 0, -1]), vec![-1, -1, 0, 3, 3]);\n}\n","entry":"merge_sort","gabarito":{"time":"O(n log n)","space":"O(n)","solution":"pub fn merge_sort(mut v: Vec<i32>) -> Vec<i32> {\n    let n = v.len();\n    if n <= 1 {\n        return v;\n    }\n    let mid = n / 2;\n    let right = merge_sort(v.split_off(mid));\n    let left = merge_sort(v);\n    let mut out = Vec::with_capacity(n);\n    let (mut i, mut j) = (0, 0);\n    while i < left.len() && j < right.len() {\n        if left[i] <= right[j] {\n            out.push(left[i]);\n            i += 1;\n        } else {\n            out.push(right[j]);\n            j += 1;\n        }\n    }\n    out.extend_from_slice(&left[i..]);\n    out.extend_from_slice(&right[j..]);\n    out\n}\n","justification":"The recursion halves the input at each level, giving **O(log n)** levels, and each\nlevel merges a total of `n` elements in linear time, so the sort is **O(n log n)**. The\nmerge allocates a buffer proportional to the slice it combines, so auxiliary space is\n**O(n)**. Taking from the left half on ties (`<=`) preserves the original order of\nequal elements, so the sort is stable; the base case (length 0 or 1) is already sorted.\n"}}]},{"id":"u26-recursion-dp","title":"Recursion and Dynamic Programming","difficulty":26,"level":"advanced","intro":"Recursion expresses a problem in terms of smaller copies of itself — elegant, but it\ncan redo the same work exponentially. **Dynamic programming** fixes that by solving\neach subproblem once and remembering the answer: top-down with a cache (memoisation),\nor bottom-up by filling a table. This unit shows naive recursion, memoised recursion,\nand a bottom-up table, then solves coin change with a DP table.\n","steps":[{"kind":"concept","id":"c26-recursion-dp","title":"Remember what you already solved","points":5,"difficulty":26,"intro":"Dynamic programming is just recursion with its repeated subproblems solved only\nonce. Whether you cache results top-down or fill a table bottom-up, the win is the\nsame: exponential work collapses to polynomial.\n","body":"## Naive recursion recomputes\n\nFibonacci is the textbook case. The direct recursion is clear but calls itself with\nthe same arguments over and over — `fib(50)` makes billions of calls:\n\n```rust\nfn fib(n: u32) -> u64 {\n    if n < 2 { n as u64 } else { fib(n - 1) + fib(n - 2) }\n}\n```\n\n## Memoise: solve each subproblem once\n\n**Memoisation** caches each answer the first time it is computed and returns the\ncached value afterwards. A `Vec<Option<u64>>` indexed by `n` turns the exponential\nrecursion into linear work:\n\n```rust\nfn fib(n: usize, memo: &mut Vec<Option<u64>>) -> u64 {\n    if let Some(v) = memo[n] { return v; }\n    let v = if n < 2 { n as u64 } else { fib(n - 1, memo) + fib(n - 2, memo) };\n    memo[n] = Some(v);\n    v\n}\n```\n\n## Bottom-up: fill a table\n\nThe same idea without recursion: start from the base cases and build each answer\nfrom smaller ones you have already stored. `dp[i]` holds the solution for size `i`:\n\n```rust\nlet mut dp = vec![0u64; n + 1];\ndp[1] = 1;\nfor i in 2..=n {\n    dp[i] = dp[i - 1] + dp[i - 2];\n}\n```\n\n- Memoisation is top-down (recurse, then cache); tabulation is bottom-up (loop,\n  filling the table). Both compute every distinct subproblem exactly once.\n- Choose DP when the problem has **overlapping subproblems** (the same smaller cases\n  recur) and **optimal substructure** (the best answer builds from best sub-answers).\n\nCoin change has both: the fewest coins for an amount builds on the fewest coins for\nsmaller amounts — a perfect bottom-up table.\n"},{"kind":"drill","id":"d75-naive-fib","title":"Naive recursive Fibonacci","points":10,"difficulty":26,"intro":"The direct recursion reads like the definition: `fib(n)` is `fib(n-1) + fib(n-2)`,\nwith `0` and `1` as base cases. It is correct but wasteful — each call re-expands the\nsame subproblems, so the work grows exponentially with `n`.\n","prompt":"Compute `fib(10)` with plain recursion.\n\n**Why:** the naive version recomputes `fib` of the same arguments again and again; it\nis fine for small `n` but motivates the memoisation that comes next.\n","target":"fn fib(n: u32) -> u64 {\n    if n < 2 {\n        n as u64\n    } else {\n        fib(n - 1) + fib(n - 2)\n    }\n}\n\nfn main() {\n    println!(\"{}\", fib(10));\n}\n","line_comments":["Naive recursive Fibonacci.","Base case: `0` and `1` return themselves.","Return `n` for the base cases.","Otherwise...","...sum the two previous Fibonacci numbers.","Closes the `if`/`else`.","Closes `fib`.","","`main` opens.","Prints `55` — but this recomputes subproblems exponentially.","Closes `main`."],"explanation":"The recursion matched the definition and gave `fib(10) = 55`, but it recomputed the\nsame smaller values many times. For large `n` that waste is fatal — which is exactly\nwhat memoisation removes.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d76-memo-fib","title":"Memoised Fibonacci","points":10,"difficulty":26,"intro":"A cache is all it takes. Before computing `fib(n)`, check whether `memo[n]` already\nholds the answer; if so return it, otherwise compute, store, and return. Each\ndistinct `n` is solved exactly once, turning exponential work into linear.\n","prompt":"Compute `fib(50)` using a `Vec<Option<u64>>` cache.\n\n**Why:** memoisation solves each subproblem a single time; with the cache `fib(50)`\nis instant, whereas the naive version would make billions of calls.\n","target":"fn fib(n: usize, memo: &mut Vec<Option<u64>>) -> u64 {\n    if let Some(v) = memo[n] {\n        return v;\n    }\n    let v = if n < 2 {\n        n as u64\n    } else {\n        fib(n - 1, memo) + fib(n - 2, memo)\n    };\n    memo[n] = Some(v);\n    v\n}\n\nfn main() {\n    let mut memo = vec![None; 51];\n    println!(\"{}\", fib(50, &mut memo));\n}\n","line_comments":["Memoized Fibonacci: the cache turns exponential work into linear.","If this value is already cached...","...return it immediately.","Closes the cache check.","Otherwise compute it: base cases...","...return `n` directly.","...or the recursive case...","...sum of the two predecessors (each itself memoized).","Closes the `let v = ...` expression.","Store the result in the cache.","Return it.","Closes `fib`.","","`main` opens.","A cache sized for `fib(0)` through `fib(50)`.","Prints `12586269025` — fast, because each subproblem is solved once.","Closes `main`."],"explanation":"The cache made each `fib(n)` compute only once, so `fib(50) = 12586269025` returned\ninstantly. That single change — remember what you solved — is the essence of dynamic\nprogramming.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d77-bottom-up-coins","title":"Bottom-up coin table","points":10,"difficulty":26,"intro":"Tabulation builds the answer from the ground up. `dp[a]` is the fewest coins to make\namount `a`; start every entry at an \"unreachable\" marker, set `dp[0] = 0`, then for\neach amount try each coin, improving `dp[a]` from the already-known `dp[a - c]`.\n","prompt":"Find the fewest coins from `[1, 3, 4]` that make amount `6`, bottom-up.\n\n**Why:** the fewest coins for `a` builds directly on the fewest for the smaller\namount `a - c`, so filling the table from `0` upward solves each amount exactly once.\n","target":"fn main() {\n    let coins = [1, 3, 4];\n    let amount = 6;\n    let mut dp = vec![u32::MAX; amount + 1];\n    dp[0] = 0;\n    for a in 1..=amount {\n        for &c in &coins {\n            if c <= a && dp[a - c] != u32::MAX {\n                dp[a] = dp[a].min(dp[a - c] + 1);\n            }\n        }\n    }\n    println!(\"{}\", dp[amount]);\n}\n","line_comments":["`main` opens.","The coin denominations.","The amount to make.","`dp[a]` = fewest coins to make `a`; start every entry at `unreachable`.","Zero coins make amount `0`.","Build the table from `1` up to `amount`...","...trying each coin...","...only if it fits and `a - c` is itself reachable.","Keep the fewest-coins option for `a`.","Closes the `if`.","Closes the coin loop.","Closes the amount loop.","Prints `2` — `3 + 3` makes `6` with two coins.","Closes `main`."],"explanation":"Each amount's answer was built from a smaller, already-solved amount, filling the\ntable up to `dp[6] = 2` (that is `3 + 3`). This bottom-up table is exactly the shape\nof the coin-change challenge.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch26-coin-change","title":"Coin change","points":40,"difficulty":26,"intro":"The capstone of the track. Implement `coin_change(coins, amount)`: return the fewest\ncoins (any denomination, reused freely) that sum to exactly `amount`, or `None` if it\ncannot be made. A bottom-up DP table holds the fewest coins for every amount from `0`\nup to the target — each built from a smaller amount you have already solved.\n","instructions":"## Your turn\n\nMake an amount with the fewest coins:\n\n```rust\npub fn coin_change(coins: &[u32], amount: u32) -> Option<u32> { ... }\n```\n\nReturn `Some(k)` where `k` is the minimum number of coins from `coins` (each usable\nany number of times) that sum to exactly `amount`, or `None` if no combination works.\n\nRules:\n\n- `amount` of `0` needs `0` coins → `Some(0)`.\n- If the amount cannot be formed (including when `coins` is empty and `amount > 0`),\n  return `None`.\n- Use a bottom-up DP table, not brute-force enumeration.\n\nExamples:\n\n- `coin_change(&[1, 2, 5], 11)` → `Some(3)` (5 + 5 + 1)\n- `coin_change(&[2], 3)` → `None`\n- `coin_change(&[1, 2, 5], 0)` → `Some(0)`\n\n**Hint:** make `dp` of length `amount + 1`, every entry an \"unreachable\" marker\n(`u32::MAX`) except `dp[0] = 0`. For each amount `a` from `1` to `amount`, for each\ncoin `c <= a` with `dp[a - c]` reachable, set `dp[a] = min(dp[a], dp[a - c] + 1)`. The\nanswer is `dp[amount]`, or `None` if it stayed unreachable.\n\nHidden tests decide correctness.\n","starter":"pub fn coin_change(coins: &[u32], amount: u32) -> Option<u32> {\n    todo!(\"fill a dp table of fewest coins per amount, bottom-up, then read dp[amount]\")\n}\n","tests":"use student::coin_change;\n\n#[test]\nfn classic() {\n    assert_eq!(coin_change(&[1, 2, 5], 11), Some(3));\n}\n\n#[test]\nfn impossible() {\n    assert_eq!(coin_change(&[2], 3), None);\n}\n\n#[test]\nfn zero_amount() {\n    assert_eq!(coin_change(&[1, 2, 5], 0), Some(0));\n}\n\n#[test]\nfn no_coins() {\n    assert_eq!(coin_change(&[], 7), None);\n}\n\n#[test]\nfn exact_single_coin() {\n    assert_eq!(coin_change(&[3, 7], 7), Some(1));\n}\n\n#[test]\nfn prefers_fewer() {\n    assert_eq!(coin_change(&[1, 3, 4], 6), Some(2));\n}\n","entry":"coin_change","gabarito":{"time":"O(amount * coins)","space":"O(amount)","solution":"pub fn coin_change(coins: &[u32], amount: u32) -> Option<u32> {\n    let amount = amount as usize;\n    let mut dp = vec![u32::MAX; amount + 1];\n    dp[0] = 0;\n    for a in 1..=amount {\n        for &c in coins {\n            let c = c as usize;\n            if c <= a && dp[a - c] != u32::MAX {\n                dp[a] = dp[a].min(dp[a - c] + 1);\n            }\n        }\n    }\n    if dp[amount] == u32::MAX {\n        None\n    } else {\n        Some(dp[amount])\n    }\n}\n","justification":"The table has `amount + 1` entries and each is relaxed against every coin, so the time\nis **O(amount * coins)** and the space is **O(amount)**. `dp[a]` is the provably fewest\ncoins for amount `a`: it is built only from `dp[a - c]`, a strictly smaller amount that\nis already final, so optimal substructure holds. An entry that never improves past the\n`u32::MAX` marker is unreachable, which is reported as `None`; `dp[0] = 0` seeds the\nbase case.\n"}}]}]},"go":{"id":"go-basics","title":"Go: From Zero to Backend","summary":"A guided, hands-on course in Go that takes you from your very first line of code to the ideas that power real backend services. You read a short concept, build muscle memory by typing small, complete programs with the tutor — every line explained — and then apply what you learned in a graded challenge whose hidden tests decide correctness. Twenty-six units of steadily rising difficulty: printing with fmt, variables and types, control flow, loops, functions with multiple returns, your own structs and methods, interfaces, slices and maps, error handling, and the Go module system (go get); an intermediate database track built on SQLite through database/sql and the pure-Go modernc.org/sqlite driver — connecting and querying, transactions, the connection pool and WAL mode, the N+1 query problem, pagination, and indexes with EXPLAIN QUERY PLAN; then an advanced concurrency track — goroutines and WaitGroups, channels, select with timeouts, and shared state with mutexes and worker pools; and a data structures & algorithms track: stacks and queues, linked lists, maps and sets, binary search trees, sorting and searching, and recursion with dynamic programming. Almost everything runs on the standard library; two exercises teach you how to pull in and run an external package the way every real Go project does. No prior Go needed.","units":[{"id":"u1-hello","title":"Hello & fmt","difficulty":1,"level":"basic","intro":"Your very first steps in Go: what a program is, how to print to the screen with\nthe `fmt` package, and how the compiler turns your text into a running binary. By\nthe end you will write a tiny greeting function and let the hidden tests check it.\n","steps":[{"kind":"concept","id":"c1-what-is-a-program","title":"What a Go program is","points":5,"difficulty":1,"intro":"Before you write anything, picture what a computer actually does: it loads a\ncompiled program into memory and executes machine instructions one after another.\nA program needs one agreed place to begin — in Go that place is the function\n`main`, inside the special `package main`. The Go toolchain compiles your source\ninto a native binary; when you run it, the operating system hands control to\n`main`, and anything you print travels to **standard output**, which the terminal\nshows on screen.\n","body":"## A program starts at `main`\n\nEvery runnable Go program lives in **`package main`** and begins at a function\ncalled **`main`**. Think of `main` as the front door: when you run the program,\nGo walks in through `main` and does, top to bottom, whatever it finds there.\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n    fmt.Println(\"Hello, Go!\")\n}\n```\n\nFour things to notice:\n\n- **`package main`** marks this file as a buildable command (not a library).\n- **`import \"fmt\"`** pulls in the standard-library `fmt` package, which formats\n  and prints text.\n- **`func main() { ... }`** declares the entry point; the `{ }` hold its body.\n- **`fmt.Println(...)`** prints a line of text, then a newline, to standard output.\n\nYou compile and run a single-file program with **`go run .`**. In the next steps\nyou will type small, complete programs yourself; when your code matches the\ntarget, the tutor runs it so you can see the output.\n"},{"kind":"drill","id":"d1-hello","title":"Print your first line","points":10,"difficulty":1,"intro":"This drill cements the one skeleton every Go program shares. `fmt.Println` writes\nyour text to standard output and adds a trailing newline. There is no loop and no\nbranching here — just the entry point `main` and a single write to the screen.\n","prompt":"Type the classic first program. It prints a single line and stops.\n\n**Why:** this cements the shape every Go program shares — `package main`, an\n`import`, and a `main` that writes one line. Reproduce it exactly.\n","target":"package main\n\nimport \"fmt\"\n\nfunc main() {\n    fmt.Println(\"Hello, Go!\")\n}\n","line_comments":["Declares this file as part of `package main` — the special package that builds a runnable command.","","Imports the standard-library `fmt` package, which formats and prints text.","","Declares `main`, the function Go runs first; `{` opens its body.","Prints the text followed by a newline to standard output.","Closes the body of `main`; when execution reaches here the program ends."],"explanation":"That is a complete Go program. Go entered `main`, ran the one `fmt.Println`,\nprinted `Hello, Go!`, and then `main` ended — so the program finished. Every\nprogram you write grows from exactly this skeleton.\n","placeholder_policy":"shown"},{"kind":"drill","id":"d2-printf","title":"Format with Printf","points":10,"difficulty":1,"intro":"`fmt.Println` prints values as-is; `fmt.Printf` lets you build a formatted string\nwith **verbs**: `%s` for a string, `%d` for an integer. Unlike `Println`, `Printf`\ndoes not add a newline for you, so you write `\\n` yourself where you want one.\n","prompt":"Use `fmt.Printf` with the `%s` and `%d` verbs to interpolate a name and a number\ninto one line. Note the explicit `\\n` at the end.\n","target":"package main\n\nimport \"fmt\"\n\nfunc main() {\n    name := \"Go\"\n    fmt.Printf(\"Hello, %s! You are %d years young.\\n\", name, 15)\n}\n","line_comments":["Declares the runnable `package main`.","","Imports `fmt` for formatted printing.","","Opens `main`, the entry point.","Declares `name` and infers its type (string) with the short form `:=`.","`Printf` fills `%s` with `name` and `%d` with `15`; `\\n` ends the line.","Closes `main`."],"explanation":"`Printf` is the workhorse of formatted output: each verb (`%s`, `%d`, ...) is\nreplaced, left to right, by the matching argument. Because `Printf` prints exactly\nwhat you give it, you control the newline with `\\n`.\n","placeholder_policy":"shown"},{"kind":"challenge","id":"ch1-greet","title":"Implement Greet","points":30,"difficulty":2,"intro":"Now you apply what you learned. In Go, strings join with the `+` operator, and a\nfunction declares what it returns after its parameter list. Your function takes a\n`string` and returns a new `string`. Hidden tests, not the screen, decide\ncorrectness.\n","instructions":"## Your turn\n\nImplement the function `Greet`:\n\n```go\nfunc Greet(name string) string { ... }\n```\n\nIt takes a name and returns a string that reads `Hello, {name}!`.\n\nExamples:\n\n- `Greet(\"World\")` → `\"Hello, World!\"`\n- `Greet(\"Go\")` → `\"Hello, Go!\"`\n\n**Hint:** build the result by joining strings with `+`.\n\nHidden tests decide correctness. Implement it, then submit.\n","starter":"package student\n\n// Greet returns a friendly greeting for name.\nfunc Greet(name string) string {\n\t// TODO: return \"Hello, <name>!\"\n\treturn \"\"\n}\n","tests":"package student\n\nimport \"testing\"\n\nfunc TestGreetWorld(t *testing.T) {\n\tif got := Greet(\"World\"); got != \"Hello, World!\" {\n\t\tt.Fatalf(\"Greet(\\\"World\\\") = %q, want %q\", got, \"Hello, World!\")\n\t}\n}\n\nfunc TestGreetGo(t *testing.T) {\n\tif got := Greet(\"Go\"); got != \"Hello, Go!\" {\n\t\tt.Fatalf(\"Greet(\\\"Go\\\") = %q, want %q\", got, \"Hello, Go!\")\n\t}\n}\n","entry":"Greet","gabarito":{"time":"O(n)","space":"O(n)","solution":"package student\n\nfunc Greet(name string) string {\n\treturn \"Hello, \" + name + \"!\"\n}\n","justification":"Joining strings copies the fixed text `Hello, ` and `!` plus the `n` characters of\n`name` into a fresh string. Both the work and the memory grow in direct proportion\nto the length of `name`, so the time is **O(n)** and the space is **O(n)**, where\n`n` is the length of the name. There is no hidden loop — a single pass builds the\nresult once.\n"}}]},{"id":"u2-variables","title":"Variables & types","difficulty":2,"level":"basic","intro":"Every value in Go has a **type** the compiler tracks for you: whole numbers\n(`int`), real numbers (`float64`), text (`string`), truth values (`bool`). You\nwill meet the two ways to declare a variable (`var` and the short `:=`) and see\nwhy Go makes you convert between numeric types on purpose.\n","steps":[{"kind":"concept","id":"c2-variables","title":"Values, types and declarations","points":5,"difficulty":2,"intro":"A variable is a named box in memory holding a value of a fixed type. Go is\nstatically typed: the type is known at compile time, which lets the compiler catch\nmistakes before the program ever runs.\n","body":"## Two ways to declare\n\n```go\nvar age int = 15   // explicit type\ncity := \"Luanda\"   // short form: type inferred as string\n```\n\n- **`var name type = value`** states the type explicitly.\n- **`name := value`** is the short form (only inside functions); Go **infers** the\n  type from the value.\n\nGo's basic types include `int`, `float64`, `bool`, and `string`. Unlike some\nlanguages, Go will **not** silently mix numeric types: to multiply an `int` by a\n`float64` you must convert, e.g. `float64(count) * price`. That explicitness\nprevents a whole class of rounding bugs.\n"},{"kind":"drill","id":"d1-declare","title":"Declare with var and :=","points":10,"difficulty":2,"intro":"Both declaration forms store a typed value. `var age int = 15` is explicit; the\nshort `city := \"Luanda\"` infers `string`. Printing several values with `Println`\nseparates them with spaces.\n","prompt":"Declare one variable with `var` and one with `:=`, then print them.\n","target":"package main\n\nimport \"fmt\"\n\nfunc main() {\n    var age int = 15\n    city := \"Luanda\"\n    fmt.Println(age, city)\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","Opens `main`.","Declares `age` as an `int` with the explicit `var` form.","Declares `city` with the short `:=` form; its type is inferred as string.","Prints both values, separated by a space.","Closes `main`."],"explanation":"`var` and `:=` both create a typed variable — `:=` just lets the compiler infer\nthe type. Inside functions the short form is the idiomatic choice.\n","placeholder_policy":"shown"},{"kind":"drill","id":"d2-convert","title":"Convert between number types","points":10,"difficulty":2,"intro":"Go will not mix an `int` and a `float64` automatically. To multiply them you\nconvert the `int` with `float64(...)` first. This drill shows that explicit\nconversion.\n","prompt":"Multiply an integer count by a floating-point price. Convert the `int` to\n`float64` before the multiplication.\n","target":"package main\n\nimport \"fmt\"\n\nfunc main() {\n    count := 7\n    price := 2.5\n    total := float64(count) * price\n    fmt.Println(\"Total:\", total)\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","Opens `main`.","`count` is inferred as `int`.","`price` is inferred as `float64` because it has a decimal point.","Converts `count` to `float64` so the multiplication type-checks.","Prints a label and the computed total.","Closes `main`."],"explanation":"The compiler rejects `count * price` because the types differ. `float64(count)`\nmakes the conversion explicit and the intent obvious — Go never guesses for you.\n","placeholder_policy":"shown"},{"kind":"challenge","id":"ch2-celsius","title":"Implement CelsiusToFahrenheit","points":30,"difficulty":3,"intro":"Apply numeric types and arithmetic. The formula is `F = C * 9/5 + 32`. Because you\nwork entirely in `float64`, no conversion is needed inside the function — the\ncaller passes a `float64` and you return one.\n","instructions":"## Your turn\n\nImplement the function `CelsiusToFahrenheit`:\n\n```go\nfunc CelsiusToFahrenheit(c float64) float64 { ... }\n```\n\nIt converts a temperature in Celsius to Fahrenheit using `F = C * 9/5 + 32`.\n\nExamples:\n\n- `CelsiusToFahrenheit(0)` → `32`\n- `CelsiusToFahrenheit(100)` → `212`\n- `CelsiusToFahrenheit(-40)` → `-40`\n\nHidden tests decide correctness. Implement it, then submit.\n","starter":"package student\n\n// CelsiusToFahrenheit converts c degrees Celsius to Fahrenheit.\nfunc CelsiusToFahrenheit(c float64) float64 {\n\t// TODO: return c*9/5 + 32\n\treturn 0\n}\n","tests":"package student\n\nimport \"testing\"\n\nfunc TestFreezing(t *testing.T) {\n\tif got := CelsiusToFahrenheit(0); got != 32 {\n\t\tt.Fatalf(\"CelsiusToFahrenheit(0) = %v, want 32\", got)\n\t}\n}\n\nfunc TestBoiling(t *testing.T) {\n\tif got := CelsiusToFahrenheit(100); got != 212 {\n\t\tt.Fatalf(\"CelsiusToFahrenheit(100) = %v, want 212\", got)\n\t}\n}\n\nfunc TestMinus40(t *testing.T) {\n\tif got := CelsiusToFahrenheit(-40); got != -40 {\n\t\tt.Fatalf(\"CelsiusToFahrenheit(-40) = %v, want -40\", got)\n\t}\n}\n","entry":"CelsiusToFahrenheit","gabarito":{"time":"O(1)","space":"O(1)","solution":"package student\n\nfunc CelsiusToFahrenheit(c float64) float64 {\n\treturn c*9/5 + 32\n}\n","justification":"The function performs a fixed number of arithmetic operations — one multiply, one\ndivide, one add — regardless of the input value. There is no loop and no allocation\nthat grows with the input, so both the time and the space are **O(1)** (constant).\n"}}]},{"id":"u3-control-flow","title":"Control flow (if / switch)","difficulty":3,"level":"basic","intro":"Programs make decisions. You will use `if`/`else` to branch on a boolean condition\nand `switch` to pick cleanly among several cases. By the end you classify a number\nin a graded challenge.\n","steps":[{"kind":"concept","id":"c3-branching","title":"Branching with if and switch","points":5,"difficulty":3,"intro":"A branch lets the program take one path or another depending on a condition\nevaluated at run time. Go's `if` needs no parentheses around the condition, and\nits `switch` does not fall through by default — each case stands alone.\n","body":"## `if` / `else`\n\n```go\nif n%2 == 0 {\n    fmt.Println(\"even\")\n} else {\n    fmt.Println(\"odd\")\n}\n```\n\nThe condition must be a `bool`. No parentheses are required; the braces are.\n\n## `switch`\n\n```go\nswitch day {\ncase 1:\n    fmt.Println(\"Monday\")\ncase 3:\n    fmt.Println(\"Wednesday\")\ndefault:\n    fmt.Println(\"Other\")\n}\n```\n\nUnlike C, Go does **not** fall through from one case to the next, so you rarely\nneed `break`. A `switch` with many cases reads far more clearly than a long chain\nof `else if`.\n"},{"kind":"drill","id":"d1-if","title":"Branch with if/else","points":10,"difficulty":3,"intro":"`%` is the remainder operator. `n%2 == 0` is true exactly when `n` is even, so this\n`if`/`else` prints one word or the other.\n","prompt":"Use `if`/`else` and the `%` operator to print whether a number is even or odd.\n","target":"package main\n\nimport \"fmt\"\n\nfunc main() {\n    n := 7\n    if n%2 == 0 {\n        fmt.Println(\"even\")\n    } else {\n        fmt.Println(\"odd\")\n    }\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","Opens `main`.","`n` holds the value to classify.","If the remainder of `n` divided by 2 is zero, `n` is even.","Prints `even` on the true branch.","`else` begins the false branch.","Prints `odd` when `n` is not divisible by 2.","Closes the `if`/`else`.","Closes `main`."],"explanation":"The condition `n%2 == 0` is a `bool`; Go runs the matching block and skips the\nother. Change `n` and the branch taken changes with it.\n","placeholder_policy":"shown"},{"kind":"drill","id":"d2-switch","title":"Choose with switch","points":10,"difficulty":3,"intro":"`switch` compares one value against several `case` labels and runs the first that\nmatches, with no fall-through. `default` handles everything else.\n","prompt":"Map a day number to a day name with a `switch`, including a `default`.\n","target":"package main\n\nimport \"fmt\"\n\nfunc main() {\n    day := 3\n    switch day {\n    case 1:\n        fmt.Println(\"Monday\")\n    case 3:\n        fmt.Println(\"Wednesday\")\n    default:\n        fmt.Println(\"Other\")\n    }\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","Opens `main`.","`day` holds the value to match.","`switch` begins, comparing `day` against each case.","Case for the value 1.","Printed only when `day == 1`.","Case for the value 3.","Printed when `day == 3` — our value, so this runs.","`default` matches anything not listed.","Printed for any other value.","Closes the `switch`.","Closes `main`."],"explanation":"Go runs exactly one matching case and then leaves the `switch` — no `break`\nneeded. Because `day` is 3, only `Wednesday` prints.\n","placeholder_policy":"shown"},{"kind":"challenge","id":"ch3-sign","title":"Implement Sign","points":30,"difficulty":4,"intro":"Apply branching. You classify an integer as negative, zero, or positive and return\nthe matching word. Either an `if`/`else if`/`else` chain or a `switch` works.\n","instructions":"## Your turn\n\nImplement the function `Sign`:\n\n```go\nfunc Sign(n int) string { ... }\n```\n\nReturn `\"negative\"` when `n < 0`, `\"zero\"` when `n == 0`, and `\"positive\"` when\n`n > 0`.\n\nExamples:\n\n- `Sign(-5)` → `\"negative\"`\n- `Sign(0)` → `\"zero\"`\n- `Sign(42)` → `\"positive\"`\n\nHidden tests decide correctness. Implement it, then submit.\n","starter":"package student\n\n// Sign classifies n as \"negative\", \"zero\", or \"positive\".\nfunc Sign(n int) string {\n\t// TODO: branch on the value of n\n\treturn \"\"\n}\n","tests":"package student\n\nimport \"testing\"\n\nfunc TestNegative(t *testing.T) {\n\tif got := Sign(-5); got != \"negative\" {\n\t\tt.Fatalf(\"Sign(-5) = %q, want \\\"negative\\\"\", got)\n\t}\n}\n\nfunc TestZero(t *testing.T) {\n\tif got := Sign(0); got != \"zero\" {\n\t\tt.Fatalf(\"Sign(0) = %q, want \\\"zero\\\"\", got)\n\t}\n}\n\nfunc TestPositive(t *testing.T) {\n\tif got := Sign(42); got != \"positive\" {\n\t\tt.Fatalf(\"Sign(42) = %q, want \\\"positive\\\"\", got)\n\t}\n}\n","entry":"Sign","gabarito":{"time":"O(1)","space":"O(1)","solution":"package student\n\nfunc Sign(n int) string {\n\tswitch {\n\tcase n < 0:\n\t\treturn \"negative\"\n\tcase n > 0:\n\t\treturn \"positive\"\n\tdefault:\n\t\treturn \"zero\"\n\t}\n}\n","justification":"The function checks at most two comparisons and returns — the number of operations\ndoes not depend on how large `n` is. No loop, no allocation that grows with input,\nso both time and space are **O(1)**.\n"}}]},{"id":"u4-loops","title":"Loops (for)","difficulty":4,"level":"basic","intro":"Repetition is where computers shine. Go has exactly one loop keyword — `for` — that\nplays every role: counting loop, while-style loop, and range loop over a collection.\nBy the end you sum the numbers up to `n` in a graded challenge.\n","steps":[{"kind":"concept","id":"c4-for","title":"The one loop: for","points":5,"difficulty":4,"intro":"A loop repeats a block while a condition holds. Go unifies all looping into the\nsingle keyword `for`, so there is less to remember and one shape to master.\n","body":"## Three shapes, one keyword\n\n```go\nfor i := 1; i <= 5; i++ {   // classic counter: init; condition; post\n    sum += i\n}\n\nfor condition {             // while-style\n    // ...\n}\n\nfor i, v := range nums {    // range over a slice/map/string\n    fmt.Println(i, v)\n}\n```\n\n- The **classic** form has three parts: an initializer, a condition, and a\n  post-statement (`i++`).\n- Drop the init and post to get a **while** loop.\n- **`range`** walks a collection, handing you the index and the value each turn.\n\nLoop cost matters: a single `for` over `n` items is **O(n)**; a loop inside a loop\nis **O(n²)**. You will meet that idea again when complexity is graded.\n"},{"kind":"drill","id":"d1-counter","title":"Count with a for loop","points":10,"difficulty":4,"intro":"The classic three-part `for` runs its body once per value of `i`, from 1 through 5,\naccumulating the running total in `sum`.\n","prompt":"Add the numbers 1 through 5 with a classic `for` loop and print the total.\n","target":"package main\n\nimport \"fmt\"\n\nfunc main() {\n    sum := 0\n    for i := 1; i <= 5; i++ {\n        sum += i\n    }\n    fmt.Println(\"Sum:\", sum)\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","Opens `main`.","Starts the running total at zero.","Loops `i` from 1 while `i <= 5`, adding 1 each turn (`i++`).","Adds the current `i` to `sum` (`+=` means `sum = sum + i`).","Closes the loop body.","Prints the final total, 15.","Closes `main`."],"explanation":"The loop body runs five times, once for each `i` in 1..5, and `sum` grows to 15.\nOne pass over `n` items is linear — **O(n)** work.\n","placeholder_policy":"shown"},{"kind":"drill","id":"d2-range","title":"Walk a slice with range","points":10,"difficulty":4,"intro":"`range` over a slice yields the index and the value on each turn. It is the\nidiomatic way to visit every element without managing an index by hand.\n","prompt":"Use `for ... range` to print the index and value of each item in a slice.\n","target":"package main\n\nimport \"fmt\"\n\nfunc main() {\n    nums := []int{10, 20, 30}\n    for i, v := range nums {\n        fmt.Println(i, v)\n    }\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","Opens `main`.","Creates a slice of three integers.","`range` yields each index `i` and value `v` in turn.","Prints the index and the value side by side.","Closes the loop body.","Closes `main`."],"explanation":"`range` is the cleanest way to visit every element. Each turn binds `i` to the\nposition and `v` to a copy of the value at that position.\n","placeholder_policy":"shown"},{"kind":"challenge","id":"ch4-sumto","title":"Implement SumTo","points":30,"difficulty":5,"intro":"Apply looping. You add every integer from 1 to `n`. A single `for` loop does it in\none linear pass; the closed-form `n*(n+1)/2` would do it in constant time, but a\nloop is the point of this unit.\n","instructions":"## Your turn\n\nImplement the function `SumTo`:\n\n```go\nfunc SumTo(n int) int { ... }\n```\n\nReturn the sum `1 + 2 + ... + n`. For `n <= 0`, return `0`.\n\nExamples:\n\n- `SumTo(5)` → `15`\n- `SumTo(1)` → `1`\n- `SumTo(0)` → `0`\n\nHidden tests decide correctness. Implement it, then submit.\n","starter":"package student\n\n// SumTo returns 1 + 2 + ... + n (0 when n <= 0).\nfunc SumTo(n int) int {\n\t// TODO: loop from 1 to n, accumulating the total\n\treturn 0\n}\n","tests":"package student\n\nimport \"testing\"\n\nfunc TestSumToFive(t *testing.T) {\n\tif got := SumTo(5); got != 15 {\n\t\tt.Fatalf(\"SumTo(5) = %d, want 15\", got)\n\t}\n}\n\nfunc TestSumToOne(t *testing.T) {\n\tif got := SumTo(1); got != 1 {\n\t\tt.Fatalf(\"SumTo(1) = %d, want 1\", got)\n\t}\n}\n\nfunc TestSumToZero(t *testing.T) {\n\tif got := SumTo(0); got != 0 {\n\t\tt.Fatalf(\"SumTo(0) = %d, want 0\", got)\n\t}\n}\n\nfunc TestSumToHundred(t *testing.T) {\n\tif got := SumTo(100); got != 5050 {\n\t\tt.Fatalf(\"SumTo(100) = %d, want 5050\", got)\n\t}\n}\n","entry":"SumTo","gabarito":{"time":"O(n)","space":"O(1)","solution":"package student\n\nfunc SumTo(n int) int {\n\ttotal := 0\n\tfor i := 1; i <= n; i++ {\n\t\ttotal += i\n\t}\n\treturn total\n}\n","justification":"The loop runs `n` times, doing constant work per turn, so the running time grows\nlinearly with `n` — **O(n)**. Only the single accumulator `total` is stored,\nregardless of `n`, so the extra space is **O(1)**.\n"}}]},{"id":"u5-functions","title":"Functions & multiple returns","difficulty":5,"level":"basic","intro":"Functions package a piece of work behind a name so you can call it anywhere. Go\nfunctions can return **several values at once** — the idiom behind both `(result,\nerror)` and small helpers like min/max. By the end you return a quotient and a\nremainder together.\n","steps":[{"kind":"concept","id":"c5-functions","title":"Declaring and returning","points":5,"difficulty":5,"intro":"A function has a name, a list of typed parameters, a list of result types, and a\nbody. Go's ability to return more than one value is used everywhere in the\nstandard library.\n","body":"## One value, or several\n\n```go\nfunc square(x int) int {\n    return x * x\n}\n\nfunc minMax(a, b int) (int, int) {\n    if a < b {\n        return a, b\n    }\n    return b, a\n}\n```\n\n- Parameters come first (`a, b int` groups two `int`s).\n- The result types come after the parameter list; wrap several in parentheses.\n- `return a, b` hands back both values; the caller receives them with\n  `lo, hi := minMax(8, 3)`.\n\nReturning `(value, error)` is the Go convention for operations that can fail — you\nwill use it in the errors unit.\n"},{"kind":"drill","id":"d1-func","title":"Write and call a function","points":10,"difficulty":5,"intro":"`square` takes one `int` and returns one `int`. `main` calls it and prints the\nresult. Declaring a helper above `main` keeps each piece small and named.\n","prompt":"Define a `square` function and call it from `main`.\n","target":"package main\n\nimport \"fmt\"\n\nfunc square(x int) int {\n    return x * x\n}\n\nfunc main() {\n    fmt.Println(square(6))\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","Declares `square`, taking an `int` and returning an `int`.","Returns the parameter multiplied by itself.","Closes `square`.","","Opens `main`.","Calls `square(6)` and prints the returned value, 36.","Closes `main`."],"explanation":"A function is a reusable, named block. `square` hides the detail `x * x` behind a\nmeaningful name you can call as often as you like.\n","placeholder_policy":"shown"},{"kind":"drill","id":"d2-multi-return","title":"Return two values","points":10,"difficulty":5,"intro":"`minMax` returns two `int`s. The caller destructures them with `lo, hi := ...`.\nThis two-value return is the shape Go uses for `(result, error)` throughout the\nstandard library.\n","prompt":"Write a `minMax` that returns the smaller then the larger of two numbers, and\nunpack both results in `main`.\n","target":"package main\n\nimport \"fmt\"\n\nfunc minMax(a, b int) (int, int) {\n    if a < b {\n        return a, b\n    }\n    return b, a\n}\n\nfunc main() {\n    lo, hi := minMax(8, 3)\n    fmt.Println(lo, hi)\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","Declares `minMax` returning two `int`s (the result types in parentheses).","If `a` is already the smaller, return it first.","Returns `a` (small) then `b` (large).","Closes the `if`.","Otherwise `b` is smaller, so return `b` then `a`.","Closes `minMax`.","","Opens `main`.","Calls `minMax` and unpacks both results into `lo` and `hi`.","Prints the smaller then the larger: 3 8.","Closes `main`."],"explanation":"Multiple return values let one call hand back everything the caller needs. This is\nexactly how `(value, error)` works later — two values from one function.\n","placeholder_policy":"shown"},{"kind":"challenge","id":"ch5-divmod","title":"Implement DivMod","points":30,"difficulty":6,"intro":"Apply multiple returns. Integer division in Go uses `/` for the quotient and `%`\nfor the remainder. You return both in one call — the quotient first, the remainder\nsecond.\n","instructions":"## Your turn\n\nImplement the function `DivMod`:\n\n```go\nfunc DivMod(a, b int) (int, int) { ... }\n```\n\nReturn the integer quotient `a / b` and the remainder `a % b`, in that order.\n\nExamples:\n\n- `DivMod(17, 5)` → `(3, 2)`\n- `DivMod(10, 2)` → `(5, 0)`\n\n(You may assume `b` is not zero — division by zero comes up in the errors unit.)\n\nHidden tests decide correctness. Implement it, then submit.\n","starter":"package student\n\n// DivMod returns the quotient a/b and the remainder a%b.\nfunc DivMod(a, b int) (int, int) {\n\t// TODO: return both the quotient and the remainder\n\treturn 0, 0\n}\n","tests":"package student\n\nimport \"testing\"\n\nfunc TestDivModSeventeenFive(t *testing.T) {\n\tq, r := DivMod(17, 5)\n\tif q != 3 || r != 2 {\n\t\tt.Fatalf(\"DivMod(17, 5) = (%d, %d), want (3, 2)\", q, r)\n\t}\n}\n\nfunc TestDivModExact(t *testing.T) {\n\tq, r := DivMod(10, 2)\n\tif q != 5 || r != 0 {\n\t\tt.Fatalf(\"DivMod(10, 2) = (%d, %d), want (5, 0)\", q, r)\n\t}\n}\n","entry":"DivMod","gabarito":{"time":"O(1)","space":"O(1)","solution":"package student\n\nfunc DivMod(a, b int) (int, int) {\n\treturn a / b, a % b\n}\n","justification":"The function performs two constant-time arithmetic operations — one division and\none remainder — no matter how large the inputs are. No loops and no growing\nallocation, so both time and space are **O(1)**.\n"}}]},{"id":"u6-structs","title":"Structs & methods","difficulty":6,"level":"intermediate","intro":"Real programs model things — a user, a rectangle, a request. A **struct** groups\nrelated fields into one named type, and a **method** attaches behaviour to that\ntype. By the end you give a `Rectangle` an `Area` method.\n","steps":[{"kind":"concept","id":"c6-structs","title":"Your own types","points":5,"difficulty":6,"intro":"A struct is a composite type: several typed fields bundled under one name. A method\nis a function with a **receiver** — the value it acts on — written just before the\nname. Together they are how Go models data and the behaviour that belongs with it.\n","body":"## Struct + method\n\n```go\ntype Rectangle struct {\n    Width  float64\n    Height float64\n}\n\nfunc (r Rectangle) Area() float64 {\n    return r.Width * r.Height\n}\n```\n\n- **`type Name struct { ... }`** declares a new type with named fields.\n- Create a value with `Rectangle{Width: 3, Height: 4}` and read a field with\n  `r.Width`.\n- **`func (r Rectangle) Area() float64`** adds a method; `r` is the receiver, the\n  specific rectangle the method runs on. Call it with `r.Area()`.\n\nCapitalised names (`Width`, `Area`) are **exported** — visible from other packages;\nlowercase names are private to the package. That single rule is Go's whole access\nmodel.\n"},{"kind":"drill","id":"d1-struct","title":"Define and use a struct","points":10,"difficulty":6,"intro":"`Point` groups two `int` fields. You build one with a composite literal and read\nits fields with the dot operator.\n","prompt":"Define a `Point` struct with `X` and `Y`, create one, and print its fields.\n","target":"package main\n\nimport \"fmt\"\n\ntype Point struct {\n    X int\n    Y int\n}\n\nfunc main() {\n    p := Point{X: 3, Y: 4}\n    fmt.Println(p.X, p.Y)\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","Declares a new struct type `Point`.","Field `X`, an integer.","Field `Y`, an integer.","Closes the struct definition.","","Opens `main`.","Builds a `Point` with named fields.","Reads the fields with the dot operator and prints them.","Closes `main`."],"explanation":"A struct bundles related values under one name. Building with named fields\n(`X: 3, Y: 4`) makes the code self-documenting.\n","placeholder_policy":"on_demand"},{"kind":"drill","id":"d2-method","title":"Attach a method","points":10,"difficulty":6,"intro":"A method is a function with a receiver. `Celsius` is a named type over `float64`,\nand `ToFahrenheit` is a method on it — behaviour that travels with the value.\n","prompt":"Give a `Celsius` type a `ToFahrenheit` method and call it.\n","target":"package main\n\nimport \"fmt\"\n\ntype Celsius float64\n\nfunc (c Celsius) ToFahrenheit() float64 {\n    return float64(c)*9/5 + 32\n}\n\nfunc main() {\n    t := Celsius(100)\n    fmt.Println(t.ToFahrenheit())\n}\n","line_comments":["Runnable `package main`.","","Imports `fmt`.","","Declares `Celsius` as a named type over `float64`.","","Defines a method with receiver `c Celsius` returning a `float64`.","Converts the receiver and applies the conversion formula.","Closes the method.","","Opens `main`.","Creates a `Celsius` value of 100.","Calls the method on it and prints 212.","Closes `main`."],"explanation":"A method ties behaviour to a type. `t.ToFahrenheit()` reads as \"ask this\ntemperature for its Fahrenheit value\" — the receiver `c` is `t`.\n","placeholder_policy":"on_demand"},{"kind":"challenge","id":"ch6-rectangle","title":"Implement Rectangle.Area","points":30,"difficulty":7,"intro":"Apply structs and methods. Define a `Rectangle` type with `Width` and `Height`,\nand an `Area` method that returns their product. The hidden tests build rectangles\nand call `Area`.\n","instructions":"## Your turn\n\nDefine a `Rectangle` struct and an `Area` method:\n\n```go\ntype Rectangle struct {\n    Width  float64\n    Height float64\n}\n\nfunc (r Rectangle) Area() float64 { ... }\n```\n\n`Area` returns `Width * Height`.\n\nExamples:\n\n- `Rectangle{Width: 3, Height: 4}.Area()` → `12`\n- `Rectangle{Width: 2.5, Height: 2}.Area()` → `5`\n\nHidden tests decide correctness. Implement it, then submit.\n","starter":"package student\n\n// Rectangle has a width and a height.\ntype Rectangle struct {\n\tWidth  float64\n\tHeight float64\n}\n\n// Area returns the rectangle's area.\nfunc (r Rectangle) Area() float64 {\n\t// TODO: return Width * Height\n\treturn 0\n}\n","tests":"package student\n\nimport \"testing\"\n\nfunc TestAreaWhole(t *testing.T) {\n\tr := Rectangle{Width: 3, Height: 4}\n\tif got := r.Area(); got != 12 {\n\t\tt.Fatalf(\"Area() = %v, want 12\", got)\n\t}\n}\n\nfunc TestAreaFraction(t *testing.T) {\n\tr := Rectangle{Width: 2.5, Height: 2}\n\tif got := r.Area(); got != 5 {\n\t\tt.Fatalf(\"Area() = %v, want 5\", got)\n\t}\n}\n","entry":"Rectangle","gabarito":{"time":"O(1)","space":"O(1)","solution":"package student\n\ntype Rectangle struct {\n\tWidth  float64\n\tHeight float64\n}\n\nfunc (r Rectangle) Area() float64 {\n\treturn r.Width * r.Height\n}\n","justification":"`Area` multiplies two fields once — a single constant-time operation regardless of\nthe values. No loops and no allocation that grows with input, so both time and\nspace are **O(1)**.\n"}}]},{"id":"u7-interfaces","title":"Interfaces","difficulty":7,"level":"intermediate","intro":"An **interface** names a set of methods. Any type that has those methods satisfies\nthe interface automatically — no `implements` keyword. This is how Go writes code\nthat works with many types at once. By the end you total the area of a mixed list\nof shapes.\n","steps":[{"kind":"concept","id":"c7-interfaces","title":"Behaviour, not data","points":5,"difficulty":7,"intro":"An interface describes what a value can **do**, not what it **is**. If a type has\nthe right methods, it fits the interface implicitly — this decoupling is the heart\nof Go's approach to polymorphism.\n","body":"## Implicit satisfaction\n\n```go\ntype Shape interface {\n    Area() float64\n}\n\ntype Square struct{ Side float64 }\n\nfunc (s Square) Area() float64 { return s.Side * s.Side }\n```\n\nBecause `Square` has an `Area() float64` method, it **is** a `Shape` — you never\nwrite it down. Now a function can accept any `Shape`:\n\n```go\nfunc TotalArea(shapes []Shape) float64 {\n    total := 0.0\n    for _, s := range shapes {\n        total += s.Area()\n    }\n    return total\n}\n```\n\nThe same loop handles squares, rectangles, circles — anything with an `Area`.\nInterfaces let you program to behaviour, so new types slot in without touching the\ncode that uses them.\n"},{"kind":"drill","id":"d1-interface","title":"Define and satisfy an interface","points":10,"difficulty":7,"intro":"`Greeter` requires one method, `Greet`. `Robot` has it, so a `Robot` value can be\nstored in a `Greeter` variable — satisfaction is implicit
